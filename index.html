/* Exercises can be generated at runtime (dictation drills, order-the-lines,
   gap-fill, vocabulary review cards) and never enter EXERCISES. Anything that

function findExercise(id){
  var pools = [];
  if(session.queue) pools.push(session.queue);
  if(session.exam && session.exam.items) pools.push(session.exam.items);
  for(var i=0;i<pools.length;i++){
    var hit = pools[i].find(function(e){ return e && e.id===id; });
    if(hit) return hit;
  }
  return exerciseById(id);
}

/* Sentence-construction and matching have their own comparators. */


/* Ordering is graded on sequence, and the feedback names how far off it was —
   one swapped pair is a different kind of error from a scrambled guess. */
function checkOrder(ex){
  var placed = session.built[ex.id] || [];
  var n = ex.lines.length;
  if(placed.length < n){
    return {verdict:"incorrect", correct:ex.lines.map(function(l){return l.ro;}).join(" / "),
      diagnosis:"You've placed "+placed.length+" of "+n+" lines. Put them all in order before checking."};
  }
  var wrong = placed.filter(function(idx,pos){ return idx!==pos; }).length;
  if(wrong===0) return {verdict:"correct", correct:ex.lines.map(function(l){return l.ro;}).join(" / ")};
  return {
    verdict: wrong<=2 ? "almost" : "incorrect",
    correct: ex.lines.map(function(l){return l.ro;}).join(" / "),
    diagnosis: wrong===2
      ? "Two lines are swapped — the rest of the sequence is right. Replay the conversation and listen for which one answers which."
      : wrong+" of "+n+" lines are out of place. Try playing it at 0.65× and following the question-and-answer pairs rather than individual words."
  };
}
function checkGapfill(ex){
  var gaps = session.gaps[ex.id] || {};
  var wrong = [], nearMiss = 0;
  ex.answers.forEach(function(a,i){
    var given = gaps[i]||"";
    if(norm(given)===norm(a)) return;
    if(normLoose(given)===normLoose(a)){ nearMiss++; return; }
    wrong.push(a);
  });
  if(!wrong.length && !nearMiss) return {verdict:"correct", correct:ex.fullText};
  if(!wrong.length) return {verdict:"almost", correct:ex.fullText,
    diagnosis:"Every word is right, but "+nearMiss+" of them "+(nearMiss===1?"is":"are")+" missing diacritics. Those letters are part of the spelling, not decoration."};
  return {
    verdict: wrong.length<=1 ? "almost" : "incorrect",
    correct: ex.fullText,
    diagnosis: wrong.length+" of "+ex.answers.length+" gaps "+(wrong.length===1?"is":"are")+" wrong. Replay at a slower speed — the missing words are unstressed in connected speech, which is exactly what makes them hard to catch."
  };
}

/* ---- Generators: build activities from dialogues that already exist ---- */
function buildOrderExercise(d){
  return {
    id:"ord_"+d.id, lesson:null, skill:"listening", type:"order_lines", diff:3,
    topic:null, generated:true, lines:d.lines,
    prompt:"Listen to the whole conversation, then put the lines back in the order you heard them.",
    explain:"Following a conversation means tracking who answers what, not catching every word. "+
      "Question-and-answer pairs are the anchor: a line ending in a question mark is almost always followed by the reply to it. "+
      "From the dialogue <i>"+escapeHtml(d.title)+"</i> — "+escapeHtml(d.titleEn)+"."
  };
}

function buildGapfill(id, text, levelId, title){
  if(!gapfillEligible(levelId)) return null;
  var clean = String(text||"").replace(/\s+/g," ").trim();
  var raw = clean.split(" ");
  // Blank content words only — skip short function words and anything numeric.
  var candidates = [];
  raw.forEach(function(w,i){
    var bare = w.replace(/[.,!?;:()"„”—–]/g,"");
    if(bare.length>4 && !/^\d+$/.test(bare)) candidates.push(i);
  });
  if(candidates.length < 3) return null;
  var chosen = pick(candidates, Math.min(4, Math.max(3, Math.floor(candidates.length/6)))).sort(function(a,b){return a-b;});
  var answers = [];
  var tokens = raw.map(function(w,i){
    if(chosen.indexOf(i)===-1) return {text:w, blank:false};
    var bare = w.replace(/[.,!?;:()"„”—–]/g,"");
    answers.push(bare);
    return {text:w, blank:true};
  });
  return {
    id:"gap_"+id, lesson:null, skill:"listening", type:"gapfill", diff:4,
    topic:null, generated:true, tokens:tokens, answers:answers, fullText:clean, audio:clean,
    prompt:"Listen and type the missing words. Play it as many times as you need.",
    explain:"The blanked words are content words — the ones that carry meaning and that connected speech tends to compress. "+
      (title? "From <i>"+escapeHtml(title)+"</i>. ":"")+
      "If a word kept escaping you, replay at 0.65×: hearing it slowed down once usually makes it audible at full speed afterwards."
  };
}

    '<p style="color:var(--text-2);max-width:62ch;margin-bottom:24px">'+escapeHtml(u.blurb)+'</p>';

  /* A unit can point at a purpose-built assessment instead of the generic

/* ---------- MOVING PROGRESS BETWEEN BROWSERS ----------
   Progress lives in this browser's localStorage, which is per-browser and
   per-device by design. Real accounts need a server to hold the data, and this
   course is a single static file with no backend — so instead of pretending,
   the app makes the save file portable: export it, carry it, import it. That
   covers the actual need (continue on another machine) and has the side benefit
   that the data stays yours and never leaves your computer. */
/* The mistake notebook stores the prompt and the full explanation alongside
   every saved mistake, which is most of the save file's bulk. Both are
   reconstructible from the exercise id, so the pasteable code drops them and
   the import puts them back. The downloaded FILE keeps everything, since size
   costs nothing there. */
function slimStateForCode(st){
  var copy = Object.assign({}, st);
  copy.mistakes = (st.mistakes||[]).map(function(m){
    if(!m.exerciseId || !exerciseById(m.exerciseId)) return m;   // generated: keep verbatim
    var s = Object.assign({}, m);
    delete s.explanation; delete s.promptText;
    return s;
  });
  return copy;
}
function rehydrateMistakes(st){
  (st.mistakes||[]).forEach(function(m){
    if(m.explanation && m.promptText) return;
    var ex = m.exerciseId && exerciseById(m.exerciseId);
    if(!ex) return;
    if(!m.explanation) m.explanation = ex.explain;
    if(!m.promptText)  m.promptText  = String(ex.prompt||"").replace(/<[^>]+>/g,"");
  });
  return st;
}
function stateToCode(){
  var json = JSON.stringify({v:2, at:new Date().toISOString(), slim:1, state:slimStateForCode(state)});
  /* btoa is byte-oriented; Romanian text and names are not ASCII. */
  return btoa(unescape(encodeURIComponent(json)));
}
function codeToState(code){
  var json = decodeURIComponent(escape(atob(String(code).replace(/\s+/g,""))));
  var wrapper = JSON.parse(json);
  if(!wrapper || !wrapper.state) throw new Error("not a progress code");
  return rehydrateMistakes(wrapper.state);
}
/* Merge an imported save over the default shape, so a file written by an older
   build still loads: any key the export predates keeps its default rather than
   arriving undefined and breaking a page halfway through a render. */
function applyImportedState(incoming, source){
  var d = defaultState();
  Object.keys(d).forEach(function(k){
    var saved = incoming[k];
    if(saved===undefined || saved===null) return;
    var nested = d[k] && typeof d[k]==="object" && !Array.isArray(d[k])
              && saved && typeof saved==="object" && !Array.isArray(saved);
    d[k] = nested ? Object.assign({}, d[k], saved) : saved;
  });
  state = d;
  writeState();
  session.transferOpen = false;
  session.importCode = "";
  session.transferErr = "";
  session.transferMsg = "Progress restored from "+source+" — "+progressSummaryLine(state)+".";
  render();
}


/* Romanian inserts "de" between a numeral and the noun it counts once the
   numeral reaches 20 — douăzeci DE ani, but nouăsprezece ani. The rule keys off
   the last two digits, so 101 takes no "de" (o sută unu ani) while 120 does. */
function needsDe(n){
  n = Math.floor(Math.abs(n));
  if(n < 20) return false;
  var lastTwo = n % 100;
  return !(lastTwo >= 1 && lastTwo <= 19);
}
function romanianNumber(n, opts){
  opts = opts || {};
  n = Math.floor(Math.abs(n));
  var fem = !!opts.feminine;
  if(n < 10) return (fem ? NUM_ONES_F : NUM_ONES)[n];
  if(n < 20) return NUM_TEENS[n-10];
  if(n < 100){
    var t = Math.floor(n/10), u = n%10;
    return NUM_TENS[t] + (u ? " și " + (fem ? NUM_ONES_F : NUM_ONES)[u] : "");
  }
  if(n < 1000){
    var h = Math.floor(n/100), rest = n%100;
    /* sută is feminine: o sută, două sute, trei sute … */
    var head = h===1 ? "o sută" : NUM_ONES_F[h] + " sute";
    return head + (rest ? " " + romanianNumber(rest, {feminine:fem}) : "");
  }
  if(n < 1000000){
    var th = Math.floor(n/1000), r2 = n%1000;
    /* mie is feminine (o mie, două mii) and is itself a counted noun, so a
       multiplier of 20 or more takes "de": douăzeci DE mii, cinci sute DE mii. */
    var thHead = th===1 ? "o mie"
      : romanianNumber(th, {feminine:true}) + (needsDe(th) ? " de mii" : " mii");
    return thHead + (r2 ? " " + romanianNumber(r2, {feminine:fem}) : "");
  }
  var mil = Math.floor(n/1000000), r3 = n%1000000;
  /* milion is neuter, and neuter nouns take the feminine numeral in the plural:
     două milioane, not *doi milioane. The "de" rule applies here too. */
  var milHead = mil===1 ? "un milion"
    : romanianNumber(mil, {feminine:true}) + (needsDe(mil) ? " de milioane" : " milioane");
  return milHead + (r3 ? " " + romanianNumber(r3, {feminine:fem}) : "");
}

function isYear(n){ return n >= 1000 && n <= 2999; }
function numberNote(n, context){
  var notes = [];
  if(isYear(n)) notes.push("Years are read out in full in Romanian — never split into pairs the way English says “eighteen fifty-nine”.");
  if(needsDe(n) && !isYear(n)) notes.push("Counting a noun needs <b>de</b> from 20 up: <i>" + romanianNumber(n) + " de ani</i>.");
  else if(n >= 20 && !isYear(n)) notes.push("No <b>de</b> here — the last two digits are between 1 and 19: <i>" + romanianNumber(n) + " ani</i>.");
  if(n === 1 && context === "date") notes.push("The first of the month is <b>întâi</b>, not <i>unu</i>.");
  if(String(n).length > 3 && !isYear(n)) notes.push("<b>mie</b> is feminine, so it takes <b>două</b>: <i>două mii</i>.");
  return notes;
}

PAGES.grammar = function(params){
  var q = session.grammarQuery||"";

  var focus = params[0] ? grammarById(params[0]) : null;

  var cats = [];
  GRAMMAR_TOPICS.forEach(function(g){ if(cats.indexOf(g.cat)===-1) cats.push(g.cat); });
  var levels = [];
  GRAMMAR_TOPICS.forEach(function(g){ if(levels.indexOf(g.level)===-1) levels.push(g.level); });
  levels.sort();

  function matches(g){
    if(lvl!=="all" && g.level!==lvl) return false;
    if(cat!=="all" && g.cat!==cat) return false;
    if(q){
      var hay = normLoose(g.title+" "+g.cat+" "+g.rule+" "+(g.formation||[]).join(" "));

function buildConjugationDrill(cfg){
  var pool = drillPool(cfg);
  if(!pool.length) return [];
  var tenses = cfg.tenses.length? cfg.tenses : ["present"];
  var out = [];
  for(var i=0; i<cfg.length; i++){
    var v = sample(pool);
    var tense = sample(tenses);
    var T = verbTables(v);
    if(!T[tense]) continue;
    var meta = TENSE_META.find(function(t){ return t.id===tense; });
    if(tense==="imperative"){
      var who = sample(["tu","voi"]);
      /* Verbs whose singular imperative is undeclared (or genuinely unused, as
         with stative a părea) must not become drill questions — there would be
         no correct answer to mark against. */
      if(!T.imperative[who]) continue;
      out.push({
        id:"drill_"+v.id+"_imp_"+who+"_"+i, lesson:null, skill:"grammar", type:"conjugate", diff:3,
        topic:"g_imperative", generated:true, vocab:[],
        prompt: escapeHtml(v.inf)+" — <b>"+who+"</b> — "+meta.ro,
        answer: T.imperative[who], accept:[T.imperative[who], String(T.imperative[who]).replace(/!$/,"")],
        audio: T.imperative[who],
        explain:"<b>"+escapeHtml(T.imperative[who])+"</b> — "+escapeHtml(v.en)+". "+
          (v.notes? escapeHtml(v.notes) : "The voi-imperative is identical to the voi present tense; the tu form is less predictable.")
      });
      continue;
    }
    var person = sample(PERSONS);
    var form = T[tense][person];
    if(!form || form==="—") continue;
    out.push({
      id:"drill_"+v.id+"_"+tense+"_"+person+"_"+i, lesson:null, skill:"grammar", type:"conjugate", diff:3,
      topic: tense==="subjunctive" ? "g_subjunctive" : tense==="imperfect" ? "g_imperfect"
           : tense==="past" ? "g_perfect_compus" : tense==="future" ? "g_future"
           : tense==="conditional" ? "g_conditional" : "g_present",
      generated:true, vocab:[],
      prompt: escapeHtml(v.inf)+" — <b>"+PERSON_LABELS[person]+"</b> — "+meta.ro,
      answer: form, accept:[form],
      audio: form,
      explain:"<b>"+escapeHtml(form)+"</b> — "+escapeHtml(v.en)+" ("+meta.en.toLowerCase()+", "+PERSON_LABELS[person]+")."+
        (verbIsIrregular(v)? " This verb is irregular, so the form has to be known rather than derived." :
          " Conjugation class "+escapeHtml(verbGroupLabel(v))+" — the same endings apply to every verb in that class.")+
        (v.notes? "<br><span style=\"color:var(--text-3)\">"+escapeHtml(v.notes)+"</span>" : "")
    });
  }
  return out;
}
PAGES.drill = function(){

        }).join("")+
      '</div>'+
      '<label class="field-label">Length</label>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">'+

};

/* ---------- CHECKPOINTS & LEVEL EXAMS ----------
   A checkpoint mixes material from the units before it; a level exam covers the
   whole level and adds reading, listening and a written task. Neither tells the
   learner which rule is being tested — that is the point of them, since naming
   the rule lets pattern-matching stand in for knowing the language. */


PAGES.exam = function(params){
  var kind = params[0], id = params[1];
  if(!session.exam || session.exam.key !== kind+":"+id){
    var built = buildExam(kind, id);
    if(!built) return notFound("There isn't enough completed material to build this assessment yet.");
    built.key = kind+":"+id;
    session.exam = built;
    session.qIndex = 0; session.sessionDone = false;
    built.items.forEach(function(e){
      delete session.feedback[e.id]; delete session.answers[e.id];
      delete session.built[e.id];    delete session.matched[e.id];
      delete session.gaps[e.id];     delete session.optOrder[e.id];
    });
  }
  var ex = session.exam;
  var answered = ex.items.filter(function(e){ return session.feedback[e.id]; }).length;

  if(session.sessionDone){
    var bySkill = {};
    ex.items.forEach(function(e){
      var f = session.feedback[e.id];
      bySkill[e.skill] = bySkill[e.skill] || {c:0,t:0};
      bySkill[e.skill].t++;
      if(f && f.verdict==="correct") bySkill[e.skill].c++;
    });
    var correct = ex.items.filter(function(e){ var f=session.feedback[e.id]; return f&&f.verdict==="correct"; }).length;
    var score = pct(correct, ex.items.length);
    var passed = score >= ex.passMark;
    var weakest = Object.keys(bySkill).filter(function(k){ return bySkill[k].t; })
      .sort(function(a,b){ return pct(bySkill[a].c,bySkill[a].t)-pct(bySkill[b].c,bySkill[b].t); });

    if(!ex.recorded){
      ex.recorded = true;
      state.examResults.unshift({
        date: todayStr(), kind: ex.kind, id: ex.id, title: ex.title,
        score: score, passed: passed, total: ex.items.length, correct: correct,
        bySkill: Object.keys(bySkill).reduce(function(a,k){ a[k]=pct(bySkill[k].c,bySkill[k].t); return a; }, {})
      });
      if(state.examResults.length>40) state.examResults.length=40;
      markActivityToday(); persist();
    }

    return shell(null,
      '<div class="card" style="padding:28px">'+
        '<div class="section-eyebrow">'+escapeHtml(ex.title)+'</div>'+
        '<h1 style="font-size:32px;margin-bottom:4px">'+score+'%</h1>'+
        '<p style="color:var(--text-2);margin-bottom:18px">'+correct+' of '+ex.items.length+' correct · '+
          (passed? '<b style="color:var(--pine)">passed</b>' : '<b style="color:var(--brick)">below the '+ex.passMark+'% pass mark</b>')+'</p>'+
        '<h2 style="font-size:16px;margin-bottom:12px">Results by skill</h2>'+
        Object.keys(bySkill).map(function(k){
          var p = pct(bySkill[k].c, bySkill[k].t);
          return '<div class="mastery-row" style="margin-bottom:10px">'+
            '<span class="label">'+k[0].toUpperCase()+k.slice(1)+'</span>'+
            '<span class="progressbar'+(p>=80?" pine":"")+'"><span style="width:'+p+'%"></span></span>'+
            '<span class="pct">'+bySkill[k].c+'/'+bySkill[k].t+'</span></div>';
        }).join("")+
        (weakest.length? '<p style="font-size:13.5px;color:var(--text-2);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">'+
          'Weakest area: <b>'+escapeHtml(weakest[0])+'</b>. '+
          (passed? 'Worth a review pass before you move on.' : 'Focus here before retaking.')+'</p>':'')+
        whatYouGotWrong(ex.items, {retryAction:"retryWrongOnly"})+
        '<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">'+
          '<button class="btn" data-action="go" data-page="home">Back to Learn</button>'+
          '<button class="btn secondary" data-action="retakeExam" data-kind="'+escapeHtml(kind)+'" data-id="'+escapeHtml(id)+'">Retake</button>'+
          (state.mistakes.length? '<button class="btn secondary" data-action="go" data-page="mistakes">Review mistakes</button>':'')+
        '</div>'+
      '</div>', null);
  }

  var i = clamp(session.qIndex, 0, ex.items.length-1);
  var item = ex.items[i];
  return shell(null,
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'+
      '<div><div class="section-eyebrow">'+escapeHtml(ex.title)+'</div>'+
      '<p style="color:var(--text-2);font-size:13.5px;max-width:56ch">'+escapeHtml(ex.blurb)+'</p></div>'+
      '<span class="tabular" style="font-size:12.5px;color:var(--text-3);white-space:nowrap">'+answered+' / '+ex.items.length+'</span>'+
    '</div>'+
    '<div class="progressbar" style="margin:12px 0 20px"><span style="width:'+pct(answered,ex.items.length)+'%"></span></div>'+
    renderExercise(item, {counter:"Question "+(i+1)+" of "+ex.items.length, examMode:true}),
    null);
};

/* ---------- READING MODE ---------- */
PAGES.reading = function(params){
  var r = params[0]? readingById(params[0]) : null;
  if(r){
    var qs = openExercises().filter(function(e){ return e.readingId===r.id; });
    var inEnglish = qs.filter(function(e){ return e.qLang!=="ro"; });
    var inRomanian = qs.filter(function(e){ return e.qLang==="ro"; });
    var block = function(list){
      return list.map(function(e){
        return '<div style="margin-bottom:16px">'+renderExercise(e,{onContinue:false, showPassage:false})+'</div>';
      }).join("");
    };
    return shell(null,
      '<button class="btn ghost sm" data-action="go" data-page="reading" style="margin-bottom:12px">← All texts</button>'+
      renderReading(r)+
      (inEnglish.length? '<h2 style="font-size:18px;margin:22px 0 12px">Comprehension</h2>'+block(inEnglish) : '')+
      /* Romanian-language questions sit in their own block so the switch of
         language is announced rather than sprung. */
      (inRomanian.length
        ? '<h2 style="font-size:18px;margin:26px 0 4px">Întrebări în română</h2>'+
          '<p style="font-size:13px;color:var(--text-3);margin-bottom:12px;max-width:60ch">'+
            'Same text, questions in Romanian. Click any word you don\'t know — the point is to answer '+
            'without translating the question into English first.</p>'+
          block(inRomanian)
        : '')
    , null);
  }
  var byLevel = {};
  READING_TEXTS.forEach(function(t){ (byLevel[t.level]=byLevel[t.level]||[]).push(t); });
  return shell(null,
    '<h1 style="font-size:28px;margin-bottom:6px">Reading</h1>'+
    '<p style="color:var(--text-2);margin-bottom:20px;max-width:60ch">Texts get longer and less supported as you climb: 40–70 words at A1, 80–100 at A2.1, 110–150 at A2.2, and 560–660 in the B1 long-form pieces — well past the 230-word texts the I.L.R. exam uses, because reading at length is a different skill from reading accurately. Click any word for its meaning; the full translation stays hidden until you ask for it.</p>'+
    LEVELS.filter(function(l){ return byLevel[l.id]; }).map(function(l){
      return '<h2 style="font-size:16px;margin:20px 0 10px">'+l.code+' · '+escapeHtml(l.name)+'</h2>'+
        byLevel[l.id].map(function(t){
          return '<div class="card" style="padding:16px 18px;margin-bottom:10px;display:flex;gap:14px;align-items:center">'+
            '<div style="flex:1"><b style="font-family:var(--font-display);font-size:16.5px">'+escapeHtml(t.title)+'</b>'+
            '<div style="font-size:12.5px;color:var(--text-3);margin-top:2px">'+escapeHtml(t.titleEn)+' · '+escapeHtml(t.format)+' · '+t.wordCount+' words</div></div>'+
            '<button class="btn secondary sm" data-action="go" data-page="reading" data-p1="'+t.id+'">Read</button></div>';
        }).join("");
    }).join(""), null);
};

/* ---------- WRITING MODE ---------- */
PAGES.writing = function(params){
  var e = params[0]? exerciseById(params[0]) : null;
  if(e){
    return shell(null,
      '<button class="btn ghost sm" data-action="go" data-page="writing" style="margin-bottom:12px">← All writing tasks</button>'+
      renderExercise(e,{onContinue:false}), null);
  }
  var tasks = openExercises().filter(function(x){ return x.type==="produce"; });
  var byLevel = {};
  tasks.forEach(function(t){
    var l = lessonById(t.lesson);
    var key = l? l.levelId : "a1_1";
    (byLevel[key]=byLevel[key]||[]).push(t);
  });
  return shell(null,
    '<h1 style="font-size:28px;margin-bottom:6px">Writing</h1>'+
    '<p style="color:var(--text-2);margin-bottom:8px;max-width:60ch">Single sentences at A1, short messages at A2, connected texts of 100–180 words at B1.</p>'+
    '<p style="color:var(--text-3);font-size:13.5px;margin-bottom:20px;max-width:60ch">Submitted work gets feedback split by category — diacritics, sentence length, grammar and vocabulary — alongside a model answer to compare against. The checks are mechanical, so they catch structure rather than judging style.</p>'+
    LEVELS.filter(function(l){ return byLevel[l.id]; }).map(function(l){
      return '<h2 style="font-size:16px;margin:20px 0 10px">'+l.code+' · '+escapeHtml(l.name)+'</h2>'+
        byLevel[l.id].map(function(t){
          var done = session.feedback[t.id];
          return '<div class="card" style="padding:16px 18px;margin-bottom:10px;display:flex;gap:14px;align-items:center">'+
            '<div style="flex:1"><div style="font-size:14.5px">'+t.prompt+'</div>'+
            '<div style="font-size:12px;color:var(--text-3);margin-top:5px">at least '+(t.minWords||10)+' words'+
              (done? ' · <span style="color:var(--pine)">attempted</span>':'')+'</div></div>'+
            '<button class="btn secondary sm" data-action="go" data-page="writing" data-p1="'+t.id+'">Write</button></div>';
        }).join("");
    }).join(""), null);
};

/* ---------- PLACEMENT TEST ---------- */
/* ===================== PLACEMENT TEST =====================
   Organized into bands of four, one band per level, and scored band by band
   rather than by "highest question answered correctly" — a single lucky guess
   must not place someone three levels above where they are.

   Guessing is further constrained by mixing in typed items, which have no
   options at all, and by using four options rather than three on the rest. */
var PLACEMENT_STOP = 0.5;    // below half → stop, the ceiling has been found


PAGES.placement = function(){
  var st = session.placement || (session.placement = newPlacementRun());

  if(st.done){
    var res = placementResult(st);
    var rec = levelById(res.placement) || LEVELS[0];
    var cefrLevels = levelsOfCourse("cefr");
    return '<div class="shell"><main class="main"><div class="main-inner" style="max-width:660px;padding-top:30px">'+
      '<div class="section-eyebrow">Placement result</div>'+
      '<h1 style="font-size:30px;margin-bottom:6px">Start at '+rec.code+'</h1>'+
      '<p style="color:var(--text-2);margin-bottom:20px;max-width:58ch">'+
        res.totalCorrect+' of '+res.totalAsked+' correct overall. You are placed at the first level you did <b>not</b> clear — '+
        'that is where there is still something to learn, so it is where the course starts you.</p>'+

      '<div class="card" style="padding:18px 20px;margin-bottom:16px">'+
        '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:12px">How you did at each level</div>'+
        res.bands.map(function(b){
          return '<div class="mastery-row" style="margin-bottom:10px">'+
            '<span class="label">'+b.label+'</span>'+
            '<span class="progressbar'+(b.passed?" pine":"")+'"><span style="width:'+b.pct+'%"></span></span>'+
            '<span class="pct" style="width:70px;text-align:right">'+b.correct+'/'+b.total+
              ' <span class="badge '+(b.passed?'pine':'brick')+'" style="margin-left:4px">'+(b.passed?'pass':'not yet')+'</span></span>'+
          '</div>';
        }).join("")+
        '<p style="font-size:12.5px;color:var(--text-3);margin-top:10px">A level counts as cleared at 3 of 4. '+
          (res.bands.length < PLACEMENT_BANDS.length
            ? 'The test stopped early once a level was clearly beyond you — the remaining levels were not asked.'
            : 'You were asked every level.')+'</p>'+
      '</div>'+

      '<p style="color:var(--text-2);font-size:14px;margin-bottom:10px">This is a recommendation, not a verdict. Override it if you disagree:</p>'+
      '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">'+
        cefrLevels.map(function(l){
          return '<button class="btn '+(l.id===rec.id?'':'secondary')+'" style="justify-content:flex-start" data-action="acceptPlacement" data-level="'+l.id+'">'+
            l.code+' · '+escapeHtml(l.name)+(l.id===rec.id?'  — recommended':'')+'</button>';
        }).join("")+'</div>'+
      '<button class="btn ghost sm" data-action="restartPlacement">Retake the test</button>'+
    '</div></main></div>';
  }

  var band = PLACEMENT_BANDS[st.bandIndex];
  var item = st.picks[st.bandIndex][st.itemIndex];
  var asked = placementFlatIndex(st, st.bandIndex, st.itemIndex);
  var maxItems = st.picks.reduce(function(a,p){ return a+p.length; },0);

  var body;
  if(item.type==="mcq"){
    body = item.opts.map(function(o,i){
      return '<button type="button" class="mcq-option" data-action="answerPlacement" data-i="'+i+'">'+
        '<span class="mcq-letter">'+String.fromCharCode(65+i)+'</span><span class="ro">'+escapeHtml(o)+'</span></button>';
    }).join("");
  } else {
    body = '<input type="text" data-field="plc" data-autofocus data-action="typePlacement" '+
      'data-enter-action="submitPlacement" autocomplete="off" spellcheck="false" '+
      'placeholder="Type your answer…" value="'+escapeHtml(st.typed||"")+'" aria-label="Your answer" />'+
      diacriticBar("plc")+
      '<div style="margin-top:12px;display:flex;gap:10px;align-items:center">'+
        '<button class="btn" data-action="submitPlacement">Submit</button>'+
        '<button class="btn secondary" data-action="skipPlacement">I don\'t know</button>'+
      '</div>';
  }

  return '<div class="shell"><main class="main"><div class="main-inner" style="max-width:620px;padding-top:30px">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'+
      '<div class="section-eyebrow">Placement test · '+band.label+' section</div>'+
      '<span class="tabular" style="font-size:12.5px;color:var(--text-3)">question '+(asked+1)+'</span></div>'+
    '<div class="progressbar" style="margin-bottom:22px"><span style="width:'+pct(asked,maxItems)+'%"></span></div>'+
    '<div class="exercise-shell">'+
      '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">'+
        (item.type==="mcq"?"Choose one":"Type the answer")+'</div>'+
      '<div class="exercise-prompt" style="font-family:var(--font-display)">'+item.q+'</div>'+
      body+
      (item.hint? '<p style="font-size:12.5px;color:var(--text-3);margin-top:10px">'+escapeHtml(item.hint)+'</p>':'')+
      '<p style="font-size:12.5px;color:var(--text-3);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">'+
        'No feedback until the end. If you genuinely don\'t know, say so rather than guessing — '+
        'a wrong guess that happens to land right will place you above your actual level, which helps nobody.</p>'+
    '</div></div></main></div>';
};


/* ===================== ACTIONS ===================== */


var Actions = {
  go: function(el){
    var page = el.getAttribute("data-page");
    var ps = [el.getAttribute("data-p1"), el.getAttribute("data-p2")].filter(function(x){ return x!=null; });
    /* Opening a unit or lesson from the map implies its track — keep the rest
       of the app (recommended lesson, Learn page) in step with what was opened. */
    var ctx = page==="unit" ? unitById(ps[0])
            : page==="lesson" ? lessonById(ps[0]) : null;
    if(ctx){
      var lv = levelById(ctx.levelId);
      if(lv) session.course = lv.course||"cefr";
    }
    session.sidebarOpen = false;
    if(page!==parseHash().page){
      session.queue=null; session.queueKind=null; session.sessionDone=false; session.qIndex=0;
      if(page!=="exam") session.exam = null;
    }
    navigate(page, ps);
  },
  toggleSidebar: function(){ session.sidebarOpen = !session.sidebarOpen; render(); },
  setCourse: function(el){
    session.course = el.getAttribute("data-course");
    session.queue=null; session.exam=null; session.sessionDone=false; session.qIndex=0;
    navigate("home");
  },
  toggleLevel: function(el){
    var id = el.getAttribute("data-level");
    state.settings.openLevels = state.settings.openLevels || {};
    var wasOpen = el.getAttribute("aria-expanded")==="true";
    state.settings.openLevels[id] = wasOpen ? "closed" : "open";
    persist(); render();
  },
  /* Operates on every level the sidebar renders, which is all of them across
     all tracks. It used to toggle only the current course's levels while the
     button's label tested all of them — so once there was more than one track,
     "every level is open" was never true, the label was stuck on "Expand all",
     and "Collapse all" could not be reached. */
  toggleAllLevels: function(){
    /* Mirrors the label: if anything is open, close everything; otherwise open
       everything. The active unit's level counts as open even when nothing has
       been set explicitly, so the first click on a fresh session collapses. */
    var route = parseHash();
    var activeUnit = route.page==="unit" ? route.params[0]
                   : (route.page==="lesson" && lessonById(route.params[0]) ? lessonById(route.params[0]).unitId : null);
    var anyOpen = LEVELS.some(function(l){ return levelIsOpen(l.id, activeUnit); });
    state.settings.openLevels = state.settings.openLevels || {};
    LEVELS.forEach(function(l){ state.settings.openLevels[l.id] = anyOpen ? "closed" : "open"; });
    persist(); render();
  },
  /* Same elision handling as glossLookup, so the clip resolves for nost' etc. */
  replayGloss: function(el){ Speech.speak(String(el.getAttribute("data-text")||"").replace(/['’]+$/,"")); },
  setMediaFilter: function(el){
    var cfg = session.mediaFilter || (session.mediaFilter = {level:"all", kind:"all"});
    cfg[el.getAttribute("data-group")] = el.getAttribute("data-val");
    render();
  },
  typeTranscript: function(el){ session.transcriptDraft = el.value; },
  editTranscript: function(el){
    session.mediaEditing = el.getAttribute("data-vid");
    session.transcriptDraft = mediaTranscript(session.mediaEditing);
    render();
  },
  cancelTranscript: function(){
    session.mediaEditing = null; session.transcriptDraft = null; render();
  },
  saveTranscript: function(el){
    var id = el.getAttribute("data-vid");
    state.mediaTranscripts = state.mediaTranscripts || {};
    var text = String(session.transcriptDraft==null ? mediaTranscript(id) : session.transcriptDraft).trim();
    if(text) state.mediaTranscripts[id] = text;
    else delete state.mediaTranscripts[id];
    session.mediaEditing = null; session.transcriptDraft = null;
    persist(); render();
  },
  startIlrMock: function(){
    var st = ilrMockState();
    st.started = Date.now(); st.paper = 0; st.done = false;
    /* Clear any prior attempt so a re-sit is not pre-filled with old answers. */
    mockItems("ilr").forEach(function(e){
      delete session.feedback[e.id]; delete session.answers[e.id];
      delete session.built[e.id];    delete session.matched[e.id];
      delete session.gaps[e.id];     delete session.optOrder[e.id];
    });
    render();
  },
  nextIlrPaper: function(){
    var st = ilrMockState();
    if(st.paper < ILR_PAPERS.length-1){ st.paper++; window.scrollTo(0,0); }
    else st.done = true;
    render();
  },
  restartIlrMock: function(){ session.ilrMock = null; Actions.startIlrMock(); },
  toggleUnlockAll: function(){
    state.settings.unlockAll = !state.settings.unlockAll; persist(); render();
  },
  enableProfanity: function(el){
    state.settings.showProfanity = true; persist();
    navigate("lesson",[el.getAttribute("data-lesson"),"0"]);
  },
  toggleProfanity: function(){
    state.settings.showProfanity = !state.settings.showProfanity; persist(); render();
  },
  playVideo: function(el){ session.videoOpen = el.getAttribute("data-vid"); render(); },
  closeVideo: function(){ session.videoOpen = null; render(); },
  playAudio: function(el){
    var seq = el.getAttribute("data-seq");
    var lines = seq ? JSON.parse(seq) : null;
    var text = lines ? lines.join(" ") : el.getAttribute("data-text");
    el.classList.remove("audio-failed");
    el.classList.add("playing");
    var clear = function(){ el.classList.remove("playing"); };
    var fail = function(){
      clear(); el.classList.add("audio-failed");
      el.title = "No Romanian pronunciation for this — see Listening → Pronunciation source";
    };
    var res = lines
      ? Speech.speakSequence(lines, {onend:clear})
      : Speech.speak(text, {onend:clear, onerror:fail});
    if(!res.ok) fail();
    setTimeout(clear, Math.max(2500, text.length*100));
  },
  setSpeed: function(el){ state.settings.audioSpeed = parseFloat(el.getAttribute("data-speed")); persist(); render(); },
  recheckVoices: function(){ Speech.resetSource(); Speech.refresh(); render(); },
  toggleMotion: function(){ state.settings.reduceMotion = !state.settings.reduceMotion; persist(); render(); },

  typeAnswer: function(el){ session.answers[el.getAttribute("data-ex")] = el.value; },
  insertChar: function(el){
    var key = el.getAttribute("data-target");
    var field = document.querySelector('[data-field="'+key+'"]');
    if(!field) return;
    var ch = el.getAttribute("data-char");
    var s = field.selectionStart==null? field.value.length : field.selectionStart;
    var e = field.selectionEnd==null? s : field.selectionEnd;
    field.value = field.value.slice(0,s) + ch + field.value.slice(e);
    field.focus();
    try{ field.setSelectionRange(s+1, s+1); }catch(err){}
    var exId = field.getAttribute("data-ex");
    if(exId) session.answers[exId] = field.value;
  },
  pickOption: function(el){
    var id = el.getAttribute("data-ex");
    if(session.feedback[id]) return;
    session.answers[id] = parseInt(el.getAttribute("data-i"),10);
    render();
  },
  placeWord: function(el){
    var id = el.getAttribute("data-ex");
    if(session.feedback[id]) return;
    session.built[id] = (session.built[id]||[]).concat([parseInt(el.getAttribute("data-i"),10)]);
    render();
  },
  unplaceWord: function(el){
    var id = el.getAttribute("data-ex");
    if(session.feedback[id]) return;
    var arr = (session.built[id]||[]).slice();
    arr.splice(parseInt(el.getAttribute("data-pos"),10),1);
    session.built[id]=arr; render();
  },
  pickMatch: function(el){
    var id = el.getAttribute("data-ex");
    session.matched[id] = session.matched[id]||{};
    session.matched[id][el.getAttribute("data-row")] = el.value;
  },
  revealHint: function(el){ session.revealed[el.getAttribute("data-ex")]=true; render(); },
  revealLine: function(el){
    var k = el.getAttribute("data-key");
    /* Toggles where the control offers to hide again (verse translations);
       one-way reveal everywhere else, where re-hiding makes no sense. */
    session.revealed[k] = el.hasAttribute("data-toggle") ? !session.revealed[k] : true;
    render();

/* Shadowing runner. Plays the current line, then holds a silent gap scaled to
   the line's length so there is time to repeat it, then advances by itself. */
var shadowTimer = null;
var glossTimer = null;
/* One popup implementation for both words and numerals — positioning, the
   dismiss timer and the hover-to-keep-open behaviour are identical, and the
   replay control is only reachable because of that timer handling. */
function showGlossPopup(el, title, innerHtml, speakText){
  var old = document.querySelector(".gloss-pop"); if(old) old.remove();
  var pop = document.createElement("div");
  pop.className = "gloss-pop";
  pop.innerHTML = '<b>' + escapeHtml(title) + '</b>' + innerHtml;
  document.body.appendChild(pop);
  var r = el.getBoundingClientRect();
  pop.style.left = Math.min(r.left, window.innerWidth - 250) + "px";
  pop.style.top = (r.bottom + 6) + "px";
  if(speakText) Speech.speak(speakText);
  clearTimeout(glossTimer);
  /* Long enough, and canceled while the pointer is over the popup, so the
     replay control is actually reachable. */
  glossTimer = setTimeout(function(){ pop.remove(); }, 9000);
  pop.addEventListener("mouseenter", function(){ clearTimeout(glossTimer); });
  pop.addEventListener("mouseleave", function(){
    glossTimer = setTimeout(function(){ pop.remove(); }, 1500);
  });
}
/* Advance the placement test, stopping early once a band is clearly beyond the
   learner — there is no point asking B1.2 questions of someone who could not
   clear A1.2, and every extra guess only adds noise to the result. */
function recordPlacement(answer){
  var st = session.placement; if(!st || st.done) return;
  st.answers[st.bandIndex+"_"+st.itemIndex] = answer;
  st.typed = "";
  var items = st.picks[st.bandIndex];

  if(st.itemIndex < items.length-1){
    st.itemIndex++;
    render();
    return;
  }
  // Band finished — score it before deciding whether to continue.
  var correct = 0;
  items.forEach(function(item, i){
    var a = st.answers[st.bandIndex+"_"+i];
    if(item.type==="mcq"){ if(a===item.a) correct++; }
    else if(a && item.accept.some(function(x){ return normLoose(a)===normLoose(x); })) correct++;
  });
  var ratio = correct / items.length;
  var lastBand = st.bandIndex >= PLACEMENT_BANDS.length-1;

  if(lastBand || ratio < PLACEMENT_STOP){
    st.done = true;
  } else {
    st.bandIndex++; st.itemIndex = 0;
  }
  render();
}
function runShadowLine(){
  var s = session.shadow; if(!s) return;
  var d = dialogueById(s.dialogueId); if(!d) return;
  var line = d.lines[s.index];
  clearTimeout(shadowTimer);
  s.phase = "listen"; render();
  Speech.speak(line.ro, {
    onend: function(){
      if(!session.shadow || session.shadow!==s) return;
      s.phase = "repeat"; render();
      // Roughly the time the line itself took, floored at 1.8s.
      var gap = Math.max(1800, line.ro.length * 85 / (state.settings.audioSpeed||1));
      shadowTimer = setTimeout(function(){
        if(!session.shadow || session.shadow!==s) return;
        if(s.index < d.lines.length-1){ s.index++; runShadowLine(); }
        else { session.shadow = null; render(); }
      }, gap);
    },
    onerror: function(){
      if(!session.shadow || session.shadow!==s) return;
      s.phase = "repeat"; render();
    }
  });
}
function startQueue(kind, exercises){
  session.queue = exercises; session.queueKind = kind;
  session.qIndex = 0; session.sessionDone = false;
  /* Clear everything per-attempt, including the option permutation — a new
     session must not present the same answer in the same position. */
  exercises.forEach(function(e){
    delete session.feedback[e.id]; delete session.answers[e.id];
    delete session.built[e.id];    delete session.matched[e.id];
    delete session.gaps[e.id];     delete session.optOrder[e.id];
  });
  render();
}
/* Vocabulary review re-uses whichever course exercises tag the due words; if a
   word has no exercise yet, it gets a generated recognition question so the
   queue is never empty. */
function buildVocabQueue(ids){
  var out = [];
  ids.forEach(function(vid){
    var tagged = openExercises().filter(function(e){ return (e.vocab||[]).indexOf(vid)>-1; });
    if(tagged.length){ out.push(sample(tagged)); return; }
    var v = vocabById(vid); if(!v) return;
    var distractors = pick(VOCAB.filter(function(x){ return x.id!==vid && x.pos===v.pos; }), 2);
    if(distractors.length<2) return;
    var opts = shuffle([v].concat(distractors));
    out.push({
      id:"gen_"+vid, lesson:null, skill:"vocabulary", type:"mcq", diff:1, topic:null, generated:true,
      prompt:'What does <span class="ro" style="font-family:var(--font-display);font-size:20px">'+escapeHtml(v.ro)+'</span> mean?',
      options: opts.map(function(o){ return o.en; }), correct: opts.indexOf(v),
      audio: v.ro, vocab:[vid],
      explain:"<b>"+escapeHtml(v.ro)+"</b> — "+escapeHtml(v.en)+(v.ex? "<br><i>"+escapeHtml(v.ex.ro)+"</i> — "+escapeHtml(v.ex.en):"")
    });
  });
  return out.filter(Boolean);
}

PAGES.lessondone = function(params){
  var r = session.lastLessonResult;
  var l = lessonById(params[0]);
  if(!r || !l) return notFound("No lesson result to show.");
  var passed = r.score>=80 && r.answered===r.total;
  var next = nextLessonAfter(l);
  return '<div class="shell"><main class="main"><div class="main-inner" style="max-width:620px;padding-top:30px">'+
    '<div class="section-eyebrow">'+(passed?"Lesson complete":"Lesson attempted")+'</div>'+
    '<h1 style="font-size:30px;margin-bottom:10px">'+escapeHtml(l.title)+'</h1>'+
    '<div class="card" style="padding:22px;margin-bottom:16px">'+
      '<div style="font-size:34px;font-weight:700;font-family:var(--font-mono)">'+r.score+'%</div>'+
      '<div style="color:var(--text-2);font-size:14px;margin-bottom:14px">'+r.correct+' of '+r.total+' exercises correct'+
        (r.answered<r.total? ' · '+(r.total-r.answered)+' not attempted':'')+'</div>'+
      (passed
        ? '<p style="font-size:14px;color:var(--pine)"><b>Marked complete.</b> The vocabulary from this lesson has entered your review queue and will come back on a spaced schedule.</p>'
        : '<p style="font-size:14px;color:var(--accent-strong)"><b>Not marked complete yet.</b> A lesson needs every core exercise attempted and a score of at least 80%. Your best score is kept — retry the weak parts rather than starting over.</p>')+
      whatYouGotWrong(lessonExercises(l), {retryAction:"retryWrongOnly"})+
    '</div>'+
    nextLessonCard(l, passed)+
    '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
      (next
        ? '<button class="btn" data-action="go" data-page="lesson" data-p1="'+next.id+'">Next lesson →</button>'+
          '<button class="btn secondary" data-action="go" data-page="unit" data-p1="'+l.unitId+'">Back to unit</button>'
        : '<button class="btn" data-action="go" data-page="unit" data-p1="'+l.unitId+'">Back to unit</button>')+
      '<button class="btn secondary" data-action="go" data-page="lesson" data-p1="'+l.id+'">Review this lesson</button>'+
      (dueVocabIds().length? '<button class="btn secondary" data-action="go" data-page="review">Review vocabulary</button>':'')+
    '</div>'+
  '</div></main></div>';
};

   js/core/topbar.js, loaded above this script, along with the icon helpers
   (js/core/icons.js) and navIsActive (js/core/navigation.js) it calls.
   renderApp — now in js/core/render.js — still calls renderTopbar();
   shell() still calls mobileNav(). */


/* captureField and restoreField now live in js/core/fields.js, loaded just
   above this script. renderApp — now in js/core/render.js — still calls
   both across that script boundary. */


/* The back-to-top control (scrollTopBtn, ensureScrollTop, updateScrollTop and
   its three listeners) now lives in js/core/scroll.js, loaded just above this

/* Actions that must NOT fire on click — they are driven by input/change so the
   field keeps its own value while the learner types. */
var INPUT_DRIVEN = {typeAnswer:1, typeGap:1, typePlacement:1, grammarSearch:1, vocabSearch:1,
                    verbSearch:1, pickMatch:1, toggleMotion:1, toggleProfanity:1, typeImport:1, importFile:1,
                    typeTranscript:1};

document.addEventListener("click", function(e){
  /* A glossable word can sit inside a clickable control (an MCQ option, a
     dialogue line). Looking a word up must not also trigger the control, so
     the innermost gloss wins and stops there. */
  var gloss = e.target.closest('[data-action="glossWord"],[data-action="glossNumber"]');
  if(gloss){
    e.preventDefault(); e.stopPropagation();
    Actions[gloss.getAttribute("data-action")](gloss, e);
    return;
  }
  var el = e.target.closest("[data-action]");
  if(!el || el.disabled) return;
  var name = el.getAttribute("data-action");
  if(INPUT_DRIVEN[name]) return;
  var fn = Actions[name];
  if(fn){ fn(el, e); }
});
/* Live typing: update the model without a re-render, so the caret stays put. */
document.addEventListener("input", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var name = el.getAttribute("data-action");
  /* Model-only updates: no re-render, so the caret stays where the learner
     put it. Every typed field must be listed here or its value is silently
     dropped when the answer is checked. */
  if(name==="typeAnswer" || name==="typeGap" || name==="typePlacement" || name==="typeImport" || name==="typeTranscript"){
    Actions[name](el, e);
    return;
  }
  if(name==="grammarSearch" || name==="vocabSearch" || name==="verbSearch"){
    clearTimeout(el._deb);
    el._deb = setTimeout(function(){ Actions[name](el, e); }, 220);
  }
});
document.addEventListener("change", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var name = el.getAttribute("data-action");
  if(name==="pickMatch" || name==="toggleMotion" || name==="toggleProfanity" || name==="importFile"){ Actions[name](el, e); }
});
/* Keyboard activation for the div-based rows that act as buttons. */
document.addEventListener("keydown", function(e){
  if(e.key!==" " && e.key!=="Enter") return;
  var el = e.target.closest('[role="button"][data-action]');
  if(!el) return;
  e.preventDefault();
  var fn = Actions[el.getAttribute("data-action")];
  if(fn) fn(el, e);
});
/* Enter submits the exercise the learner is actually in — resolve outward from
   the focused field rather than grabbing the first match in the document, which
   fires the wrong one on review pages that show several exercises at once.
   Shift+Enter stays free for newlines in the B1 paragraph-writing tasks. */
document.addEventListener("keydown", function(e){
  if(e.key!=="Enter" || e.shiftKey) return;
  var active = document.activeElement;
  if(!active || active.tagName!=="INPUT") return;
  var el = active.closest("[data-enter-action]") || document.querySelector("[data-enter-action]");
  if(!el) return;
  var fn = Actions[el.getAttribute("data-enter-action")];
  if(fn){ e.preventDefault(); fn(el, e); }
});

/* Audit hook: dump the generated conjugation of one verb, or the present tense
   of every verb, so tables produced by the engine can be checked against a
   reference instead of trusted. Generated forms are only as good as the class
   each verb was tagged with, and a wrong ending taught confidently is worse
   than no table at all. */
window.__verbAudit = function(inf){
  if(inf){
    var v = VERBS.find(function(x){ return x.inf===inf || x.id===inf; });
    return v ? {inf:v.inf, group:v.group, irregular:!!v.irregular, tables:verbTables(v)} : null;
  }
  return VERBS.map(function(v){
    var t = verbTables(v);
    return {inf:v.inf, group:verbGroupKey(v), irr:!!v.irregular, hand:!!v.present,
            present:PERSONS.map(function(p){ return t.present[p]; }).join(" · "),
            part:t.participle, subj3:t.subjunctive.el, imp:t.imperative.tu};
  });
};

/* Build-tool hook: every Romanian string in the course that has a play button.
   tools/fetch-audio.py reads this to pre-render native pronunciation clips. */
window.__roAudioStrings = function(){
  var out = {};
  var add = function(s){ if(s && String(s).trim()) out[String(s).trim()] = 1; };
  VOCAB.forEach(function(v){ add(v.ro); if(v.ex) add(v.ex.ro); });
  DIALOGUES.forEach(function(d){ d.lines.forEach(function(l){ add(l.ro); }); });
  GRAMMAR_TOPICS.forEach(function(g){ (g.examples||[]).forEach(function(e){ add(e.ro); }); });
  VERBS.forEach(function(v){
    add(v.inf); if(v.example) add(v.example.ro);
    ["present","past","imperfect","future","conditional","subjunctive"].forEach(function(t){
      if(v[t]) Object.keys(v[t]).forEach(function(p){ add(v[t][p]); });
    });
    if(v.imperative){ add(v.imperative.tu); add(v.imperative.voi); }
  });
  EXERCISES.forEach(function(e){
    add(e.audio);
    (e.audioFor||[]).forEach(add);
    if(e.answer) add(e.answer);
    if(e.type==="match") (e.pairs||[]).forEach(function(p){ add(p[0]); });
  });
  READING_TEXTS.forEach(function(r){ add(r.ro.replace(/\s+/g," ")); });
  return Object.keys(out);
};

/* boot */
render();

})();
