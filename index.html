/* Split a passage into sentences so it can be read aloud clip by clip, and so
   a missing clip costs one sentence rather than the whole text. */
function sentencesOf(text){
  var parts = String(text||"").replace(/\n+/g," ").match(/[^.!?…]+[.!?…]*/g) || [];
  return parts
    /* Quoted speech inside a passage ("…!" strigă toți) leaves fragments that
       begin with a closing quote. Strip stray quote marks and drop anything
       with no actual words left. */
    .map(function(s){ return s.replace(/^[\s”"„»«]+/, "").trim(); })
    .filter(function(s){ return /[a-zăâîșțA-ZĂÂÎȘȚ]{2,}/.test(s); });
}
/* ---------- READING NUMERALS ALOUD ----------
   Digits in a text were inert: a learner could click every word in "În 1859,
   Alexandru Ioan Cuza a fost ales domn" and still have no idea how to say the
   year. Numerals are also where Romanian diverges sharply from English, so
   leaving them unglossed skips a real teaching point rather than a detail.

   Things worth knowing, all of which this encodes:
     · Years are read in FULL, not in pairs — 1859 is "o mie opt sute cincizeci
       și nouă", never "eighteen fifty-nine".
     · sută and mie are feminine, so they take două: două mii, not *doi mii.
     · Several teens and tens are irregular in speech: paisprezece (14),
       șaisprezece (16), șaizeci (60).
     · From 20 up, counting a noun needs "de": douăzeci DE ani, but nouăsprezece
       ani with no "de". */
var NUM_ONES = ["zero","unu","doi","trei","patru","cinci","șase","șapte","opt","nouă"];
var NUM_TEENS = ["zece","unsprezece","doisprezece","treisprezece","paisprezece","cincisprezece",
                 "șaisprezece","șaptesprezece","optsprezece","nouăsprezece"];
var NUM_TENS = ["","","douăzeci","treizeci","patruzeci","cincizeci","șaizeci","șaptezeci","optzeci","nouăzeci"];
/* The feminine forms, needed before sută/mie and when counting feminine nouns. */
var NUM_ONES_F = ["zero","una","două","trei","patru","cinci","șase","șapte","opt","nouă"];

/* Romanian inserts "de" between a numeral and the noun it counts once the
   numeral reaches 20 — douăzeci DE ani, but nouăsprezece ani. The rule keys off
   the last two digits, so 101 takes no "de" (o sută unu ani) while 120 does. */
function needsDe(n){
  n = Math.floor(Math.abs(n));
  if(n < 20) return false;
  var lastTwo = n % 100;
  return !(lastTwo >= 1 && lastTwo <= 19);
}
function romanianNumber(n, opts){
  opts = opts || {};
  n = Math.floor(Math.abs(n));
  var fem = !!opts.feminine;
  if(n < 10) return (fem ? NUM_ONES_F : NUM_ONES)[n];
  if(n < 20) return NUM_TEENS[n-10];
  if(n < 100){
    var t = Math.floor(n/10), u = n%10;
    return NUM_TENS[t] + (u ? " și " + (fem ? NUM_ONES_F : NUM_ONES)[u] : "");
  }
  if(n < 1000){
    var h = Math.floor(n/100), rest = n%100;
    /* sută is feminine: o sută, două sute, trei sute … */
    var head = h===1 ? "o sută" : NUM_ONES_F[h] + " sute";
    return head + (rest ? " " + romanianNumber(rest, {feminine:fem}) : "");
  }
  if(n < 1000000){
    var th = Math.floor(n/1000), r2 = n%1000;
    /* mie is feminine (o mie, două mii) and is itself a counted noun, so a
       multiplier of 20 or more takes "de": douăzeci DE mii, cinci sute DE mii. */
    var thHead = th===1 ? "o mie"
      : romanianNumber(th, {feminine:true}) + (needsDe(th) ? " de mii" : " mii");
    return thHead + (r2 ? " " + romanianNumber(r2, {feminine:fem}) : "");
  }
  var mil = Math.floor(n/1000000), r3 = n%1000000;
  /* milion is neuter, and neuter nouns take the feminine numeral in the plural:
     două milioane, not *doi milioane. The "de" rule applies here too. */
  var milHead = mil===1 ? "un milion"
    : romanianNumber(mil, {feminine:true}) + (needsDe(mil) ? " de milioane" : " milioane");
  return milHead + (r3 ? " " + romanianNumber(r3, {feminine:fem}) : "");
}
/* Ordinals only where a learner actually meets them: dates. The 1st of a month
   is întâi, never *unu — "1 decembrie" is read "întâi decembrie". */
var MONTHS_RO = ["ianuarie","februarie","martie","aprilie","mai","iunie",
                 "iulie","august","septembrie","octombrie","noiembrie","decembrie"];
function isYear(n){ return n >= 1000 && n <= 2999; }
function numberNote(n, context){
  var notes = [];
  if(isYear(n)) notes.push("Years are read out in full in Romanian — never split into pairs the way English says “eighteen fifty-nine”.");
  if(needsDe(n) && !isYear(n)) notes.push("Counting a noun needs <b>de</b> from 20 up: <i>" + romanianNumber(n) + " de ani</i>.");
  else if(n >= 20 && !isYear(n)) notes.push("No <b>de</b> here — the last two digits are between 1 and 19: <i>" + romanianNumber(n) + " ani</i>.");
  if(n === 1 && context === "date") notes.push("The first of the month is <b>întâi</b>, not <i>unu</i>.");
  if(String(n).length > 3 && !isYear(n)) notes.push("<b>mie</b> is feminine, so it takes <b>două</b>: <i>două mii</i>.");
  return notes;
}
/* Wrap every numeral in a text so it can be clicked like a word. Runs on the
   raw token before escaping, and leaves anything that is not a plain integer
   (ranges, prices with decimals) to be split into its parts by the caller. */
/* A day-of-month reads as an ordinal in one place only: the 1st is "întâi".
   Detected from the following word, since "1 decembrie" and "1 leu" are read
   differently and nothing in the digit itself says which is which. */
function numberToken(tok, nextWord){
  if(!/\d/.test(tok)) return null;
  var isDate = !!(nextWord && MONTHS_RO.indexOf(String(nextWord).toLowerCase().replace(/[^a-zăâîșț]/g,"")) > -1);
  /* A token may be a bare number, or a range like 1877–1878, or carry
     punctuation. Split on anything that is not a digit and make each numeric
     run separately clickable, so both years in a range can be heard. */
  var parts = String(tok).split(/(\d+)/);
  if(parts.filter(function(p){ return /^\d+$/.test(p); }).length === 0) return null;
  return parts.map(function(p){
    if(!/^\d+$/.test(p)) return escapeHtml(p);
    var n = parseInt(p, 10);
    if(!isFinite(n) || p.length > 9) return escapeHtml(p);
    return '<span class="link-word num-word" data-action="glossNumber" data-num="' + n + '"' +
           (isDate ? ' data-date="1"' : '') + '>' +
           escapeHtml(p) + '</span>';
  }).join("");
}

/* Reading order: grouped by level, exactly as the index page lists them, so
   "next" moves the way the eye expects rather than following array order. */
function readingSequence(){
  var out = [];
  LEVELS.forEach(function(l){
    READING_TEXTS.forEach(function(t){ if(t.level===l.id) out.push(t); });
  });
  /* Anything whose level is not in LEVELS would otherwise vanish from the
     sequence and become unreachable by arrow. */
  READING_TEXTS.forEach(function(t){
    if(out.indexOf(t)===-1) out.push(t);
  });
  return out;
}
function readingNeighbours(r){
  var seq = readingSequence();
  var i = seq.findIndex(function(t){ return t.id===r.id; });
  return {prev: i>0? seq[i-1] : null, next: (i>-1 && i<seq.length-1)? seq[i+1] : null,
          index: i+1, total: seq.length};
}
/* Arrows sit with the audio controls, where the eye already is. Disabled rather
   than hidden at the ends, so the control row does not reflow between texts. */
function readingNav(r){
  var n = readingNeighbours(r);
  var btn = function(t, glyph, label){
    if(!t) return '<button class="reading-arrow" disabled aria-label="'+label+'">'+glyph+'</button>';
    return '<button class="reading-arrow" data-action="go" data-page="reading" data-p1="'+t.id+'" '+
      'title="'+escapeHtml(t.title)+'" aria-label="'+label+': '+escapeHtml(t.title)+'">'+glyph+'</button>';
  };
  return '<div class="reading-nav">'+
    btn(n.prev, "←", "Previous text")+
    '<span class="reading-count tabular">'+n.index+' / '+n.total+'</span>'+
    btn(n.next, "→", "Next text")+
  '</div>';
}

/* Turn one run of text into clickable, glossed words. Shared by prose and
   verse rendering so both get the same gloss behavior. */
function glossRun(text, glossary){
  var toks = String(text).split(/(\s+)/);
  return toks.map(function(tok, ti){
    var clean = tok.replace(/[.,!?;:()"„”\n]/g,"");
    if(!clean.trim()) return tok.replace(/\n/g,"<br>");
    var numHtml = numberToken(tok, toks[ti+2]);
    if(numHtml) return numHtml;
    if(/^[\d—–\-]+%?$/.test(clean)) return escapeHtml(tok);
    var g = glossary && Object.keys(glossary).find(function(k){ return normLoose(k)===normLoose(clean); });
    if(g) return '<span class="link-word" data-action="glossWord" data-word="'+escapeHtml(g)+'" data-def="'+escapeHtml(glossary[g])+'">'+escapeHtml(tok)+'</span>';
    var known = !!glossLookup(clean);
    return '<span class="link-word'+(known?'':' link-word-unknown')+'" data-action="glossWord" '+
      'data-word="'+escapeHtml(clean)+'" data-def="">'+escapeHtml(tok)+'</span>';
  }).join("");
}
/* ---------- THE ANTHEM AS MUSIC ----------
   Both recordings are instrumental and in the public domain: the modern one is
   a US Navy Band performance (a US Government work), the historical one a
   pre-1926 Victor Military Band cut. Freely-licensed SUNG recordings of the
   anthem essentially do not exist, so the melody is here to be learned against
   the printed words rather than to be sung along with. Native <audio> rather
   than the Speech module — this is music, not pronunciation. */
var ANTHEM_TRACKS = [
  {id:"navy", file:"audio/anthem/anthem-navy-band.ogg", title:"United States Navy Band",
   meta:"instrumental · 2:19 · recorded c. 2003",
   note:"A clean modern band performance at ceremonial tempo — the version you would hear at an official event. Use it to fix the melody and, above all, the pace: the anthem is slower than most people expect on a first reading."},
  {id:"victor", file:"audio/anthem/anthem-victor-band.ogg", title:"Victor Military Band",
   meta:"instrumental · 2:59 · recorded before 1926",
   note:"A historical brass-band recording made within living memory of the 1848 revolution the words come from. Rougher sound, broader phrasing — worth one listen for the sense of how long this melody has been carrying these words."}
];
/* ---------- HOW THE ANTHEM IS ACTUALLY SUNG ----------
   Both bundled recordings are instrumental, so on their own they do not answer
   the question a learner actually has: where do the words go? That answer is
   in the verse structure, and it is fully checkable rather than a matter of
   taste. Every line of Mureșanu's poem is a 13- or 14-syllable line split by a
   caesura after the seventh syllable, one poetic line to one musical phrase.
   The elisions written into the text — te-adânciră, se-nchine, fală-un — are
   not typography, they are singing instructions: those vowels collapse into one
   syllable, and a learner who pronounces them separately runs out of melody.
   Syllable counts below are marked so they can be verified by counting. */
var ANTHEM_SUNG = {
  intro:"Each line is one musical phrase. Sing to the break marked ‖ — that is the caesura, and it falls after the seventh syllable in every single line — then take a breath and finish the line. Lines alternate 14 and 13 syllables.",
  lines:[
    {ro:"Deșteaptă-te, române, ‖ din somnul cel de moarte,",
     syl:"Deș · teap · tă · te ‖ ro · mâ · ne ‖ din · som · nul · cel · de · moar · te", count:14,
     note:"No elisions in this line — every syllable is its own. <b>Deșteaptă-te</b> carries the stress on <b>teap</b>."},
    {ro:"În care te-adânciră ‖ barbarii de tirani!",
     syl:"În · ca · re · te-a · dân · ci · ră ‖ bar · ba · rii · de · ti · rani", count:13,
     note:"<b>te-adânciră</b>: <i>te</i> and <i>a</i> collapse into a single syllable <i>tea</i>. Sing it as one beat, not two."},
    {ro:"Acum ori niciodată, ‖ croiește-ți altă soartă,",
     syl:"A · cum · ori · ni · cio · da · tă ‖ cro · ieș · te-ți · al · tă · soar · tă", count:14,
     note:"<b>niciodată</b> is four syllables, not five — <i>cio</i> is one. <b>croiește-ți</b> ends on a single beat carrying the attached <i>-ți</i>."},
    {ro:"La care să se-nchine ‖ și cruzii tăi dușmani!",
     syl:"La · ca · re · să · se-n · chi · ne ‖ și · cru · zii · tăi · duș · mani", count:13,
     note:"<b>se-nchine</b> is <i>se</i> + <i>închine</i> with the <i>î</i> swallowed: three syllables, <i>se-n · chi · ne</i>."}
  ],
  occasions:[
    ["1 December", "National Day — sung at official ceremonies across the country."],
    ["Flag-raising and state occasions", "Stanza 1 only, in almost every case."],
    ["Sporting fixtures", "Stanza 1, usually with the crowd singing over a recording."],
    ["Citizenship ceremonies", "You may be asked to stand; joining in is welcomed but not required."]
  ]
};
/* ---------- SUNG PERFORMANCES ----------
   The bundled clips are instrumental because no freely licensed sung recording
   exists to ship. Sung versions are on YouTube, and the right way to use them
   is to embed rather than to rip the audio: the upload stays with whoever
   holds the rights, and they keep the view.

   These are community uploads, not official channels, so they are labeled as
   such and may disappear — the page has to survive that, which is why nothing
   here is load-bearing for the lesson. The iframe is only injected when the
   learner asks for it (youtube-nocookie, and no network request at all until
   the click), so the course does not quietly reach out to Google on open. */
var ANTHEM_VIDEOS = [
  {id:"3WIqeSiUbNc", title:"Deșteaptă-te, române — with on-screen lyrics", by:"JR videos",
   note:"Words appear as they are sung, which is the fastest way to see how the syllables line up against the melody. Start here."},
  {id:"zTwgwEHiWm0", title:"Romanian National Anthem (Romanian + English)", by:"BlueMarbleNations",
   note:"Romanian with a running English translation, useful once you can follow the sound and want the sense at the same time."},
  {id:"3-iDi3M7llE", title:"National Anthem: Romania", by:"Ian Berwick",
   note:"A straightforward vocal performance without on-screen text — try following the printed stanza above instead."},
  {id:"lustEXmjGWs", title:"Deșteaptă-te, române!", by:"Romanian Aquila",
   note:"Another sung version, worth hearing for a second interpretation of the tempo."}
];
function renderAnthemVideos(){
  return '<div class="card" style="padding:20px 22px;margin-bottom:16px">'+
    '<div class="section-eyebrow" style="margin-bottom:6px">Sung versions</div>'+
    '<h3 style="font-size:18px;margin-bottom:8px">Hearing it with the words</h3>'+
    '<p style="font-size:13.5px;color:var(--text-2);line-height:1.6;max-width:64ch;margin-bottom:14px">'+
      'Nothing is loaded until you press play — these sit on YouTube rather than in the course, because the '+
      'performances belong to the people who recorded them. That also means you need to be online for this section, '+
      'and that a video can disappear without warning. The first one shows the words as they are sung.</p>'+
    ANTHEM_VIDEOS.map(function(v){
      var open = session.videoOpen===v.id;
      return '<div style="padding:12px 0;border-top:1px solid var(--line)">'+
        '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px">'+
          '<b style="font-family:var(--font-display);font-size:15px">'+escapeHtml(v.title)+'</b>'+
          '<span style="font-size:12px;color:var(--text-3)">uploaded by '+escapeHtml(v.by)+'</span>'+
        '</div>'+
        '<p style="font-size:12.8px;color:var(--text-3);line-height:1.55;margin-bottom:8px;max-width:62ch">'+escapeHtml(v.note)+'</p>'+
        (open
          ? '<div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/'+v.id+'?rel=0" '+
            'title="'+escapeHtml(v.title)+'" frameborder="0" allowfullscreen '+
            'allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"></iframe></div>'+
            '<button class="btn ghost sm" style="margin-top:8px" data-action="closeVideo">Close video</button>'
          : '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
            '<button class="btn secondary sm" data-action="playVideo" data-vid="'+v.id+'">Play here</button>'+
            '<a class="btn ghost sm" href="https://www.youtube.com/watch?v='+v.id+'" target="_blank" rel="noopener noreferrer">Open on YouTube ↗</a>'+
            '</div>')+
      '</div>';
    }).join("")+
  '</div>';
}
function renderSingingGuide(){
  var s = ANTHEM_SUNG;
  return '<div class="card" style="padding:20px 22px;margin-bottom:16px">'+
    '<div class="section-eyebrow" style="margin-bottom:6px">How it is sung</div>'+
    '<h3 style="font-size:18px;margin-bottom:8px">Fitting the words to the melody</h3>'+
    '<p style="font-size:13.5px;color:var(--text-2);line-height:1.6;max-width:64ch;margin-bottom:8px">'+escapeHtml(s.intro)+'</p>'+
    '<p style="font-size:13.5px;color:var(--text-2);line-height:1.6;max-width:64ch;margin-bottom:16px">'+
      'The hyphens printed in the text are not decoration — they mark vowels that <b>merge into one syllable</b> when sung. '+
      'Getting those wrong is the single most common way a learner falls out of time with everyone else.</p>'+
    s.lines.map(function(l, i){
      return '<div style="padding:12px 0;border-top:1px solid var(--line)">'+
        '<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:6px">'+
          audioButton(l.ro.replace(/‖/g,""),{small:true,label:false})+
          '<div class="transcript-text" style="flex:1">'+escapeHtml(l.ro)+'</div>'+
          '<span class="badge neutral" style="flex:0 0 auto">'+l.count+' syllables</span>'+
        '</div>'+
        '<div style="font-family:var(--font-mono);font-size:12.5px;color:var(--accent-strong);line-height:1.8;padding-left:2px">'+escapeHtml(l.syl)+'</div>'+
        '<p style="font-size:12.8px;color:var(--text-3);line-height:1.55;margin-top:5px">'+l.note+'</p>'+
      '</div>';
    }).join("")+
    '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">'+
      '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">When you will hear it</div>'+
      s.occasions.map(function(o){
        return '<div style="display:flex;gap:10px;padding:5px 0;font-size:13.2px;line-height:1.5">'+
          '<b style="flex:0 0 34%;color:var(--text-1)">'+escapeHtml(o[0])+'</b>'+
          '<span style="color:var(--text-2)">'+escapeHtml(o[1])+'</span></div>';
      }).join("")+
      '<p style="font-size:12.8px;color:var(--text-2);line-height:1.6;margin-top:10px">'+
        'Eleven stanzas were written; four are official (1, 2, 4 and 11). In practice you will almost only ever '+
        'need the first, which is why it is the one broken down above.</p>'+
    '</div>'+
  '</div>';
}
function renderAnthemPlayer(){
  return '<div class="card" style="padding:20px 22px;margin-bottom:16px">'+
    '<div class="section-eyebrow" style="margin-bottom:6px">The melody</div>'+
    '<h3 style="font-size:18px;margin-bottom:6px">Deșteaptă-te, române! — the music</h3>'+
    '<p style="font-size:13.5px;color:var(--text-2);line-height:1.6;max-width:62ch;margin-bottom:16px">'+
      'Music by Anton Pann, words by Andrei Mureșanu, both from 1848. '+
      '<b>Both recordings are instrumental — nobody sings on them.</b> That is not an oversight: the 1848 composition '+
      'is long out of copyright, but every <i>sung performance</i> of it carries its own separate rights, and there is '+
      'no freely licensed one to bundle. Use these for the melody and the tempo, and read the syllable breakdown '+
      'underneath to see exactly where each word falls — that is the part a recording would only let you work out by ear.</p>'+
    ANTHEM_TRACKS.map(function(t){
      return '<div style="padding:12px 0;border-top:1px solid var(--line)">'+
        '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px">'+
          '<b style="font-family:var(--font-display);font-size:15px">'+escapeHtml(t.title)+'</b>'+
          '<span style="font-size:12px;color:var(--text-3)">'+escapeHtml(t.meta)+'</span>'+
          '<span class="badge pine" style="margin-left:auto">public domain</span>'+
        '</div>'+
        '<audio controls preload="none" src="'+t.file+'" style="width:100%;max-width:520px"></audio>'+
        '<p style="font-size:12.8px;color:var(--text-3);line-height:1.55;margin-top:6px;max-width:62ch">'+escapeHtml(t.note)+'</p>'+
      '</div>';
    }).join("")+
    '<p style="font-size:12px;color:var(--text-3);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">'+
      'Recordings from Wikimedia Commons. The Navy Band performance is a work of the US Government; the Victor Military Band '+
      'recording predates 1926. The 1848 composition and lyrics are long out of copyright.</p>'+
  '</div>';
}

/* Verse: each line paired with its own English directly underneath, and its own
   play button. A single prose translation under a poem forces the reader to
   work out which clause answers which line, and in the anthem — inverted word
   order, 1848 vocabulary — that mapping is not recoverable by guessing. */
function renderVerse(r){
  var lines = r.ro.split("\n");
  var en = r.lineEn || [];
  var shown = session.revealed["read_"+r.id];
  var body = lines.map(function(line, i){
    if(!line.trim()) return '<div style="height:14px"></div>';
    return '<div class="verse-line">'+
      '<div class="verse-ro">'+glossRun(line, r.glossary)+
        ' '+audioButton(line,{small:true,label:false})+'</div>'+
      (shown && en[i]? '<div class="verse-en">'+escapeHtml(en[i])+'</div>' : '')+
    '</div>';
  }).join("");
  var cov = glossCoverage(r.ro);
  return (r.format==="anthem" ? renderAnthemVideos() + renderSingingGuide() + renderAnthemPlayer() : "")+
  '<div class="card" style="padding:22px 24px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">'+
      '<div><b style="font-family:var(--font-display);font-size:17px">'+escapeHtml(r.title)+'</b>'+
      '<div style="font-size:12px;color:var(--text-3)">'+escapeHtml(r.format)+' · '+r.wordCount+' words</div></div>'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
        readingNav(r)+
        audioButton(lines.filter(function(l){return l.trim();}),{label:"Read aloud",speedControl:true})+
      '</div>'+
    '</div>'+
    (en.length
      ? '<div style="margin-bottom:12px">'+
        '<button class="btn secondary sm" data-action="revealLine" data-toggle="1" data-key="read_'+r.id+'">'+
          (shown? "Hide the line-by-line English" : "Show the English line by line")+'</button></div>'
      : '')+
    '<div class="verse">'+body+'</div>'+
    '<div style="font-size:12.5px;color:var(--text-3);margin-top:12px">Click any word for its meaning. '+cov.pct+'% of this text is glossed.</div>'+
  '</div>';
}
function renderReading(r){
  if(r.format==="anthem" || r.format==="verse" || r.lineEn) return renderVerse(r);
  var toks = r.ro.split(/(\s+)/);
  var words = toks.map(function(tok, ti){
    var clean = tok.replace(/[.,!?;:()"„”\n]/g,"");
    if(!clean.trim()) return tok.replace(/\n/g,"<br>");
    // Numerals, percentages and lone punctuation are not words — leave inert.
    var numHtml = numberToken(tok, toks[ti+2]);
    if(numHtml) return numHtml;
    if(/^[\d—–\-]+%?$/.test(clean)) return escapeHtml(tok);
    var g = r.glossary && Object.keys(r.glossary).find(function(k){ return normLoose(k)===normLoose(clean); });
    if(g) return '<span class="link-word" data-action="glossWord" data-word="'+escapeHtml(g)+'" data-def="'+escapeHtml(r.glossary[g])+'">'+escapeHtml(tok)+'</span>';
    /* Words with no gloss are still clickable but not underlined, so the
       dotted line is a promise the app can keep rather than a guess. */
    var known = !!glossLookup(clean);
    return '<span class="link-word'+(known?'':' link-word-unknown')+'" data-action="glossWord" '+
      'data-word="'+escapeHtml(clean)+'" data-def="">'+escapeHtml(tok)+'</span>';
  }).join("");
  var cov = glossCoverage(r.ro);
  var shown = session.revealed["read_"+r.id];
  return '<div class="card" style="padding:22px 24px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">'+
      '<div><b style="font-family:var(--font-display);font-size:17px">'+escapeHtml(r.title)+'</b>'+
      '<div style="font-size:12px;color:var(--text-3)">'+escapeHtml(r.format)+' · '+r.wordCount+' words</div></div>'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
        readingNav(r)+
        audioButton(sentencesOf(r.ro),{label:"Read aloud",speedControl:true})+
      '</div>'+
    '</div>'+
    '<div style="font-family:var(--font-display);font-size:16.5px;line-height:1.75">'+words+'</div>'+
    '<div style="font-size:12.5px;color:var(--text-3);margin-top:10px">Click any word for its meaning. '+
      '<span title="Underlined words resolve to a course entry, including inflected forms">'+cov.pct+'% of this text is glossed.</span></div>'+
    '<hr class="rule" style="margin:16px 0">'+
    (shown? '<div style="font-size:14px;color:var(--text-2);line-height:1.6"><b style="color:var(--text-1)">Translation.</b> '+escapeHtml(r.en)+'</div>'
          : '<button class="btn secondary sm" data-action="revealLine" data-key="read_'+r.id+'">Show English translation</button>')+
  '</div>';
}

PAGES.lesson = function(params){
  var l = lessonById(params[0]);
  if(!l) return notFound("That lesson doesn't exist.");
  /* The profanity lesson is opted into once, not gated every visit — a wall you
     have to click through repeatedly stops being a choice and becomes friction.
     The consent is stored, and can be withdrawn from Progress. */
  if(l.sensitive && !state.settings.showProfanity) return shell(null, profanityGate(l), null);
  var stageIdx = clamp(parseInt(params[1]||"0",10)||0, 0, l.sections.length-1);
  var s = l.sections[stageIdx];
  var p = lessonProgress(l.id);
  var u = unitById(l.unitId);

  var body = "";
  switch(s.type){
    case "context":
      body = (s.note? '<p style="color:var(--text-2);margin-bottom:14px;max-width:62ch">'+s.note+'</p>':'')+
             renderDialogue(dialogueById(s.dialogueId), {hideEn:true})+
             '<p style="color:var(--text-3);font-size:13px;margin-top:12px;max-width:62ch">Listen through once before revealing any English. Understanding the gist without the translation is the skill you are building.</p>';
      break;
    case "grammar":
      body = (s.intro? '<p style="color:var(--text-2);margin-bottom:14px;max-width:62ch">'+s.intro+'</p>':'')+
             renderGrammarArticle(grammarById(s.topicId));
      break;
    case "vocab":
      body = '<p style="color:var(--text-2);margin-bottom:16px;max-width:62ch">Tap the speaker on any word or example to hear it. These words enter your review queue as soon as you finish the lesson.</p>'+
             '<div class="grid-2">'+ s.vocabIds.map(function(id){
               var v = vocabById(id); return v? renderVocabCard(v):"";
             }).join("") +'</div>';
      break;
    case "contrast":
      body = renderContrast(s);
      break;
    case "culture":
      body = '<div class="card" style="padding:22px 24px;border-left:3px solid var(--pine)">'+
        '<div class="section-eyebrow" style="color:var(--pine)">Cultural note</div>'+
        '<h3 style="font-size:19px;margin-bottom:10px">'+escapeHtml(s.title)+'</h3>'+
        '<p style="color:var(--text-2);line-height:1.7">'+s.body+'</p></div>';
      break;
    default: {
      var ids = s.exerciseIds||[];
      body = ids.map(function(id,i){
        var ex = exerciseById(id);
        if(!ex) return "";
        return '<div style="margin-bottom:18px">'+renderExercise(ex,{counter:(i+1)+" / "+ids.length, onContinue:false})+'</div>';
      }).join("");
      if(s.type==="reading" && s.readingId) body = renderReading(readingById(s.readingId));
      break;
    }
  }
  if(s.type==="reading" && s.readingId && !s.exerciseIds) body = renderReading(readingById(s.readingId));

  var allAnswered = (s.exerciseIds||[]).every(function(id){ return session.feedback[id]; });
  var isLast = stageIdx===l.sections.length-1;

  var main =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
      '<button class="btn ghost sm" data-action="go" data-page="unit" data-p1="'+u.id+'">← '+escapeHtml(u.titleEn)+'</button>'+
      '<span style="font-size:12px;color:var(--text-3)" class="tabular">Stage '+(stageIdx+1)+' of '+l.sections.length+'</span>'+
    '</div>'+
    '<div class="progressbar" style="margin-bottom:20px"><span style="width:'+Math.round(100*(stageIdx)/(l.sections.length-1||1))+'%"></span></div>'+
    '<div class="section-eyebrow">'+(STAGE_LABEL[s.type]||s.type)+'</div>'+
    '<h1 style="font-size:26px;margin-bottom:16px">'+escapeHtml(l.title)+'</h1>'+
    body+
    '<div style="display:flex;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)">'+
      (stageIdx>0? '<button class="btn secondary" data-action="go" data-page="lesson" data-p1="'+l.id+'" data-p2="'+(stageIdx-1)+'">Previous</button>':'')+
      (isLast
        ? '<button class="btn" data-action="finishLesson" data-lesson="'+l.id+'">Finish lesson</button>'
        : '<button class="btn" data-action="go" data-page="lesson" data-p1="'+l.id+'" data-p2="'+(stageIdx+1)+'"'+
          ((s.exerciseIds&&s.exerciseIds.length&&!allAnswered)?' disabled title="Answer the exercises above first"':'')+'>Continue</button>')+
    '</div>';

  var railStages = '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px">Lesson stages</div>'+
    l.sections.map(function(sec,i){
      var active = i===stageIdx;
      return '<div style="display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;'+(active?'background:var(--accent-soft)':'')+'" data-action="go" data-page="lesson" data-p1="'+l.id+'" data-p2="'+i+'" role="button" tabindex="0">'+
        '<span style="width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;'+
        (i<stageIdx?'background:var(--pine);color:#fff':active?'background:var(--accent);color:#fff':'border:1.5px solid var(--line-strong);color:var(--text-3)')+'">'+(i<stageIdx?'✓':i+1)+'</span>'+
        '<span style="font-size:13px;'+(active?'font-weight:700':'color:var(--text-2)')+'">'+(STAGE_LABEL[sec.type]||sec.type)+'</span></div>';
    }).join("")+
    '<hr class="rule" style="margin:16px 0">'+
    '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">Objective</div>'+
    '<p style="font-size:13px;color:var(--text-2);line-height:1.55">'+escapeHtml(l.objective)+'</p>'+
    (p.status==="complete"? '<div style="margin-top:14px"><span class="badge pine">'+iconCheck()+' completed · '+p.bestScore+'%</span></div>':'');

  return shell(courseMapSidebar(u.id), main, railStages);
};

/* ---------- GRAMMAR REFERENCE ---------- */
function grammarExerciseCount(topicId){
  return EXERCISES.filter(function(e){ return e.topic===topicId; }).length;
}
PAGES.grammar = function(params){
  var q = session.grammarQuery||"";
  var lvl = session.grammarLevel||"all";
  var cat = session.grammarCat||"all";
  var focus = params[0] ? grammarById(params[0]) : null;

  var cats = [];
  GRAMMAR_TOPICS.forEach(function(g){ if(cats.indexOf(g.cat)===-1) cats.push(g.cat); });
  var levels = [];
  GRAMMAR_TOPICS.forEach(function(g){ if(levels.indexOf(g.level)===-1) levels.push(g.level); });
  levels.sort();

  function matches(g){
    if(lvl!=="all" && g.level!==lvl) return false;
    if(cat!=="all" && g.cat!==cat) return false;
    if(q){
      var hay = normLoose(g.title+" "+g.cat+" "+g.rule+" "+(g.formation||[]).join(" "));
      if(hay.indexOf(normLoose(q))===-1) return false;
    }
    return true;
  }
  var list = GRAMMAR_TOPICS.filter(matches);

  /* Sidebar mirrors the active filters, so the two views never disagree. */
  var side = '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin:0 8px 10px">'+
      'Topics'+((lvl!=="all"||cat!=="all")? ' · filtered':'')+'</div>'+
    cats.filter(function(c){ return list.some(function(g){ return g.cat===c; }); }).map(function(c){
      return '<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:var(--text-2);margin:0 8px 5px">'+escapeHtml(c)+'</div>'+
        list.filter(function(g){return g.cat===c;}).map(function(g){
          var n = grammarExerciseCount(g.id);
          return '<div class="unit-node'+(focus&&focus.id===g.id?" current":"")+'" style="padding:7px 8px" data-action="go" data-page="grammar" data-p1="'+g.id+'" role="button" tabindex="0">'+
            '<div><div style="font-size:13.3px;font-weight:600">'+escapeHtml(g.title)+'</div>'+
            '<div style="font-size:11px;color:var(--text-3)">'+g.level+' · '+n+' exercise'+(n===1?"":"s")+'</div></div></div>';
        }).join("")+'</div>';
    }).join("") || '<div style="padding:8px;font-size:13px;color:var(--text-3)">Nothing matches these filters.</div>';

  var filterBar =
    '<div style="margin-bottom:8px"><span style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-right:8px">Level</span>'+
      ['all'].concat(levels).map(function(L){
        return '<button class="chip'+(lvl===L?" active":"")+'" style="margin:0 4px 4px 0" data-action="setGrammarLevel" data-v="'+L+'">'+
          (L==="all"?"All":L)+'</button>';
      }).join("")+
    '</div>'+
    '<div style="margin-bottom:16px"><span style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-right:8px">Topic</span>'+
      ['all'].concat(cats).map(function(C){
        return '<button class="chip'+(cat===C?" active":"")+'" style="margin:0 4px 4px 0" data-action="setGrammarCat" data-v="'+escapeHtml(C)+'">'+
          (C==="all"?"All":escapeHtml(C))+'</button>';
      }).join("")+
    '</div>';

  var main = focus
    ? '<button class="btn ghost sm" data-action="go" data-page="grammar" style="margin-bottom:12px">← All grammar</button>'+renderGrammarArticle(focus)+
      '<div style="margin-top:16px">'+practiceLinkFor(focus.id)+'</div>'
    : '<h1 style="font-size:28px;margin-bottom:6px">Grammar reference</h1>'+
      '<p style="color:var(--text-2);margin-bottom:16px;max-width:60ch">Every rule with its formation, worked examples, and the mistakes English speakers actually make. Filter by level or topic, or search across all of them.</p>'+
      '<input type="search" data-field="gq" data-action="grammarSearch" placeholder="Search rules, e.g. \'plural\', \'perfectul compus\', \'pe\'…" value="'+escapeHtml(q)+'" style="margin-bottom:14px" aria-label="Search grammar" />'+
      filterBar+
      grammarDrillBar(list)+
      '<div style="font-size:12.5px;color:var(--text-3);margin-bottom:12px" class="tabular">'+list.length+' of '+GRAMMAR_TOPICS.length+' rules'+
        ((lvl!=="all"||cat!=="all"||q)? ' · <button class="btn ghost sm" style="padding:0 4px" data-action="clearGrammarFilters">clear filters</button>':'')+'</div>'+
      (list.length? list.map(function(g){
        var n = grammarExerciseCount(g.id);
        return '<div class="card" style="padding:16px 18px;margin-bottom:10px;cursor:pointer" data-action="go" data-page="grammar" data-p1="'+g.id+'" role="button" tabindex="0">'+
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap"><span class="badge accent">'+g.level+'</span><span class="badge neutral">'+escapeHtml(g.cat)+'</span>'+
            '<span class="badge '+(n>=3?"pine":n>0?"neutral":"brick")+'">'+n+' exercise'+(n===1?"":"s")+'</span></div>'+
          '<b style="font-family:var(--font-display);font-size:16.5px">'+escapeHtml(g.title)+'</b>'+
          '<p style="font-size:13.5px;color:var(--text-2);margin-top:4px;max-width:66ch">'+escapeHtml(g.rule.slice(0,150))+(g.rule.length>150?"…":"")+'</p></div>';
      }).join("") : '<div class="empty-state">No rule matches these filters.</div>');

  return shell(side, main, null);
};
/* Counts through openExercises so the number shown matches the number the

/* ---------- VERB TOOL ---------- */
/* "Irregular" means the PRESENT tense does not follow its class — that is the
   thing a learner has to memorize instead of derive. It is not the same as
   having an unpredictable participle (a merge → mers) or a spelled-out table in
   the data. Inferring it from the presence of an `irr` block labeled two
   thirds of the verb list irregular, including a ajuta and a asculta, which are
   textbook-regular. Only the explicit flag counts. */
function verbIsIrregular(x){ return !!(x.irregular || verbGroupKey(x)==="irr"); }
/* Participle you could not have predicted from the infinitive — worth flagging
   separately, since it is what breaks the compound past. */
function verbHasOddParticiple(v){
  if(!v.irr || !v.irr.participle) return false;
  var p = verbParts(v.inf);
  var predicted = {"a":p.stem+"at","ea":p.stem+"ut","e":p.stem+"ut","i":p.stem+"it","î":p.stem+"ât"}[p.ending];
  return predicted !== v.irr.participle;
}
function filteredVerbs(){
  var q = session.verbQuery||"", grp = session.verbGroup||"all";
  return VERBS.filter(function(x){
    if(grp==="irregular" && !verbIsIrregular(x)) return false;
    if(grp==="reflexive" && !verbIsReflexive(x)) return false;
    if(grp==="marked" && state.verbsMarked.indexOf(x.id)===-1) return false;
    if(["I","I-ez","II","III","IV","IV-esc","IV-î"].indexOf(grp)>-1 && verbGroupKey(x)!==grp) return false;
    if(q){
      var hay = normLoose(x.inf+" "+x.en);
      if(hay.indexOf(normLoose(q))===-1) return false;
    }
    return true;
  }).sort(function(a,b){ return normLoose(a.inf) < normLoose(b.inf) ? -1 : 1; });
}

/* ---------- CONJUGATION DRILLS ----------
   Generates conjugation questions on demand from the verb tables, so a learner
   can drill one tense across many verbs rather than only ever meeting the
   present tense inside lessons. */
var TENSE_META = [
  {id:"present",     ro:"Prezent",         en:"Present"},
  {id:"past",        ro:"Perfect compus",  en:"Compound past"},
  {id:"imperfect",   ro:"Imperfect",       en:"Imperfect"},
  {id:"future",      ro:"Viitor",          en:"Future"},
  {id:"conditional", ro:"Condițional",     en:"Conditional"},
  {id:"subjunctive", ro:"Conjunctiv",      en:"Subjunctive"},
  {id:"imperative",  ro:"Imperativ",       en:"Imperative"}
];
var PERSON_LABELS = {eu:"eu", tu:"tu", el:"el / ea", noi:"noi", voi:"voi", ei:"ei / ele"};
function drillPool(cfg){
  return VERBS.filter(function(v){
    if(cfg.scope==="irregular" && !verbIsIrregular(v)) return false;
    if(cfg.scope==="reflexive" && !verbIsReflexive(v)) return false;
    if(cfg.scope==="marked" && state.verbsMarked.indexOf(v.id)===-1) return false;
    if(["I","I-ez","II","III","IV","IV-esc"].indexOf(cfg.scope)>-1 && verbGroupKey(v)!==cfg.scope) return false;
    return true;
  });
}
function buildConjugationDrill(cfg){
  var pool = drillPool(cfg);
  if(!pool.length) return [];
  var tenses = cfg.tenses.length? cfg.tenses : ["present"];
  var out = [];
  for(var i=0; i<cfg.length; i++){
    var v = sample(pool);
    var tense = sample(tenses);
    var T = verbTables(v);
    if(!T[tense]) continue;
    var meta = TENSE_META.find(function(t){ return t.id===tense; });
    if(tense==="imperative"){
      var who = sample(["tu","voi"]);
      /* Verbs whose singular imperative is undeclared (or genuinely unused, as
         with stative a părea) must not become drill questions — there would be
         no correct answer to mark against. */
      if(!T.imperative[who]) continue;
      out.push({
        id:"drill_"+v.id+"_imp_"+who+"_"+i, lesson:null, skill:"grammar", type:"conjugate", diff:3,
        topic:"g_imperative", generated:true, vocab:[],
        prompt: escapeHtml(v.inf)+" — <b>"+who+"</b> — "+meta.ro,
        answer: T.imperative[who], accept:[T.imperative[who], String(T.imperative[who]).replace(/!$/,"")],
        audio: T.imperative[who],
        explain:"<b>"+escapeHtml(T.imperative[who])+"</b> — "+escapeHtml(v.en)+". "+
          (v.notes? escapeHtml(v.notes) : "The voi-imperative is identical to the voi present tense; the tu form is less predictable.")
      });
      continue;
    }
    var person = sample(PERSONS);
    var form = T[tense][person];
    if(!form || form==="—") continue;
    out.push({
      id:"drill_"+v.id+"_"+tense+"_"+person+"_"+i, lesson:null, skill:"grammar", type:"conjugate", diff:3,
      topic: tense==="subjunctive" ? "g_subjunctive" : tense==="imperfect" ? "g_imperfect"
           : tense==="past" ? "g_perfect_compus" : tense==="future" ? "g_future"
           : tense==="conditional" ? "g_conditional" : "g_present",
      generated:true, vocab:[],
      prompt: escapeHtml(v.inf)+" — <b>"+PERSON_LABELS[person]+"</b> — "+meta.ro,
      answer: form, accept:[form],
      audio: form,
      explain:"<b>"+escapeHtml(form)+"</b> — "+escapeHtml(v.en)+" ("+meta.en.toLowerCase()+", "+PERSON_LABELS[person]+")."+
        (verbIsIrregular(v)? " This verb is irregular, so the form has to be known rather than derived." :
          " Conjugation class "+escapeHtml(verbGroupLabel(v))+" — the same endings apply to every verb in that class.")+
        (v.notes? "<br><span style=\"color:var(--text-3)\">"+escapeHtml(v.notes)+"</span>" : "")
    });
  }
  return out;
}

        pool.length+' verb'+(pool.length===1?"":"s")+' in scope · '+

      '<p style="font-size:13.5px;color:var(--text-2);margin-top:6px;line-height:1.6">Lessons introduce a tense and then move on, so the present ends up massively over-practiced and the imperfect and conditional barely at all. Drilling one tense across many verbs is how the pattern becomes automatic — and mixing two tenses together is what stops you applying the right ending to the wrong tense.</p>'+

/* ---------- SESSION RUNNER (review / practice / exams) ---------- */
function runSession(title, subtitle, exercises, opts){
  opts = opts||{};
  if(!exercises.length) return '<div class="empty-state">'+escapeHtml(opts.emptyMsg||"Nothing to practice right now.")+'</div>';
  var i = clamp(session.qIndex,0,exercises.length-1);
  var ex = exercises[i];
  var answered = exercises.filter(function(e){ return session.feedback[e.id]; }).length;
  var correct = exercises.filter(function(e){ var f=session.feedback[e.id]; return f&&f.verdict==="correct"; }).length;
  /* Ungradeable free writing is excluded from the denominator — see finishLesson. */
  var scorable = exercises.filter(function(e){
    var f = session.feedback[e.id]; return !f || f.verdict!=="submitted";
  }).length;

  if(session.sessionDone){
    var scorePct = pct(correct, scorable);
    return '<div class="card" style="padding:28px">'+
      '<div class="section-eyebrow">Session complete</div>'+
      '<h2 style="font-size:26px;margin-bottom:10px">'+correct+' of '+scorable+' correct · '+scorePct+'%</h2>'+
      bySkillBreakdown(exercises)+
      whatYouGotWrong(exercises, {retryAction:"retryWrongOnly"})+
      '<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">'+
        '<button class="btn" data-action="go" data-page="home">Back to Learn</button>'+
        '<button class="btn secondary" data-action="restartSession">Run another set</button></div></div>';
  }
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
      '<div><div class="section-eyebrow">'+escapeHtml(title)+'</div>'+
      '<p style="color:var(--text-2);font-size:13.5px">'+escapeHtml(subtitle)+'</p></div>'+
      '<span class="tabular" style="font-size:12.5px;color:var(--text-3)">'+answered+' / '+exercises.length+'</span></div>'+
    '<div class="progressbar" style="margin-bottom:20px"><span style="width:'+pct(answered,exercises.length)+'%"></span></div>'+
    renderExercise(ex, {counter:"Question "+(i+1)+" of "+exercises.length});

/* A score alone doesn't teach anything. List every item the learner got wrong,
   with what they answered, what was right, and why — so the review happens
   where the session ends rather than in a separate notebook they may never
   open. */
function whatYouGotWrong(exercises, opts){
  opts = opts||{};
  /* "submitted" is open writing the app cannot grade. It belongs in this list —
     the learner should still compare it against the model — but it is not a
     mistake, so it is counted and worded separately. */
  var wrong = exercises.filter(function(e){
    var f = session.feedback[e.id];
    return f && f.verdict !== "correct";
  });
  var graded = wrong.filter(function(e){ return session.feedback[e.id].verdict!=="submitted"; }).length;
  var selfCheck = wrong.length - graded;
  if(!wrong.length){
    return '<div style="margin-top:18px;padding:14px 16px;background:var(--pine-soft);color:var(--pine);'+
      'border-radius:var(--radius-s);font-size:13.5px"><b>Nothing to review.</b> Every answer in this set was fully correct.</div>';
  }
  var lead = graded
    ? graded+' of '+exercises.length+' need another pass. Each one is saved to your mistake notebook too.'
    : 'Nothing was marked wrong.';
  if(selfCheck) lead += (graded?' ':'')+selfCheck+' free-writing answer'+(selfCheck===1?'':'s')+
    ' can’t be graded automatically — compare '+(selfCheck===1?'it':'them')+' against the model below. '+
    (selfCheck===1?'It does':'They do')+' not count against your score.';
  return '<div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)">'+
    '<h3 style="font-size:16px;margin-bottom:4px">'+(graded?'What to look at again':'Worth a second look')+'</h3>'+
    '<p style="font-size:13px;color:var(--text-3);margin-bottom:14px">'+lead+'</p>'+
    wrong.map(function(e){
      var f = session.feedback[e.id];
      var yours = (e.type==="mcq"||e.type==="reading_q"||e.type==="minimal_pair")
        ? (e.options[session.answers[e.id]] || "(no answer)")
        : (e.type==="build" ? (builtSentence(e)||"(nothing arranged)")
        : (session.answers[e.id] || "(blank)"));
      var right = f.correct || primaryAnswer(e);
      var band = f.verdict==="incorrect" ? "brick" : "accent";
      return '<div style="border:1px solid var(--line);border-left:3px solid var(--'+band+');'+
        'border-radius:var(--radius-s);padding:13px 15px;margin-bottom:10px">'+
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:7px">'+
          skillBadge(e.skill)+
          '<span class="badge '+band+'">'+escapeHtml(f.verdict==="incorrect"?"incorrect":f.verdict)+'</span>'+
          (e.topic && grammarById(e.topic)
            ? '<a href="#/grammar/'+e.topic+'" style="font-size:11.5px;margin-left:auto;text-decoration:none">'+
              escapeHtml(grammarById(e.topic).title)+' →</a>' : '')+
        '</div>'+
        '<div style="font-size:13.5px;color:var(--text-2);margin-bottom:8px">'+
          String(e.prompt).replace(/<[^>]+>/g,"")+'</div>'+
        '<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;align-items:baseline">'+
          '<span style="font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--text-3)">You</span>'+
          '<span style="font-family:var(--font-display);color:var(--brick)">'+escapeHtml(yours)+'</span>'+
          '<span style="font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--text-3)">Correct</span>'+
          '<span style="font-family:var(--font-display)">'+escapeHtml(right)+
            (right? ' '+audioButton(right,{small:true,label:false}) : '')+'</span>'+
        '</div>'+
        '<div style="font-size:13px;color:var(--text-2);line-height:1.55;margin-top:9px;'+
          'padding-top:9px;border-top:1px solid var(--line)">'+
          (f.diagnosis? f.diagnosis+' ' : '')+e.explain+'</div>'+
      '</div>';
    }).join("")+
    (opts.retryAction
      ? '<button class="btn secondary sm" data-action="'+opts.retryAction+'">Practice just these '+wrong.length+' again</button>'
      : '')+
  '</div>';
}
function bySkillBreakdown(exercises){
  var by = {};
  exercises.forEach(function(e){
    var f = session.feedback[e.id]; if(!f) return;
    if(f.verdict==="submitted") return;   // not gradeable — see finishLesson
    by[e.skill] = by[e.skill]||{c:0,t:0};
    by[e.skill].t++; if(f.verdict==="correct") by[e.skill].c++;
  });
  var keys = Object.keys(by);
  if(!keys.length) return "";
  return '<div style="margin-top:16px">'+
    '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px">By skill</div>'+
    keys.map(function(k){
      return '<div class="mastery-row" style="margin-bottom:8px"><span class="label">'+k[0].toUpperCase()+k.slice(1)+'</span>'+
        '<span class="progressbar"><span style="width:'+pct(by[k].c,by[k].t)+'%"></span></span>'+
        '<span class="pct">'+by[k].c+'/'+by[k].t+'</span></div>';
    }).join("")+'</div>';
}

/* Exercises the learner has agreed to see. The profanity unit is opt-in, and an
   opt-in that only guards its own lesson page is not an opt-in at all — those
   questions would still surface through Practice ("all levels"), the Listening
   set, topic drills and vocabulary review. Every broad scan over EXERCISES goes
   through here so the consent holds everywhere. */
function isSensitiveExercise(e){
  var l = e && e.lesson && lessonById(e.lesson);
  return !!(l && l.sensitive);
}
function openExercises(){
  return EXERCISES.filter(function(e){
    /* Mock-exam items are reserved for the simulation. If they leaked into
       practice, review, the listening set or the drills, the learner would
       meet them before sitting the mock and the mock would then measure
       recall of specific items rather than readiness. */
    if(e.mock) return false;
    if(!state.settings.showProfanity && isSensitiveExercise(e)) return false;
    return true;
  });
}
function mockItems(kind, paper){
  return EXERCISES.filter(function(e){
    return e.mock===kind && (paper==null || e.paper===paper);
  });
}
function practicePool(cfg){
  return openExercises().filter(function(e){
    var l = lessonById(e.lesson);
    if(cfg.level!=="all"){
      var lvl = l? l.levelId:"";
      var fam = cfg.level.slice(0,2);
      if(lvl.slice(0,2)!==fam) return false;
    }
    if(cfg.skill!=="all" && e.skill!==cfg.skill) return false;
    return true;
  });
}

/* Where pronunciation comes from, stated plainly, with a working switch. */
function audioSourcePanel(){
  var clips = assetCount();
  var localVoices = Speech.romanianVoices();
  var st = Speech.statusFor("");

  var status;
  if(clips){
    status = '<div style="background:var(--pine-soft);color:var(--pine);padding:10px 12px;border-radius:var(--radius-s);font-size:13px">'+
      '<b>Using '+clips+' pre-rendered Romanian clips.</b> Recorded from Google Translate\'s Romanian voice and bundled with the course, so pronunciation is consistent and works offline.'+
      (localVoices.length? '' : ' Anything not covered by a clip stays silent rather than being read in an English voice.')+'</div>';
  } else if(st==="tts"){
    status = '<div style="background:var(--pine-soft);color:var(--pine);padding:10px 12px;border-radius:var(--radius-s);font-size:13px">'+
      '<b>Using a Romanian voice installed on this computer:</b> '+escapeHtml(Speech.voiceName()||"")+'.</div>';

/* ---------- CHECKPOINTS & LEVEL EXAMS ----------
   A checkpoint mixes material from the units before it; a level exam covers the
   whole level and adds reading, listening and a written task. Neither tells the
   learner which rule is being tested — that is the point of them, since naming
   the rule lets pattern-matching stand in for knowing the language. */
function unitsBefore(unit){
  return UNITS.filter(function(u){
    return u.levelId===unit.levelId && u.order < unit.order && lessonsOfUnit(u.id).length;
  });
}
function exercisesForUnits(units){
  var lessonIds = [];
  units.forEach(function(u){ lessonsOfUnit(u.id).forEach(function(l){ lessonIds.push(l.id); }); });
  return EXERCISES.filter(function(e){ return lessonIds.indexOf(e.lesson)>-1; });
}
/* Spread the draw across skills so an exam can't be all grammar by accident. */
function balancedDraw(pool, n){
  var bySkill = {};
  pool.forEach(function(e){ (bySkill[e.skill] = bySkill[e.skill]||[]).push(e); });
  var skills = Object.keys(bySkill);
  skills.forEach(function(s){ bySkill[s] = shuffle(bySkill[s]); });
  var out = [], i = 0;
  while(out.length < n && skills.length){
    var s = skills[i % skills.length];
    if(bySkill[s].length) out.push(bySkill[s].shift());
    else { skills.splice(i % skills.length, 1); continue; }
    i++;
  }
  return out;
}
function buildExam(kind, id){
  if(kind==="checkpoint"){
    var unit = unitById(id);
    if(!unit) return null;
    var pool = exercisesForUnits(unitsBefore(unit));
    if(!pool.length) return null;
    return {
      kind:"checkpoint", id:id,
      title:"Checkpoint · "+unit.titleEn,
      blurb:"Mixed questions drawn from the units you've completed in this level. The grammar point being tested is deliberately not named.",
      items: balancedDraw(pool, Math.min(12, pool.length)),
      passMark: 70
    };
  }
  var level = levelById(id);
  if(!level) return null;
  var levelUnits = UNITS.filter(function(u){ return u.levelId===level.id && lessonsOfUnit(u.id).length; });
  var pool2 = exercisesForUnits(levelUnits);
  if(!pool2.length) return null;
  /* A level exam weights toward production and comprehension rather than
     recognition — closer to what the CEFR descriptor actually claims. */
  var core = balancedDraw(pool2.filter(function(e){ return e.type!=="produce"; }), 14);
  var written = pool2.filter(function(e){ return e.type==="produce"; });
  var comprehension = pool2.filter(function(e){ return e.skill==="reading" || e.skill==="listening"; });
  var items = core
    .concat(shuffle(comprehension).slice(0,3))
    .concat(shuffle(written).slice(0,2));
  // de-duplicate while preserving order
  var seen = {}, uniq = [];
  items.forEach(function(e){ if(e && !seen[e.id]){ seen[e.id]=1; uniq.push(e); } });
  return {
    kind:"exam", id:id,
    title:level.code+" Level Exam",
    blurb:"A full assessment of "+level.code+": vocabulary, grammar, listening, reading and written production. Results are reported per skill, not as a single number.",
    items: uniq, passMark: 75
  };
}

PAGES.exam = function(params){
  var kind = params[0], id = params[1];
  if(!session.exam || session.exam.key !== kind+":"+id){
    var built = buildExam(kind, id);
    if(!built) return notFound("There isn't enough completed material to build this assessment yet.");
    built.key = kind+":"+id;
    session.exam = built;
    session.qIndex = 0; session.sessionDone = false;
    built.items.forEach(function(e){
      delete session.feedback[e.id]; delete session.answers[e.id];
      delete session.built[e.id];    delete session.matched[e.id];
      delete session.gaps[e.id];     delete session.optOrder[e.id];
    });
  }
  var ex = session.exam;
  var answered = ex.items.filter(function(e){ return session.feedback[e.id]; }).length;

  if(session.sessionDone){
    var bySkill = {};
    ex.items.forEach(function(e){
      var f = session.feedback[e.id];
      bySkill[e.skill] = bySkill[e.skill] || {c:0,t:0};
      bySkill[e.skill].t++;
      if(f && f.verdict==="correct") bySkill[e.skill].c++;
    });
    var correct = ex.items.filter(function(e){ var f=session.feedback[e.id]; return f&&f.verdict==="correct"; }).length;
    var score = pct(correct, ex.items.length);
    var passed = score >= ex.passMark;
    var weakest = Object.keys(bySkill).filter(function(k){ return bySkill[k].t; })
      .sort(function(a,b){ return pct(bySkill[a].c,bySkill[a].t)-pct(bySkill[b].c,bySkill[b].t); });

    if(!ex.recorded){
      ex.recorded = true;
      state.examResults.unshift({
        date: todayStr(), kind: ex.kind, id: ex.id, title: ex.title,
        score: score, passed: passed, total: ex.items.length, correct: correct,
        bySkill: Object.keys(bySkill).reduce(function(a,k){ a[k]=pct(bySkill[k].c,bySkill[k].t); return a; }, {})
      });
      if(state.examResults.length>40) state.examResults.length=40;
      markActivityToday(); persist();
    }

    return shell(null,
      '<div class="card" style="padding:28px">'+
        '<div class="section-eyebrow">'+escapeHtml(ex.title)+'</div>'+
        '<h1 style="font-size:32px;margin-bottom:4px">'+score+'%</h1>'+
        '<p style="color:var(--text-2);margin-bottom:18px">'+correct+' of '+ex.items.length+' correct · '+
          (passed? '<b style="color:var(--pine)">passed</b>' : '<b style="color:var(--brick)">below the '+ex.passMark+'% pass mark</b>')+'</p>'+
        '<h2 style="font-size:16px;margin-bottom:12px">Results by skill</h2>'+
        Object.keys(bySkill).map(function(k){
          var p = pct(bySkill[k].c, bySkill[k].t);
          return '<div class="mastery-row" style="margin-bottom:10px">'+
            '<span class="label">'+k[0].toUpperCase()+k.slice(1)+'</span>'+
            '<span class="progressbar'+(p>=80?" pine":"")+'"><span style="width:'+p+'%"></span></span>'+
            '<span class="pct">'+bySkill[k].c+'/'+bySkill[k].t+'</span></div>';
        }).join("")+
        (weakest.length? '<p style="font-size:13.5px;color:var(--text-2);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">'+
          'Weakest area: <b>'+escapeHtml(weakest[0])+'</b>. '+
          (passed? 'Worth a review pass before you move on.' : 'Focus here before retaking.')+'</p>':'')+
        whatYouGotWrong(ex.items, {retryAction:"retryWrongOnly"})+
        '<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">'+
          '<button class="btn" data-action="go" data-page="home">Back to Learn</button>'+
          '<button class="btn secondary" data-action="retakeExam" data-kind="'+escapeHtml(kind)+'" data-id="'+escapeHtml(id)+'">Retake</button>'+
          (state.mistakes.length? '<button class="btn secondary" data-action="go" data-page="mistakes">Review mistakes</button>':'')+
        '</div>'+
      '</div>', null);
  }

  var i = clamp(session.qIndex, 0, ex.items.length-1);
  var item = ex.items[i];
  return shell(null,
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'+
      '<div><div class="section-eyebrow">'+escapeHtml(ex.title)+'</div>'+
      '<p style="color:var(--text-2);font-size:13.5px;max-width:56ch">'+escapeHtml(ex.blurb)+'</p></div>'+
      '<span class="tabular" style="font-size:12.5px;color:var(--text-3);white-space:nowrap">'+answered+' / '+ex.items.length+'</span>'+
    '</div>'+
    '<div class="progressbar" style="margin:12px 0 20px"><span style="width:'+pct(answered,ex.items.length)+'%"></span></div>'+
    renderExercise(item, {counter:"Question "+(i+1)+" of "+ex.items.length, examMode:true}),
    null);
};

/* ---------- PLACEMENT TEST ---------- */
/* ===================== PLACEMENT TEST =====================
   Organized into bands of four, one band per level, and scored band by band
   rather than by "highest question answered correctly" — a single lucky guess
   must not place someone three levels above where they are.

   Guessing is further constrained by mixing in typed items, which have no
   options at all, and by using four options rather than three on the rest. */
var PLACEMENT_PASS = 0.75;   // 3 of 4 to clear a band
var PLACEMENT_STOP = 0.5;    // below half → stop, the ceiling has been found
var PLACEMENT_PER_BAND = 4;   // asked per band, drawn at random from the pool
/* Each band holds more items than are asked, so retaking the test does not
   replay the same questions. Combined with per-attempt option shuffling, this
   makes memorizing positions or item order useless. */

function placementFlatIndex(st, bandIdx, itemIdx){
  var n = 0;
  for(var b=0;b<bandIdx;b++) n += st.picks[b].length;
  return n + itemIdx;
}
/* Score each band, then place at the FIRST band not cleared — that is where
   the learner still has something to learn, which is where they should start. */
function placementResult(st){
  var bands = [];
  for(var b=0; b<PLACEMENT_BANDS.length; b++){
    var band = PLACEMENT_BANDS[b];
    var items = st.picks[b];
    var answered = 0, correct = 0;
    items.forEach(function(item, i){
      var key = b+"_"+i;
      if(!(key in st.answers)) return;
      answered++;
      if(item.type==="mcq"){ if(st.answers[key]===item.a) correct++; }
      else if(item.accept.some(function(a){ return normLoose(st.answers[key])===normLoose(a); })) correct++;
    });
    if(!answered) break;
    bands.push({level:band.level, label:band.label, correct:correct, total:answered,
                pct:pct(correct,answered), passed: (correct/answered) >= PLACEMENT_PASS});
  }
  var placement = PLACEMENT_BANDS[0].level;
  for(var i=0;i<bands.length;i++){
    if(bands[i].passed) placement = PLACEMENT_BANDS[Math.min(i+1, PLACEMENT_BANDS.length-1)].level;
    else { placement = bands[i].level; break; }
  }
  return {bands:bands, placement:placement,
          totalCorrect: bands.reduce(function(a,x){return a+x.correct;},0),
          totalAsked: bands.reduce(function(a,x){return a+x.total;},0)};
}
/* Draw this attempt's questions: a random subset of each band, each with its
   options in a random order. Regenerated on every retake. */
function newPlacementRun(){
  return {
    bandIndex:0, itemIndex:0, answers:{}, done:false, typed:"",
    picks: PLACEMENT_BANDS.map(function(band){
      var chosen = pick(band.items, Math.min(PLACEMENT_PER_BAND, band.items.length));
      return chosen.map(function(item){
        var copy = {};
        for(var k in item) copy[k] = item[k];
        if(copy.type==="mcq"){
          var order = shuffle(copy.opts.map(function(_,i){ return i; }));
          copy.opts = order.map(function(i){ return item.opts[i]; });
          copy.a = order.indexOf(item.a);
        }
        return copy;
      });
    })
  };
}
PAGES.placement = function(){
  var st = session.placement || (session.placement = newPlacementRun());

  if(st.done){
    var res = placementResult(st);
    var rec = levelById(res.placement) || LEVELS[0];
    var cefrLevels = levelsOfCourse("cefr");
    return '<div class="shell"><main class="main"><div class="main-inner" style="max-width:660px;padding-top:30px">'+
      '<div class="section-eyebrow">Placement result</div>'+

      '<p style="color:var(--text-2);margin-bottom:20px;max-width:58ch">'+
        res.totalCorrect+' of '+res.totalAsked+' correct overall. You are placed at the first level you did <b>not</b> clear — '+
        'that is where there is still something to learn, so it is where the course starts you.</p>'+

      '<div class="card" style="padding:18px 20px;margin-bottom:16px">'+
        '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:12px">How you did at each level</div>'+
        res.bands.map(function(b){
          return '<div class="mastery-row" style="margin-bottom:10px">'+
            '<span class="label">'+b.label+'</span>'+
            '<span class="progressbar'+(b.passed?" pine":"")+'"><span style="width:'+b.pct+'%"></span></span>'+
            '<span class="pct" style="width:70px;text-align:right">'+b.correct+'/'+b.total+
              ' <span class="badge '+(b.passed?'pine':'brick')+'" style="margin-left:4px">'+(b.passed?'pass':'not yet')+'</span></span>'+
          '</div>';
        }).join("")+
        '<p style="font-size:12.5px;color:var(--text-3);margin-top:10px">A level counts as cleared at 3 of 4. '+
          (res.bands.length < PLACEMENT_BANDS.length
            ? 'The test stopped early once a level was clearly beyond you — the remaining levels were not asked.'
            : 'You were asked every level.')+'</p>'+
      '</div>'+

      '<p style="color:var(--text-2);font-size:14px;margin-bottom:10px">This is a recommendation, not a verdict. Override it if you disagree:</p>'+
      '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">'+
        cefrLevels.map(function(l){
          return '<button class="btn '+(l.id===rec.id?'':'secondary')+'" style="justify-content:flex-start" data-action="acceptPlacement" data-level="'+l.id+'">'+
            l.code+' · '+escapeHtml(l.name)+(l.id===rec.id?'  — recommended':'')+'</button>';
        }).join("")+'</div>'+
      '<button class="btn ghost sm" data-action="restartPlacement">Retake the test</button>'+
    '</div></main></div>';
  }

  var band = PLACEMENT_BANDS[st.bandIndex];
  var item = st.picks[st.bandIndex][st.itemIndex];
  var asked = placementFlatIndex(st, st.bandIndex, st.itemIndex);
  var maxItems = st.picks.reduce(function(a,p){ return a+p.length; },0);

  var body;
  if(item.type==="mcq"){
    body = item.opts.map(function(o,i){
      return '<button type="button" class="mcq-option" data-action="answerPlacement" data-i="'+i+'">'+
        '<span class="mcq-letter">'+String.fromCharCode(65+i)+'</span><span class="ro">'+escapeHtml(o)+'</span></button>';
    }).join("");
  } else {
    body = '<input type="text" data-field="plc" data-autofocus data-action="typePlacement" '+
      'data-enter-action="submitPlacement" autocomplete="off" spellcheck="false" '+
      'placeholder="Type your answer…" value="'+escapeHtml(st.typed||"")+'" aria-label="Your answer" />'+
      diacriticBar("plc")+
      '<div style="margin-top:12px;display:flex;gap:10px;align-items:center">'+
        '<button class="btn" data-action="submitPlacement">Submit</button>'+
        '<button class="btn secondary" data-action="skipPlacement">I don\'t know</button>'+
      '</div>';
  }

  return '<div class="shell"><main class="main"><div class="main-inner" style="max-width:620px;padding-top:30px">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'+
      '<div class="section-eyebrow">Placement test · '+band.label+' section</div>'+
      '<span class="tabular" style="font-size:12.5px;color:var(--text-3)">question '+(asked+1)+'</span></div>'+
    '<div class="progressbar" style="margin-bottom:22px"><span style="width:'+pct(asked,maxItems)+'%"></span></div>'+
    '<div class="exercise-shell">'+
      '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">'+
        (item.type==="mcq"?"Choose one":"Type the answer")+'</div>'+
      '<div class="exercise-prompt" style="font-family:var(--font-display)">'+item.q+'</div>'+
      body+
      (item.hint? '<p style="font-size:12.5px;color:var(--text-3);margin-top:10px">'+escapeHtml(item.hint)+'</p>':'')+
      '<p style="font-size:12.5px;color:var(--text-3);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">'+
        'No feedback until the end. If you genuinely don\'t know, say so rather than guessing — '+
        'a wrong guess that happens to land right will place you above your actual level, which helps nobody.</p>'+
    '</div></div></main></div>';
};


/* ===================== ACTIONS ===================== */
function gradeAndRecord(ex, result){
  session.feedback[ex.id] = result;
  state.exercisesCompleted++;
  markActivityToday();
  var ok = result.verdict==="correct";
  recordSkill(ex.skill, ok);
  recordGrammar(ex.topic, ok);
  (ex.vocab||[]).forEach(function(vid){ reviewVocab(vid, ok); });
  if(!ok){
    var g = grammarById(ex.topic);
    saveMistake({
      skill: ex.skill, topicTitle: g? g.title : null, exerciseId: ex.id,
      promptText: String(ex.prompt).replace(/<[^>]+>/g,""),
      yourAnswer: ex.type==="mcq"||ex.type==="reading_q"||ex.type==="minimal_pair"
        ? (ex.options[session.answers[ex.id]]||"(no answer)")
        : (ex.type==="build" ? builtSentence(ex) : (session.answers[ex.id]||"(blank)")),
      correctAnswer: result.correct || primaryAnswer(ex),
      explanation: (result.diagnosis? result.diagnosis+" " : "") + ex.explain
    });
  }
  persist();
}

var Actions = {
  go: function(el){
    var page = el.getAttribute("data-page");
    var ps = [el.getAttribute("data-p1"), el.getAttribute("data-p2")].filter(function(x){ return x!=null; });
    /* Opening a unit or lesson from the map implies its track — keep the rest
       of the app (recommended lesson, Learn page) in step with what was opened. */
    var ctx = page==="unit" ? unitById(ps[0])
            : page==="lesson" ? lessonById(ps[0]) : null;
    if(ctx){
      var lv = levelById(ctx.levelId);
      if(lv) session.course = lv.course||"cefr";
    }
    session.sidebarOpen = false;
    if(page!==parseHash().page){
      session.queue=null; session.queueKind=null; session.sessionDone=false; session.qIndex=0;
      if(page!=="exam") session.exam = null;
    }
    navigate(page, ps);
  },
  toggleSidebar: function(){ session.sidebarOpen = !session.sidebarOpen; render(); },
  setCourse: function(el){
    session.course = el.getAttribute("data-course");
    session.queue=null; session.exam=null; session.sessionDone=false; session.qIndex=0;
    navigate("home");
  },
  toggleLevel: function(el){
    var id = el.getAttribute("data-level");
    state.settings.openLevels = state.settings.openLevels || {};
    var wasOpen = el.getAttribute("aria-expanded")==="true";
    state.settings.openLevels[id] = wasOpen ? "closed" : "open";
    persist(); render();
  },
  /* Operates on every level the sidebar renders, which is all of them across
     all tracks. It used to toggle only the current course's levels while the
     button's label tested all of them — so once there was more than one track,
     "every level is open" was never true, the label was stuck on "Expand all",
     and "Collapse all" could not be reached. */
  toggleAllLevels: function(){
    /* Mirrors the label: if anything is open, close everything; otherwise open
       everything. The active unit's level counts as open even when nothing has
       been set explicitly, so the first click on a fresh session collapses. */
    var route = parseHash();
    var activeUnit = route.page==="unit" ? route.params[0]
                   : (route.page==="lesson" && lessonById(route.params[0]) ? lessonById(route.params[0]).unitId : null);
    var anyOpen = LEVELS.some(function(l){ return levelIsOpen(l.id, activeUnit); });
    state.settings.openLevels = state.settings.openLevels || {};
    LEVELS.forEach(function(l){ state.settings.openLevels[l.id] = anyOpen ? "closed" : "open"; });
    persist(); render();
  },
  /* Same elision handling as glossLookup, so the clip resolves for nost' etc. */
  replayGloss: function(el){ Speech.speak(String(el.getAttribute("data-text")||"").replace(/['’]+$/,"")); },
  setMediaFilter: function(el){
    var cfg = session.mediaFilter || (session.mediaFilter = {level:"all", kind:"all"});
    cfg[el.getAttribute("data-group")] = el.getAttribute("data-val");
    render();
  },
  typeTranscript: function(el){ session.transcriptDraft = el.value; },
  editTranscript: function(el){
    session.mediaEditing = el.getAttribute("data-vid");
    session.transcriptDraft = mediaTranscript(session.mediaEditing);
    render();
  },
  cancelTranscript: function(){
    session.mediaEditing = null; session.transcriptDraft = null; render();
  },
  saveTranscript: function(el){
    var id = el.getAttribute("data-vid");
    state.mediaTranscripts = state.mediaTranscripts || {};
    var text = String(session.transcriptDraft==null ? mediaTranscript(id) : session.transcriptDraft).trim();
    if(text) state.mediaTranscripts[id] = text;
    else delete state.mediaTranscripts[id];
    session.mediaEditing = null; session.transcriptDraft = null;
    persist(); render();
  },
  startIlrMock: function(){
    var st = ilrMockState();
    st.started = Date.now(); st.paper = 0; st.done = false;
    /* Clear any prior attempt so a re-sit is not pre-filled with old answers. */
    mockItems("ilr").forEach(function(e){
      delete session.feedback[e.id]; delete session.answers[e.id];
      delete session.built[e.id];    delete session.matched[e.id];
      delete session.gaps[e.id];     delete session.optOrder[e.id];
    });
    render();
  },
  nextIlrPaper: function(){
    var st = ilrMockState();
    if(st.paper < ILR_PAPERS.length-1){ st.paper++; window.scrollTo(0,0); }
    else st.done = true;
    render();
  },
  restartIlrMock: function(){ session.ilrMock = null; Actions.startIlrMock(); },
  toggleUnlockAll: function(){
    state.settings.unlockAll = !state.settings.unlockAll; persist(); render();
  },
  enableProfanity: function(el){
    state.settings.showProfanity = true; persist();
    navigate("lesson",[el.getAttribute("data-lesson"),"0"]);
  },
  toggleProfanity: function(){
    state.settings.showProfanity = !state.settings.showProfanity; persist(); render();
  },
  playVideo: function(el){ session.videoOpen = el.getAttribute("data-vid"); render(); },
  closeVideo: function(){ session.videoOpen = null; render(); },
  playAudio: function(el){
    var seq = el.getAttribute("data-seq");
    var lines = seq ? JSON.parse(seq) : null;
    var text = lines ? lines.join(" ") : el.getAttribute("data-text");
    el.classList.remove("audio-failed");
    el.classList.add("playing");
    var clear = function(){ el.classList.remove("playing"); };
    var fail = function(){
      clear(); el.classList.add("audio-failed");
      el.title = "No Romanian pronunciation for this — see Listening → Pronunciation source";
    };
    var res = lines
      ? Speech.speakSequence(lines, {onend:clear})
      : Speech.speak(text, {onend:clear, onerror:fail});
    if(!res.ok) fail();
    setTimeout(clear, Math.max(2500, text.length*100));
  },
  setSpeed: function(el){ state.settings.audioSpeed = parseFloat(el.getAttribute("data-speed")); persist(); render(); },
  recheckVoices: function(){ Speech.resetSource(); Speech.refresh(); render(); },
  toggleMotion: function(){ state.settings.reduceMotion = !state.settings.reduceMotion; persist(); render(); },

  typeAnswer: function(el){ session.answers[el.getAttribute("data-ex")] = el.value; },
  insertChar: function(el){
    var key = el.getAttribute("data-target");
    var field = document.querySelector('[data-field="'+key+'"]');
    if(!field) return;
    var ch = el.getAttribute("data-char");
    var s = field.selectionStart==null? field.value.length : field.selectionStart;
    var e = field.selectionEnd==null? s : field.selectionEnd;
    field.value = field.value.slice(0,s) + ch + field.value.slice(e);
    field.focus();
    try{ field.setSelectionRange(s+1, s+1); }catch(err){}
    var exId = field.getAttribute("data-ex");
    if(exId) session.answers[exId] = field.value;
  },
  pickOption: function(el){
    var id = el.getAttribute("data-ex");
    if(session.feedback[id]) return;
    session.answers[id] = parseInt(el.getAttribute("data-i"),10);
    render();
  },
  placeWord: function(el){
    var id = el.getAttribute("data-ex");
    if(session.feedback[id]) return;
    session.built[id] = (session.built[id]||[]).concat([parseInt(el.getAttribute("data-i"),10)]);
    render();
  },
  unplaceWord: function(el){
    var id = el.getAttribute("data-ex");
    if(session.feedback[id]) return;
    var arr = (session.built[id]||[]).slice();
    arr.splice(parseInt(el.getAttribute("data-pos"),10),1);
    session.built[id]=arr; render();
  },
  pickMatch: function(el){
    var id = el.getAttribute("data-ex");
    session.matched[id] = session.matched[id]||{};
    session.matched[id][el.getAttribute("data-row")] = el.value;
  },
  revealHint: function(el){ session.revealed[el.getAttribute("data-ex")]=true; render(); },
  revealLine: function(el){
    var k = el.getAttribute("data-key");
    /* Toggles where the control offers to hide again (verse translations);
       one-way reveal everywhere else, where re-hiding makes no sense. */
    session.revealed[k] = el.hasAttribute("data-toggle") ? !session.revealed[k] : true;
    render();
  },
  revealAllLines: function(el){
    var id = el.getAttribute("data-id"), n = parseInt(el.getAttribute("data-n"),10);
    for(var i=0;i<n;i++) session.revealed["lst_"+id+"_"+i] = true;
    render();
  },
  toggleDialogue: function(el){
    var id = el.getAttribute("data-id");
    session.openDialogue = (session.openDialogue===id) ? null : id;

  placeLine: function(el){

    session.gaps[id][i] = el.value;
  },
