 explain:"<b>Bate vântul</b> — literally 'the wind beats', the standard way to say it's windy. Unlike <i>plouă</i>, this one <b>does</b> have a subject (<i>vântul</i>), which is why the verb agrees with it.",
 vocab:["w_vant","w_aploua"]},
{id:"e885", lesson:"l_u8l2", skill:"reading", type:"reading_q", diff:3, topic:"g_impersonal", readingId:"r_u8",
 prompt:"You're planning a hike in the mountains for Thursday. What does the forecast suggest you should expect?",
 options:["Warm sunshine, around 22 degrees.","Improving weather but still cold, with snow at altitude.","Rain all day and strong wind."], correct:1,
 explain:"Two sentences have to be combined: <i>Joi și vineri vremea se îmbunătățește, dar rămâne rece</i> and <i>La munte va ninge din nou</i>. The 22 degrees belongs to Monday–Tuesday and the all-day rain to Wednesday — both are real details from the text, attached to the wrong days.",
 vocab:["w_zapada","w_grad"]},
{id:"e886", lesson:"l_u8l2", skill:"writing", type:"produce", diff:3, topic:"g_impersonal",
 prompt:"Describe the weather where you are, and say which season you prefer and why (4–5 sentences).",
 minWords:20, mustUse:["vreme"],
 model:"Astăzi vremea este frumoasă: este soare și douăzeci de grade. Ieri a plouat toată ziua și a fost frig. Anotimpul meu preferat este toamna, pentru că nu este nici prea cald, nici prea frig. Iarna ninge mult aici și îmi place să stau acasă.",
 explain:"Check that no weather verb picked up a subject — <b>plouă</b> and <b>ninge</b> stand alone. Note <i>a plouat</i> and <i>a fost frig</i> for the past, and the useful pairing <b>nici… nici…</b> ('neither… nor…') for describing mild weather.",
 vocab:["w_vreme","w_anotimp","w_aploua"]},

/* ---------- A1.2 U1 : occupations, routines, frequency ---------- */
{id:"e701", lesson:"l_a12u1l1", skill:"grammar", type:"mcq", diff:2, topic:"g_articles_indef",
 prompt:"Choose the correct sentence:",
 options:["Ea este o programatoare.","Ea este programatoare.","Ea este un programator."], correct:1,
 explain:"Romanian drops the article before a bare profession: <b>Ea este programatoare</b> — literally 'she is programmer'. English needs 'a', Romanian does not. The article reappears only when the profession is modified: <i>Ea este o programatoare foarte bună.</i> Option C also mismatches gender.",
 audio:"Ea este programatoare.", vocab:["w_programator"]},
{id:"e702", lesson:"l_a12u1l1", skill:"grammar", type:"fill", diff:2, topic:"g_frequency",
 prompt:"___ beau cafea seara. (never)", answer:"Nu ... niciodată", accept:["Nu beau niciodată cafea seara","nu beau niciodată","Nu beau niciodată"],
 hint:"Romanian needs two words here, not one.",
 explain:"'Never' is <b>niciodată</b>, but it cannot stand alone — the verb still takes <b>nu</b>: <i>Nu beau niciodată cafea seara.</i> Romanian requires this double negative; unlike English, leaving out <i>nu</i> is ungrammatical rather than merely informal.",
 audio:"Nu beau niciodată cafea seara.", vocab:["w_niciodata"]},
{id:"e703", lesson:"l_a12u1l1", skill:"grammar", type:"error_fix", diff:2, topic:"g_frequency",
 prompt:"This sentence is missing a required word. Rewrite it correctly.",
 given:"Merg niciodată la birou sâmbăta.", answer:"Nu merg niciodată la birou sâmbăta.",
 accept:["Nu merg niciodată la birou sâmbăta."],
 explain:"<b>Niciodată</b> always travels with <b>nu</b> on the verb. The same applies to <i>nimic</i> ('nothing') and <i>nimeni</i> ('nobody'): <i>Nu văd nimic</i>, <i>Nu vine nimeni</i>. Two negatives do not cancel out in Romanian — they're a single grammatical unit.",
 audio:"Nu merg niciodată la birou sâmbăta.", vocab:["w_niciodata"]},
{id:"e704", lesson:"l_a12u1l1", skill:"vocabulary", type:"match", diff:1, topic:"g_frequency",
 prompt:"Match each frequency adverb with its meaning.",
 pairs:[["întotdeauna","always"],["de obicei","usually"],["uneori","sometimes"],["rar","rarely"],["niciodată","never"]],
 explain:"These sit on a scale from <i>întotdeauna</i> down to <i>niciodată</i>. Only the last one changes the sentence structure, by requiring <b>nu</b>. For counted frequency use <b>de … ori</b>: <i>de două ori pe săptămână</i> ('twice a week'), with <i>o dată</i> as the one irregular form.",
 vocab:["w_intotdeauna","w_deobicei","w_uneori","w_rar","w_niciodata"]},
{id:"e705", lesson:"l_a12u1l2", skill:"grammar", type:"conjugate", diff:2, topic:"g_present",
 prompt:"a începe — el/ea — prezent", answer:"începe", accept:["începe","incepe"],
 explain:"<b>el/ea începe</b>. Full present: încep, începi, începe, începem, începeți, încep. Like most -e verbs, the eu and ei/ele forms are identical. When another verb follows, use <b>să</b>: <i>încep să lucrez</i>.",
 audio:"el începe"},
{id:"e706", lesson:"l_a12u1l2", skill:"grammar", type:"build", diff:2, topic:"g_frequency",
 prompt:"Arrange the words into a natural sentence.",
 words:["de","obicei","la","opt","încep"], answer:"De obicei încep la opt.",
 accept:["De obicei încep la opt.","Încep de obicei la opt."],
 explain:"<b>De obicei</b> most often opens the sentence, though it can also sit right after the verb (<i>Încep de obicei la opt</i>) with no change of meaning. Fronting it is slightly more common in speech.",
 audio:"De obicei încep la opt.", vocab:["w_deobicei","w_aincepe"]},
{id:"e707", lesson:"l_a12u1l2", skill:"reading", type:"reading_q", diff:3, topic:"g_frequency", readingId:"r_a12u1",
 prompt:"How does Victor get to work when the weather is cold?",
 options:["By bicycle, as he does all year.","By tram.","On foot, because it's close."], correct:1,
 explain:"The text says <i>de obicei merg la birou cu bicicleta, <b>dar iarna iau tramvaiul</b></i>. The word doing the work is <b>iarna</b> ('in winter'), which the question paraphrases as 'when the weather is cold'. Option A quotes the bike — the more prominent detail — but ignores the <i>dar</i> that overrides it.",
 vocab:["w_tramvai"]},
{id:"e708", lesson:"l_a12u1l2", skill:"writing", type:"produce", diff:3, topic:"g_frequency",
 prompt:"Describe your working or study week in 4–5 sentences. Use at least two different frequency adverbs.",
 minWords:20, mustUse:["de obicei"],
 model:"De obicei mă trezesc la șapte și fac duș. Încep munca la nouă și termin pe la șase. Uneori lucrez de acasă, mai ales vinerea. Nu lucrez niciodată duminica. Seara citesc sau mă uit la un film.",
 explain:"Compare with the model. Check two things in your own text: that any <i>niciodată</i> is paired with <b>nu</b>, and that reflexive verbs kept their pronouns (<i>mă trezesc</i>, not <i>trezesc</i>). Habitual actions take the plain present — Romanian has no separate 'I usually do' tense.",
 vocab:["w_deobicei","w_niciodata","w_aincepe"]},

/* ---------- A1.2 U2 : free time, îmi place să ---------- */
{id:"e721", lesson:"l_a12u2l1", skill:"grammar", type:"mcq", diff:2, topic:"g_imi_place",
 prompt:"Choose the correct way to say \"I like reading\":",
 options:["Îmi place citesc.","Îmi place să citesc.","Îmi plac să citesc."], correct:1,
 explain:"To like <i>doing</i> something, Romanian uses <b>îmi place să</b> + subjunctive: <b>Îmi place să citesc</b>. Note it is always singular <b>place</b> here, however many activities follow — the verb agrees with the action, not with a plural noun. A bare verb without <i>să</i> is ungrammatical.",
 audio:"Îmi place să citesc.", vocab:["w_aciti","w_imiplace"]},
{id:"e722", lesson:"l_a12u2l1", skill:"grammar", type:"fill", diff:2, topic:"g_imi_place",
 prompt:"Îmi ___ filmele vechi. (place / plac)", answer:"plac", accept:["plac"],
 explain:"<b>Filmele</b> is plural, so <b>plac</b>. Contrast this with the previous pattern: <i>Îmi place să mă uit la filme</i> uses <b>place</b> because the subject there is the action <i>să mă uit</i>, not the films. Identify the subject and the agreement follows.",
 audio:"Îmi plac filmele vechi.", vocab:["w_film","w_imiplace"]},
{id:"e723", lesson:"l_a12u2l1", skill:"grammar", type:"conjugate", diff:2, topic:"g_present",
 prompt:"a juca — el/ea — prezent", answer:"joacă", accept:["joacă","joaca"],
 explain:"<b>el/ea joacă</b>. The stem alternates u→o: joc, joci, joacă, but jucăm, jucați, joacă. Use <b>a juca</b> for sports and games; for playing a musical instrument Romanian uses <b>a cânta</b> — <i>cânt la pian</i>.",
 audio:"el joacă"},
{id:"e724", lesson:"l_a12u2l2", skill:"grammar", type:"build", diff:3, topic:"g_frequency",
 prompt:"Arrange the words into a natural sentence.",
 words:["ori","pe","fac","de","sport","săptămână","trei"], answer:"Fac sport de trei ori pe săptămână.",
 accept:["Fac sport de trei ori pe săptămână.","Eu fac sport de trei ori pe săptămână."],
 explain:"Counted frequency is <b>de + number + ori + pe + time unit</b>: <i>de trei ori pe săptămână</i>. The <b>de</b> is obligatory and often dropped by learners. 'Once' is the exception — <b>o dată</b>, not *<i>de o ori</i>.",
 audio:"Fac sport de trei ori pe săptămână.", vocab:["w_sport"]},
{id:"e725", lesson:"l_a12u2l2", skill:"listening", type:"transcribe", diff:2, topic:"g_imi_place",
 prompt:"Listen and type what you hear.",
 audio:"Îmi place să gătesc pentru prieteni.", answer:"Îmi place să gătesc pentru prieteni.",
 accept:["Îmi place să gătesc pentru prieteni."],
 explain:"<b>Îmi place să gătesc</b> — 'I like to cook'. Listen for the unstressed <i>să</i>, which is easy to miss at speed but is structurally essential.",
 vocab:["w_agati","w_imiplace"]},
{id:"e726", lesson:"l_a12u2l2", skill:"writing", type:"produce", diff:3, topic:"g_imi_place",
 prompt:"Write 4–5 sentences about your free time. Use <b>îmi place să</b> at least once and a frequency expression at least once.",
 minWords:20, mustUse:["îmi place să"],
 model:"În timpul liber îmi place să citesc și să ascult muzică. Merg la înot de două ori pe săptămână. Uneori gătesc ceva nou pentru prieteni. Nu mă uit aproape niciodată la televizor. Sâmbăta joc fotbal în parc.",
 explain:"Check the agreement: <b>place</b> before <i>să</i> + verb, <b>plac</b> before a plural noun. Also check that any counted frequency kept its <b>de</b> — <i>de două ori pe săptămână</i>.",
 vocab:["w_imiplace","w_timpliber"]},

/* ---------- A1.2 U3 : phone, appointments, dates ---------- */
{id:"e741", lesson:"l_a12u3l1", skill:"vocabulary", type:"mcq", diff:1, topic:"g_questions",
 prompt:"You pick up the phone. What do you say?",
 options:["Bună ziua?","Alo?","Salut, cine ești?"], correct:1,
 explain:"<b>Alo?</b> is the phone-specific greeting, used only when answering or checking the line is live — never face to face. After it, you'd normally continue with <i>Bună ziua</i> and identify yourself. Option C is far too familiar for an unknown caller.",
 audio:"Alo? Cine este la telefon?", vocab:["w_alo","w_telefon"]},
{id:"e742", lesson:"l_a12u3l1", skill:"grammar", type:"fill", diff:2, topic:"g_dates",
 prompt:"Ziua mea este pe ___ martie. (the 1st)", answer:"întâi", accept:["întâi","intai"],
 explain:"The first of the month is the one date that uses an ordinal: <b>întâi martie</b>, not *<i>unu martie</i>. Every other date uses a plain cardinal — <i>doi martie, cincisprezece martie</i> — with no <b>de</b> and no article.",
 audio:"Ziua mea este pe întâi martie.", vocab:["w_martie","w_data"]},
{id:"e743", lesson:"l_a12u3l1", skill:"grammar", type:"error_fix", diff:2, topic:"g_dates",
 prompt:"Correct this date.",
 given:"Ne vedem pe 14 de martie.", answer:"Ne vedem pe 14 martie.",
 accept:["Ne vedem pe 14 martie.","Ne vedem pe paisprezece martie."],
 explain:"No <b>de</b> between the number and the month. The <i>de</i> rule applies to counted nouns (<i>14 zile</i> → <i>paisprezece zile</i>, and <i>douăzeci <b>de</b> zile</i> from 20 up), but a date is not a counted noun. Months are also never capitalized in Romanian.",
 audio:"Ne vedem pe 14 martie.", vocab:["w_martie"]},
{id:"e744", lesson:"l_a12u3l2", skill:"vocabulary", type:"trans_en_ro", diff:3, topic:"g_subjunctive",
 prompt:"Translate into Romanian: \"I would like to make an appointment.\"",
 answer:"Aș vrea să fac o programare.",
 accept:["Aș vrea să fac o programare.","Aș dori să fac o programare.","As vrea sa fac o programare."],
 explain:"<b>Aș vrea / aș dori</b> ('I would like') is the polite conditional, followed by <b>să</b> + subjunctive. The set phrase is <b>a face o programare</b> — Romanian 'makes' an appointment just as English does.",
 audio:"Aș vrea să fac o programare.", vocab:["w_programare"]},
{id:"e745", lesson:"l_a12u3l2", skill:"listening", type:"dictation", diff:3, topic:"g_dates",
 prompt:"Listen and write the appointment details you hear.",
 audio:"Vineri, pe 14 martie, la ora unsprezece.", answer:"Vineri, pe 14 martie, la ora unsprezece.",
 accept:["Vineri, pe 14 martie, la ora unsprezece.","Vineri pe paisprezece martie la ora unsprezece."],
 explain:"Three pieces stack in a fixed order: day, then <b>pe</b> + date, then <b>la ora</b> + time. Note <i>unsprezece</i> (11) — the -sprezece numbers run from 11 to 19 and are worth drilling, since they come fast in speech.",
 vocab:["w_martie","w_ora"]},
{id:"e746", lesson:"l_a12u3l2", skill:"reading", type:"reading_q", diff:3, topic:"g_dates", readingId:"r_a12u3",
 prompt:"Why can't they meet on Thursday?",
 options:["The restaurant is closed that evening.","One of them already has a medical appointment.","Neither of them finishes work in time."], correct:1,
 explain:"Ana replies <i>Joi sunt ocupată, am o programare la medic</i>. The reason is the appointment, not the restaurant — which is mentioned only later, as the place for Friday. Scanning for <i>restaurantul</i> finds a real word from the text attached to the wrong day.",
 vocab:["w_programare","w_ocupat"]},

/* ---------- A1.2 U4 : body, health, mă doare ---------- */
{id:"e761", lesson:"l_a12u4l1", skill:"grammar", type:"mcq", diff:2, topic:"g_ma_doare",
 prompt:"How do you say \"I have a headache\"?",
 options:["Eu doare capul meu.","Mă doare capul.","Am o durere de cap meu."], correct:1,
 explain:"Romanian says 'the head hurts <b>me</b>': <b>Mă doare capul</b>. Two things change from English — the person becomes the pronoun <b>mă</b>, and the body part takes the definite article <b>capul</b> rather than a possessive. Whose head it is, is obvious from context, so <i>meu</i> would sound redundant.",
 audio:"Mă doare capul.", vocab:["w_cap","w_adurea"]},
{id:"e762", lesson:"l_a12u4l1", skill:"grammar", type:"fill", diff:2, topic:"g_ma_doare",
 prompt:"Mă ___ picioarele. (doare / dor)", answer:"dor", accept:["dor"],
 explain:"<b>Picioarele</b> is plural, so the verb is <b>dor</b>. Exactly the same agreement rule as <i>îmi place / îmi plac</i>: the verb agrees with the thing, not the person. One body part → <i>doare</i>; several → <i>dor</i>.",
 audio:"Mă dor picioarele.", hint:"What is the subject — you, or your legs?", vocab:["w_picior","w_adurea"]},
{id:"e763", lesson:"l_a12u4l1", skill:"grammar", type:"error_fix", diff:2, topic:"g_ma_doare",
 prompt:"Rewrite this the way a Romanian would say it.",
 given:"Eu am durere în capul meu.", answer:"Mă doare capul.",
 accept:["Mă doare capul.","Am o durere de cap.","Ma doare capul."],
 explain:"Both <b>Mă doare capul</b> and <b>Am o durere de cap</b> are natural. What does not work is translating English structure word for word: no possessive on the body part, and no <i>în</i>. Note the fixed phrase <b>durere de cap</b>, with <i>de</i> rather than a preposition of place.",
 audio:"Mă doare capul.", vocab:["w_durere","w_cap"]},
{id:"e764", lesson:"l_a12u4l1", skill:"vocabulary", type:"match", diff:1, topic:"g_gender",
 prompt:"Match each body part with its English meaning.",
 pairs:[["cap","head"],["gât","throat, neck"],["stomac","stomach"],["spate","back"],["mână","hand"],["picior","leg, foot"]],
 explain:"Watch the plurals, which are irregular in several of these: <i>cap → capete</i>, <i>mână → mâini</i>, <i>picior → picioare</i>. <b>Picior</b> covers both leg and foot — Romanian does not routinely distinguish them.",
 vocab:["w_cap","w_gat","w_stomac","w_spate","w_mana","w_picior"]},
{id:"e765", lesson:"l_a12u4l2", skill:"listening", type:"transcribe", diff:2, topic:"g_ma_doare",
 prompt:"Listen and type what you hear.",
 audio:"Mă doare gâtul de două zile.", answer:"Mă doare gâtul de două zile.",
 accept:["Mă doare gâtul de două zile."],
 explain:"<b>de două zile</b> — 'for two days'. Romanian uses <b>de</b> where English uses 'for' with a duration that is still going on, and keeps the present tense: <i>Mă doare de două zile</i>, not a past tense.",
 vocab:["w_gat","w_adurea"]},
{id:"e766", lesson:"l_a12u4l2", skill:"vocabulary", type:"trans_en_ro", diff:3, topic:"g_questions",
 prompt:"Translate into Romanian: \"How are you feeling today?\" (polite)",
 answer:"Cum vă simțiți astăzi?",
 accept:["Cum vă simțiți astăzi?","Cum vă simțiți azi?","Cum va simtiti astazi?"],
 explain:"<b>A se simți</b> is reflexive, so the pronoun is required — and with a stranger or a professional it is <b>vă</b>, not <i>te</i>. The informal version is <i>Cum te simți?</i>",
 audio:"Cum vă simțiți astăzi?", vocab:["w_asesimti"]},
{id:"e767", lesson:"l_a12u4l2", skill:"writing", type:"produce", diff:3, topic:"g_ma_doare",
 prompt:"You are at the pharmacy. Describe your symptoms in 3–4 sentences.",
 minWords:16, mustUse:["doare"],
 model:"Bună ziua. Mă doare gâtul de trei zile și cred că am febră. Mă doare și capul, mai ales dimineața. Nu am fost încă la medic. Aveți ceva pentru răceală?",
 explain:"Compare with the model. Check that each body part carries the definite article and that the verb agrees — <i>doare</i> for one, <i>dor</i> for several. Opening with <b>Bună ziua</b> and closing with a question is the normal shape of a pharmacy exchange.",
 vocab:["w_adurea","w_febra","w_raceala"]},

/* ---------- A1.2 U5 : travel, tickets, future ---------- */
{id:"e781", lesson:"l_a12u5l1", skill:"vocabulary", type:"mcq", diff:1, topic:"g_questions",
 prompt:"You want a return ticket. What do you ask for?",
 options:["Un bilet dus, vă rog.","Un bilet dus-întors, vă rog.","Două bilete, vă rog."], correct:1,
 explain:"<b>Dus-întors</b> is the fixed term for a return ticket — literally 'gone-returned'. A one-way is simply <b>dus</b>. Note this is one item, not two: <i>un bilet dus-întors</i>, not <i>două bilete</i>.",
 audio:"Un bilet dus-întors, vă rog.", vocab:["w_dusintors","w_bilet"]},
{id:"e782", lesson:"l_a12u5l1", skill:"grammar", type:"conjugate", diff:2, topic:"g_present",
 prompt:"a pleca — noi — prezent", answer:"plecăm", accept:["plecăm","plecam"],
 explain:"<b>noi plecăm</b>. Full present: plec, pleci, pleacă, plecăm, plecați, pleacă. Note the stem shift e→ea in the el/ea and ei/ele forms — <i>pleacă</i> — which is very common in -a verbs.",
 audio:"noi plecăm"},
{id:"e783", lesson:"l_a12u5l1", skill:"grammar", type:"mcq", diff:2, topic:"g_future",
 prompt:"Which is the most common way to say \"I'm going to leave tomorrow\" in everyday speech?",
 options:["Voi pleca mâine.","O să plec mâine.","Am plecat mâine."], correct:1,
 explain:"All three are grammatical shapes, but <b>o să plec</b> is what you will actually hear. <i>Voi pleca</i> is the formal written future; <i>o să</i> + subjunctive dominates speech. The third option mixes a past tense with <i>mâine</i> and is simply wrong. In practice Romanians also use the plain present: <i>Mâine plec.</i>",
 audio:"O să plec mâine.", vocab:["w_apleca"]},
{id:"e784", lesson:"l_a12u5l2", skill:"listening", type:"dictation", diff:3, topic:"g_numbers",
 prompt:"Listen and write the announcement detail you hear.",
 audio:"Trenul are o întârziere de douăzeci de minute.", answer:"Trenul are o întârziere de douăzeci de minute.",
 accept:["Trenul are o întârziere de douăzeci de minute."],
 explain:"Two uses of <b>de</b> stack here: <i>o întârziere <b>de</b> …</i> ('a delay of') and <i>douăzeci <b>de</b> minute</i> (required after any number from 20). Missing either is the most common error in this sentence.",
 vocab:["w_intarziere"]},
{id:"e785", lesson:"l_a12u5l2", skill:"reading", type:"reading_q", diff:3, topic:"g_numbers", readingId:"r_a12u5",
 prompt:"If the train was scheduled for 9:10, roughly when will it actually leave?",
 options:["Around 9:20","Around 9:30","Around 10:10"], correct:1,
 explain:"The announcement gives two separate numbers you have to combine: departure at <i>ora nouă și zece minute</i> and a delay of <i>aproximativ douăzeci de minute</i>. 9:10 plus 20 minutes is roughly 9:30. Neither figure appears as an answer in the text — you have to do the arithmetic.",
 vocab:["w_intarziere","w_tren"]},

/* ---------- A1.2 U6 : invitations, socialising ---------- */
{id:"e801", lesson:"l_a12u6l1", skill:"vocabulary", type:"mcq", diff:2, topic:"g_subjunctive",
 prompt:"A friend invites you out but you're busy. Which reply is both natural and polite?",
 options:["Nu.","Din păcate nu pot, dar mulțumesc de invitație!","Nu vreau să vin."], correct:1,
 explain:"<b>Din păcate</b> ('unfortunately') softens a refusal, and thanking for the invitation keeps it warm. A bare <i>nu</i> is blunt, and <i>nu vreau</i> states you don't <b>want</b> to come — considerably harsher than saying you can't.",
 audio:"Din păcate nu pot, dar mulțumesc de invitație!", vocab:["w_dinpacate"]},
{id:"e802", lesson:"l_a12u6l1", skill:"grammar", type:"build", diff:2, topic:"g_questions",
 prompt:"Arrange the words into a natural invitation.",
 words:["la","vii","petrecere","sâmbătă"], answer:"Vii la petrecere sâmbătă?",
 accept:["Vii la petrecere sâmbătă?","Sâmbătă vii la petrecere?"],
 explain:"Romanian asks a yes/no question with plain word order and rising intonation — no auxiliary, no inversion. <b>Vii la petrecere sâmbătă?</b> Fronting the day (<i>Sâmbătă vii…</i>) is equally correct and emphasizes the timing.",
 audio:"Vii la petrecere sâmbătă?", vocab:["w_petrecere"]},
{id:"e803", lesson:"l_a12u6l2", skill:"grammar", type:"transform", diff:3, topic:"g_perfect_compus",
 prompt:"Rewrite in the past: <span class=\"ro\">Ne distrăm foarte bine.</span>",
 answer:"Ne-am distrat foarte bine.", accept:["Ne-am distrat foarte bine."],
 explain:"Reflexive verbs contract with the auxiliary in the past: <i>ne + am → <b>ne-am</b></i>. The full set is m-am, te-ai, s-a, ne-am, v-ați, s-au. Writing *<i>ne am distrat</i> is never correct — the hyphenated contraction is obligatory.",
 audio:"Ne-am distrat foarte bine.", vocab:["w_asedistra"]},
{id:"e804", lesson:"l_a12u6l2", skill:"writing", type:"produce", diff:3, topic:"g_subjunctive",
 prompt:"Write a short message inviting a friend to your birthday. Give the day, the time and the place (3–4 sentences).",
 minWords:18, mustUse:["ziua mea"],
 model:"Bună, Radu! Sâmbătă este ziua mea de naștere și organizez o petrecere mică. Începem pe la șapte, la mine acasă. Vii și tu? Ar fi grozav să te văd!",
 explain:"Compare with the model. An invitation normally gives day, time and place in that order, then asks directly. <b>Pe la</b> before a time means 'around', which is how Romanians usually state a social start time — precision would sound oddly formal.",
 vocab:["w_zidenastere","w_ainvita","w_petrecere"]},

/* ---------- A1.2 U7 : comparisons ---------- */
{id:"e821", lesson:"l_a12u7l1", skill:"grammar", type:"mcq", diff:2, topic:"g_comparative_a1",
 prompt:"Choose the correct comparison:",
 options:["Trenul este mai rapid ca autobuzul.","Trenul este mai rapid decât autobuzul.","Trenul este rapidul decât autobuzul."], correct:1,
 explain:"After a <b>mai</b> comparative, 'than' is <b>decât</b>. <i>Ca</i> belongs to the equal comparison <b>la fel de … ca</b> (<i>la fel de rapid ca</i> = 'as fast as'). Romanian never changes the adjective ending the way English adds -er.",
 audio:"Trenul este mai rapid decât autobuzul.", vocab:["w_maidecat"]},
{id:"e822", lesson:"l_a12u7l1", skill:"grammar", type:"fill", diff:2, topic:"g_comparative_a1",
 prompt:"Este ___ mai bună calitate din magazin. (cel / cea)", answer:"cea", accept:["cea"],
 explain:"<b>Calitate</b> is feminine, so the superlative marker is <b>cea</b>: <i>cea mai bună calitate</i>. The set is cel (m. sg.), cea (f. sg.), cei (m. pl.), cele (f. pl.) — each agreeing with its noun.",
 audio:"Este cea mai bună calitate din magazin.", vocab:["w_celmai","w_calitate"]},
{id:"e823", lesson:"l_a12u7l1", skill:"grammar", type:"trans_en_ro", diff:3, topic:"g_comparative_a1",
 prompt:"Translate into Romanian: \"This jacket is cheaper than the other one.\"",
 answer:"Această geacă este mai ieftină decât cealaltă.",
 accept:["Această geacă este mai ieftină decât cealaltă.","Geaca aceasta este mai ieftină decât cealaltă.","Această geacă e mai ieftină decât cealaltă."],
 explain:"<i>Geacă</i> is feminine, so the adjective agrees: <b>mai ieftină</b>. 'The other one' is <b>cealaltă</b> (f.) — the masculine is <i>celălalt</i>. Placing the demonstrative after the noun (<i>geaca aceasta</i>) is equally natural.",
 audio:"Această geacă este mai ieftină decât cealaltă.", vocab:["w_maidecat","w_ieftin"]},
{id:"e824", lesson:"l_a12u7l2", skill:"reading", type:"reading_q", diff:3, topic:"g_comparative_a1", readingId:"r_a12u7",
 prompt:"You want the warmest jacket and cost is not a concern. Which should you buy, and why?",
 options:["The classic model, because it's the cheaper of the two.","The sports model, because the ad says it's warmer than the classic one.","Neither — the ad doesn't compare warmth."], correct:1,
 explain:"The advert says of the sports jacket: <i>Mai ușoară și mai caldă decât modelul clasic</i>. The comparison is stated only once, in the second entry, and describes it relative to the first — so you have to connect the two listings. Note <b>mai caldă</b> agrees with the feminine <i>geacă</i>.",
 vocab:["w_maidecat"]},
{id:"e825", lesson:"l_a12u7l2", skill:"writing", type:"produce", diff:3, topic:"g_comparative_a1",
 prompt:"Compare two things you own or two places you know, in 4–5 sentences. Use <b>mai … decât</b> and <b>cel mai</b> or <b>cea mai</b> at least once each.",
 minWords:20, mustUse:["mai","decât"],
 model:"Am două telefoane. Telefonul nou este mai rapid decât cel vechi, dar este și mai scump. Bateria de la telefonul vechi ține mai mult. Pentru mine, cel mai important lucru este bateria. Cred că voi păstra telefonul vechi încă un an.",
 explain:"Check two things in your text: that <b>decât</b> follows every <i>mai</i> comparison, and that <b>cel/cea</b> agrees with the noun it describes. Note also <i>cel vechi</i> — <b>cel</b> can stand alone meaning 'the one', which saves repeating the noun.",
 vocab:["w_maidecat","w_celmai"]},

/* ---------- CIVIC U1 : the oath ---------- */
{id:"cv101", lesson:"l_civ_u1l1", skill:"vocabulary", type:"build", diff:3, topic:null,
 prompt:"Rebuild the first clause of the oath.",
 words:["Jur","să","fiu","devotat","patriei","și","poporului","român"],
 answer:"Jur să fiu devotat patriei și poporului român",
 accept:["Jur să fiu devotat patriei și poporului român","Jur să fiu devotat patriei și poporului român."],
 explain:"<b>Jur să fiu devotat patriei și poporului român</b> — 'I swear to be devoted to the homeland and the Romanian people'. Note <b>patriei</b> and <b>poporului</b> are dative forms: devotion is <i>to</i> something. After <b>jur</b> every clause of the oath is introduced by <b>să</b> + subjunctive.",
 audio:"Jur să fiu devotat patriei și poporului român", vocab:["c_ajura","c_patrie","c_popor"]},
{id:"cv102", lesson:"l_civ_u1l1", skill:"vocabulary", type:"fill", diff:3, topic:null,
 prompt:"…să ___ drepturile și interesele naționale…", answer:"apăr", accept:["apăr","apar"],
 explain:"<b>apăr</b> — first person singular of <i>a apăra</i>, 'to defend'. In the subjunctive after <b>să</b> the form is identical to the present indicative for this verb. The full clause is <i>să apăr drepturile și interesele naționale</i>.",
 audio:"să apăr drepturile și interesele naționale", vocab:["c_aapara","c_drept"]},
{id:"cv103", lesson:"l_civ_u1l1", skill:"vocabulary", type:"fill", diff:3, topic:null,
 prompt:"…să respect ___ și legile României.", answer:"Constituția", accept:["Constituția","Constitutia","constituția"],
 explain:"<b>Constituția</b> — with the definite article, because the oath refers to <i>the</i> Constitution of Romania specifically. The closing clause is <i>să respect Constituția și legile României</i>. Note <b>legile</b> is also definite, and <b>României</b> is genitive: 'of Romania'.",
 audio:"să respect Constituția și legile României", vocab:["c_constitutie","c_lege"]},
{id:"cv104", lesson:"l_civ_u1l2", skill:"listening", type:"dictation", diff:4, topic:null,
 prompt:"Listen to the full oath and type it. Use the slower speeds until you can follow it at normal pace.",
 audio:"Jur să fiu devotat patriei și poporului român, să apăr drepturile și interesele naționale, să respect Constituția și legile României.",
 answer:"Jur să fiu devotat patriei și poporului român, să apăr drepturile și interesele naționale, să respect Constituția și legile României.",
 accept:["Jur să fiu devotat patriei și poporului român, să apăr drepturile și interesele naționale, să respect Constituția și legile României."],
 explain:"The oath has three parallel clauses, each opening with <b>să</b>: be devoted, defend, respect. Hearing that three-part rhythm is the easiest way to hold the whole text in memory — it is one sentence, not three.",
 vocab:["c_juramant","c_ajura"]},
{id:"cv105", lesson:"l_civ_u1l2", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Write the oath from memory. Take as many attempts as you need — this is the one text you must be able to deliver without notes.",
 recite:true, minWords:18, mustUse:["Jur"],
 model:"Jur să fiu devotat patriei și poporului român, să apăr drepturile și interesele naționale, să respect Constituția și legile României.",
 explain:"Check your version word for word against the model. The three <b>să</b>-clauses must all be present and in this order. Common slips: dropping a <i>să</i>, writing <i>apar</i> for <b>apăr</b>, or leaving <i>Constituția</i> and <i>legile</i> without their definite endings.",
 vocab:["c_ajura","c_arespecta"]},

/* ---------- CIVIC U2 : the anthem ---------- */
{id:"cv121", lesson:"l_civ_u2l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"What is the title of the Romanian national anthem?",
 options:["Trei culori","Deșteaptă-te, române!","Hora Unirii"], correct:1,
 explain:"<b>Deșteaptă-te, române!</b> ('Awaken thee, Romanian!'), lyrics by Andrei Mureșanu, written during the 1848 revolution. <i>Trei culori</i> was the anthem of communist Romania, and <i>Hora Unirii</i> is a patriotic song associated with the 1859 union — both are plausible distractors precisely because they are real Romanian patriotic songs.",
 audio:"Deșteaptă-te, române!", vocab:["c_imn"]},
{id:"cv122", lesson:"l_civ_u2l1", skill:"vocabulary", type:"fill", diff:3, topic:null,
 prompt:"Deșteaptă-te, române, din ___ cel de moarte…", answer:"somnul", accept:["somnul"],
 explain:"<b>somnul cel de moarte</b> — 'the sleep of death'. The construction <i>cel de</i> links a noun to a defining phrase, a slightly archaic pattern that survives in fixed expressions and poetry.",
 audio:"Deșteaptă-te, române, din somnul cel de moarte"},
{id:"cv123", lesson:"l_civ_u2l2", skill:"reading", type:"reading_q", diff:4, topic:null, readingId:"r_civ_imn",
 prompt:"The fourth official stanza names Mihai, Ștefan and Corvine. Who are they addressed as?",
 options:["Living leaders of the nation","Ancestral figures being called on to witness their descendants","Enemies of the Romanian people"], correct:1,
 explain:"The line is <i>Priviți, mărețe umbre</i> — 'Behold, great shades'. <b>Umbre</b> ('shades') marks them as the dead, and the stanza then calls the nation <i>ai voștri strănepoți</i> ('your great-grandchildren'). They are Mihai Viteazul, Ștefan cel Mare and Iancu de Hunedoara (Corvinus) — historical rulers invoked as witnesses."},
{id:"cv124", lesson:"l_civ_u2l2", skill:"listening", type:"transcribe", diff:4, topic:null,
 prompt:"Listen and type the line you hear.",
 audio:"Acum ori niciodată, croiește-ți altă soartă",
 answer:"Acum ori niciodată, croiește-ți altă soartă",
 accept:["Acum ori niciodată, croiește-ți altă soartă","Acum ori niciodata, croieste-ti alta soarta"],
 explain:"<b>Acum ori niciodată</b> — 'now or never' — opens both the first and second stanzas, which makes it the anthem's most recognizable phrase. <b>croiește-ți</b> is an imperative with an attached reflexive pronoun: 'forge for yourself'."},

/* ---------- CIVIC U3 : state & Constitution ---------- */
{id:"cv141", lesson:"l_civ_u3l1", skill:"vocabulary", type:"mcq", diff:1, topic:null,
 prompt:"Care este forma de guvernământ a României?",
 options:["Monarhie constituțională","Republică","Federație"], correct:1,
 explain:"România este o <b>republică</b>, conform articolului 1 din Constituție. A fost monarhie până în 1947, iar din 1991 Constituția actuală definește statul ca <i>stat național, suveran și independent, unitar și indivizibil</i>. Nu este federație — statul este <b>unitar</b>.",
 audio:"România este o republică.", vocab:["c_republica"]},
{id:"cv142", lesson:"l_civ_u3l1", skill:"vocabulary", type:"match", diff:2, topic:null,
 prompt:"Match each national symbol or fact with its answer.",
 pairs:[["Capitala","București"],["Ziua națională","1 decembrie"],["Limba oficială","limba română"],["Culorile drapelului","albastru, galben, roșu"],["Imnul național","Deșteaptă-te, române!"]],
 explain:"These five come up in almost every interview. Note the flag colors run <b>vertically</b>, in the order blue–yellow–red from the pole outward, and that <b>1 decembrie</b> marks the 1918 union at Alba Iulia rather than independence, which was 1877.",
 vocab:["c_capitala","c_steag","c_imn"]},
{id:"cv143", lesson:"l_civ_u3l2", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"Câte camere are Parlamentul României?",
 options:["Una singură","Două: Camera Deputaților și Senatul","Trei"], correct:1,
 explain:"Parlamentul este <b>bicameral</b>: <b>Camera Deputaților</b> și <b>Senatul</b>. Președintele este ales prin vot direct pentru cinci ani, cu maximum două mandate, iar Guvernul este condus de <b>prim-ministru</b>.",
 audio:"Parlamentul are două camere: Camera Deputaților și Senatul.", vocab:["c_parlament"]},
{id:"cv144", lesson:"l_civ_u3l2", skill:"reading", type:"reading_q", diff:3, topic:null, readingId:"r_civ_stat",
 prompt:"Someone has served two terms as President. What does the text imply about a third?",
 options:["They may run again after a break.","They may not — two terms is the maximum.","The text does not address term limits."], correct:1,
 explain:"The text states <i>poate avea cel mult două mandate</i> — 'may have at most two terms'. <b>Cel mult</b> means 'at most', which caps the total rather than describing consecutive terms. No exception for a break is mentioned.",
 vocab:["c_presedinte"]},

/* ---------- CIVIC U4 : geography ---------- */
{id:"cv161", lesson:"l_civ_u4l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"Cu câte țări are graniță România?",
 options:["Patru","Cinci","Șase"], correct:1,
 explain:"<b>Cinci</b>: Ungaria, Serbia, Bulgaria, Ucraina și Republica Moldova. Ucraina este vecin atât la <b>nord</b>, cât și la <b>est</b>, ceea ce îi face pe mulți să numere greșit. La sud-est se află <b>Marea Neagră</b>, care nu este graniță terestră.",
 audio:"România are graniță cu cinci țări.", vocab:["c_granita"]},
{id:"cv162", lesson:"l_civ_u4l1", skill:"vocabulary", type:"fill", diff:2, topic:null,
 prompt:"Cel mai important fluviu al României este ___.", answer:"Dunărea", accept:["Dunărea","Dunarea"],
 explain:"<b>Dunărea</b> traversează sudul țării și se varsă în Marea Neagră prin <b>Delta Dunării</b>, cea mai mare deltă din Uniunea Europeană. Atenție la distincția <b>fluviu</b> (râu mare care se varsă în mare) și <b>râu</b> (curs de apă obișnuit).",
 audio:"Cel mai important fluviu al României este Dunărea.", vocab:["c_fluviu"]},
{id:"cv163", lesson:"l_civ_u4l2", skill:"reading", type:"reading_q", diff:3, topic:null, readingId:"r_civ_geo",
 prompt:"A traveler enters Romania from the west. Which country have they most likely come from?",
 options:["Ucraina","Ungaria","Bulgaria"], correct:1,
 explain:"The text places <i>Ungaria la vest</i>. Bulgaria is <b>la sud</b> and Ucraina <b>la nord și est</b> — both appear in the same sentence, so scanning for a country name without reading its direction gives the wrong answer.",
 vocab:["c_granita"]},

/* ---------- CIVIC U5 : history ---------- */
{id:"cv181", lesson:"l_civ_u5l1", skill:"vocabulary", type:"match", diff:3, topic:null,
 prompt:"Match each date with the event.",
 pairs:[["1859","Unirea Principatelor Române"],["1877","Independența față de Imperiul Otoman"],["1918","Marea Unire de la Alba Iulia"],["1989","Revoluția anticomunistă"],["2007","Aderarea la Uniunea Europeană"]],
 explain:"Aceste cinci date sunt cele mai frecvente la interviu. Reține legătura dintre <b>1918</b> și <b>1 decembrie</b>, ziua națională — este singura dată care apare și ca sărbătoare. România a intrat în <b>NATO în 2004</b>, cu trei ani înainte de UE.",
 vocab:["c_unire","c_independenta","c_revolutie"]},
{id:"cv182", lesson:"l_civ_u5l1", skill:"vocabulary", type:"fill", diff:2, topic:null,
 prompt:"Ziua națională a României este pe ___ decembrie.", answer:"1", accept:["1","întâi","unu"],
 explain:"<b>1 decembrie</b>, care marchează Marea Unire de la Alba Iulia din 1918. Spus cu voce tare, ziua întâi a lunii se citește <b>întâi decembrie</b>, nu <i>unu decembrie</i>.",
 audio:"Ziua națională a României este pe întâi decembrie.", vocab:["c_unire"]},

/* ---------- CIVIC U6 : interview & documents ---------- */
{id:"cv201", lesson:"l_civ_u6l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"The interviewer asks: <span class=\"ro\">De ce doriți să redobândiți cetățenia română?</span> Write your own answer in 3–5 sentences.",
 minWords:25, mustUse:["cetățenia"],
 model:"Doresc să redobândesc cetățenia română pentru că bunicii mei s-au născut în România. Familia mea a păstrat limba și tradițiile românești. Vreau să am o legătură oficială cu țara strămoșilor mei. De asemenea, învăț limba română de mai mulți ani și îmi doresc să o vorbesc bine.",
 explain:"There is no single right answer — but a good one is <b>specific</b> and <b>personal</b>. Name the ancestor and the connection rather than speaking in generalities. Useful frames: <i>Doresc să… pentru că…</i>, <i>Bunicii mei s-au născut în…</i>, <i>Vreau să păstrez legătura cu…</i>. Prepare this answer in advance; it is asked in almost every interview.",
 vocab:["c_cetatenie","c_redobandire","c_stramos"]},
{id:"cv202", lesson:"l_civ_u6l1", skill:"vocabulary", type:"match", diff:2, topic:null,
 prompt:"Match each document term with its meaning.",
 pairs:[["dosar","file, application dossier"],["certificat de naștere","birth certificate"],["cazier judiciar","criminal record certificate"],["act de identitate","identity document"],["apostilă","apostille (international certification)"]],
 explain:"These are the terms you will hear when your paperwork is checked. <b>Cazier judiciar</b> is required from every country you have lived in, and foreign documents generally need an <b>apostilă</b> plus an authorised translation. Requirements change — always confirm the current list with the authority handling your file.",
 vocab:["c_dosar","c_certificat"]},
{id:"cv203", lesson:"l_civ_u6l2", skill:"listening", type:"transcribe", diff:3, topic:null,
 prompt:"Listen to a typical interview question and type it.",
 audio:"De ce doriți să redobândiți cetățenia română?",
 answer:"De ce doriți să redobândiți cetățenia română?",
 accept:["De ce doriți să redobândiți cetățenia română?","De ce doriti sa redobanditi cetatenia romana?"],
 explain:"Note the formal <b>doriți</b> and <b>redobândiți</b> — the interviewer will address you with <i>dumneavoastră</i> throughout, so expect voi-form verbs. Answer in the same register: <i>Doresc…</i> rather than <i>Vreau…</i>.",
 vocab:["c_redobandire","c_cetatenie"]},

/* ---------- A1.1 U1 L4 : everyday expressions & register ---------- */
{id:"e151", lesson:"l_u1l4", skill:"vocabulary", type:"mcq", diff:1, topic:null,
 prompt:"Someone says <span class=\"ro\">Bine ai venit!</span> What is the set reply?",
 options:["Mulțumesc, la revedere!","Bine te-am găsit!","Bine ai venit și tu!"], correct:1,
 explain:"<b>Bine te-am găsit!</b> — literally 'I found you well'. This is a fixed pair: <i>bine ai venit</i> is always answered with <i>bine te-am găsit</i> (or <b>bine v-am găsit</b> in the formal form). It has no English equivalent, and using it marks you out immediately as someone who has actually learned Romanian rather than translated into it.",
 audio:"Bine ai venit! Bine te-am găsit!", vocab:["x_bineaivenit","x_bineteamgasit"]},
{id:"e152", lesson:"l_u1l4", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"You're at a shop counter and need to get past an older stranger. Which is right?",
 options:["Scuză-mă, te rog!","Scuzați-mă, vă rog!","Pa, scuze!"], correct:1,
 explain:"With a stranger — especially an older one — use the formal <b>Scuzați-mă, vă rog</b>. The <i>-ți</i> ending and <b>vă</b> mark the polite form. <i>Scuză-mă, te rog</i> is for friends. Getting this wrong is the most audible slip a foreigner makes in Romania.",
 audio:"Scuzați-mă, vă rog!", vocab:["x_scuzama"]},
{id:"e153", lesson:"l_u1l4", skill:"vocabulary", type:"match", diff:2, topic:null,
 prompt:"Match each Romanian expression with the situation it belongs to.",
 pairs:[["La mulți ani!","someone's birthday"],["Noroc!","raising a glass"],["Succes!","before an exam"],["Felicitări!","after good news"],["Călătorie plăcută!","someone is leaving on a trip"]],
 explain:"These are fixed social formulas — you cannot build them from grammar, only learn them whole. <b>La mulți ani</b> covers birthdays, name days and New Year. <b>Noroc</b> doubles as 'cheers' and 'good luck', and is also what you say when someone sneezes.",
 vocab:["x_lamultiani","x_noroc","x_succes","x_felicitari","x_calatorie"]},
{id:"e154", lesson:"l_u1l4", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"A colleague apologizes for being late. Which reply is natural?",
 options:["Nu face nimic.","Nu am nimic.","Nimic nu este."], correct:0,
 explain:"<b>Nu face nimic</b> ('it's nothing') is the standard reassurance, alongside <b>Nicio problemă</b>. Note the fixed word order — the other two options are grammatical Romanian but mean something else entirely ('I have nothing', 'nothing exists').",
 audio:"Nu face nimic.", vocab:["x_nufacenimic","x_niciopb"]},
{id:"e155", lesson:"l_u1l4", skill:"vocabulary", type:"trans_en_ro", diff:2, topic:null,
 prompt:"Translate: \"Have a nice weekend!\"",
 answer:"Weekend plăcut!", accept:["Weekend plăcut!","Weekend placut","Un weekend plăcut!","Sfârșit de săptămână plăcut!"],
 explain:"<b>Weekend plăcut!</b> The adjective <b>plăcut</b> ('pleasant') builds a whole family of farewells: <i>călătorie plăcută</i>, <i>seară plăcută</i>, <i>vacanță plăcută</i>. Note the adjective follows the noun and agrees with it — <i>plăcut</i> for the neuter <i>weekend</i>, <i>plăcută</i> for feminine <i>călătorie</i>.",
 audio:"Weekend plăcut!", vocab:["x_weekendplacut"]},
{id:"e156", lesson:"l_u1l4", skill:"listening", type:"transcribe", diff:2, topic:null,
 prompt:"Listen and type what you hear.",
 audio:"Luați loc, vă rog.", answer:"Luați loc, vă rog.",
 accept:["Luați loc, vă rog.","Luati loc, va rog."],
 explain:"<b>Luați loc</b> — the formal 'have a seat'; informally it is <b>Ia loc</b>. Romanian 'takes' a seat just as English does, but note <i>loc</i> here means 'place' rather than a physical chair.",
 vocab:["x_ialoc"]},

/* ===================== GRAMMAR DRILLS =====================
   Exercises attached to a rule rather than to one lesson. They surface under
   "Practice this rule" on each grammar article and feed the practice generator,
   so a learner can drill a specific weakness instead of replaying a lesson.
   They carry an explicit `level` because they have no parent lesson. */

/* ---- g_negation (A1) ---- */
{id:"d_neg1", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:1, topic:"g_negation",
 prompt:"Make this negative: <span class=\"ro\">Vorbesc franceza.</span>",
 options:["Nu vorbesc franceza.","Vorbesc nu franceza.","Vorbesc franceza nu."], correct:0,
 explain:"<b>Nu</b> goes immediately before the conjugated verb — never after it, and never at the end. This position is fixed, unlike English where 'not' attaches to an auxiliary.",
 audio:"Nu vorbesc franceza."},
{id:"d_neg2", lesson:null, level:"a1_1", skill:"grammar", type:"fill", diff:2, topic:"g_negation",
 prompt:"___ mănânc niciodată carne.", answer:"Nu", accept:["nu"],
 explain:"Romanian requires the double negative: <b>nu</b> on the verb <i>and</i> <b>niciodată</b>. Unlike English, dropping <i>nu</i> is ungrammatical rather than merely informal. The same holds for <i>nimic</i> and <i>nimeni</i>.",
 audio:"Nu mănânc niciodată carne."},
{id:"d_neg3", lesson:null, level:"a1_1", skill:"grammar", type:"error_fix", diff:2, topic:"g_negation",
 prompt:"Fix the negation.", given:"Văd nimic pe masă.", answer:"Nu văd nimic pe masă.",
 accept:["Nu văd nimic pe masă.","Nu vad nimic pe masa."],
 explain:"<b>Nimic</b> ('nothing') needs <b>nu</b> on the verb. Two negatives do not cancel in Romanian — they form one unit. Compare <i>Nu vine nimeni</i> ('nobody is coming').",
 audio:"Nu văd nimic pe masă."},
{id:"d_neg4", lesson:null, level:"a1_1", skill:"grammar", type:"trans_en_ro", diff:2, topic:"g_negation",
 prompt:"Translate: \"I don't have a car.\"", answer:"Nu am mașină.",
 accept:["Nu am mașină.","Nu am o mașină.","Nu am masina","Nu am masină."],
 explain:"<b>Nu am mașină</b>. Romanian needs no equivalent of English 'do' — <i>nu</i> attaches straight to the verb. Dropping the article (<i>nu am mașină</i>) is the more idiomatic reading: 'I don't own a car'.",
 audio:"Nu am mașină."},

/* ---- g_plural (A1) ---- */
{id:"d_pl1", lesson:null, level:"a1_1", skill:"grammar", type:"transform", diff:2, topic:"g_plural",
 prompt:"Give the plural: <span class=\"ro\">o casă</span>", answer:"două case", accept:["două case","case","doua case"],
 explain:"Feminine <b>-ă → -e</b>: <i>casă → case</i>. This is the commonest feminine pattern, but not the only one — many -ă nouns take -i instead (<i>mașină → mașini</i>), which is why plurals are worth learning with the noun.",
 audio:"o casă, două case"},
{id:"d_pl2", lesson:null, level:"a1_1", skill:"grammar", type:"transform", diff:2, topic:"g_plural",
 prompt:"Give the plural: <span class=\"ro\">un student</span>", answer:"doi studenți", accept:["doi studenți","studenți","doi studenti"],
 explain:"Masculine usually adds <b>-i</b>, and the final consonant softens: <b>t → ț</b>. The same softening gives <i>brad → brazi</i> (d→z) and <i>urs → urși</i> (s→ș).",
 audio:"un student, doi studenți"},
{id:"d_pl3", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:2, topic:"g_plural",
 prompt:"Which is the correct plural of <span class=\"ro\">un tren</span>?",
 options:["două trene","două trenuri","doi treni"], correct:1,
 explain:"<b>Tren</b> is neuter, and this group splits between <b>-e</b> and <b>-uri</b>. <i>Tren</i> takes <b>-uri</b>: <i>două trenuri</i>. Compare <i>oraș → orașe</i>, which takes -e. There is no rule that predicts which — they are learned individually.",
 audio:"un tren, două trenuri"},
{id:"d_pl4", lesson:null, level:"a1_1", skill:"grammar", type:"error_fix", diff:3, topic:"g_plural",
 prompt:"Correct the plural.", given:"Am două mașine noi.", answer:"Am două mașini noi.",
 accept:["Am două mașini noi.","Am doua masini noi."],
 explain:"<b>Mașină</b> is one of the feminine nouns taking <b>-i</b>, not -e: <i>mașină → mașini</i>. Note the adjective stays <b>noi</b> for feminine plural. Assuming every -ă noun takes -e is the single commonest plural error.",
 audio:"Am două mașini noi."},
{id:"d_pl5", lesson:null, level:"a1_1", skill:"grammar", type:"match", diff:2, topic:"g_plural",
 prompt:"Match each singular with its plural.",
 pairs:[["copil","copii"],["floare","flori"],["bilet","bilete"],["oraș","orașe"],["frate","frați"]],
 explain:"Five different patterns in one set. <b>Copil → copii</b> is masculine -i; <b>floare → flori</b> loses the -e; <b>bilet</b> and <b>oraș</b> are neuter taking -e; <b>frate → frați</b> softens t→ț.",
 vocab:["w_copil","w_frate"]},

/* ---- g_gender: the un/două test (after Brâncuș) ---- */
{id:"d_gen1", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:2, topic:"g_gender",
 prompt:"<span class=\"ro\">un manual → două manuale.</span> What gender is <span class=\"ro\">manual</span>?",
 options:["masculine","feminine","neuter"], correct:2,
 explain:"<b>Neuter</b>, and the test proves it: <b>un</b> in the singular (like a masculine) but <b>două</b> in the plural (like a feminine). That combination <i>is</i> the definition of neuter — there is no third set of endings to learn.",
 audio:"un manual, două manuale"},
{id:"d_gen2", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:2, topic:"g_gender",
 prompt:"Which pair shows a MASCULINE noun?",
 options:["un scaun → două scaune","un student → doi studenți","o casă → două case"], correct:1,
 explain:"Only <b>doi</b> marks masculine. <i>Un scaun → două scaune</i> is neuter (un + două) and <i>o casă → două case</i> is feminine (o + două). Note that both neuter and feminine take <b>două</b> — the singular article is what separates them.",
 audio:"un student, doi studenți"},
{id:"d_gen3", lesson:null, level:"a1_1", skill:"grammar", type:"fill", diff:2, topic:"g_gender",
 prompt:"Apply the test: un tren → ___ trenuri. (doi / două)", answer:"două", accept:["două","doua"],
 explain:"<b>Două trenuri</b> — so <i>tren</i> is neuter. If it were masculine the plural would take <i>doi</i>. Learning each noun as a triple (<b>un tren, două trenuri</b>) settles the gender permanently.",
 audio:"un tren, două trenuri"},
{id:"d_gen4", lesson:null, level:"a1_1", skill:"grammar", type:"match", diff:3, topic:"g_gender",
 prompt:"Match each noun with its gender, using the un/o + doi/două test.",
 pairs:[["un bilet → două bilete","neuter"],["o floare → două flori","feminine"],["un frate → doi frați","masculine"],["un oraș → două orașe","neuter"],["o carte → două cărți","feminine"]],
 explain:"Three of these end in a consonant, yet only <i>frate</i> is masculine — which is exactly why the ending is not a reliable guide and the plural test is. <b>Doi</b> → masculine; <b>un … două</b> → neuter; <b>o … două</b> → feminine.",
 vocab:["w_frate","w_bilet","w_carte"]},

/* ---- g_plural: invariable and irregular nouns ---- */
{id:"d_pl6", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:3, topic:"g_plural",
 prompt:"What is the plural of <span class=\"ro\">un ochi</span> (an eye)?",
 options:["doi ochi","doi ochii","două ochiuri"], correct:0,
 explain:"<b>Doi ochi</b> — unchanged. A small group of masculines is invariable: <i>ochi, unchi, pui</i> are identical in both numbers. The form <i>ochii</i> exists but means 'the eyes' — that second -i is the definite article, not the plural.",
 audio:"un ochi, doi ochi", vocab:["w_ochi"]},
{id:"d_pl7", lesson:null, level:"a1_1", skill:"grammar", type:"match", diff:3, topic:"g_plural",
 prompt:"Match each singular with its plural — three of these are irregular.",
 pairs:[["copil","copii"],["cal","cai"],["om","oameni"],["pui","pui"],["frate","frați"]],
 explain:"<b>Copil→copii</b>, <b>cal→cai</b> and <b>om→oameni</b> are irregular and must simply be known — <i>oameni</i> does not even share a stem with <i>om</i>. <b>Pui</b> is invariable, and only <b>frate→frați</b> follows the regular -e → -i pattern.",
 vocab:["w_copil","w_frate"]},

/* ---- Antonym pairs: vocabulary through opposition (after Brâncuș) ---- */
{id:"d_ant1", lesson:null, level:"a1_1", skill:"vocabulary", type:"match", diff:2, topic:null,
 prompt:"Match each adjective with its opposite.",
 pairs:[["bun","rău"],["frumos","urât"],["scump","ieftin"],["curat","murdar"],["înalt","scund"]],
 explain:"Learning adjectives in opposed pairs doubles what one word buys you and makes both easier to recall. All five here are four-form adjectives, so each changes for gender and number: <i>bună, frumoasă, scumpă, curată, înaltă</i>.",
 vocab:["w_scump","w_ieftin","w_inalt","w_scund","w_frumos"]},
{id:"d_ant2", lesson:null, level:"a1_1", skill:"vocabulary", type:"match", diff:2, topic:null,
 prompt:"Match each word with its opposite.",
 pairs:[["aproape","departe"],["liber","ocupat"],["deschis","închis"],["devreme","târziu"],["mare","mic"]],
 explain:"<b>Liber ≠ ocupat</b> covers both a free seat and a free evening. <b>Deschis ≠ închis</b> is what you read on every shop door in Romania. Note <b>mare</b> is a two-form adjective (mare/mari) while <b>mic</b> has four (mic, mică, mici, mici).",
 vocab:["w_aproape","w_departe","w_liber_adj","w_ocupat"]},
{id:"d_ant3", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:3, topic:"g_place_prepositions",
 prompt:"Both sentences are correct. What is the difference?<br><span class=\"ro\">1. Căminul este aproape.</span><br><span class=\"ro\">2. Căminul este aproape de facultate.</span>",
 options:["No difference — de is optional.","Without <b>de</b> it means 'nearby' in general; with <b>de</b> it says near WHAT.","The first is wrong Romanian."], correct:1,
 explain:"<b>Aproape</b> on its own is an adverb — 'it's nearby'. Add a thing you're measuring against and it needs <b>de</b>: <i>aproape <b>de</b> facultate</i>. Same for <b>departe (de)</b> and <b>vizavi de</b>. Dropping the <i>de</i> before a noun is a very common learner error.",
 audio:"Căminul este aproape de facultate.", vocab:["w_aproape","w_departe"]},

/* ---- g_articles_def (A1) ---- */
{id:"d_def1", lesson:null, level:"a1_1", skill:"grammar", type:"fill", diff:2, topic:"g_articles_def",
 prompt:"Add the definite article: un băiat → ___", answer:"băiatul", accept:["băiatul","baiatul"],
 explain:"Masculine and neuter singular take <b>-ul</b>: <i>băiat → băiatul</i>. There is no separate word for 'the' — the article fuses onto the end of the noun, which is one of the most distinctive features of Romanian.",
 audio:"un băiat, băiatul"},
{id:"d_def2", lesson:null, level:"a1_1", skill:"grammar", type:"fill", diff:2, topic:"g_articles_def",
 prompt:"Add the definite article: o carte → ___", answer:"cartea", accept:["cartea"],
 explain:"Feminine singular takes <b>-a</b>, replacing the final -e: <i>carte → cartea</i>. For nouns in -ă it also becomes -a: <i>casă → casa</i>.",
 audio:"o carte, cartea"},
{id:"d_def3", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:2, topic:"g_articles_def",
 prompt:"How do you say \"the coffee\"?",
 options:["cafeaua","cafeaa","la cafea"], correct:0,
 explain:"<b>Cafeaua</b>. When a feminine noun already ends in a vowel, the article contracts rather than simply appending: <i>cafea → cafeaua</i>, <i>stea → steaua</i>. There is never a separate word before the noun.",
 audio:"cafeaua", vocab:["w_cafea"]},
{id:"d_def4", lesson:null, level:"a1_1", skill:"grammar", type:"transform", diff:3, topic:"g_articles_def",
 prompt:"Make both nouns definite: <span class=\"ro\">Un copil citește o carte.</span>",
 answer:"Copilul citește cartea.", accept:["Copilul citește cartea."],
 explain:"<b>Copilul citește cartea</b> — 'The child is reading the book'. Both articles attach as endings, and the indefinite words <i>un</i> and <i>o</i> disappear entirely rather than being replaced.",
 audio:"Copilul citește cartea."},

/* ---- g_pronouns_subj (A1) ---- */
{id:"d_pron1", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:2, topic:"g_pronouns_subj",
 prompt:"Which sounds most natural in ordinary conversation?",
 options:["Eu sunt din Cluj și eu lucrez aici.","Sunt din Cluj și lucrez aici.","Eu sunt din Cluj și lucrez eu aici."], correct:1,
 explain:"The verb endings already identify the subject, so Romanians normally drop the pronoun. Repeating <b>eu</b> in every clause sounds laboured. Keep it only for contrast or emphasis: <i>Eu lucrez, dar tu dormi.</i>",
 audio:"Sunt din Cluj și lucrez aici."},
{id:"d_pron2", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:2, topic:"g_pronouns_subj",
 prompt:"When SHOULD you keep the subject pronoun?",
 options:["Always — it's more correct.","When contrasting with someone else.","Never — it's always wrong."], correct:1,
 explain:"Pronouns come back for contrast or emphasis: <i>Eu merg la munte, iar <b>ea</b> merge la mare.</i> Dropping them is the default, not a rule — both are grammatical, and the choice carries meaning.",
 audio:"Eu merg la munte, iar ea merge la mare."},
{id:"d_pron3", lesson:null, level:"a1_1", skill:"grammar", type:"fill", diff:2, topic:"g_pronouns_subj",
 prompt:"Formal 'you' (one person, to a stranger): ___", answer:"dumneavoastră", accept:["dumneavoastră","dumneavoastra","dvs"],
 explain:"<b>Dumneavoastră</b> is the formal 'you' for one person or several. Crucially it takes <b>voi</b>-form verbs even for one person: <i>Dumneavoastră sunteți…</i>, never <i>ești</i>.",
 audio:"dumneavoastră"},

/* ---- g_demonstratives (A1) ---- */
{id:"d_dem1", lesson:null, level:"a1_1", skill:"grammar", type:"fill", diff:2, topic:"g_demonstratives",
 prompt:"___ carte este interesantă. (this, feminine)", answer:"Această", accept:["această","aceasta"],
 explain:"<b>Această</b> is the feminine singular. The set is <i>acest</i> (m), <b>această</b> (f), <i>acești</i> (m pl), <i>aceste</i> (f pl). Placing it after the noun is equally natural: <b>cartea aceasta</b>.",
 audio:"Această carte este interesantă."},
{id:"d_dem2", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:2, topic:"g_demonstratives",
 prompt:"Which means \"those houses\"?",
 options:["acele case","acei case","această case"], correct:0,
 explain:"<b>Acele case</b>. <i>Case</i> is feminine plural, so the demonstrative is <b>acele</b>. <i>Acei</i> is masculine plural (<i>acei băieți</i>), and <i>această</i> is feminine singular.",
 audio:"acele case"},
{id:"d_dem3", lesson:null, level:"a1_1", skill:"grammar", type:"mcq", diff:3, topic:"g_demonstratives",
 prompt:"Both are correct — but which is more common in everyday speech?",
 options:["această rochie","rochia aceasta","amândouă sunt rare"], correct:1,
 explain:"Both are correct, but the post-noun form <b>rochia aceasta</b> dominates in speech; <i>această rochie</i> reads as slightly more formal or written. Note the noun takes the definite article when the demonstrative follows it.",
 audio:"rochia aceasta"},

/* ---- g_reflexive (A1) ---- */
{id:"d_ref1", lesson:null, level:"a1_1", skill:"grammar", type:"conjugate", diff:2, topic:"g_reflexive",
 prompt:"a se trezi — noi — prezent", answer:"ne trezim", accept:["ne trezim"],
 explain:"<b>noi ne trezim</b>. The reflexive pronoun changes with the person: mă, te, se, <b>ne</b>, vă, se. It always precedes the verb in the present tense.",
 audio:"noi ne trezim"},
{id:"d_ref2", lesson:null, level:"a1_1", skill:"grammar", type:"fill", diff:2, topic:"g_reflexive",
 prompt:"Copiii ___ spală pe mâini. (reflexive pronoun)", answer:"se", accept:["se"],
 explain:"Third person — singular or plural — uses <b>se</b>: <i>el se spală</i>, <i>ei se spală</i>. It is the only pronoun in the set that covers both numbers.",
 audio:"Copiii se spală pe mâini."},
{id:"d_ref3", lesson:null, level:"a1_1", skill:"grammar", type:"error_fix", diff:2, topic:"g_reflexive",
 prompt:"Something is missing.", given:"Îmbrac repede dimineața.", answer:"Mă îmbrac repede dimineața.",
 accept:["Mă îmbrac repede dimineața.","Ma imbrac repede dimineata."],
 explain:"<b>A se îmbrăca</b> is reflexive — the pronoun is part of the verb. Without <i>mă</i>, <i>îmbrac</i> means 'I dress (someone else)'. Many everyday Romanian verbs are reflexive where their English equivalents are not.",
 audio:"Mă îmbrac repede dimineața."},
{id:"d_ref4", lesson:null, level:"a1_2", skill:"grammar", type:"transform", diff:3, topic:"g_reflexive",
 prompt:"Put into the past: <span class=\"ro\">Mă trezesc devreme.</span>",
 answer:"M-am trezit devreme.", accept:["M-am trezit devreme."],
 explain:"In perfectul compus the reflexive pronoun contracts with the auxiliary: <i>mă + am → <b>m-am</b></i>. The full set is m-am, te-ai, s-a, ne-am, v-ați, s-au. The hyphenated form is obligatory.",
 audio:"M-am trezit devreme."},

/* ---- g_future (A1) ---- */
{id:"d_fut1", lesson:null, level:"a1_2", skill:"grammar", type:"mcq", diff:2, topic:"g_future",
 prompt:"Which is the everyday spoken future?",
 options:["Voi merge mâine.","O să merg mâine.","Aș merge mâine."], correct:1,
 explain:"<b>O să merg</b> dominates speech. <i>Voi merge</i> is the formal/written future — correct but noticeably bookish in conversation. <i>Aș merge</i> is the conditional, meaning 'I would go'.",
 audio:"O să merg mâine."},
{id:"d_fut2", lesson:null, level:"a1_2", skill:"grammar", type:"fill", diff:2, topic:"g_future",
 prompt:"Mâine ___ să plouă. (colloquial future)", answer:"o", accept:["o"],
 explain:"<b>O să plouă</b>. The colloquial future is invariable <b>o să</b> + subjunctive for every person — <i>o să merg, o să mergi, o să meargă</i>. Only the verb changes, which makes it far easier than the formal future.",
 audio:"Mâine o să plouă."},
{id:"d_fut3", lesson:null, level:"a1_2", skill:"grammar", type:"trans_en_ro", diff:3, topic:"g_future",
 prompt:"Translate: \"We'll finish the project tomorrow.\"",
 answer:"O să terminăm proiectul mâine.",
 accept:["O să terminăm proiectul mâine.","Vom termina proiectul mâine.","Terminăm proiectul mâine.","O sa terminam proiectul maine."],
 explain:"All three work: <b>o să terminăm</b> (colloquial), <b>vom termina</b> (formal), and even the plain present <b>terminăm</b> — with <i>mâine</i> already fixing the time, Romanian frequently uses the present for the near future.",
 audio:"O să terminăm proiectul mâine."},

/* ---- g_pe_accusative (A2) ---- */
{id:"d_pe1", lesson:null, level:"a2_1", skill:"grammar", type:"mcq", diff:3, topic:"g_pe_accusative",
 prompt:"Choose the correct sentence:",
 options:["Văd Maria în fiecare zi.","O văd pe Maria în fiecare zi.","Văd pe Maria în fiecare zi."], correct:1,
 explain:"A specific person as direct object needs <b>two</b> things: the marker <b>pe</b> before the name, and a doubling pronoun (<b>o</b> for a woman) before the verb. Option C has the <i>pe</i> but omits the pronoun — the commonest half-learned version.",
 audio:"O văd pe Maria în fiecare zi."},
{id:"d_pe2", lesson:null, level:"a2_1", skill:"grammar", type:"fill", diff:3, topic:"g_pe_accusative",
 prompt:"___ ajut pe Andrei cu tema. (doubling pronoun)", answer:"Îl", accept:["îl","il"],
 explain:"<b>Îl</b> — the masculine singular direct-object pronoun, doubling <i>pe Andrei</i>. The pair is obligatory: <b>Îl ajut pe Andrei</b>. For a woman it would be <i>O ajut pe Maria</i>.",
 audio:"Îl ajut pe Andrei cu tema."},
{id:"d_pe3", lesson:null, level:"a2_1", skill:"grammar", type:"mcq", diff:3, topic:"g_pe_accusative",
 prompt:"Which sentence should NOT use <span class=\"ro\">pe</span>?",
 options:["O văd ___ Maria.","Citesc ___ o carte.","Îl aștept ___ Radu."], correct:1,
 explain:"<b>Pe</b> marks specific <i>people</i> as direct objects. A book is neither a person nor specific here, so <i>Citesc o carte</i> takes no <b>pe</b> and no doubling pronoun. Overusing <i>pe</i> on objects is as wrong as omitting it on people.",
 audio:"Citesc o carte."},
{id:"d_pe4", lesson:null, level:"a2_1", skill:"grammar", type:"error_fix", diff:3, topic:"g_pe_accusative",
 prompt:"Fix the sentence.", given:"Aștept pe sora mea la gară.", answer:"O aștept pe sora mea la gară.",
 accept:["O aștept pe sora mea la gară.","O astept pe sora mea la gara."],
 explain:"The <b>pe</b> is right but the doubling pronoun is missing. <i>Sora mea</i> is feminine singular, so it needs <b>o</b>: <b>O aștept pe sora mea</b>. Romanian doubles the object here as a matter of grammar, not emphasis.",
 audio:"O aștept pe sora mea la gară."},

/* ---- g_object_pronouns (A2) ---- */
{id:"d_obj1", lesson:null, level:"a2_1", skill:"grammar", type:"mcq", diff:3, topic:"g_object_pronouns",
 prompt:"Replace the object: <span class=\"ro\">Văd filmul.</span> →",
 options:["Îl văd.","O văd.","Le văd."], correct:0,
 explain:"<b>Filmul</b> is masculine/neuter singular, so the pronoun is <b>îl</b>: <i>Îl văd</i>. Use <b>o</b> for feminine singular, <b>îi</b> for masculine plural and <b>le</b> for feminine plural. The pronoun sits before the verb.",
 audio:"Îl văd."},
{id:"d_obj2", lesson:null, level:"a2_1", skill:"grammar", type:"fill", diff:3, topic:"g_object_pronouns",
 prompt:"___ dau cartea Mariei. (indirect-object pronoun)", answer:"Îi", accept:["îi","ii"],
 explain:"<b>Îi</b> is the dative (indirect object) pronoun for 'to him/her', doubling <i>Mariei</i>. Romanian marks the recipient with a dative pronoun rather than a preposition — there is no equivalent of English 'to' here.",
 audio:"Îi dau cartea Mariei."},
{id:"d_obj3", lesson:null, level:"a2_1", skill:"grammar", type:"mcq", diff:4, topic:"g_object_pronouns",
 prompt:"\"Will you send it to me tomorrow?\" —",
 options:["Mi-l trimiți mâine?","Îl mi trimiți mâine?","Trimiți mi-l mâine?"], correct:0,
 explain:"When both pronouns appear, the order is <b>indirect + direct</b>, contracted: <i>mi + îl → <b>mi-l</b></i>. The whole cluster sits before the verb. This order is fixed and is the reverse of what English speakers expect.",
 audio:"Mi-l trimiți mâine?"},
{id:"d_obj4", lesson:null, level:"a2_1", skill:"grammar", type:"error_fix", diff:3, topic:"g_object_pronouns",
 prompt:"Rewrite the way a Romanian would say it.",
 given:"Dau cartea la Maria.", answer:"Îi dau cartea Mariei.",
 accept:["Îi dau cartea Mariei.","Îi dau Mariei cartea.","Ii dau cartea Mariei."],
 explain:"Romanian does not use <i>la</i> for a human recipient. The name takes the dative form <b>Mariei</b>, and the verb takes the doubling pronoun <b>îi</b>. Using <i>la + name</i> is a very common transfer error from English or Italian.",
 audio:"Îi dau cartea Mariei."},

/* ---- g_dative_genitive (A2) ---- */
{id:"d_dg1", lesson:null, level:"a2_2", skill:"grammar", type:"mcq", diff:3, topic:"g_dative_genitive",
 prompt:"How do you say \"Maria's house\"?",
 options:["casa Mariei","casa de Maria","casa lui Maria"], correct:0,
 explain:"<b>Casa Mariei</b>. Possession is shown by the genitive ending on the owner, not by a preposition — Romanian has no equivalent of English 'of' or French 'de' here. Feminine names take <b>-ei</b>; masculine names take <b>lui</b> before the name: <i>casa lui Andrei</i>.",
 audio:"casa Mariei"},
{id:"d_dg2", lesson:null, level:"a2_2", skill:"grammar", type:"fill", diff:3, topic:"g_dative_genitive",
 prompt:"Aceasta este casa ___ Andrei. (genitive marker)", answer:"lui", accept:["lui"],
 explain:"Masculine personal names take <b>lui</b> <i>before</i> the name rather than an ending: <b>casa lui Andrei</b>. Feminine names inflect instead: <i>casa Mariei</i>. This asymmetry catches learners out constantly.",
 audio:"Aceasta este casa lui Andrei."},
{id:"d_dg3", lesson:null, level:"a2_2", skill:"grammar", type:"transform", diff:4, topic:"g_dative_genitive",
 prompt:"Rewrite with the genitive: <span class=\"ro\">Casa are o grădină. Casa este a părinților.</span> → the house of my parents",
 answer:"casa părinților mei", accept:["casa părinților mei","casa parintilor mei"],
 explain:"<b>Casa părinților mei</b>. Plural genitive takes <b>-lor</b>: <i>părinți → părinților</i>. The possessive <i>mei</i> follows and agrees with <i>părinți</i> (masculine plural).",
 audio:"casa părinților mei"},
{id:"d_dg4", lesson:null, level:"a2_2", skill:"grammar", type:"mcq", diff:4, topic:"g_dative_genitive",
 prompt:"Which sentence uses the DATIVE (a recipient), not the genitive?",
 options:["Aceasta este mașina bunicii.","I-am scris o scrisoare bunicii.","Grădina bunicii este mare."], correct:1,
 explain:"The form <b>bunicii</b> is identical in both cases — what distinguishes them is the role. In B the grandmother <i>receives</i> the letter, marked by the dative pronoun <b>i-</b> on the verb. In A and C she simply <i>owns</i> something, which is genitive.",
 audio:"I-am scris o scrisoare bunicii."},

/* ---- g_imperfect (A2) ---- */
{id:"d_imp1", lesson:null, level:"a2_2", skill:"grammar", type:"mcq", diff:3, topic:"g_imperfect",
 prompt:"Choose the right past tense: <span class=\"ro\">Când eram mic, ___ la țară în fiecare vară.</span>",
 options:["am mers","mergeam","voi merge"], correct:1,
 explain:"<b>Mergeam</b> — the imperfect, because this is a repeated habit in the past ('used to go'). Perfectul compus <i>am mers</i> would describe one completed trip. The phrase <i>în fiecare vară</i> is the giveaway.",
 audio:"Când eram mic, mergeam la țară în fiecare vară."},
{id:"d_imp2", lesson:null, level:"a2_2", skill:"grammar", type:"mcq", diff:4, topic:"g_imperfect",
 prompt:"<span class=\"ro\">___ o carte când a sunat telefonul.</span>",
 options:["Am citit","Citeam","Voi citi"], correct:1,
 explain:"<b>Citeam</b>. The imperfect sets the ongoing background, and perfectul compus (<i>a sunat</i>) marks the event that interrupts it. This pairing — imperfect for the scene, compound past for the interruption — is the core of Romanian past-tense choice.",
 audio:"Citeam o carte când a sunat telefonul."},
{id:"d_imp3", lesson:null, level:"a2_2", skill:"grammar", type:"conjugate", diff:3, topic:"g_imperfect",
 prompt:"a fi — noi — imperfect", answer:"eram", accept:["eram"],
 explain:"<b>noi eram</b>. <i>A fi</i> is irregular in the imperfect: eram, erai, era, <b>eram</b>, erați, erau. Note that eu and noi share the same form, as they do in several tenses.",
 audio:"noi eram"},
{id:"d_imp4", lesson:null, level:"a2_2", skill:"grammar", type:"transform", diff:4, topic:"g_imperfect",
 prompt:"Change to the imperfect: <span class=\"ro\">Ploua toată ziua.</span> → Say it about a single completed day instead.",
 answer:"A plouat toată ziua.", accept:["A plouat toată ziua.","A plouat toata ziua."],
 explain:"<b>A plouat toată ziua</b> treats the day as one finished whole; <i>ploua</i> would describe rain as an ongoing background. Both are grammatical — the difference is how you frame the event, which is exactly what learners must internalise.",
 audio:"A plouat toată ziua."},

/* ---- g_imperative (A2) ---- */
{id:"d_imv1", lesson:null, level:"a2_2", skill:"grammar", type:"mcq", diff:3, topic:"g_imperative",
 prompt:"Tell a friend not to forget their phone:",
 options:["Nu uita telefonul!","Nu uiți telefonul!","Nu uitat telefonul!"], correct:0,
 explain:"Negative commands use <b>nu</b> + the infinitive form: <b>Nu uita!</b> This is a different pattern from the affirmative (<i>Uită!</i>), and using the present-tense form <i>nu uiți</i> is the standard learner error.",
 audio:"Nu uita telefonul!"},
{id:"d_imv2", lesson:null, level:"a2_2", skill:"grammar", type:"fill", diff:3, topic:"g_imperative",
 prompt:"Polite plural imperative of <b>a asculta</b>: ___ cu atenție!", answer:"Ascultați", accept:["ascultați","ascultati"],
 explain:"<b>Ascultați!</b> The voi-form imperative is identical to the voi present tense, which makes it the easiest form to produce — and it doubles as the polite singular with <i>dumneavoastră</i>.",
 audio:"Ascultați cu atenție!"},
{id:"d_imv3", lesson:null, level:"a2_2", skill:"grammar", type:"mcq", diff:4, topic:"g_imperative",
 prompt:"Which is the correct reflexive imperative for \"wake up!\" (to a friend)?",
 options:["Te trezește!","Trezește-te!","Se trezește!"], correct:1,
 explain:"In an affirmative command the pronoun moves <b>after</b> the verb and hyphenates: <b>Trezește-te!</b> Compare the negative, where it goes back in front: <i>Nu te trezi!</i> This flip is unique to the imperative.",
 audio:"Trezește-te!"},

/* ---- g_comparison (A2) ---- */
{id:"d_cmp1", lesson:null, level:"a2_2", skill:"grammar", type:"fill", diff:3, topic:"g_comparison",
 prompt:"Bucureștiul este ___ mare oraș din România. (the biggest)", answer:"cel mai", accept:["cel mai"],
 explain:"<b>Cel mai mare</b>. The superlative marker agrees with the noun: cel (m), cea (f), cei (m pl), cele (f pl). Note <b>din</b> for 'in/of' a group — not <i>în</i>.",
 audio:"Bucureștiul este cel mai mare oraș din România."},
{id:"d_cmp2", lesson:null, level:"a2_2", skill:"grammar", type:"mcq", diff:3, topic:"g_comparison",
 prompt:"\"as good as\" —",
 options:["mai bun ca","la fel de bun ca","cel mai bun decât"], correct:1,
 explain:"Equality uses <b>la fel de … ca</b>. <i>Mai … decât</i> is for inequality, and <i>cel mai</i> is the superlative. Mixing <i>ca</i> and <i>decât</i> is the usual slip: <b>decât</b> after a comparative, <b>ca</b> after <i>la fel de</i>.",
 audio:"la fel de bun ca"},
{id:"d_cmp3", lesson:null, level:"a2_2", skill:"grammar", type:"trans_en_ro", diff:4, topic:"g_comparison",
 prompt:"Translate: \"She is less tired than yesterday.\"",
 answer:"Ea este mai puțin obosită decât ieri.",
 accept:["Ea este mai puțin obosită decât ieri.","Este mai puțin obosită decât ieri.","E mai puțin obosită decât ieri."],
 explain:"'Less' is <b>mai puțin</b>, and 'than' remains <b>decât</b>. The adjective agrees with the subject: <b>obosită</b> for a woman. Dropping the subject pronoun is natural here.",
 audio:"Ea este mai puțin obosită decât ieri."},

/* ---- g_word_order (A2) ---- */
{id:"d_wo1", lesson:null, level:"a2_2", skill:"grammar", type:"mcq", diff:3, topic:"g_word_order",
 prompt:"Which word order emphasizes WHAT she is reading, rather than who is reading?",
 options:["Maria citește o carte.","O carte citește Maria.","Citește Maria o carte."], correct:1,
 explain:"Fronting the object — <b>O carte citește Maria</b> — puts the emphasis on the book, roughly 'it's a book Maria's reading, not a newspaper'. Romanian uses word order for emphasis far more freely than English, which would need stress or a cleft sentence.",
 audio:"O carte citește Maria."},
{id:"d_wo2", lesson:null, level:"a2_2", skill:"grammar", type:"build", diff:3, topic:"g_word_order",
 prompt:"Arrange into the most natural sentence.",
 words:["plecăm","mâine","la","mare"], answer:"Mâine plecăm la mare.",
 accept:["Mâine plecăm la mare.","Plecăm mâine la mare."],
 explain:"Both orders are correct, but fronting the time expression — <b>Mâine plecăm la mare</b> — is very common and sets the scene before the action. Note that the object pronouns, if any, would still cling to the verb regardless of where the adverb goes.",
 audio:"Mâine plecăm la mare."},

/* ---------- A2.1 : perfectul compus ---------- */
{id:"e401", lesson:"l_a2u1l1", skill:"grammar", type:"trans_en_ro", diff:3, topic:"g_perfect_compus",
 prompt:"Translate into Romanian: \"Yesterday I went to the store and bought bread.\"",
 answer:"Ieri am mers la magazin și am cumpărat pâine.",
 accept:["Ieri am mers la magazin și am cumpărat pâine.","Ieri am fost la magazin și am cumpărat pâine.","Ieri m-am dus la magazin și am cumpărat pâine."],
 explain:"Both verbs take <b>perfectul compus</b>, the normal past for completed events in conversational Romanian: <i>a merge → am mers</i>, <i>a cumpăra → am cumpărat</i>. Because <b>ieri</b> already fixes the time, no extra tense marking is needed. <i>am fost</i> and <i>m-am dus</i> are equally natural alternatives to <i>am mers</i>.",
 audio:"Ieri am mers la magazin și am cumpărat pâine.", vocab:["w_avizita"]},
{id:"e402", lesson:"l_a2u1l1", skill:"grammar", type:"error_fix", diff:3, topic:"g_perfect_compus",
 prompt:"Correct the auxiliary in this sentence.",
 given:"Eu sunt mers la magazin.", answer:"Eu am mers la magazin.",
 accept:["Eu am mers la magazin.","Am mers la magazin."],
 explain:"Romanian's perfectul compus always uses forms of <b>a avea</b> as the auxiliary — <i>am, ai, a, am, ați, au</i> — never <i>a fi</i>. This trips up learners of French, Italian or German, where motion verbs take 'to be'. In Romanian there is no such split: <b>am mers, am venit, am plecat</b>.",
 audio:"Eu am mers la magazin."},
{id:"e403", lesson:"l_a2u1l1", skill:"grammar", type:"fill", diff:3, topic:"g_perfect_compus",
 prompt:"Sâmbătă noi ___ ___ la munte. (a merge, perfectul compus)",
 answer:"am mers", accept:["am mers"],
 explain:"For <b>noi</b> the auxiliary is <b>am</b> — identical to the <i>eu</i> form. The participle <b>mers</b> never changes for gender or number in this construction. So <i>eu am mers</i> and <i>noi am mers</i> differ only by the pronoun, which is why the pronoun is often kept here for clarity.",
 audio:"Sâmbătă noi am mers la munte."},
{id:"e404", lesson:"l_a2u1l1", skill:"grammar", type:"transform", diff:3, topic:"g_perfect_compus",
 prompt:"Rewrite in perfectul compus: <span class=\"ro\">Mă întâlnesc cu prietenii.</span>",
 answer:"M-am întâlnit cu prietenii.", accept:["M-am întâlnit cu prietenii."],
 explain:"Reflexive verbs contract the pronoun with the auxiliary: <i>mă + am → <b>m-am</b></i>. The full set is <b>m-am, te-ai, s-a, ne-am, v-ați, s-au</b> + participle. Writing *<i>mă am întâlnit</i> is never correct — the contraction is obligatory.",
 audio:"M-am întâlnit cu prietenii.", vocab:["w_aintalni"]},
{id:"e405", lesson:"l_a2u1l1", skill:"listening", type:"transcribe", diff:3, topic:"g_perfect_compus",
 prompt:"Listen and type the sentence.",
 audio:"Am vizitat un muzeu foarte interesant.", answer:"Am vizitat un muzeu foarte interesant.",
 accept:["Am vizitat un muzeu foarte interesant.","Eu am vizitat un muzeu foarte interesant."],
 explain:"<i>a vizita</i> is a regular -a verb, so its participle ends in <b>-at</b>: <b>vizitat</b>. <i>Muzeu</i> is neuter — <i>un muzeu, două muzee</i>.",
 vocab:["w_avizita"]},
{id:"e406", lesson:"l_a2u1l1", skill:"reading", type:"reading_q", diff:3, topic:"g_perfect_compus", readingId:"r_a2u1",
 prompt:"Cum pare să se simtă Maria despre ziua de sâmbătă, în ansamblu?",
 options:["Dezamăgită, pentru că drumeția a fost prea lungă.","Mulțumită, deși a obosit.","Supărată, pentru că vremea a fost rea."], correct:1,
 explain:"Nicăieri în text nu apare cuvântul <i>mulțumită</i> — trebuie să combini două informații: <b>a fost obositor</b> (she got tired) și <b>peisajul a fost superb</b>, plus urarea de la final, <i>Sper că și tu ai avut un weekend plăcut</i>. Conectorul <b>dar</b> din <i>A fost obositor, dar peisajul a fost superb</i> este cheia: semnalează că partea pozitivă cântărește mai mult. Celelalte două variante conțin cuvinte din text (<i>drumeția</i>, <i>lungă</i>) fără să fie susținute de el."},
{id:"e406b", lesson:"l_a2u1l1", skill:"reading", type:"reading_q", diff:3, topic:"g_perfect_compus", readingId:"r_a2u1",
 prompt:"Prin ce a fost duminica diferită de sâmbătă?",
 options:["A rămas acasă și s-a ocupat de treburi, în loc să călătorească.","A mers din nou la munte, dar cu alți prieteni.","A lucrat toată ziua la birou."], correct:0,
 explain:"Trebuie să compari cele două paragrafe: sâmbătă înseamnă deplasare și drumeție, duminică înseamnă <i>am dormit până târziu, am făcut curățenie, am pregătit mâncare</i> — adică activități casnice. Textul nu spune niciodată explicit „a fost diferit”; contrastul îl construiești tu din cele două liste de acțiuni."},

/* ---------- A2.1 U2 : future plans, a trebui, a ști vs a cunoaște ---------- */
{id:"a201", lesson:"l_a2u2l1", skill:"grammar", type:"mcq", diff:3, topic:"g_future",
 prompt:"Choose what a Romanian would actually say:",
 options:["Vara aceasta voi merge în Grecia.","Vara aceasta o să merg în Grecia.","Vara aceasta merg să Grecia."], correct:1,
