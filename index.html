 {id:"r_u2", title:"Familia lui Andrei", titleEn:"Andrei's family", level:"a1_1", format:"short story", wordCount:58,
  ro:"Andrei are o familie mare. Tatăl lui, Ion, este inginer, iar mama lui, Maria, este medic. Andrei are doi frați: Radu, care are treizeci de ani, și Bianca, care are douăzeci și doi de ani. Bunicii lor locuiesc la țară și au o casă frumoasă cu grădină. În fiecare vară, toată familia merge la bunici.",
  en:"Andrei has a big family. His father, Ion, is an engineer, and his mother, Maria, is a doctor. Andrei has two siblings: Radu, who is thirty, and Bianca, who is twenty-two. Their grandparents live in the countryside and have a beautiful house with a garden. Every summer, the whole family goes to their grandparents'.",
  glossary:{"inginer":"engineer","medic":"doctor","grădină":"garden","vară":"summer"}},
 {id:"r_u3", title:"Programul Cristinei", titleEn:"Cristina's schedule", level:"a1_1", format:"schedule/diary", wordCount:64,
  ro:"Cristina se trezește în fiecare zi la ora șapte. Dimineața bea o cafea și mănâncă un mic dejun rapid. La ora opt și jumătate pleacă la serviciu cu metroul. Lucrează de luni până vineri, între orele nouă și șapte. Seara merge la sală sau se întâlnește cu prietenii. Duminica nu lucrează — de obicei citește sau gătește pentru toată săptămâna.",
  en:"Cristina wakes up every day at seven o'clock. In the morning she drinks a coffee and eats a quick breakfast. At half past eight she leaves for work by subway. She works Monday to Friday, between nine and seven. In the evening she goes to the gym or meets up with friends. On Sundays she doesn't work — she usually reads or cooks for the whole week.",
  glossary:{"mic dejun":"breakfast","metroul":"the subway","gătește":"cooks"}},
 {id:"r_u4", title:"Meniul zilei", titleEn:"Menu of the day", level:"a1_1", format:"menu", wordCount:72,
  ro:"RESTAURANT LA BUNICA — MENIUL ZILEI\n\nCiorbă de legume — 18 lei\nSupă de pui — 20 lei\n\nPește cu cartofi — 45 lei\nPui cu legume — 38 lei\nSarmale cu mămăligă — 42 lei\n\nSalată verde — 15 lei\nBrânză de oaie — 22 lei\n\nApă plată — 8 lei\nCafea — 10 lei\nBere — 14 lei\nVin roșu — 18 lei",
  en:"RESTAURANT AT GRANDMA'S — MENU OF THE DAY. Vegetable sour soup 18 lei. Chicken soup 20 lei. Fish with potatoes 45 lei. Chicken with vegetables 38 lei. Sarmale with polenta 42 lei. Green salad 15 lei. Sheep's cheese 22 lei. Still water 8 lei. Coffee 10 lei. Beer 14 lei. Red wine 18 lei.",
  glossary:{"ciorbă":"sour soup","pui":"chicken","cartofi":"potatoes","sarmale":"cabbage rolls (national dish)","mămăligă":"polenta","roșu":"red"}},
 {id:"r_u5", title:"Un mesaj despre cumpărături", titleEn:"A message about shopping", level:"a1_1", format:"text message", wordCount:66,
  ro:"Bună, Ioana! Sunt în oraș acum. Am fost la magazinul din centru și am găsit o rochie foarte frumoasă. Costă o sută cincizeci de lei — nu este ieftină, dar îmi place mult. Am cumpărat și pantofi negri, la reducere. Tu ce faci? Vrei să bem o cafea la ora cinci?",
  en:"Hi, Ioana! I'm in town now. I went to the shop in the center and found a very beautiful dress. It costs one hundred and fifty lei — it isn't cheap, but I like it a lot. I also bought black shoes, on sale. What are you doing? Do you want to have a coffee at five?",
  glossary:{"găsit":"found","reducere":"discount, sale","frumoasă":"beautiful"}},
 {id:"r_u6", title:"Cum ajungi la muzeu", titleEn:"How to get to the museum", level:"a1_1", format:"directions / notice", wordCount:78,
  ro:"Muzeul Satului este în nordul orașului, aproape de parcul Herăstrău. De la gară puteți lua metroul până la stația Aviatorilor. Apoi mergeți drept înainte cinci minute pe jos. Muzeul este la dreapta, vizavi de un restaurant mare. Este deschis de marți până duminică, între orele zece și optsprezece. Luni este închis. Un bilet costă douăzeci și cinci de lei.",
  en:"The Village Museum is in the north of the city, near Herăstrău park. From the station you can take the subway to Aviatorilor station. Then walk straight ahead for five minutes. The museum is on the right, opposite a large restaurant. It's open Tuesday to Sunday, between ten and eighteen. It's closed on Mondays. A ticket costs twenty-five lei.",
  glossary:{"nordul":"the north","stația":"the stop/station","deschis":"open","închis":"closed","marți":"Tuesday"}},
 {id:"r_u7", title:"Anunț imobiliar", titleEn:"Property listing", level:"a1_1", format:"advertisement", wordCount:76,
  ro:"DE ÎNCHIRIAT — apartament cu două camere, etajul patru, în centru.\n\nApartamentul are o sufragerie mare cu balcon, un dormitor, o bucătărie mobilată și o baie. Ferestrele dau spre un parc liniștit. Există frigider, mașină de spălat și dulapuri în fiecare cameră.\n\nChiria este de patru sute cincizeci de euro pe lună. Blocul are lift. Nu se acceptă animale de companie.",
  en:"FOR RENT — two-room flat, fourth floor, in the center. The flat has a large living room with a balcony, a bedroom, a furnished kitchen and a bathroom. The windows look onto a quiet park. There is a fridge, a washing machine and wardrobes in every room. The rent is four hundred and fifty euros a month. The building has a lift. No pets accepted.",
  glossary:{"De închiriat":"for rent","mobilată":"furnished","liniștit":"quiet","mașină de spălat":"washing machine","lift":"lift, elevator","animale de companie":"pets"}},
 {id:"r_u8", title:"Prognoza meteo", titleEn:"Weather forecast", level:"a1_1", format:"forecast", wordCount:68,
  ro:"PROGNOZA PENTRU SĂPTĂMÂNA VIITOARE\n\nLuni și marți va fi frumos, cu soare și douăzeci și două de grade. Miercuri se răcește: plouă toată ziua și bate vântul.\n\nJoi și vineri vremea se îmbunătățește, dar rămâne rece — doar treisprezece grade dimineața. La munte va ninge din nou.\n\nÎn weekend așteptăm din nou soare.",
  en:"FORECAST FOR NEXT WEEK. Monday and Tuesday will be nice, sunny and twenty-two degrees. Wednesday turns colder: it will rain all day and be windy. Thursday and Friday the weather improves, but stays cold — only thirteen degrees in the morning. In the mountains it will snow again. At the weekend we expect sun once more.",
  glossary:{"prognoza":"the forecast","se răcește":"it turns colder","se îmbunătățește":"improves","rămâne":"remains","din nou":"again","așteptăm":"we expect"}},
 {id:"r_a12u1", title:"Profilul unui coleg", titleEn:"A colleague's profile", level:"a1_2", format:"social post", wordCount:88,
  ro:"Mă numesc Victor și am treizeci și doi de ani. Sunt inginer și lucrez la o firmă de construcții din Timișoara. Programul meu începe la opt dimineața și se termină pe la cinci. De obicei merg la birou cu bicicleta, dar iarna iau tramvaiul. Nu lucrez niciodată duminica. În timpul liber alerg, citesc și gătesc pentru prieteni. Uneori merg la un meci de fotbal cu colegii mei.",
  en:"My name is Victor and I'm thirty-two years old. I'm an engineer and I work at a construction firm in Timișoara. My working day starts at eight in the morning and ends around five. I usually go to the office by bike, but in winter I take the tram. I never work on Sundays. In my free time I run, read and cook for friends. Sometimes I go to a football match with my colleagues.",
  glossary:{"construcții":"construction","iarna":"in winter","meci":"match, game","bicicleta":"the bicycle"}},
 {id:"r_a12u3", title:"Mesaje despre o întâlnire", titleEn:"Messages about a meeting", level:"a1_2", format:"text messages", wordCount:74,
  ro:"— Bună, Ana! Ești liberă joi seara?\n— Bună! Joi sunt ocupată, am o programare la medic. Vineri poți?\n— Vineri e perfect. La ce oră?\n— Pe la șapte? Putem merge la restaurantul nou din centru.\n— Sună bine. Ne vedem vineri, pe 14 martie, la șapte.\n— Perfect! Te sun dacă întârzii.",
  en:"— Hi, Ana! Are you free on Thursday evening? — Hi! On Thursday I'm busy, I have a doctor's appointment. Can you do Friday? — Friday is perfect. What time? — Around seven? We could go to the new restaurant in the center. — Sounds good. See you Friday, the 14th of March, at seven. — Perfect! I'll call you if I'm running late.",
  glossary:{"întârzii":"I'm late / I run late","Ne vedem":"See you","poți":"can you","Sună bine":"Sounds good"}},
 {id:"r_a12u5", title:"Anunț în gară", titleEn:"Station announcement", level:"a1_2", format:"announcement", wordCount:70,
  ro:"Atenție, călători! Trenul InterRegio 1682 cu plecare spre Brașov, programat la ora nouă și zece minute, are o întârziere de aproximativ douăzeci de minute. Trenul va sosi la peronul patru. Vă rugăm să aveți grijă la urcarea în tren. Vă mulțumim pentru înțelegere și vă dorim călătorie plăcută!",

 {id:"r_a12u7", title:"Două oferte", titleEn:"Two offers", level:"a1_2", format:"advertisement", wordCount:82,
  ro:"MAGAZINUL CENTRAL — OFERTE DE TOAMNĂ\n\nGeacă de iarnă, model clasic: 320 lei. Culori: negru, gri, albastru.\nGeacă sport, model nou: 450 lei. Mai ușoară și mai caldă decât modelul clasic.\n\nPantofi de piele: 280 lei. Cea mai bună calitate din magazin.\nPantofi sport: 190 lei. Mai ieftini, dar mai puțin rezistenți.\n\nToate produsele au reducere de 10% până duminică.",

 {id:"r_civ_imn", title:"Deșteaptă-te, române! — strofele oficiale", titleEn:"The official stanzas of the anthem", level:"civic", format:"anthem", wordCount:132,
  ro:"Deșteaptă-te, române, din somnul cel de moarte,\nÎn care te-adânciră barbarii de tirani!\nAcum ori niciodată, croiește-ți altă soartă,\nLa care să se-nchine și cruzii tăi dușmani!\n\nAcum ori niciodată să dăm dovezi la lume\nCă-n aste mâni mai curge un sânge de roman,\nȘi că-n a noastre piepturi păstrăm cu fală-un nume\nTriumfător în lupte, un nume de Traian!\n\nPriviți, mărețe umbre, Mihai, Ștefan, Corvine,\nRomâna națiune, ai voștri strănepoți,\nCu brațele armate, cu focul vostru-n vine,\n„Viață-n libertate ori moarte!” strigă toți.\n\nPreoți, cu crucea-n frunte căci oastea e creștină,\nDeviza-i libertate și scopul ei preasfânt.\nMurim mai bine-n luptă, cu glorie deplină,\nDecât să fim sclavi iarăși în vechiul nost' pământ!",
  en:"Awaken thee, Romanian, from the sleep of death into which you have been sunk by barbaric tyrants! Now or never, forge yourself a new fate, before which even your cruel enemies will bow. Now or never let us give proof to the world that in these veins still flows Roman blood, and that in our breasts we proudly bear a name triumphant in battle, the name of Trajan. Behold, great shades — Mihai, Ștefan, Corvinus — the Romanian nation, your great-grandchildren, with weapons in their arms and your fire in their veins, all cry 'Life in freedom, or death!' Priests, lead with the cross before you, for our army is Christian; its motto is liberty and its aim most holy. Better to die in battle in full glory than to be slaves once more upon our ancient land.",
  /* Verse has to be glossed line for line: a prose paragraph makes the reader
     hunt for which clause belongs to which line, and the anthem's word order is
     poetic enough that the mapping is not guessable. Kept close to the Romanian
     rather than polished into English verse. */
  lineEn:["Awaken thee, Romanian, from the sleep of death",
          "into which barbaric tyrants have sunk you!",

          "to which even your cruel enemies will bow!",
          "",
          "Now or never let us give the world proof",
          "that in these hands there still runs Roman blood,",
          "and that in our breasts we proudly bear a name",
          "triumphant in battle — the name of Trajan!",
          "",
          "Behold, great shades — Mihai, Ștefan, Corvinus —",

          "with weapons in their arms, with your fire in their veins,",

          "than be slaves once more upon our ancient land!"],
  glossary:{"Deșteaptă-te":"awaken (yourself)","somnul":"the sleep","moarte":"death","tirani":"tyrants","soartă":"fate, destiny","dușmani":"enemies","dovezi":"proofs","sânge":"blood","piepturi":"breasts, chests","umbre":"shades, shadows","strănepoți":"great-grandchildren","libertate":"freedom","oastea":"the army","glorie":"glory","sclavi":"slaves","pământ":"land, earth"}},
 {id:"r_civ_stat", title:"Statul român pe scurt", titleEn:"The Romanian state in brief", level:"civic", format:"reference", wordCount:118,
  ro:"România este stat național, suveran și independent, unitar și indivizibil. Forma de guvernământ este republica. Capitala este București. Limba oficială este limba română. Drapelul are trei culori așezate vertical: albastru, galben și roșu. Ziua națională este 1 decembrie. Imnul național este „Deșteaptă-te, române!”.\n\nParlamentul are două camere: Camera Deputaților și Senatul. Președintele este ales prin vot direct pentru un mandat de cinci ani și poate avea cel mult două mandate. Guvernul este condus de prim-ministru. Constituția actuală a fost adoptată în 1991 și revizuită în 2003.",
  en:"Romania is a national, sovereign and independent, unitary and indivisible state. The form of government is a republic. The capital is Bucharest. The official language is Romanian. The flag has three colors arranged vertically: blue, yellow and red. The national day is 1 December. The national anthem is 'Deșteaptă-te, române!'. Parliament has two chambers: the Chamber of Deputies and the Senate. The President is elected by direct vote for a five-year term and may serve at most two terms. The Government is led by the Prime Minister. The current Constitution was adopted in 1991 and revised in 2003.",
  glossary:{"suveran":"sovereign","indivizibil":"indivisible","guvernământ":"government (form of)","așezate":"arranged, placed","mandat":"term of office","revizuită":"revised","Deputaților":"of the Deputies"}},
 {id:"r_civ_geo", title:"Geografia României", titleEn:"Geography of Romania", level:"civic", format:"reference", wordCount:112,
  ro:"România se află în sud-estul Europei. Are graniță cu cinci țări: Ungaria la vest, Serbia la sud-vest, Bulgaria la sud, Ucraina la nord și est, și Republica Moldova la est. La sud-est se află Marea Neagră.\n\nMunții Carpați traversează țara. Cel mai înalt vârf este Vârful Moldoveanu, de 2544 de metri. Dunărea este cel mai important fluviu și se varsă în Marea Neagră prin Delta Dunării.\n\nRegiunile istorice sunt Transilvania, Muntenia, Moldova, Oltenia, Banat, Crișana, Maramureș și Dobrogea. Orașe mari sunt București, Cluj-Napoca, Timișoara, Iași, Constanța și Brașov.",
  en:"Romania is located in south-eastern Europe. It borders five countries: Hungary to the west, Serbia to the south-west, Bulgaria to the south, Ukraine to the north and east, and the Republic of Moldova to the east. To the south-east lies the Black Sea. The Carpathian Mountains cross the country. The highest peak is Moldoveanu Peak, at 2,544 metres. The Danube is the most important river and flows into the Black Sea through the Danube Delta. The historical regions are Transylvania, Muntenia, Moldova, Oltenia, Banat, Crișana, Maramureș and Dobrogea. Major cities are Bucharest, Cluj-Napoca, Timișoara, Iași, Constanța and Brașov.",
  glossary:{"se află":"is located","vest":"west","sud":"south","nord":"north","est":"east","vârf":"peak","se varsă":"flows into, empties","Deltă":"delta","regiunile":"the regions"}},
 {id:"r_civ_ist", title:"Repere din istoria României", titleEn:"Key points in Romanian history", level:"civic", format:"reference", wordCount:126,
  ro:"În 1859, Alexandru Ioan Cuza a fost ales domn atât în Moldova, cât și în Țara Românească. Acest moment se numește Unirea Principatelor Române.\n\nÎn 1877–1878, România și-a câștigat independența față de Imperiul Otoman.\n\nLa 1 decembrie 1918, la Alba Iulia, Transilvania s-a unit cu România. Ziua aceasta este acum Ziua Națională.\n\nÎn decembrie 1989, Revoluția a pus capăt regimului comunist.\n\nRomânia a intrat în NATO în 2004 și în Uniunea Europeană la 1 ianuarie 2007.",
  en:"In 1859, Alexandru Ioan Cuza was elected ruler of both Moldavia and Wallachia. This moment is called the Union of the Romanian Principalities. In 1877–1878, Romania won its independence from the Ottoman Empire. On 1 December 1918, at Alba Iulia, Transylvania united with Romania. That day is now the National Day. In December 1989, the Revolution ended the communist regime. Romania joined NATO in 2004 and the European Union on 1 January 2007.",
  glossary:{"domn":"ruler, prince","Principatelor":"of the Principalities","și-a câștigat":"won (for itself)","s-a unit":"united","a pus capăt":"put an end to","regimului":"of the regime","a intrat":"entered, joined"}},
 {id:"r_a2u1", title:"Un e-mail de la Maria", titleEn:"An email from Maria", level:"a2_1", format:"email", wordCount:120,
  ro:"Salut Sorin,\n\nÎți scriu ca să-ți povestesc despre weekendul trecut. Sâmbătă dimineața am plecat la munte cu Ioana și cu Vlad. Am ajuns pe la ora zece și am făcut o drumeție de trei ore. A fost obositor, dar peisajul a fost superb!\n\nLa prânz am mâncat la o cabană — am comandat ciorbă și mămăligă cu brânză. Seara ne-am întors în oraș și am vizionat un film.\n\nDuminică am dormit până târziu, apoi am făcut curățenie și am pregătit mâncare pentru săptămâna asta. Sper că și tu ai avut un weekend plăcut!\n\nCu drag,\nMaria",
  en:"Hi Sorin, I'm writing to tell you about last weekend. On Saturday morning we left for the mountains with Ioana and Vlad. We arrived around ten and went on a three-hour hike. It was tiring, but the scenery was superb! At noon we ate at a mountain cabin — we ordered ciorbă (sour soup) and mămăligă (polenta) with cheese. In the evening we went back to the city and watched a movie. On Sunday I slept in, then cleaned and prepared food for this week. I hope you also had a nice weekend! Love, Maria",
  glossary:{"drumeție":"hike","cabană":"mountain cabin/lodge","ciorbă":"sour soup","mămăligă":"polenta","curățenie":"cleaning"}},
 {id:"r_a2u3", title:"Confirmarea rezervării", titleEn:"Booking confirmation", level:"a2_1", format:"email", wordCount:118,
  ro:"Stimate domnule Ionescu,\n\nVă confirmăm rezervarea dumneavoastră la Hotel Central, pentru perioada 12–15 iulie.\n\nAți rezervat o cameră dublă la etajul doi, cu mic dejun inclus. Cazarea începe de la ora paisprezece, iar camera trebuie eliberată până la ora douăsprezece în ziua plecării.\n\nPrețul total este de opt sute cincizeci de lei. Plata se poate face la recepție, cu cardul sau în numerar.\n\nDacă doriți să anulați rezervarea, vă rugăm să ne anunțați cu cel puțin patruzeci și opt de ore înainte.\n\nCu stimă,\nRecepția Hotel Central",
  en:"Dear Mr Ionescu, We confirm your reservation at Hotel Central for the period 12–15 July. You have booked a double room on the second floor, with breakfast included. Check-in begins at two p.m., and the room must be vacated by twelve o'clock on the day of departure. The total price is eight hundred and fifty lei. Payment can be made at reception, by card or in cash. If you wish to cancel the reservation, please notify us at least forty-eight hours in advance. Kind regards, Hotel Central Reception",
  glossary:{"Stimate":"Dear (formal, to a man)","confirmăm":"we confirm","cazarea":"the check-in / accommodation","eliberată":"vacated","numerar":"cash","anulați":"you cancel","anunțați":"you notify","Cu stimă":"Kind regards"}},
 {id:"r_a2u5", title:"Anunț: apartament de închiriat", titleEn:"Advert: flat to rent", level:"a2_1", format:"advertisement", wordCount:112,
  ro:"Închiriez apartament cu două camere, renovat anul trecut, în zona Aviatorilor.\n\nApartamentul are living, dormitor, bucătărie utilată și baie. Este mobilat complet și are aer condiționat. Etajul trei din opt, bloc cu lift.\n\nChirie: 500 de euro pe lună. Întreținerea nu este inclusă și costă în medie 150 de lei iarna. Garanție: o chirie, care se returnează la sfârșitul contractului.\n\nContract minimum un an. Nu se acceptă animale. Preferabil pentru o persoană sau un cuplu fără copii.\n\nRelații la telefon după ora 17.",
  en:"I am renting a two-room flat, renovated last year, in the Aviatorilor area. The flat has a living room, bedroom, fitted kitchen and bathroom. It is fully furnished and has air conditioning. Third floor of eight, building with a lift. Rent: 500 euros a month. Maintenance is not included and costs on average 150 lei in winter. Deposit: one month's rent, returned at the end of the contract. Minimum one-year contract. No pets. Preferably for one person or a couple without children. Information by phone after 5 p.m.",
  glossary:{"Închiriez":"I am renting out","utilată":"fitted, equipped","mobilat":"furnished","lift":"lift, elevator","în medie":"on average","se returnează":"is returned","Relații":"information, enquiries"}},
 {id:"r_b1u1", title:"Munca la distanță — un articol scurt", titleEn:"Remote work — a short article", level:"b1_1", format:"article", wordCount:150,
  ro:"În ultimii ani, tot mai mulți români aleg să lucreze de acasă, cel puțin câteva zile pe săptămână. Susținătorii muncii la distanță spun că aceasta oferă mai multă flexibilitate și economisește timpul pierdut în trafic. Pe de altă parte, unii angajatori cred că este important ca echipele să se întâlnească față în față, pentru a comunica mai eficient și a construi relații mai puternice.\n\nMulți specialiști recomandă un model hibrid: câteva zile la birou, câteva zile acasă. Astfel, angajații pot beneficia de liniștea de acasă atunci când au nevoie de concentrare, dar păstrează și legătura cu colegii. Deși nu există o soluție perfectă pentru toată lumea, tot mai multe companii din România adoptă acest tip de flexibilitate.",
  en:"In recent years, more and more Romanians are choosing to work from home, at least a few days a week. Supporters of remote work say it offers more flexibility and saves time lost in traffic. On the other hand, some employers believe it's important for teams to meet face to face, in order to communicate more effectively and build stronger relationships. Many specialists recommend a hybrid model: a few days at the office, a few days at home. This way, employees can benefit from the quiet of home when they need to focus, while still keeping in touch with colleagues. Although there's no perfect solution for everyone, more and more companies in Romania are adopting this kind of flexibility.",
  glossary:{"susținătorii":"the supporters","angajatori":"employers","eficient":"efficient(ly)","hibrid":"hybrid","concentrare":"focus/concentration"}},

 {id:"r_a2u6", title:"Anunț de angajare", titleEn:"A job advert", level:"a2_1", format:"advert", wordCount:126,
  ro:"FIRMA MEDIAPLUS ANGAJEAZĂ — asistent marketing\n\nCăutăm un coleg sau o colegă pentru echipa noastră din Timișoara.\n\nCerințe: studii superioare terminate, minimum doi ani de experiență într-un post similar, engleză la nivel avansat. Este un avantaj dacă știți să lucrați cu programe de grafică.\n\nOferim: salariu între șase și opt mii de lei net, program flexibil, două zile de lucru de acasă pe săptămână și douăzeci și cinci de zile de concediu pe an.\n\nTrimiteți CV-ul la adresa de mai jos până pe cincisprezece martie. Vom contacta numai candidații selectați pentru interviu.",
  en:"MEDIAPLUS IS HIRING — marketing assistant. We are looking for a colleague for our team in Timișoara. Requirements: completed higher education, a minimum of two years' experience in a similar position, advanced English. It is an advantage if you know how to work with graphics software. We offer: a salary between six and eight thousand lei net, flexible hours, two days of working from home per week, and twenty-five days of leave per year. Send your CV to the address below by 15 March. We will contact only the candidates selected for interview.",
  glossary:{"cerințe":"requirements","avantaj":"an advantage","oferim":"we offer","net":"after tax","candidații":"the candidates","selectați":"selected"}},

 {id:"r_a2u8", title:"Rețeta de sarmale a bunicii", titleEn:"Grandmother's sarmale recipe", level:"a2_1", format:"recipe", wordCount:134,
  ro:"Sarmalele nu sunt grele, dar cer timp. Bunica începea sâmbătă dimineața și le mânca abia duminica.\n\nÎntâi prăjești ceapa tocată mărunt, până se face aurie. Adaugi carnea — porc și puțină vită — orezul și condimentele. Amesteci bine totul.\n\nApoi iei foile de varză murată și pui câte o lingură de compoziție în fiecare. Le rulezi strâns și le așezi în oală, unul lângă altul.\n\nPui apă cât să le acopere și le fierbi la foc mic două-trei ore. Cu cât stau mai mult, cu atât sunt mai bune.\n\nSe servesc cu mămăligă și smântână. A doua zi sunt și mai gustoase.",
  en:"Sarmale are not difficult, but they take time. Grandmother would start on Saturday morning and only eat them on Sunday. First you fry finely chopped onion until it turns golden. You add the meat — pork and a little beef — the rice and the spices. Mix everything well. Then you take the pickled cabbage leaves and put a spoonful of the mixture in each. You roll them tightly and arrange them in the pot, one next to another. You add enough water to cover them and boil them on a low heat for two or three hours. The longer they sit, the better they are. They are served with polenta and sour cream. The next day they are even tastier.",
  glossary:{"cer":"they require","tocată":"chopped","mărunt":"finely","aurie":"golden","condimentele":"the spices","foile":"the leaves","murată":"pickled","compoziție":"the mixture","rulezi":"you roll","strâns":"tightly","oală":"pot","acopere":"cover","gustoase":"tasty"}},

 {id:"r_b1u4", title:"De ce nu există o singură Românie", titleEn:"Why there is no single Romania", level:"b1_1", format:"article", wordCount:178,
  ro:"Cine vine în România pentru prima dată se așteaptă la o singură țară. În realitate, găsește mai multe.\n\nÎn Transilvania se vede imediat influența maghiară și germană: orașe cu piețe centrale, biserici fortificate, un ritm mai așezat. În Moldova, accentul este altul și oamenii îl recunosc după câteva cuvinte. În Dobrogea, lângă mare, au trăit împreună români, turci, tătari și greci, iar bucătăria arată asta.\n\nDiferențele nu sunt doar istorice. Un om din Cluj și unul din Constanța mănâncă altceva duminica, se salută puțin diferit și glumesc pe seama celuilalt fără răutate. Bucureștiul, ca orice capitală, atrage oameni din toate regiunile și amestecă totul.\n\nPentru cineva care învață limba, asta e o veste bună și una proastă. Vestea proastă: veți auzi variante pe care nu le găsiți în manual. Vestea bună: nimeni nu vă va corecta accentul, pentru că nu există unul singur pe care toți îl folosesc.",
  en:"Someone coming to Romania for the first time expects a single country. In reality, they find several. In Transylvania the Hungarian and German influence is immediately visible: towns with central squares, fortified churches, a steadier rhythm. In Moldova the accent is different and people recognise it after a few words. In Dobrogea, near the sea, Romanians, Turks, Tatars and Greeks have lived together, and the cuisine shows it. The differences are not only historical. Someone from Cluj and someone from Constanța eat something different on Sundays, greet each other slightly differently, and joke about one another without malice. Bucharest, like any capital, attracts people from every region and mixes everything together. For someone learning the language this is good news and bad news. The bad news: you will hear variants you won't find in a textbook. The good news: nobody will correct your accent, because there isn't a single one everyone uses.",
  glossary:{"se așteaptă":"expects","fortificate":"fortified","așezat":"settled, unhurried","recunosc":"they recognise","amestecă":"mixes","pe seama":"at the expense of","răutate":"malice","variante":"variants","manual":"textbook"}},

 {id:"r_b1u6", title:"Ghid: certificatul de rezidență", titleEn:"Guide: the residence certificate", level:"b1_1", format:"official guide", wordCount:165,
  ro:"CERTIFICAT DE ÎNREGISTRARE PENTRU CETĂȚENII UE\n\nCine depune: cetățenii Uniunii Europene care rămân în România mai mult de nouăzeci de zile.\n\nActe necesare:\n— cerere tip, completată și semnată;\n— document de identitate, în original și copie;\n— dovada scopului șederii (contract de muncă, adeverință de student sau dovada unor mijloace de întreținere);\n— dovada spațiului de locuit, cu ștampila proprietarului.\n\nUnde: la Inspectoratul General pentru Imigrări din județul unde locuiți.\n\nTermen: cererea se depune înainte de expirarea celor nouăzeci de zile. Certificatul se eliberează, de regulă, în termen de treizeci de zile de la depunerea unui dosar complet.\n\nAtenție: dosarele incomplete nu se înregistrează. Verificați lista de acte pe site înainte de a veni, pentru că se modifică periodic.",
  en:"REGISTRATION CERTIFICATE FOR EU CITIZENS. Who applies: European Union citizens who remain in Romania for more than ninety days. Documents required: a standard application form, completed and signed; an identity document, original and copy; proof of the purpose of your stay (employment contract, student certificate, or proof of means of support); proof of accommodation, with the owner's stamp. Where: at the General Inspectorate for Immigration in the county where you live. Deadline: the application is submitted before the ninety days expire. The certificate is issued, as a rule, within thirty days of the submission of a complete file. Note: incomplete files are not registered. Check the list of documents on the website before coming, as it changes periodically.",
  glossary:{"depune":"submits","șederii":"of the stay","adeverință":"official certificate","mijloace de întreținere":"means of support","spațiului de locuit":"of the living space","județul":"the county","de regulă":"as a rule","expirarea":"the expiry","se modifică":"is changed","periodic":"periodically"}},

 {id:"r_b1_2u2", title:"Trei știri scurte", titleEn:"Three short news items", level:"b1_2", format:"news", wordCount:186,
  ro:"TRANSPORT. Potrivit primăriei, lucrările de pe bulevardul principal se vor încheia până la sfârșitul lunii. Traficul a fost deviat pe străzile laterale, iar șoferii sunt sfătuiți să evite zona între orele șapte și nouă dimineața.\n\nMEDIU. Un studiu publicat marți arată că nivelul de poluare din marile orașe a scăzut ușor față de anul trecut. Autorii precizează însă că scăderea se datorează mai ales vremii, nu unor măsuri noi. „Nu putem vorbi despre o îmbunătățire reală”, a declarat unul dintre cercetători.\n\nEDUCAȚIE. Ministerul a anunțat că examenele naționale se vor desfășura în aceeași perioadă ca anul trecut. Sindicatele au cerut clarificări privind organizarea, întrucât în unele județe lipsesc profesori. Reprezentanții ministerului au spus că vor răspunde în cursul săptămânii viitoare.",
  en:"TRANSPORT. According to the town hall, the works on the main boulevard will be completed by the end of the month. Traffic has been diverted onto side streets, and drivers are advised to avoid the area between seven and nine in the morning. ENVIRONMENT. A study published on Tuesday shows that the pollution level in the big cities has fallen slightly compared with last year. The authors specify, however, that the decrease is due mainly to the weather, not to any new measures. 'We cannot speak of a real improvement,' one of the researchers stated. EDUCATION. The Ministry has announced that the national exams will take place in the same period as last year. The unions have asked for clarification regarding the organisation, since teachers are lacking in some counties. Ministry representatives said they would respond in the course of next week.",
  glossary:{"lucrările":"the works","deviat":"diverted","sfătuiți":"advised","studiu":"study","a scăzut":"has fallen","precizează":"specify","se datorează":"is due to","măsuri":"measures","cercetători":"researchers","se vor desfășura":"will take place","sindicatele":"the unions","clarificări":"clarifications","privind":"regarding","în cursul":"in the course of"}},

 {id:"r_b1_2u6", title:"Ziua în care am plecat", titleEn:"The day I left", level:"b1_2", format:"memoir", wordCount:192,
  ro:"Aveam nouăsprezece ani când am plecat prima dată de acasă. Până atunci nu dormisem niciodată singur într-un alt oraș.\n\nÎmi amintesc dimineața aceea foarte clar. Mama pregătise mâncare pentru drum, deși știa că era doar o oră cu trenul. Tata nu spusese nimic toată dimineața, iar eu crezusem că e supărat. Abia mai târziu mi-am dat seama că, de fapt, nu știa ce să spună.\n\nDupă ce am urcat în tren, m-am așezat lângă fereastră și am simțit ceva ciudat: nu era tristețe, era mai degrabă o liniște pe care nu o mai avusesem până atunci.\n\nÎn primele săptămâni am sunat acasă în fiecare seară. Apoi din ce în ce mai rar, nu pentru că nu îmi lipseau, ci pentru că începusem să am viața mea acolo.\n\nAcum, când mă întorc în orașul acela, îmi dau seama cât de mic era. Pe atunci mi se părea imens.",
  en:"I was nineteen when I first left home. Until then I had never slept alone in another city. I remember that morning very clearly. My mother had prepared food for the journey, even though she knew it was only an hour by train. My father had said nothing all morning, and I had thought he was upset. Only later did I realise that in fact he did not know what to say. After I got on the train, I sat by the window and felt something strange: it was not sadness, it was more a calm I had not had until then. In the first weeks I called home every evening. Then less and less often, not because I did not miss them, but because I had begun to have my own life there. Now, when I return to that city, I realise how small it was. Back then it seemed immense to me.",
  glossary:{"pregătise":"had prepared","spusese":"had said","crezusem":"I had thought","mi-am dat seama":"I realised","de fapt":"in fact","m-am așezat":"I sat down","tristețe":"sadness","mai degrabă":"rather","liniște":"calm","avusesem":"I had had","din ce în ce mai rar":"less and less often","îmi lipseau":"I missed them","începusem":"I had begun","imens":"immense"}},

 /* Written for this course at the difficulty the ILR reading paper actually
    uses — an opinion piece with an argument that turns, which is harder than
    the informational texts a general B1 course tends to set. */
 {id:"r_ilr_lectura", title:"De ce uităm ce citim", titleEn:"Why we forget what we read", level:"ilr", format:"opinion piece", wordCount:268,
  ro:"Mulți dintre noi ne plângem că uităm cărțile pe care le-am citit. Ne amintim că ne-a plăcut un roman, dar nu mai știm nici numele personajelor. Concluzia pare evidentă: memoria noastră s-a stricat, probabil din cauza telefoanelor.\n\nMi se pare că lucrurile stau altfel. Am uitat întotdeauna aproape tot ce am citit — diferența e că acum ne dăm seama, pentru că avem unde să verificăm.\n\nÎnainte, o carte citită rămânea o amintire vagă și nimeni nu ne cerea socoteală. Astăzi, în două secunde găsim rezumatul și vedem cât de puțin am reținut. Sentimentul de pierdere e nou; pierderea în sine, nu.\n\nMai mult, cred că uitarea nu este un defect al lecturii, ci o parte din ea. Ceea ce rămâne după ce am uitat subiectul nu e nimic: e felul în care cartea ne-a schimbat, discret, modul de a privi lumea. Un cititor care a trecut prin cincizeci de romane gândește altfel decât unul care n-a citit niciunul, chiar dacă niciunul dintre ei nu poate rezuma corect cele cincizeci de cărți.\n\nDesigur, există și o lectură care cere memorare: un manual, un contract, un articol de specialitate. Dar a citi literatură ca pe un manual, cu teama că vei fi examinat, e cel mai sigur mod de a nu înțelege nimic.\n\nAșadar, dacă ați uitat romanul de anul trecut, nu vă îngrijorați. Probabil că el nu a plecat nicăieri.",
  en:"Many of us complain that we forget the books we have read. We remember that we liked a novel, but we no longer know even the characters' names. The conclusion seems obvious: our memory has broken down, probably because of phones. It seems to me that things are otherwise. We have always forgotten almost everything we read — the difference is that now we notice, because we have somewhere to check. Before, a book you had read remained a vague memory and nobody called you to account. Today, in two seconds we find the summary and see how little we retained. The feeling of loss is new; the loss itself is not. What is more, I think forgetting is not a defect of reading but a part of it. What remains after we have forgotten the plot is not nothing: it is the way the book quietly changed how we see the world. A reader who has been through fifty novels thinks differently from one who has read none, even if neither of them can correctly summarise the fifty books. Of course, there is also reading that demands memorisation: a textbook, a contract, a specialist article. But reading literature as though it were a textbook, afraid you will be examined, is the surest way to understand nothing. So if you have forgotten last year's novel, do not worry. It has probably not gone anywhere.",
  glossary:{"ne plângem":"we complain","evidentă":"obvious","s-a stricat":"has broken down","stau altfel":"are otherwise","ne cerea socoteală":"called us to account","rezumatul":"the summary","am reținut":"we retained","pierderea":"the loss","uitarea":"forgetting","defect":"defect","discret":"quietly, discreetly","a rezuma":"to summarise","de specialitate":"specialist","teama":"the fear","așadar":"so, therefore"}},

 /* Held back for the mock exam so the simulation is not sat on material the
    learner has already worked through. Same difficulty and same shape as the
    unit text: an argument that turns, with concessions to trip A/F items. */
 {id:"r_ilr_mock", title:"Orașul care nu doarme niciodată — și de ce ar trebui", titleEn:"The city that never sleeps — and why it should", level:"ilr", format:"opinion piece", wordCount:281,
  ro:"Se spune adesea că un oraș bun este un oraș care nu se oprește. Magazine deschise la miezul nopții, transport la orice oră, cafenele pline la ora două dimineața. Multă lume consideră acest lucru un semn de civilizație.\n\nEu cred că am confundat două lucruri diferite: disponibilitatea și viața.\n\nEste adevărat că un oraș în care totul se închide la ora șase devine, pentru cine lucrează târziu, aproape de nelocuit. Nimeni nu susține că trebuie să ne întoarcem acolo. Însă între a putea cumpăra lapte la ora unsprezece și a construi o economie care cere ca cineva să stea treaz toată noaptea pentru comoditatea altcuiva există o distanță considerabilă.\n\nÎn ultimii ani, orașele mari din România au început să semene tot mai mult cu acest model. Curieri care livrează până dimineața, farmacii non-stop, birouri în care lumina rămâne aprinsă la miezul nopții. Se vorbește despre asta ca despre un progres.\n\nCei care lucrează noaptea, însă, spun altceva. Studiile arată de mult că munca de noapte afectează somnul, inima și starea psihică. Iar cei mai mulți dintre acești oameni nu au ales programul; l-au acceptat pentru că nu aveau alternativă.\n\nDesigur, unele servicii trebuie să funcționeze permanent: spitalele, pompierii, transportul de urgență. Nimeni nu discută asta.\n\nÎntrebarea nu este dacă orașul trebuie să fie viu, ci cine plătește pentru ca el să pară astfel. De obicei, nu cei care se bucură de comoditate.",
  en:"It is often said that a good city is a city that does not stop. Shops open at midnight, transport at any hour, cafés full at two in the morning. Many people consider this a sign of civilisation. I think we have confused two different things: availability and life. It is true that a city in which everything closes at six becomes, for someone who works late, almost uninhabitable. Nobody is arguing that we should go back to that. But between being able to buy milk at eleven and building an economy that requires someone to stay awake all night for someone else's convenience there is a considerable distance. In recent years, the big cities in Romania have begun to resemble this model more and more. Couriers delivering until morning, all-night pharmacies, offices where the light stays on at midnight. This is spoken of as progress. Those who work at night, however, say something else. Studies have long shown that night work affects sleep, the heart and mental health. And most of these people did not choose the schedule; they accepted it because they had no alternative. Of course, some services must operate permanently: hospitals, firefighters, emergency transport. Nobody disputes that. The question is not whether the city should be alive, but who pays for it to appear that way. Usually, not those who enjoy the convenience.",
  glossary:{"disponibilitatea":"availability","de nelocuit":"uninhabitable","susține":"argues, maintains","comoditatea":"the convenience","considerabilă":"considerable","curieri":"couriers","livrează":"deliver","aprinsă":"lit, switched on","progres":"progress","afectează":"affects","starea psihică":"mental state","alternativă":"alternative","permanent":"permanently","pompierii":"the firefighters","nu discută":"does not dispute","să pară":"to seem"}}
];

/* ---------- A1.1 U1 L1 : greetings ---------- */
{id:"e101", lesson:"l_u1l1", skill:"vocabulary", type:"mcq", diff:1, topic:"g_alphabet",
 prompt:"It is 9 in the morning and you walk into a bakery. Which greeting fits best?",
 options:["Bună seara!","Bună dimineața!","Noapte bună!"], correct:1,
 explain:"<b>Bună dimineața</b> = good morning, used until roughly midday. <b>Bună seara</b> is for the evening, and <b>noapte bună</b> is only said when parting at night — it is a goodbye, never a greeting.",
 audio:"Bună dimineața!", vocab:["w_bunadim"]},
{id:"e102", lesson:"l_u1l1", skill:"vocabulary", type:"mcq", diff:1, topic:"g_alphabet",
 prompt:"Your professor greets you in the hallway. Which reply is appropriately polite?",
 options:["Salut!","Bună ziua!","Ce faci, măi?"], correct:1,
 explain:"<b>Bună ziua</b> is the neutral-polite daytime greeting — the safe choice with anyone you address as <i>dumneavoastră</i>. <b>Salut</b> is casual and fine among friends or classmates, but too familiar for a professor. The third option is very colloquial and would sound cheeky.",
 audio:"Bună ziua!", vocab:["w_bunaziua","w_salut"]},
{id:"e103", lesson:"l_u1l1", skill:"vocabulary", type:"match", diff:1, topic:"g_alphabet",
 prompt:"Match each Romanian expression with its English meaning.",
 pairs:[["mulțumesc","thank you"],["cu plăcere","you're welcome"],["te rog","please (informal)"],["scuzați-mă","excuse me (formal)"],["la revedere","goodbye"]],
 explain:"Note the politeness pairing: <b>te rog</b> is the informal 'please' (with someone you call <i>tu</i>), while <b>vă rog</b> is the formal one. The same split runs through <b>scuze</b> (informal) and <b>scuzați-mă</b> (formal).",
 vocab:["w_multumesc","w_cuplacere","w_terog","w_scuze","w_larevedere"]},
{id:"e104", lesson:"l_u1l1", skill:"listening", type:"transcribe", diff:1, topic:"g_alphabet",
 prompt:"Listen and type exactly what you hear.",
 audio:"Bună ziua! Ce mai faceți?", accept:["Bună ziua! Ce mai faceți?"],
 answer:"Bună ziua! Ce mai faceți?",
 explain:"<b>Ce mai faceți?</b> is the formal/plural version of <i>Ce mai faci?</i> ('How are you?'). Literally it asks 'what are you still doing?', but it functions exactly like the English 'how are you'.",
 hint:"Two sentences. The second is a question with the polite 'you' form."},
{id:"e105", lesson:"l_u1l1", skill:"pronunciation", type:"minimal_pair", diff:1, topic:"g_alphabet",
 prompt:"Listen carefully. Which word was spoken?",
 options:["șase","sase"], audioFor:["șase","sase"], correct:0,
 explain:"<b>ș</b> is always 'sh'. <i>șase</i> ('six') begins like English 'shah'. Written without the diacritic, <i>sase</i> would begin with a plain 's' — and is not a Romanian word. This is why the diacritics are not optional decoration.",
 audio:"șase"},

/* ---------- A1.1 U1 L2 : a fi + identity ---------- */
{id:"e111", lesson:"l_u1l2", skill:"grammar", type:"mcq", diff:1, topic:"g_irregular_verbs",
 prompt:"Choose the correct sentence:",
 options:["Eu este din America.","Eu sunt din America.","Eu e din America."], correct:1,
 explain:"The verb <b>a fi</b> ('to be') is irregular:<br><i>eu sunt · tu ești · el/ea este · noi suntem · voi sunteți · ei/ele sunt</i><br>With <b>eu</b> the form is <b>sunt</b>. <i>Este</i> (and its short spoken form <i>e</i>) belongs to el/ea. Because the ending already identifies the person, Romanians usually drop the pronoun: <b>Sunt din America</b> is just as natural.",
 audio:"Eu sunt din America.", vocab:["w_america"]},
{id:"e112", lesson:"l_u1l2", skill:"grammar", type:"fill", diff:1, topic:"g_irregular_verbs",
 prompt:"Eu ___ din Statele Unite.", answer:"sunt", accept:["sunt"],
 explain:"<b>Sunt</b> is the first-person singular of <i>a fi</i>. Note that <i>sunt</i> serves double duty — it is also the ei/ele form ('they are'), which context disambiguates.",
 audio:"Eu sunt din Statele Unite.", hint:"First person singular of a fi.", vocab:["w_america"]},
{id:"e113", lesson:"l_u1l2", skill:"grammar", type:"conjugate", diff:1, topic:"g_irregular_verbs",
 prompt:"a fi — tu — prezent", answer:"ești", accept:["ești"],
 explain:"<b>tu ești</b>. The full present tense of <i>a fi</i>: eu sunt, tu ești, el/ea este, noi suntem, voi sunteți, ei/ele sunt.",
 audio:"tu ești"},
{id:"e114", lesson:"l_u1l2", skill:"grammar", type:"error_fix", diff:2, topic:"g_irregular_verbs",
 prompt:"This sentence contains one mistake. Rewrite it correctly.",
 given:"Eu este studentă.", answer:"Eu sunt studentă.", accept:["Eu sunt studentă.","Sunt studentă.","Eu sunt studenta."],
 explain:"<b>Este</b> means 'he/she is'. With <b>eu</b>, <i>a fi</i> takes <b>sunt</b>. Also note <b>studentă</b> with the -ă ending marks a female student; a male student is <i>student</i>.",
 audio:"Eu sunt studentă."},
{id:"e115", lesson:"l_u1l2", skill:"vocabulary", type:"trans_en_ro", diff:2, topic:"g_pronouns_subj",
 prompt:"Translate into Romanian: \"My name is Ana.\"",
 answer:"Numele meu este Ana.", accept:["Numele meu este Ana.","Numele meu e Ana.","Mă numesc Ana.","Eu mă numesc Ana."],
 explain:"Two equally natural options: <b>Numele meu este Ana</b> (lit. 'my name is Ana') or <b>Mă numesc Ana</b> (lit. 'I call myself Ana'), which is the more common everyday phrasing. In speech <i>este</i> is very often shortened to <b>e</b>.",
 audio:"Numele meu este Ana.", vocab:["w_nume"]},

/* ---------- A1.1 U1 L3 : origin & nationality ---------- */
{id:"e121", lesson:"l_u1l3", skill:"grammar", type:"mcq", diff:2, topic:"g_adj_agreement",
 prompt:"Maria is talking about herself. Which is correct?",
 options:["Eu sunt american.","Eu sunt americancă.","Eu sunt americani."], correct:1,
 explain:"Nationality words behave like adjectives and agree with the speaker. Maria is female, so <b>americancă</b>. Masculine is <i>american</i>, and <i>americani</i> is the masculine plural. A useful habit: learn nationalities in pairs — <i>român/româncă, englez/englezoaică, german/germană</i>.",
 audio:"Eu sunt americancă.", vocab:["w_american"]},
{id:"e122", lesson:"l_u1l3", skill:"grammar", type:"build", diff:2, topic:"g_present",
 prompt:"Arrange the words to form a correct sentence.",
 words:["locuiesc","în","România","eu"], answer:"Eu locuiesc în România.",
 accept:["Eu locuiesc în România.","Locuiesc în România."],
 explain:"Basic order is Subject–Verb–Complement: <b>Eu locuiesc în România</b>. Since <i>locuiesc</i> already signals 'I', dropping <b>eu</b> is equally correct and in fact more common. <b>a locui</b> is an -i verb with the -esc- infix: locuiesc, locuiești, locuiește, locuim, locuiți, locuiesc.",
 audio:"Eu locuiesc în România.", vocab:["w_romania"]},
{id:"e123", lesson:"l_u1l3", skill:"grammar", type:"fill", diff:2, topic:"g_questions",
 prompt:"___ locuiești? — La Cluj.", answer:"Unde", accept:["unde"],
 explain:"<b>Unde</b> = 'where'. Romanian needs no auxiliary like English 'do' — you simply front the question word and conjugate the main verb: <i>Unde locuiești?</i>, not *'Do you live where?'.",
 audio:"Unde locuiești?", vocab:["w_unde"]},
{id:"e124", lesson:"l_u1l3", skill:"listening", type:"dictation", diff:2, topic:"g_present",
 prompt:"Listen and write the sentence. The text is hidden until you answer.",
 audio:"Vorbesc puțină română.", answer:"Vorbesc puțină română.",
 accept:["Vorbesc puțină română.","Eu vorbesc puțină română."],
 explain:"<b>Vorbesc puțină română</b> — 'I speak a little Romanian'. <i>puțină</i> is feminine to agree with <i>română</i> (the language, a feminine noun). Language names are not capitalized in Romanian.",
 vocab:["w_avorbi","w_limba"]},

/* ---------- A1.1 U2 L1 : family, a avea ---------- */
{id:"e201", lesson:"l_u2l1", skill:"grammar", type:"conjugate", diff:1, topic:"g_irregular_verbs",
 prompt:"a avea — noi — prezent", answer:"avem", accept:["avem"],
 explain:"<b>noi avem</b>. Full present: eu am, tu ai, el/ea are, noi avem, voi aveți, ei/ele au. These same forms double as the auxiliary for the past tense (perfectul compus) later on.",
 audio:"noi avem"},
{id:"e202", lesson:"l_u2l1", skill:"grammar", type:"fill", diff:2, topic:"g_numbers",
 prompt:"Fratele meu ___ douăzeci de ani.", answer:"are", accept:["are"],
 explain:"Romanian expresses age with <b>a avea</b>, not <i>a fi</i>: literally 'my brother <b>has</b> twenty years'. Saying *<i>este douăzeci de ani</i> is a classic English-speaker error. Note also <b>de</b> before <i>ani</i> — required for every number from 20 up.",
 audio:"Fratele meu are douăzeci de ani.", vocab:["w_frate","w_an"]},
{id:"e203", lesson:"l_u2l1", skill:"grammar", type:"transform", diff:2, topic:"g_plural",
 prompt:"Change to the plural: <span class=\"ro\">Copilul este mic.</span>",
 answer:"Copiii sunt mici.", accept:["Copiii sunt mici."],
 explain:"Three things change together: <b>copilul → copiii</b> (plural + definite article, hence three i's), <b>este → sunt</b>, and <b>mic → mici</b> so the adjective still agrees. Romanian requires this agreement chain throughout the sentence.",
 audio:"Copiii sunt mici.", vocab:["w_copil"]},
{id:"e204", lesson:"l_u2l1", skill:"grammar", type:"mcq", diff:2, topic:"g_possessives",
 prompt:"Which is the natural way to say \"my brother\"?",
 options:["fratele al meu","fratele meu","al meu frate"], correct:1,
 explain:"When the possessive follows a noun already carrying the definite article (<i>fratele</i> = 'the brother'), the linking article <b>al</b> is dropped: <b>fratele meu</b>. You need <i>al</i> when the possessive stands apart from its noun — e.g. <i>Acest telefon este al meu</i> ('This phone is mine').",
 audio:"fratele meu", vocab:["w_frate"]},
{id:"e205", lesson:"l_u2l1", skill:"writing", type:"produce", diff:2, topic:"g_possessives",
 prompt:"Write 3–4 sentences in Romanian about your family. Mention how many siblings you have and one person's age.",
 minWords:12, mustUse:["am","ani"],
 model:"Am o familie mică. Am un frate și o soră. Fratele meu are treizeci de ani. Mama mea este profesoară.",
 explain:"Check your work against the model: age uses <b>a avea</b> (<i>are treizeci de ani</i>), numbers from 20 up take <b>de</b>, and possessives follow the noun (<i>fratele meu</i>, <i>mama mea</i>). Feminine possessives use <b>mea</b>, masculine/neuter use <b>meu</b>.",
 vocab:["w_familie","w_frate","w_sora"]},

/* ---------- A1.1 U2 L2 : adjectives / description ---------- */
{id:"e211", lesson:"l_u2l2", skill:"grammar", type:"fill", diff:2, topic:"g_adj_agreement",
 prompt:"Sora mea este ___. (tall)", answer:"înaltă", accept:["înaltă"],
 explain:"<b>înalt</b> is a four-form adjective: <i>înalt (m sg) · înaltă (f sg) · înalți (m pl) · înalte (f pl)</i>. <i>Sora</i> is feminine singular, so <b>înaltă</b>.",
 audio:"Sora mea este înaltă.", vocab:["w_inalt","w_sora"]},
{id:"e212", lesson:"l_u2l2", skill:"grammar", type:"mcq", diff:2, topic:"g_adj_agreement",
 prompt:"Which sentence is correct?",
 options:["Colegii mei sunt simpatice.","Colegii mei sunt simpatici.","Colegii mei sunt simpatic."], correct:1,
 explain:"<b>Colegii</b> is masculine plural, so the adjective takes the masculine plural ending: <b>simpatici</b>. <i>Simpatice</i> is the feminine plural (it would go with <i>colegele</i>), and <i>simpatic</i> is masculine singular.",
 audio:"Colegii mei sunt simpatici.", vocab:["w_simpatic"]},
{id:"e213", lesson:"l_u2l2", skill:"grammar", type:"mcq", diff:2, topic:"g_adj_agreement",
 prompt:"Which phrase is correct?",
 options:["o casă mareă","o casă mare","o casă mari"], correct:1,
 explain:"<b>mare</b> is a two-form adjective: it is <i>mare</i> in both masculine and feminine singular, and <i>mari</i> in the plural. It never takes -ă. Contrast this with four-form adjectives like <i>frumos/frumoasă</i>.",
 audio:"o casă mare"},
{id:"e214", lesson:"l_u2l2", skill:"listening", type:"transcribe", diff:2, topic:"g_adj_agreement",
 prompt:"Listen and type what you hear.",
 audio:"Are părul lung și ochii verzi.", answer:"Are părul lung și ochii verzi.",
 accept:["Are părul lung și ochii verzi.","El are părul lung și ochii verzi.","Ea are părul lung și ochii verzi."],
 explain:"<b>Are părul lung și ochii verzi</b> — 'He/she has long hair and green eyes.' Romanian uses the definite article here (<i>părul</i>, <i>ochii</i>) where English uses a possessive. The subject pronoun is dropped, so this works for either 'he' or 'she'.",
 vocab:["w_par","w_ochi"]},

/* ---------- A1.1 U3 : time & routine ---------- */
{id:"e301", lesson:"l_u3l1", skill:"vocabulary", type:"mcq", diff:1, topic:"g_numbers",
 prompt:"How do you say \"It's half past nine\"?",
 options:["Este ora nouă jumătate.","Este nouă și jumătate.","Este jumătate nouă."], correct:1,
 explain:"<b>Este nouă și jumătate</b> — literally 'it is nine and a half'. Romanian builds times additively with <b>și</b> ('and'): <i>nouă și un sfert</i> (quarter past nine), <i>nouă și jumătate</i> (half past). For 'to' the hour it uses <b>fără</b>: <i>zece fără un sfert</i> (quarter to ten).",
 audio:"Este nouă și jumătate.", vocab:["w_ora"]},
{id:"e302", lesson:"l_u3l1", skill:"grammar", type:"fill", diff:2, topic:"g_prepositions",
 prompt:"Mă trezesc ___ ora șapte.", answer:"la", accept:["la"],
 explain:"Clock times take <b>la</b>: <i>la ora șapte</i> ('at seven o'clock'). Compare <b>în</b> for enclosed periods (<i>în weekend</i>) and <b>de la … până la</b> for ranges (<i>de la nouă până la cinci</i>).",
 audio:"Mă trezesc la ora șapte.", vocab:["w_atrezi","w_ora"]},
{id:"e303", lesson:"l_u3l2", skill:"grammar", type:"error_fix", diff:2, topic:"g_reflexive",
 prompt:"This sentence is missing something. Rewrite it correctly.",
 given:"Trezesc la ora șapte.", answer:"Mă trezesc la ora șapte.", accept:["Mă trezesc la ora șapte."],
 explain:"<b>a se trezi</b> is reflexive — the pronoun is part of the verb, not optional: <i>mă trezesc, te trezești, se trezește, ne trezim, vă treziți, se trezesc</i>. Dropping <b>mă</b> leaves a form that means roughly 'I wake (someone)', which is not what you want.",
 audio:"Mă trezesc la ora șapte.", vocab:["w_atrezi"]},
{id:"e304", lesson:"l_u3l2", skill:"grammar", type:"conjugate", diff:2, topic:"g_present",
 prompt:"a merge — noi — prezent", answer:"mergem", accept:["mergem"],
 explain:"<b>noi mergem</b>. Full present: eu merg, tu mergi, el/ea merge, noi mergem, voi mergeți, ei/ele merg. Note eu and ei/ele share the same form (<i>merg</i>) — very common in Romanian.",
 audio:"noi mergem"},
{id:"e305", lesson:"l_u3l2", skill:"grammar", type:"build", diff:2, topic:"g_word_order",
 prompt:"Arrange the words into a natural sentence.",
 words:["merg","cu","la","metroul","serviciu"], answer:"Merg la serviciu cu metroul.",
 accept:["Merg la serviciu cu metroul.","Eu merg la serviciu cu metroul.","Cu metroul merg la serviciu."],
 explain:"<b>Merg la serviciu cu metroul</b> — destination before means of transport is the neutral order. Transport takes <b>cu</b> + the definite form: <i>cu metroul, cu autobuzul, cu mașina</i>. Fronting <i>cu metroul</i> is grammatical but emphasizes the method ('it's by subway that I go').",
 audio:"Merg la serviciu cu metroul.", vocab:["w_serviciu"]},
/* Reading questions must require the learner to UNDERSTAND the text, not to
   spot a string. Rule of thumb applied throughout: the correct option must not
   reproduce the text's own wording, and at least one distractor should contain
   a phrase that IS in the text — so keyword-scanning actively misleads. */
{id:"e306", lesson:"l_u3l2", skill:"reading", type:"reading_q", diff:2, topic:"g_present", readingId:"r_u3",
 prompt:"Why does Cristina cook on Sundays?",
 options:["Because she doesn't go to the gym at the weekend.","So that she has food ready for the days ahead.","Because she finishes work at seven o'clock."], correct:1,
 explain:"The text says <i>gătește pentru toată săptămâna</i> — 'she cooks for the whole week'. The reason is in that little phrase <b>pentru toată săptămâna</b>, not in the verb itself. The other two options both quote real details from the text (the gym, finishing at seven), but neither answers <i>why</i> she cooks — a reminder that finding a familiar word is not the same as understanding the sentence it sits in.",
 vocab:["w_duminica"]},
{id:"e306b", lesson:"l_u3l2", skill:"reading", type:"reading_q", diff:3, topic:"g_present", readingId:"r_u3",
 prompt:"Roughly how long is Cristina's working day?",
 options:["About six hours","About ten hours","About twelve hours"], correct:1,
 explain:"The text gives <i>între orele nouă și șapte</i> — from nine to seven — which you have to convert yourself: that is ten hours. Nowhere does the text state a number of hours, so this can only be answered by reading the time expression and doing the arithmetic. Note <b>între … și …</b> ('between … and …') for ranges.",
 vocab:["w_ora"]},
{id:"e307", lesson:"l_u3l2", skill:"writing", type:"produce", diff:3, topic:"g_present",
 prompt:"Write 4–5 sentences describing what you usually do on a Sunday.",
 minWords:18, mustUse:["duminic"],
 model:"Duminica mă trezesc târziu, pe la ora zece. Beau o cafea și citesc știrile. După-amiaza mă întâlnesc cu prietenii sau merg la o plimbare în parc. Seara gătesc pentru săptămâna următoare și mă culc devreme.",
 explain:"Compare with the model. Habitual actions take the plain present tense — Romanian has no separate 'I usually do' construction, though <b>de obicei</b> ('usually') can be added. Remember the reflexive pronouns on <i>mă trezesc</i> and <i>mă întâlnesc</i>.",
 vocab:["w_duminica","w_atrezi"]},

/* ---------- A1.1 U4 : food, ordering, îmi place ---------- */
{id:"e601", lesson:"l_u4l1", skill:"vocabulary", type:"mcq", diff:1, topic:"g_articles_indef",
 prompt:"You want to order a coffee politely. Which is best?",
 options:["Dă-mi cafea.","Aș dori o cafea, vă rog.","Eu vreau cafea acum."], correct:1,
 explain:"<b>Aș dori</b> ('I would like') is the conditional, and it is the standard polite way to order — the same register as English 'I'd like'. <i>Dă-mi</i> is an imperative ('give me') and sounds abrupt to a stranger. <i>Vreau</i> ('I want') is grammatical but blunt; with a waiter, add <b>vă rog</b> at minimum.",
 audio:"Aș dori o cafea, vă rog.", vocab:["w_asdori","w_cafea"]},
{id:"e602", lesson:"l_u4l1", skill:"grammar", type:"mcq", diff:2, topic:"g_imi_place",
 prompt:"Choose the correct sentence:",
 options:["Eu plac cafeaua.","Îmi place cafeaua.","Îmi plac cafeaua."], correct:1,
 explain:"Romanian says 'the coffee is pleasing <b>to me</b>'. The person goes in the dative (<b>îmi</b>), and the verb agrees with the thing liked — <i>cafeaua</i> is singular, so <b>place</b>. <i>Eu plac</i> would mean 'I am pleasing (to someone)', and <i>îmi plac</i> would need a plural thing.",
 audio:"Îmi place cafeaua.", vocab:["w_imiplace","w_cafea"]},
{id:"e603", lesson:"l_u4l1", skill:"grammar", type:"fill", diff:2, topic:"g_imi_place",
 prompt:"Îmi ___ merele roșii. (place / plac)", answer:"plac", accept:["plac"],
 explain:"<b>Merele</b> is plural, so the verb is <b>plac</b>. The rule is simple once you see what the subject is: the thing liked is the subject, and the verb agrees with it — not with the person. Compare <i>Îmi place mărul</i> (one apple) with <i>Îmi plac merele</i> (apples).",
 audio:"Îmi plac merele roșii.", hint:"What is the grammatical subject — you, or the apples?", vocab:["w_mar","w_imiplace"]},
{id:"e604", lesson:"l_u4l1", skill:"grammar", type:"error_fix", diff:2, topic:"g_imi_place",
 prompt:"This sentence reverses the Romanian structure. Rewrite it correctly.",
 given:"Eu plac ciorba.", answer:"Îmi place ciorba.", accept:["Îmi place ciorba.","Imi place ciorba."],
 explain:"<i>Eu plac</i> makes <b>you</b> the thing being liked. Romanian puts the liker in the dative: <b>îmi place ciorba</b> — literally 'to me pleases the soup'. This inversion catches out nearly every English speaker at first; drill it until it feels automatic.",
 audio:"Îmi place ciorba.", vocab:["w_ciorba","w_imiplace"]},
{id:"e605", lesson:"l_u4l1", skill:"vocabulary", type:"match", diff:1, topic:"g_gender",
 prompt:"Match each item with its English meaning.",
 pairs:[["pâine","bread"],["brânză","cheese"],["apă","water"],["carne","meat"],["pește","fish"],["ciorbă","sour soup"]],
 explain:"Note the genders, which decide the article: <i>pâinea, brânza, apa, carnea</i> are feminine; <i>peștele</i> is masculine. <b>Ciorbă</b> is worth knowing culturally — it's a sour soup, distinct from <i>supă</i>, and a staple of Romanian home cooking.",
 vocab:["w_paine","w_branza","w_apa","w_carne","w_peste","w_ciorba"]},
{id:"e606", lesson:"l_u4l1", skill:"listening", type:"transcribe", diff:2, topic:"g_articles_indef",
 prompt:"Listen and type what you hear.",
 audio:"Aș dori o supă de legume, vă rog.", answer:"Aș dori o supă de legume, vă rog.",
 accept:["Aș dori o supă de legume, vă rog."],
 explain:"<b>o supă de legume</b> — 'a vegetable soup'. Romanian links the two nouns with <b>de</b> where English simply stacks them: <i>supă de legume</i>, <i>ciorbă de burtă</i>, <i>suc de portocale</i>.",
 vocab:["w_supa","w_legume","w_asdori"]},
{id:"e607", lesson:"l_u4l2", skill:"grammar", type:"build", diff:2, topic:"g_imi_place",
 prompt:"Arrange the words into a correct sentence.",
 words:["nu","berea","îmi","place"], answer:"Nu îmi place berea.",
 accept:["Nu îmi place berea.","Nu-mi place berea.","Nu imi place berea."],
 explain:"Negation puts <b>nu</b> before the whole pronoun-plus-verb block: <b>Nu îmi place berea</b>. In speech this almost always contracts to <b>nu-mi place</b>, which is what you'll actually hear — both are correct in writing.",
 audio:"Nu îmi place berea.", vocab:["w_bere","w_imiplace"]},
{id:"e608", lesson:"l_u4l2", skill:"vocabulary", type:"trans_en_ro", diff:2, topic:"g_articles_def",
 prompt:"Translate into Romanian: \"The bill, please!\"",
 answer:"Nota, vă rog!", accept:["Nota, vă rog!","Nota va rog","Plata, vă rog!","Nota, vă rog"],
 explain:"<b>Nota, vă rog</b> is the standard phrase in a restaurant; <b>Plata, vă rog</b> works equally well. Note the definite article on <i>nota</i> — you're asking for <i>the</i> bill, not <i>a</i> bill. Use <b>vă rog</b>, not <i>te rog</i>, with staff you don't know.",
 audio:"Nota, vă rog!", vocab:["w_nota"]},
{id:"e609", lesson:"l_u4l2", skill:"reading", type:"reading_q", diff:3, topic:"g_numbers", readingId:"r_u4",
 prompt:"You order a vegetable soup and a coffee. What will you pay?",
 options:["26 lei","28 lei","30 lei"], correct:1,
 explain:"<i>Ciorbă de legume</i> is 18 lei and <i>cafea</i> is 10 lei, so 28 lei. No single line of the menu gives this figure — you have to find two prices and add them. Note that <b>supă de pui</b> (20 lei) is a different dish: <i>supă</i> is a clear soup, <i>ciorbă</i> is soured. Picking the wrong soup gives you 30.",
 vocab:["w_supa","w_ciorba","w_lei"]},
{id:"e610", lesson:"l_u4l2", skill:"writing", type:"produce", diff:2, topic:"g_imi_place",
 prompt:"Write 3–4 sentences about food you like and dislike. Use both <b>îmi place</b> and <b>îmi plac</b> at least once each.",
 minWords:14, mustUse:["îmi place","îmi plac"],
 model:"Îmi place foarte mult ciorba de legume. Îmi plac și fructele, mai ales merele. Nu-mi place carnea de porc. Dimineața beau o cafea cu lapte și mănânc pâine cu brânză.",
 explain:"Check the agreement in your own sentences: singular thing → <b>place</b>, plural thing → <b>plac</b>. Also note the definite article on the thing liked (<i>ciorba</i>, <i>fructele</i>, <i>carnea</i>) — Romanian uses it for general statements where English uses no article at all.",
 vocab:["w_imiplace","w_ciorba","w_fructe"]},

/* ---------- A1.1 U5 : shopping, prices, demonstratives ---------- */
{id:"e621", lesson:"l_u5l1", skill:"vocabulary", type:"mcq", diff:1, topic:"g_questions",
 prompt:"You want to know the price of something. What do you ask?",
 options:["Ce preț?","Cât costă?","Cum este prețul?"], correct:1,
 explain:"<b>Cât costă?</b> is the standard question — literally 'how much does it cost?'. For several items: <i>Cât costă acestea?</i> You may also hear <b>Cât face?</b> in shops and markets, which is more colloquial but perfectly normal.",
 audio:"Cât costă?", vocab:["w_catcosta"]},
{id:"e622", lesson:"l_u5l1", skill:"grammar", type:"fill", diff:2, topic:"g_numbers",
 prompt:"Costă optzeci ___ lei.", answer:"de", accept:["de"],
 explain:"Every number from <b>20</b> upward takes <b>de</b> before the counted noun: <i>optzeci de lei</i>, <i>o sută de euro</i>. Below 20 there is no <i>de</i>: <i>cincisprezece lei</i>. This is one of the most reliable rules in Romanian — and one learners drop constantly.",
 audio:"Costă optzeci de lei.", vocab:["w_lei"]},
{id:"e623", lesson:"l_u5l1", skill:"grammar", type:"mcq", diff:2, topic:"g_demonstratives",
 prompt:"Pointing at one shirt (cămașă, feminine), which is correct?",
 options:["acest cămașă","această cămașă","aceste cămașă"], correct:1,
 explain:"Demonstratives agree with the noun. <i>Cămașă</i> is feminine singular, so <b>această cămașă</b>. Masculine singular would be <i>acest</i> (<i>acest pantof</i>), and <i>aceste</i> is the feminine plural (<i>aceste cămăși</i>). In speech you'll also hear the demonstrative placed after the noun: <b>cămașa aceasta</b>.",
 audio:"această cămașă", vocab:["w_camasa"]},
{id:"e624", lesson:"l_u5l1", skill:"grammar", type:"transform", diff:3, topic:"g_adj_agreement",
 prompt:"Change to the plural: <span class=\"ro\">Pantoful este scump.</span>",
 answer:"Pantofii sunt scumpi.", accept:["Pantofii sunt scumpi."],
 explain:"Three agreements shift together: <b>pantoful → pantofii</b> (masculine plural with the definite article), <b>este → sunt</b>, and <b>scump → scumpi</b>. Masculine plural adjectives in -i are extremely common; note the spelling <i>scumpi</i>, not *scumpii.",
 audio:"Pantofii sunt scumpi.", vocab:["w_pantofi","w_scump"]},
{id:"e625", lesson:"l_u5l1", skill:"listening", type:"dictation", diff:2, topic:"g_numbers",
 prompt:"Listen and write the price you hear.",
 audio:"Costă o sută douăzeci de lei.", answer:"Costă o sută douăzeci de lei.",
 accept:["Costă o sută douăzeci de lei.","O sută douăzeci de lei."],
 explain:"<b>O sută douăzeci</b> = 120. Romanian builds hundreds transparently: <i>o sută</i> (100), <i>două sute</i> (200), <i>trei sute</i> (300). Note <b>o sută</b> uses the feminine <i>o</i>, because <i>sută</i> is a feminine noun.",
 vocab:["w_lei","w_catcosta"]},
{id:"e626", lesson:"l_u5l2", skill:"vocabulary", type:"trans_en_ro", diff:3, topic:"g_adj_agreement",
 prompt:"Translate into Romanian: \"This dress is too expensive.\"",
 answer:"Această rochie este prea scumpă.",
 accept:["Această rochie este prea scumpă.","Rochia aceasta este prea scumpă.","Această rochie e prea scumpă.","Rochia aceasta e prea scumpă."],
 explain:"<i>Rochie</i> is feminine, so both the demonstrative and the adjective take feminine forms: <b>această … scumpă</b>. <b>Prea</b> means 'too (much)'. Placing the demonstrative after the noun — <i>rochia aceasta</i> — is equally correct and very common in speech.",
 audio:"Această rochie este prea scumpă.", vocab:["w_rochie","w_scump"]},
{id:"e627", lesson:"l_u5l2", skill:"reading", type:"reading_q", diff:3, topic:"g_connectors", readingId:"r_u5",
 prompt:"What does the writer think about the dress's price?",
 options:["It's a bargain, which is why she bought it.","It's steep, but she thinks it's worth it.","It's too much, so she left it in the shop."], correct:1,
 explain:"The clue is the connector: <i>nu este ieftină, <b>dar</b> îmi place mult</i>. <b>Dar</b> ('but') concedes the price and then overrides it — and the following sentence confirms she bought other things too. Nothing in the text says 'bargain' or 'too expensive'; you have to read what the <i>dar</i> is doing between the two clauses.",
 vocab:["w_scump","w_ieftin"]},
{id:"e628", lesson:"l_u5l2", skill:"grammar", type:"build", diff:2, topic:"g_questions",
 prompt:"Arrange the words to ask if you can try the dress on.",
 words:["pot","probez","rochia","să"], answer:"Pot să probez rochia?",
 accept:["Pot să probez rochia?","Pot sa probez rochia"],
 explain:"<b>A putea</b> is followed by <b>să</b> + subjunctive: <i>pot să probez</i>. This să-construction is everywhere in spoken Romanian and replaces the English infinitive after modal verbs. You'll meet it formally at B1, but it's worth using from the start.",
 audio:"Pot să probez rochia?", vocab:["w_aproba","w_rochie"]},

/* ---------- A1.1 U6 : town, directions, transport ---------- */
{id:"e641", lesson:"l_u6l1", skill:"vocabulary", type:"match", diff:1, topic:"g_gender",
 prompt:"Match each place with its English meaning.",
 pairs:[["gară","train station"],["farmacie","pharmacy"],["biserică","church"],["muzeu","museum"],["piață","market / square"],["bancă","bank"]],
 explain:"Watch two of these: <b>piață</b> means both 'market' and 'town square', and <b>bancă</b> means both 'bank' and 'bench' — context disambiguates. <i>Muzeu</i> is the only neuter here: <i>un muzeu, două muzee</i>.",
 vocab:["w_gara","w_farmacie","w_biserica","w_muzeu","w_piata","w_banca"]},
{id:"e642", lesson:"l_u6l1", skill:"grammar", type:"fill", diff:2, topic:"g_place_prepositions",
 prompt:"Hotelul este aproape ___ gară.", answer:"de", accept:["de"],
 explain:"<b>aproape de</b> ('near'), <b>departe de</b> ('far from') and <b>vizavi de</b> ('opposite') all require <b>de</b> before the noun. Dropping it — *<i>aproape gara</i> — is a very common learner error and sounds clearly wrong to a native speaker.",
 audio:"Hotelul este aproape de gară.", vocab:["w_aproape","w_gara"]},
{id:"e643", lesson:"l_u6l1", skill:"grammar", type:"mcq", diff:2, topic:"g_place_prepositions",
 prompt:"Someone tells you: <span class=\"ro\">Mergeți drept înainte, apoi la stânga.</span> What should you do?",
 options:["Turn right immediately","Go straight, then turn left","Go back the way you came"], correct:1,
 explain:"<b>drept înainte</b> = straight ahead; <b>la stânga</b> = to the left; <b>la dreapta</b> = to the right. A useful memory hook: <i>stânga</i> and 'sinister' (Latin for left) share a root, while <i>dreapta</i> relates to 'direct' and 'right'.",
 audio:"Mergeți drept înainte, apoi la stânga.", vocab:["w_drept","w_stanga"]},
{id:"e644", lesson:"l_u6l1", skill:"listening", type:"transcribe", diff:2, topic:"g_place_prepositions",
 prompt:"Listen and type what you hear.",
 audio:"Farmacia este vizavi de parc.", answer:"Farmacia este vizavi de parc.",
 accept:["Farmacia este vizavi de parc.","Farmacia e vizavi de parc."],
 explain:"<b>vizavi de</b> — 'opposite / across from'. The word is borrowed from French <i>vis-à-vis</i> and keeps a French-like pronunciation. Note <i>farmacia</i> carries the definite article: 'the pharmacy'.",
 vocab:["w_farmacie","w_vizavi","w_parc"]},
{id:"e645", lesson:"l_u6l2", skill:"grammar", type:"conjugate", diff:2, topic:"g_present",
 prompt:"a lua — eu — prezent", answer:"iau", accept:["iau"],
 explain:"<b>eu iau</b>. The stem alternates: <i>iau, iei, ia</i> but <i>luăm, luați, iau</i>. Used constantly for transport (<i>iau metroul</i>) and for ordering (<i>iau o cafea</i>) — in both cases where English says 'take' or 'have'.",
 audio:"eu iau"},
{id:"e646", lesson:"l_u6l2", skill:"grammar", type:"build", diff:2, topic:"g_prepositions",
 prompt:"Arrange the words into a natural sentence.",
 words:["iau","în","centru","metroul","până"], answer:"Iau metroul până în centru.",
 accept:["Iau metroul până în centru.","Eu iau metroul până în centru."],
 explain:"<b>până în</b> means 'as far as / up to' a destination. Note that transport takes the definite form after <i>a lua</i>: <b>iau metroul</b>, <i>iau autobuzul</i> — never *<i>iau metrou</i>. Compare with <b>cu</b>: <i>merg cu metroul</i> ('I go by subway').",
 audio:"Iau metroul până în centru.", vocab:["w_alua","w_metrou"]},
{id:"e647", lesson:"l_u6l2", skill:"reading", type:"reading_q", diff:3, topic:"g_present", readingId:"r_u6",
 prompt:"You arrive at the museum at 9am on a Tuesday. What happens?",
 options:["You get in — it opens at nine.","You wait an hour — it opens at ten.","You've come on the wrong day — it's shut."], correct:1,
 explain:"Two facts have to be combined: the museum opens <i>de marți până duminică</i> (so Tuesday is fine — that rules out the third option), but only <i>între orele zece și optsprezece</i>, and 9am is before ten. The closed day is <b>luni</b>, which is a tempting answer only if you skim for <i>închis</i> without checking which day you were asked about.",
 vocab:["w_muzeu"]},
{id:"e648", lesson:"l_u6l2", skill:"writing", type:"produce", diff:3, topic:"g_place_prepositions",
 prompt:"Someone asks how to get from the station to your home. Write 3–4 sentences of directions in Romanian.",
 minWords:16, mustUse:["drept"],
 model:"De la gară mergeți drept înainte două străzi. Apoi luați autobuzul 105 până în centru. Coborâți lângă farmacie și mergeți la dreapta. Casa mea este vizavi de un parc mic.",
 explain:"Compare with the model. Directions in Romanian normally use the <b>voi</b> form (<i>mergeți, luați, coborâți</i>) because you're addressing a stranger politely. Check that <i>aproape</i>, <i>departe</i> and <i>vizavi</i> all kept their <b>de</b>.",
 vocab:["w_drept","w_dreapta","w_vizavi"]},

/* ---------- A1.1 U7 : the home ---------- */
{id:"e861", lesson:"l_u7l1", skill:"vocabulary", type:"match", diff:1, topic:"g_gender",
 prompt:"Match each room with its English meaning.",
 pairs:[["bucătărie","kitchen"],["dormitor","bedroom"],["sufragerie","living room"],["baie","bathroom"],["balcon","balcony"]],
 explain:"Note the genders, which decide the article: <i>bucătăria, sufrageria, baia</i> are feminine; <b>dormitorul</b> and <b>balconul</b> are neuter. <i>Baie</i> has an irregular plural — <b>băi</b>.",
 vocab:["w_bucatarie","w_dormitor","w_sufragerie","w_baie","w_balcon"]},
{id:"e862", lesson:"l_u7l1", skill:"grammar", type:"fill", diff:2, topic:"g_place_prepositions",
 prompt:"Cheile sunt ___ masă. (on)", answer:"pe", accept:["pe"],
 explain:"<b>pe</b> = 'on' a surface. Compare <b>în</b> for inside something (<i>în dulap</i>), <b>sub</b> for underneath (<i>sub pat</i>) and <b>lângă</b> for beside (<i>lângă fereastră</i>).",
 audio:"Cheile sunt pe masă.", vocab:["w_masa_n"]},
{id:"e863", lesson:"l_u7l1", skill:"grammar", type:"build", diff:2, topic:"g_place_prepositions",
 prompt:"Arrange the words into a correct sentence.",
 words:["este","frigider","laptele","în"], answer:"Laptele este în frigider.",
 accept:["Laptele este în frigider.","Laptele e în frigider."],
 explain:"<b>Laptele este în frigider</b> — note the definite article on both nouns. Romanian uses <b>în</b> for enclosed spaces, and <i>frigider</i> is neuter, so its definite form would be <i>frigiderul</i> — but after a preposition the article is dropped: <b>în frigider</b>, not <i>în frigiderul</i>.",
 audio:"Laptele este în frigider.", vocab:["w_frigider","w_lapte"]},
{id:"e864", lesson:"l_u7l2", skill:"listening", type:"transcribe", diff:2, topic:"g_place_prepositions",
 prompt:"Listen and type what you hear.",
 audio:"Dormitorul este la dreapta, lângă baie.", answer:"Dormitorul este la dreapta, lângă baie.",
 accept:["Dormitorul este la dreapta, lângă baie.","Dormitorul e la dreapta, lângă baie."],
 explain:"Two location markers stack here: <b>la dreapta</b> ('on the right') and <b>lângă</b> ('next to'). Note that <i>lângă</i> takes no <b>de</b>, unlike <i>aproape de</i> and <i>vizavi de</i>.",
 vocab:["w_dormitor","w_langa"]},
{id:"e865", lesson:"l_u7l2", skill:"reading", type:"reading_q", diff:3, topic:"g_numbers", readingId:"r_u7",
 prompt:"You have a cat. Can you rent this flat?",
 options:["Yes — pets are welcome.","No — the listing excludes pets.","The listing doesn't mention pets."], correct:1,
 explain:"The final line reads <i>Nu se acceptă animale de companie</i> — 'pets are not accepted'. <b>Animale de companie</b> is the standard phrase for pets; a listing that allowed them would say <i>se acceptă</i>. The reflexive <b>se acceptă</b> is an impersonal construction: 'one does not accept', with no stated subject.",
 vocab:["w_chirie"]},
{id:"e866", lesson:"l_u7l2", skill:"writing", type:"produce", diff:3, topic:"g_place_prepositions",
 prompt:"Describe where you live in 4–5 sentences: the rooms, and where things are in relation to each other.",
 minWords:20, mustUse:["cameră"],
 model:"Stau într-un apartament cu două camere, la etajul doi. Bucătăria este mică, dar are o fereastră mare. Dormitorul meu este lângă baie. În sufragerie am o canapea și o masă. Îmi place mult balconul, pentru că dă spre un parc.",
 explain:"Compare with the model. Check your prepositions: <b>în</b> for inside a room, <b>pe</b> for on a surface, <b>lângă</b> with no <i>de</i>, and <b>la etajul…</b> for the floor. Note also <i>într-un</i> — the contracted form of <b>în + un</b>, which is obligatory.",
 vocab:["w_camera","w_apartament","w_etaj"]},

/* ---------- A1.1 U8 : weather & seasons ---------- */
{id:"e881", lesson:"l_u8l1", skill:"grammar", type:"mcq", diff:2, topic:"g_impersonal",
 prompt:"How do you say \"It's raining\" in Romanian?",
 options:["El plouă.","Plouă.","Este plouă."], correct:1,
 explain:"Just <b>Plouă</b>. Romanian weather verbs have <i>no subject at all</i> — there is no equivalent of the English dummy 'it'. <i>El plouă</i> would mean 'he rains', and <i>este plouă</i> stacks two verbs. The same applies to <b>ninge</b> (it's snowing) and <b>tună</b> (it's thundering).",
 audio:"Plouă.", vocab:["w_aploua"]},
{id:"e882", lesson:"l_u8l1", skill:"grammar", type:"error_fix", diff:2, topic:"g_impersonal",
 prompt:"Remove what doesn't belong.",
 given:"Astăzi el este frig.", answer:"Astăzi este frig.",
 accept:["Astăzi este frig.","Astazi este frig.","Azi este frig.","Astăzi e frig."],
 explain:"<b>Este frig</b> — literally 'is cold', with no subject. English needs 'it', Romanian does not. The same pattern covers <i>este cald</i>, <i>este soare</i>, <i>este vânt</i>. In speech <b>este</b> almost always shortens to <b>e</b>: <i>e frig</i>.",
 audio:"Astăzi este frig.", vocab:["w_frig"]},
{id:"e883", lesson:"l_u8l1", skill:"vocabulary", type:"match", diff:1, topic:"g_gender",
 prompt:"Match each season with its English name.",
 pairs:[["primăvară","spring"],["vară","summer"],["toamnă","autumn"],["iarnă","winter"]],
 explain:"All four are feminine. Used with the definite article they become adverbs meaning 'in that season': <b>primăvara</b> ('in spring'), <b>vara</b>, <b>toamna</b>, <b>iarna</b> — so <i>Iarna ninge</i> means 'in winter it snows', not 'the winter snows'.",
 vocab:["w_primavara","w_vara_n","w_toamna","w_iarna_n"]},
{id:"e884", lesson:"l_u8l2", skill:"listening", type:"dictation", diff:2, topic:"g_impersonal",
 prompt:"Listen and write what you hear.",
 audio:"Plouă și bate vântul.", answer:"Plouă și bate vântul.",
 accept:["Plouă și bate vântul.","Ploua si bate vantul."],
