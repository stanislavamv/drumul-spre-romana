/* Ordering is graded on sequence, and the feedback names how far off it was —
   one swapped pair is a different kind of error from a scrambled guess. */
function checkOrder(ex){
  var placed = session.built[ex.id] || [];
  var n = ex.lines.length;
  if(placed.length < n){
    return {verdict:"incorrect", correct:ex.lines.map(function(l){return l.ro;}).join(" / "),
      diagnosis:"You've placed "+placed.length+" of "+n+" lines. Put them all in order before checking."};
  }
  var wrong = placed.filter(function(idx,pos){ return idx!==pos; }).length;
  if(wrong===0) return {verdict:"correct", correct:ex.lines.map(function(l){return l.ro;}).join(" / ")};
  return {
    verdict: wrong<=2 ? "almost" : "incorrect",
    correct: ex.lines.map(function(l){return l.ro;}).join(" / "),
    diagnosis: wrong===2
      ? "Two lines are swapped — the rest of the sequence is right. Replay the conversation and listen for which one answers which."
      : wrong+" of "+n+" lines are out of place. Try playing it at 0.65× and following the question-and-answer pairs rather than individual words."
  };
}
function checkGapfill(ex){
  var gaps = session.gaps[ex.id] || {};
  var wrong = [], nearMiss = 0;
  ex.answers.forEach(function(a,i){
    var given = gaps[i]||"";
    if(norm(given)===norm(a)) return;
    if(normLoose(given)===normLoose(a)){ nearMiss++; return; }
    wrong.push(a);
  });
  if(!wrong.length && !nearMiss) return {verdict:"correct", correct:ex.fullText};
  if(!wrong.length) return {verdict:"almost", correct:ex.fullText,
    diagnosis:"Every word is right, but "+nearMiss+" of them "+(nearMiss===1?"is":"are")+" missing diacritics. Those letters are part of the spelling, not decoration."};
  return {
    verdict: wrong.length<=1 ? "almost" : "incorrect",
    correct: ex.fullText,
    diagnosis: wrong.length+" of "+ex.answers.length+" gaps "+(wrong.length===1?"is":"are")+" wrong. Replay at a slower speed — the missing words are unstressed in connected speech, which is exactly what makes them hard to catch."
  };
}

function buildOrderExercise(d){

    explain:"Following a conversation means tracking who answers what, not catching every word. "+
      "Question-and-answer pairs are the anchor: a line ending in a question mark is almost always followed by the reply to it. "+
      "From the dialogue <i>"+escapeHtml(d.title)+"</i> — "+escapeHtml(d.titleEn)+"."
  };
}

function buildGapfill(id, text, levelId, title){
  if(!gapfillEligible(levelId)) return null;
  var clean = String(text||"").replace(/\s+/g," ").trim();
  var raw = clean.split(" ");
  // Blank content words only — skip short function words and anything numeric.
  var candidates = [];
  raw.forEach(function(w,i){
    var bare = w.replace(/[.,!?;:()"„”—–]/g,"");
    if(bare.length>4 && !/^\d+$/.test(bare)) candidates.push(i);
  });
  if(candidates.length < 3) return null;
  var chosen = pick(candidates, Math.min(4, Math.max(3, Math.floor(candidates.length/6)))).sort(function(a,b){return a-b;});
  var answers = [];
  var tokens = raw.map(function(w,i){
    if(chosen.indexOf(i)===-1) return {text:w, blank:false};
    var bare = w.replace(/[.,!?;:()"„”—–]/g,"");
    answers.push(bare);
    return {text:w, blank:true};
  });
  return {
    id:"gap_"+id, lesson:null, skill:"listening", type:"gapfill", diff:4,
    topic:null, generated:true, tokens:tokens, answers:answers, fullText:clean, audio:clean,
    prompt:"Listen and type the missing words. Play it as many times as you need.",
    explain:"The blanked words are content words — the ones that carry meaning and that connected speech tends to compress. "+
      (title? "From <i>"+escapeHtml(title)+"</i>. ":"")+
      "If a word kept escaping you, replay at 0.65×: hearing it slowed down once usually makes it audible at full speed afterwards."
  };
}

/* ---------- MOVING PROGRESS BETWEEN BROWSERS ----------
   Progress lives in this browser's localStorage, which is per-browser and
   per-device by design. Real accounts need a server to hold the data, and this
   course is a single static file with no backend — so instead of pretending,
   the app makes the save file portable: export it, carry it, import it. That
   covers the actual need (continue on another machine) and has the side benefit
   that the data stays yours and never leaves your computer. */
/* The mistake notebook stores the prompt and the full explanation alongside
   every saved mistake, which is most of the save file's bulk. Both are
   reconstructible from the exercise id, so the pasteable code drops them and
   the import puts them back. The downloaded FILE keeps everything, since size
   costs nothing there. */
function slimStateForCode(st){
  var copy = Object.assign({}, st);
  copy.mistakes = (st.mistakes||[]).map(function(m){
    if(!m.exerciseId || !exerciseById(m.exerciseId)) return m;   // generated: keep verbatim
    var s = Object.assign({}, m);
    delete s.explanation; delete s.promptText;
    return s;
  });
  return copy;
}
function rehydrateMistakes(st){
  (st.mistakes||[]).forEach(function(m){
    if(m.explanation && m.promptText) return;
    var ex = m.exerciseId && exerciseById(m.exerciseId);
    if(!ex) return;
    if(!m.explanation) m.explanation = ex.explain;
    if(!m.promptText)  m.promptText  = String(ex.prompt||"").replace(/<[^>]+>/g,"");
  });
  return st;
}
function stateToCode(){
  var json = JSON.stringify({v:2, at:new Date().toISOString(), slim:1, state:slimStateForCode(state)});
  /* btoa is byte-oriented; Romanian text and names are not ASCII. */
  return btoa(unescape(encodeURIComponent(json)));
}
function codeToState(code){
  var json = decodeURIComponent(escape(atob(String(code).replace(/\s+/g,""))));
  var wrapper = JSON.parse(json);
  if(!wrapper || !wrapper.state) throw new Error("not a progress code");
  return rehydrateMistakes(wrapper.state);
}
/* Merge an imported save over the default shape, so a file written by an older
   build still loads: any key the export predates keeps its default rather than
   arriving undefined and breaking a page halfway through a render. */
function applyImportedState(incoming, source){
  var d = defaultState();
  Object.keys(d).forEach(function(k){
    var saved = incoming[k];
    if(saved===undefined || saved===null) return;
    var nested = d[k] && typeof d[k]==="object" && !Array.isArray(d[k])
              && saved && typeof saved==="object" && !Array.isArray(saved);
    d[k] = nested ? Object.assign({}, d[k], saved) : saved;
  });
  state = d;
  writeState();
  session.transferOpen = false;
  session.importCode = "";
  session.transferErr = "";
  session.transferMsg = "Progress restored from "+source+" — "+progressSummaryLine(state)+".";
  render();
}


/* Romanian inserts "de" between a numeral and the noun it counts once the
   numeral reaches 20 — douăzeci DE ani, but nouăsprezece ani. The rule keys off
   the last two digits, so 101 takes no "de" (o sută unu ani) while 120 does. */
function needsDe(n){
  n = Math.floor(Math.abs(n));
  if(n < 20) return false;
  var lastTwo = n % 100;
  return !(lastTwo >= 1 && lastTwo <= 19);
}
function romanianNumber(n, opts){
  opts = opts || {};
  n = Math.floor(Math.abs(n));
  var fem = !!opts.feminine;
  if(n < 10) return (fem ? NUM_ONES_F : NUM_ONES)[n];
  if(n < 20) return NUM_TEENS[n-10];
  if(n < 100){
    var t = Math.floor(n/10), u = n%10;
    return NUM_TENS[t] + (u ? " și " + (fem ? NUM_ONES_F : NUM_ONES)[u] : "");
  }
  if(n < 1000){
    var h = Math.floor(n/100), rest = n%100;
    /* sută is feminine: o sută, două sute, trei sute … */
    var head = h===1 ? "o sută" : NUM_ONES_F[h] + " sute";
    return head + (rest ? " " + romanianNumber(rest, {feminine:fem}) : "");
  }
  if(n < 1000000){
    var th = Math.floor(n/1000), r2 = n%1000;
    /* mie is feminine (o mie, două mii) and is itself a counted noun, so a
       multiplier of 20 or more takes "de": douăzeci DE mii, cinci sute DE mii. */
    var thHead = th===1 ? "o mie"
      : romanianNumber(th, {feminine:true}) + (needsDe(th) ? " de mii" : " mii");
    return thHead + (r2 ? " " + romanianNumber(r2, {feminine:fem}) : "");
  }
  var mil = Math.floor(n/1000000), r3 = n%1000000;
  /* milion is neuter, and neuter nouns take the feminine numeral in the plural:
     două milioane, not *doi milioane. The "de" rule applies here too. */
  var milHead = mil===1 ? "un milion"
    : romanianNumber(mil, {feminine:true}) + (needsDe(mil) ? " de milioane" : " milioane");
  return milHead + (r3 ? " " + romanianNumber(r3, {feminine:fem}) : "");
}

function isYear(n){ return n >= 1000 && n <= 2999; }
function numberNote(n, context){
  var notes = [];
  if(isYear(n)) notes.push("Years are read out in full in Romanian — never split into pairs the way English says “eighteen fifty-nine”.");
  if(needsDe(n) && !isYear(n)) notes.push("Counting a noun needs <b>de</b> from 20 up: <i>" + romanianNumber(n) + " de ani</i>.");
  else if(n >= 20 && !isYear(n)) notes.push("No <b>de</b> here — the last two digits are between 1 and 19: <i>" + romanianNumber(n) + " ani</i>.");
  if(n === 1 && context === "date") notes.push("The first of the month is <b>întâi</b>, not <i>unu</i>.");
  if(String(n).length > 3 && !isYear(n)) notes.push("<b>mie</b> is feminine, so it takes <b>două</b>: <i>două mii</i>.");
  return notes;
}


function buildConjugationDrill(cfg){
  var pool = drillPool(cfg);
  if(!pool.length) return [];
  var tenses = cfg.tenses.length? cfg.tenses : ["present"];
  var out = [];
  for(var i=0; i<cfg.length; i++){
    var v = sample(pool);
    var tense = sample(tenses);
    var T = verbTables(v);
    if(!T[tense]) continue;
    var meta = TENSE_META.find(function(t){ return t.id===tense; });
    if(tense==="imperative"){
      var who = sample(["tu","voi"]);
      /* Verbs whose singular imperative is undeclared (or genuinely unused, as
         with stative a părea) must not become drill questions — there would be
         no correct answer to mark against. */
      if(!T.imperative[who]) continue;
      out.push({
        id:"drill_"+v.id+"_imp_"+who+"_"+i, lesson:null, skill:"grammar", type:"conjugate", diff:3,
        topic:"g_imperative", generated:true, vocab:[],
        prompt: escapeHtml(v.inf)+" — <b>"+who+"</b> — "+meta.ro,
        answer: T.imperative[who], accept:[T.imperative[who], String(T.imperative[who]).replace(/!$/,"")],
        audio: T.imperative[who],
        explain:"<b>"+escapeHtml(T.imperative[who])+"</b> — "+escapeHtml(v.en)+". "+
          (v.notes? escapeHtml(v.notes) : "The voi-imperative is identical to the voi present tense; the tu form is less predictable.")
      });
      continue;
    }
    var person = sample(PERSONS);
    var form = T[tense][person];
    if(!form || form==="—") continue;
    out.push({
      id:"drill_"+v.id+"_"+tense+"_"+person+"_"+i, lesson:null, skill:"grammar", type:"conjugate", diff:3,
      topic: tense==="subjunctive" ? "g_subjunctive" : tense==="imperfect" ? "g_imperfect"
           : tense==="past" ? "g_perfect_compus" : tense==="future" ? "g_future"
           : tense==="conditional" ? "g_conditional" : "g_present",
      generated:true, vocab:[],
      prompt: escapeHtml(v.inf)+" — <b>"+PERSON_LABELS[person]+"</b> — "+meta.ro,
      answer: form, accept:[form],
      audio: form,
      explain:"<b>"+escapeHtml(form)+"</b> — "+escapeHtml(v.en)+" ("+meta.en.toLowerCase()+", "+PERSON_LABELS[person]+")."+
        (verbIsIrregular(v)? " This verb is irregular, so the form has to be known rather than derived." :
          " Conjugation class "+escapeHtml(verbGroupLabel(v))+" — the same endings apply to every verb in that class.")+
        (v.notes? "<br><span style=\"color:var(--text-3)\">"+escapeHtml(v.notes)+"</span>" : "")
    });
  }
  return out;
}

/* ---------- SHADOWING ----------
   Play a line, then hold silence for roughly as long as the line took, so the
   learner repeats it aloud into that gap. Advancing automatically is the point:
   it forces production at the speaker's pace instead of letting you re-read. */


/* ---------- PLACEMENT TEST ---------- */
/* ===================== PLACEMENT TEST =====================
   Organized into bands of four, one band per level, and scored band by band
   rather than by "highest question answered correctly" — a single lucky guess
   must not place someone three levels above where they are.

   Guessing is further constrained by mixing in typed items, which have no
   options at all, and by using four options rather than three on the rest. */
var PLACEMENT_STOP = 0.5;    // below half → stop, the ceiling has been found

  /* Same popup as a glossed word, but the "meaning" of a numeral is how you say
     it — so the body is the Romanian reading, plus whatever rule that number
     happens to illustrate. */
  glossNumber: function(el){
    var n = parseInt(el.getAttribute("data-num"), 10);
    if(!isFinite(n)) return;
    var asDate = el.hasAttribute("data-date");
    var words = (asDate && n === 1) ? "întâi" : romanianNumber(n);
    var notes = numberNote(n, asDate ? "date" : null);
    var body = '<div style="font-family:var(--font-display);font-size:15px;margin-top:2px">'+escapeHtml(words)+'</div>'+
      (isYear(n)? '<div style="opacity:.7;margin-top:3px;font-size:11.5px">year</div>' : '')+
      notes.map(function(t){ return '<div style="opacity:.8;margin-top:5px;font-size:11.5px;line-height:1.45">'+t+'</div>'; }).join("");
    var canSpeak = Speech.statusFor(words) !== "unavailable";
    var audioRow = canSpeak
      ? '<button type="button" class="gloss-play" data-action="replayGloss" data-text="'+escapeHtml(words)+'">'+iconPlay()+' play again</button>'
      : '<div style="opacity:.6;margin-top:6px;font-size:11.5px">No pronunciation clip for this number yet.</div>';
    showGlossPopup(el, String(n), body + audioRow, canSpeak ? words : null);
  },
  glossWord: function(el){
    var w = el.getAttribute("data-word"), def = el.getAttribute("data-def");
    var g = glossLookup(w);
    var body;
    if(def){
      // A per-text glossary note always wins — it is written for this passage.
      body = '<div>'+escapeHtml(def)+'</div>';
    } else if(g){
      body = '<div>'+escapeHtml(g.en)+'</div>'+
        (g.pos? '<div style="opacity:.7;margin-top:3px">'+escapeHtml(g.pos)+'</div>' : '')+
        (g.lemma && normLoose(g.lemma)!==normLoose(w)
          ? '<div style="opacity:.7;margin-top:2px">'+(g.partOfPhrase?"part of":"from")+' <b>'+escapeHtml(g.lemma)+'</b></div>' : '')+
        (g.note? '<div style="opacity:.75;margin-top:4px">'+escapeHtml(g.note)+'</div>' : '');
    } else {
      body = '<div>Not in the course glossary yet.</div>'+
        '<div style="opacity:.7;margin-top:3px">Search it under Vocabulary, or check the verb reference if it looks like a verb form.</div>';
    }
    /* Say whether this word can actually be pronounced, and give a control to
       replay it. Auto-playing once and going silent left no way to tell a
       missing clip from a missed moment. */
    var canSpeak = Speech.statusFor(w) !== "unavailable";
    var audioRow = canSpeak
      ? '<button type="button" class="gloss-play" data-action="replayGloss" data-text="'+escapeHtml(w)+'">'+iconPlay()+' play again</button>'
      : '<div style="opacity:.6;margin-top:6px;font-size:11.5px">No pronunciation clip for this word yet.</div>';

    showGlossPopup(el, w, body + audioRow, canSpeak ? w : null);
  },

  submitExercise: function(el){
    var id = el.getAttribute("data-ex");
    var ex = findExercise(id); if(!ex || session.feedback[id]) return;
    var result;
    if(ex.type==="mcq"||ex.type==="reading_q"||ex.type==="minimal_pair"){
      var sel = session.answers[id];
      if(sel==null) return;
      result = (sel===ex.correct)
        ? {verdict:"correct", correct:ex.options[ex.correct]}
        : {verdict:"incorrect", correct:ex.options[ex.correct],
           // strip the option's own terminal punctuation so we don't print ".."
           diagnosis:"You chose <b>"+escapeHtml(String(ex.options[sel]).replace(/[.!?]+$/,""))+"</b>."};
    } else if(ex.type==="build"){
      result = checkBuild(ex);
    } else if(ex.type==="order_lines"){
      result = checkOrder(ex);
    } else if(ex.type==="gapfill"){
      result = checkGapfill(ex);
    } else if(ex.type==="match"){
      var picks = session.matched[id]||{};
      var wrong = ex.pairs.filter(function(p,i){ return String(picks[i])!==String(i); }).length;
      result = wrong===0 ? {verdict:"correct"} :
        {verdict:"incorrect", diagnosis:wrong+" of "+ex.pairs.length+" pairs are not matched correctly. The correct pairings are shown above."};
    } else if(ex.type==="produce"){
      result = checkProduce(ex, session.answers[id]);
    } else {
      result = checkAnswer(ex, session.answers[id]);
    }
    gradeAndRecord(ex, result);
    render();
  },

  finishLesson: function(el){
    var id = el.getAttribute("data-lesson");
    var l = lessonById(id); if(!l) return;
    var ids = []; l.sections.forEach(function(s){ (s.exerciseIds||[]).forEach(function(x){ if(ids.indexOf(x)===-1) ids.push(x); }); });
    var answered = ids.filter(function(x){ return session.feedback[x]; });
    /* "submitted" means open writing the app cannot grade — it is neither right
       nor wrong, so it must not sit in the denominator. Counting it as a miss
       capped every lesson containing a free-writing task below the 80% needed
       to complete it, no matter how well the learner did. */
    var scorable = ids.filter(function(x){
      var f = session.feedback[x]; return !f || f.verdict!=="submitted";
    });
    var correct = scorable.filter(function(x){
      var f = session.feedback[x]; return f && f.verdict==="correct";
    }).length;
    var score = scorable.length? pct(correct, scorable.length) : 100;
    var prev = lessonProgress(id);
    state.progress.lessons[id] = {
      status: (answered.length===ids.length && score>=80) ? "complete" : "partial",
      bestScore: Math.max(prev.bestScore||0, score),
      attempts: (prev.attempts||0)+1,
      sectionsDone: {}
    };
    // Words from this lesson enter the review queue.
    l.sections.forEach(function(s){ (s.vocabIds||[]).forEach(function(v){ getVocabState(v); }); });
    markActivityToday(); persist();
    session.lastLessonResult = {id:id, score:score, answered:answered.length, total:ids.length, correct:correct};

  clearGrammarFilters: function(){
    session.grammarLevel="all"; session.grammarCat="all"; session.grammarQuery="";
    render();
  },
  verbSearch: function(el){ session.verbQuery = el.value; render(); },
  setVerbGroup: function(el){ session.verbGroup = el.getAttribute("data-g"); render(); },
  toggleDrillTense: function(el){
    var cfg = session.drillCfg || (session.drillCfg = {tenses:["present"], scope:"all", length:15});
    var t = el.getAttribute("data-t");
    var i = cfg.tenses.indexOf(t);
    if(i>-1) cfg.tenses.splice(i,1); else cfg.tenses.push(t);
    render();
  },
  setDrillScope: function(el){
    (session.drillCfg = session.drillCfg||{tenses:["present"],scope:"all",length:15}).scope = el.getAttribute("data-s");
    render();
  },
  setDrillLength: function(el){
    (session.drillCfg = session.drillCfg||{tenses:["present"],scope:"all",length:15}).length = parseInt(el.getAttribute("data-n"),10);
    render();
  },
  startDrill: function(){
    var items = buildConjugationDrill(session.drillCfg);
    if(!items.length) return;
    startQueue("drill", items);
  },
  /* From a verb page: drill this one tense across the whole verb list, which is
     the practice that actually fixes a paradigm — one verb's table on screen is
     recognition, not recall. */
  drillThisTense: function(el){
    session.drillCfg = {tenses:[el.getAttribute("data-tense")], scope:"all", length:15};
    session.queue = null; session.queueKind = null;
    navigate("drill");
  },
  vocabSearch: function(el){ session.vocabQuery = el.value; render(); },
  setVocabFilter: function(el){ session.vocabFilter = el.getAttribute("data-f"); render(); },

  exportProgress: function(){
    writeState();
    var blob = new Blob([JSON.stringify({v:2, at:new Date().toISOString(), state:state}, null, 1)],
                        {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "drumul-progress-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    session.transferMsg = "Progress file downloaded. Open the course in the other browser, go to Progress → Import progress, and choose this file.";
    session.transferErr = ""; render();
  },
  /* Show the code as well as trying to copy it. Clipboard access is refused in
     plenty of ordinary situations — file:// pages, an unfocused window, a
     locked-down browser — and a button whose only outcome is an error message
     is a dead button. The textarea always works. */
  copyProgressCode: function(){
    writeState();
    var code = stateToCode();
    session.transferCode = code;
    session.transferErr = "";
    session.transferMsg = "Transfer code ready ("+code.length+" characters). Copy all of it, then paste it into Progress → Import progress in the other browser.";
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(function(){
        session.transferMsg = "Transfer code copied to the clipboard ("+code.length+" characters). Paste it into Progress → Import progress in the other browser.";
        render();
      }, function(){ /* keep the textarea fallback message */ });
    }
    render();
  },
  toggleImport: function(){
    session.transferOpen = !session.transferOpen;
    session.transferMsg = ""; session.transferErr = ""; render();
  },
  typeImport: function(el){ session.importCode = el.value; },
  importProgress: function(){
    try{
      var incoming = codeToState(session.importCode||"");
      applyImportedState(incoming, "transfer code");
    }catch(e){
      session.transferErr = "That doesn't look like a transfer code from this course. Copy the whole thing, with no line breaks removed.";
      session.transferMsg = ""; render();
    }
  },
  importFile: function(el){
    var f = el.files && el.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var wrapper = JSON.parse(rd.result);
        if(!wrapper || !wrapper.state) throw new Error("bad file");
        applyImportedState(rehydrateMistakes(wrapper.state), f.name);
      }catch(e){
        session.transferErr = "That file isn't a progress export from this course.";
        session.transferMsg = ""; render();
      }
    };
    rd.readAsText(f);
  },
  resetProgress: function(){
    if(!window.confirm("This permanently deletes all your progress, vocabulary history and saved mistakes in this browser. Continue?")) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state = defaultState();
    session = defaultSession();
    navigate("home");
  }
};
/* Shadowing runner. Plays the current line, then holds a silent gap scaled to
   the line's length so there is time to repeat it, then advances by itself. */
var shadowTimer = null;
var glossTimer = null;
/* One popup implementation for both words and numerals — positioning, the
   dismiss timer and the hover-to-keep-open behaviour are identical, and the
   replay control is only reachable because of that timer handling. */
function showGlossPopup(el, title, innerHtml, speakText){
  var old = document.querySelector(".gloss-pop"); if(old) old.remove();
  var pop = document.createElement("div");
  pop.className = "gloss-pop";
  pop.innerHTML = '<b>' + escapeHtml(title) + '</b>' + innerHtml;
  document.body.appendChild(pop);
  var r = el.getBoundingClientRect();
  pop.style.left = Math.min(r.left, window.innerWidth - 250) + "px";
  pop.style.top = (r.bottom + 6) + "px";
  if(speakText) Speech.speak(speakText);
  clearTimeout(glossTimer);
  /* Long enough, and canceled while the pointer is over the popup, so the
     replay control is actually reachable. */
  glossTimer = setTimeout(function(){ pop.remove(); }, 9000);
  pop.addEventListener("mouseenter", function(){ clearTimeout(glossTimer); });
  pop.addEventListener("mouseleave", function(){
    glossTimer = setTimeout(function(){ pop.remove(); }, 1500);
  });
}
/* Advance the placement test, stopping early once a band is clearly beyond the
   learner — there is no point asking B1.2 questions of someone who could not
   clear A1.2, and every extra guess only adds noise to the result. */
function recordPlacement(answer){
  var st = session.placement; if(!st || st.done) return;
  st.answers[st.bandIndex+"_"+st.itemIndex] = answer;
  st.typed = "";
  var items = st.picks[st.bandIndex];

  if(st.itemIndex < items.length-1){
    st.itemIndex++;
    render();
    return;
  }
  // Band finished — score it before deciding whether to continue.
  var correct = 0;
  items.forEach(function(item, i){
    var a = st.answers[st.bandIndex+"_"+i];
    if(item.type==="mcq"){ if(a===item.a) correct++; }
    else if(a && item.accept.some(function(x){ return normLoose(a)===normLoose(x); })) correct++;
  });
  var ratio = correct / items.length;
  var lastBand = st.bandIndex >= PLACEMENT_BANDS.length-1;

  if(lastBand || ratio < PLACEMENT_STOP){
    st.done = true;
  } else {
    st.bandIndex++; st.itemIndex = 0;
  }
  render();
}
function runShadowLine(){
  var s = session.shadow; if(!s) return;
  var d = dialogueById(s.dialogueId); if(!d) return;
  var line = d.lines[s.index];
  clearTimeout(shadowTimer);
  s.phase = "listen"; render();
  Speech.speak(line.ro, {
    onend: function(){
      if(!session.shadow || session.shadow!==s) return;
      s.phase = "repeat"; render();
      // Roughly the time the line itself took, floored at 1.8s.
      var gap = Math.max(1800, line.ro.length * 85 / (state.settings.audioSpeed||1));
      shadowTimer = setTimeout(function(){
        if(!session.shadow || session.shadow!==s) return;
        if(s.index < d.lines.length-1){ s.index++; runShadowLine(); }
        else { session.shadow = null; render(); }
      }, gap);
    },
    onerror: function(){
      if(!session.shadow || session.shadow!==s) return;
      s.phase = "repeat"; render();
    }
  });
}
function startQueue(kind, exercises){
  session.queue = exercises; session.queueKind = kind;
  session.qIndex = 0; session.sessionDone = false;
  /* Clear everything per-attempt, including the option permutation — a new
     session must not present the same answer in the same position. */
  exercises.forEach(function(e){
    delete session.feedback[e.id]; delete session.answers[e.id];
    delete session.built[e.id];    delete session.matched[e.id];
    delete session.gaps[e.id];     delete session.optOrder[e.id];
  });
  render();
}
/* Vocabulary review re-uses whichever course exercises tag the due words; if a
   word has no exercise yet, it gets a generated recognition question so the
   queue is never empty. */
function buildVocabQueue(ids){
  var out = [];
  ids.forEach(function(vid){
    var tagged = openExercises().filter(function(e){ return (e.vocab||[]).indexOf(vid)>-1; });
    if(tagged.length){ out.push(sample(tagged)); return; }
    var v = vocabById(vid); if(!v) return;
    var distractors = pick(VOCAB.filter(function(x){ return x.id!==vid && x.pos===v.pos; }), 2);
    if(distractors.length<2) return;
    var opts = shuffle([v].concat(distractors));
    out.push({
      id:"gen_"+vid, lesson:null, skill:"vocabulary", type:"mcq", diff:1, topic:null, generated:true,
      prompt:'What does <span class="ro" style="font-family:var(--font-display);font-size:20px">'+escapeHtml(v.ro)+'</span> mean?',
      options: opts.map(function(o){ return o.en; }), correct: opts.indexOf(v),
      audio: v.ro, vocab:[vid],
      explain:"<b>"+escapeHtml(v.ro)+"</b> — "+escapeHtml(v.en)+(v.ex? "<br><i>"+escapeHtml(v.ex.ro)+"</i> — "+escapeHtml(v.ex.en):"")
    });
  });
  return out.filter(Boolean);
}

   progressSummaryLine moved to js/features/progress.js. Both load above

/* The application chrome — renderTopbar and mobileNav — now lives in
   js/core/topbar.js, loaded above this script, along with the icon helpers
   (js/core/icons.js) and navIsActive (js/core/navigation.js) it calls.
   renderApp — now in js/core/render.js — still calls renderTopbar();
   shell() still calls mobileNav(). */


/* captureField and restoreField now live in js/core/fields.js, loaded just
   above this script. renderApp — now in js/core/render.js — still calls
   both across that script boundary. */


/* The back-to-top control (scrollTopBtn, ensureScrollTop, updateScrollTop and
   its three listeners) now lives in js/core/scroll.js, loaded just above this
   script. renderApp — now in js/core/render.js — still calls

/* Actions that must NOT fire on click — they are driven by input/change so the
   field keeps its own value while the learner types. */
var INPUT_DRIVEN = {typeAnswer:1, typeGap:1, typePlacement:1, grammarSearch:1, vocabSearch:1,
                    verbSearch:1, pickMatch:1, toggleMotion:1, toggleProfanity:1, typeImport:1, importFile:1,
                    typeTranscript:1};

document.addEventListener("click", function(e){
  /* A glossable word can sit inside a clickable control (an MCQ option, a
     dialogue line). Looking a word up must not also trigger the control, so
     the innermost gloss wins and stops there. */
  var gloss = e.target.closest('[data-action="glossWord"],[data-action="glossNumber"]');
  if(gloss){
    e.preventDefault(); e.stopPropagation();
    Actions[gloss.getAttribute("data-action")](gloss, e);
    return;
  }
  var el = e.target.closest("[data-action]");
  if(!el || el.disabled) return;
  var name = el.getAttribute("data-action");
  if(INPUT_DRIVEN[name]) return;
  var fn = Actions[name];
  if(fn){ fn(el, e); }
});
/* Live typing: update the model without a re-render, so the caret stays put. */
document.addEventListener("input", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var name = el.getAttribute("data-action");
  /* Model-only updates: no re-render, so the caret stays where the learner
     put it. Every typed field must be listed here or its value is silently
     dropped when the answer is checked. */
  if(name==="typeAnswer" || name==="typeGap" || name==="typePlacement" || name==="typeImport" || name==="typeTranscript"){
    Actions[name](el, e);
    return;
  }
  if(name==="grammarSearch" || name==="vocabSearch" || name==="verbSearch"){
    clearTimeout(el._deb);
    el._deb = setTimeout(function(){ Actions[name](el, e); }, 220);
  }
});
document.addEventListener("change", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var name = el.getAttribute("data-action");
  if(name==="pickMatch" || name==="toggleMotion" || name==="toggleProfanity" || name==="importFile"){ Actions[name](el, e); }
});
/* Keyboard activation for the div-based rows that act as buttons. */
document.addEventListener("keydown", function(e){
  if(e.key!==" " && e.key!=="Enter") return;
  var el = e.target.closest('[role="button"][data-action]');
  if(!el) return;
  e.preventDefault();
  var fn = Actions[el.getAttribute("data-action")];
  if(fn) fn(el, e);
});
/* Enter submits the exercise the learner is actually in — resolve outward from
   the focused field rather than grabbing the first match in the document, which
   fires the wrong one on review pages that show several exercises at once.
   Shift+Enter stays free for newlines in the B1 paragraph-writing tasks. */
document.addEventListener("keydown", function(e){
  if(e.key!=="Enter" || e.shiftKey) return;
  var active = document.activeElement;
  if(!active || active.tagName!=="INPUT") return;
  var el = active.closest("[data-enter-action]") || document.querySelector("[data-enter-action]");
  if(!el) return;
  var fn = Actions[el.getAttribute("data-enter-action")];
  if(fn){ e.preventDefault(); fn(el, e); }
});

/* Audit hook: dump the generated conjugation of one verb, or the present tense
   of every verb, so tables produced by the engine can be checked against a
   reference instead of trusted. Generated forms are only as good as the class
   each verb was tagged with, and a wrong ending taught confidently is worse
   than no table at all. */
window.__verbAudit = function(inf){
  if(inf){
    var v = VERBS.find(function(x){ return x.inf===inf || x.id===inf; });
    return v ? {inf:v.inf, group:v.group, irregular:!!v.irregular, tables:verbTables(v)} : null;
  }
  return VERBS.map(function(v){
    var t = verbTables(v);
    return {inf:v.inf, group:verbGroupKey(v), irr:!!v.irregular, hand:!!v.present,
            present:PERSONS.map(function(p){ return t.present[p]; }).join(" · "),
            part:t.participle, subj3:t.subjunctive.el, imp:t.imperative.tu};
  });
};

/* Build-tool hook: every Romanian string in the course that has a play button.
   tools/fetch-audio.py reads this to pre-render native pronunciation clips. */
window.__roAudioStrings = function(){
  var out = {};
  var add = function(s){ if(s && String(s).trim()) out[String(s).trim()] = 1; };
  VOCAB.forEach(function(v){ add(v.ro); if(v.ex) add(v.ex.ro); });
  DIALOGUES.forEach(function(d){ d.lines.forEach(function(l){ add(l.ro); }); });
  GRAMMAR_TOPICS.forEach(function(g){ (g.examples||[]).forEach(function(e){ add(e.ro); }); });
  VERBS.forEach(function(v){
    add(v.inf); if(v.example) add(v.example.ro);
    ["present","past","imperfect","future","conditional","subjunctive"].forEach(function(t){
      if(v[t]) Object.keys(v[t]).forEach(function(p){ add(v[t][p]); });
    });
    if(v.imperative){ add(v.imperative.tu); add(v.imperative.voi); }
  });
  EXERCISES.forEach(function(e){
    add(e.audio);
    (e.audioFor||[]).forEach(add);
    if(e.answer) add(e.answer);
    if(e.type==="match") (e.pairs||[]).forEach(function(p){ add(p[0]); });
  });
  READING_TEXTS.forEach(function(r){ add(r.ro.replace(/\s+/g," ")); });
  return Object.keys(out);
};

/* boot */
render();

})();
