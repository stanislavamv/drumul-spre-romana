/* ---------- COURSE DATA ----------
   Every content dataset now lives in js/data/*.js, loaded above this script as
   classic scripts, so each is a global here exactly as before. The files are
   ordered by their original position in this file; see js/data/courses.js for

/* ===================== SPEECH / AUDIO ABSTRACTION ===================== */
/* ---------------------------------------------------------------------------
   AUDIO ASSETS — prerecorded native-speaker clips, keyed by the exact Romanian
   string they voice. Stored separately from lesson content (per the brief) so
   recordings can be added without touching a single lesson, vocabulary entry
   or exercise.

   Drop in entries as:  "bună ziua": "audio/buna-ziua.mp3"
   or a data: URI. Anything listed here is used in preference to speech
   synthesis. Keys are matched case- and diacritic-insensitively.

   This ships EMPTY: no native recordings are bundled. Until it is populated,
   playback falls back to a Romanian TTS voice — and if none is installed, the
   app refuses to speak rather than mispronouncing Romanian in an English voice.
--------------------------------------------------------------------------- */
var AUDIO_ASSETS = {
  // "bună ziua": "audio/buna-ziua.mp3",
};

/* Pronunciation comes from pre-rendered clips (see audio-manifest.js). Fetching
   Google's translate_tts live from the page is not possible: it rejects
   browser-originated requests — the Sec-Fetch-* / Origin headers mark them as
   hotlinking and it returns an HTML error page instead of audio, and those
   headers are forbidden to JavaScript. tools/fetch_audio.py does the fetching
   from a non-browser client instead, which also makes playback work offline. */
var AUDIO_ASSET_INDEX = null;
function buildAssetIndex(){
  AUDIO_ASSET_INDEX = {};
  /* audio-manifest.js (generated by tools/fetch_audio.py) is keyed by the same
     normLoose() form used here, so it merges in directly. */
  var m = window.AUDIO_MANIFEST;
  if(m) Object.keys(m).forEach(function(k){ AUDIO_ASSET_INDEX[k] = m[k]; });
  /* Hand-added entries win over generated ones. */
  Object.keys(AUDIO_ASSETS).forEach(function(k){ AUDIO_ASSET_INDEX[normLoose(k)] = AUDIO_ASSETS[k]; });
  return AUDIO_ASSET_INDEX;
}
function assetFor(text){
  if(AUDIO_ASSET_INDEX===null) buildAssetIndex();
  var k = normLoose(text);
  if(AUDIO_ASSET_INDEX[k]) return AUDIO_ASSET_INDEX[k];
  /* Poetic elisions (nost', într') are stored under the unelided stem. */
  var stripped = normLoose(String(text||"").replace(/['’]+$/,""));
  return AUDIO_ASSET_INDEX[stripped] || null;
}
function assetCount(){
  if(AUDIO_ASSET_INDEX===null) buildAssetIndex();
  return Object.keys(AUDIO_ASSET_INDEX).length;
}

var Speech = (function(){
  var voices=[], roVoice=null, current=null, audioEl=null, gtFailed=false;

  /* Rank Romanian voices best-first. Edge exposes free online neural voices
     (Emil / Alina, ro-RO) that are modelled on native speakers; those are the
     best available without shipping recordings. Offline SAPI voices come next.
     A non-Romanian voice is NEVER an acceptable fallback. */
  function scoreVoice(v){
    if(!/^ro(-|_|$)/i.test(v.lang)) return -1;
    var n = (v.name||"").toLowerCase();
    var s = 10;
    if(/natural|neural/.test(n)) s += 40;
    if(/online/.test(n)) s += 20;
    if(/\bro-ro\b/i.test(v.lang)) s += 5;
    if(v.localService) s += 3;
    return s;
  }
  function refresh(){
    try{
      voices = window.speechSynthesis ? (window.speechSynthesis.getVoices()||[]) : [];
      var ro = voices.filter(function(v){ return scoreVoice(v) >= 0; })
                     .sort(function(a,b){ return scoreVoice(b)-scoreVoice(a); });
      roVoice = ro[0] || null;
    }catch(e){ voices=[]; roVoice=null; }
    return roVoice;
  }
  if(typeof window!=="undefined" && window.speechSynthesis){
    refresh();
    /* Voice lists populate asynchronously — and on Edge the online neural
       voices arrive seconds after the offline ones. Re-check and repaint so the
       audio controls stop showing as unavailable once Romanian appears. */
    window.speechSynthesis.onvoiceschanged = function(){
      var had = !!roVoice;
      refresh();
      if(!!roVoice !== had && typeof render==="function") render();
    };
    [400, 1200, 3000].forEach(function(ms){
      setTimeout(function(){
        var had = !!roVoice;
        refresh();
        if(!!roVoice !== had && typeof render==="function") render();
      }, ms);
    });
  }
  function hasNativeVoice(){ return !!roVoice; }
  function voiceName(){ return roVoice ? roVoice.name : null; }
  function romanianVoices(){ return voices.filter(function(v){ return scoreVoice(v)>=0; }); }
  /* What will actually happen if the learner presses play on this text. */
  function statusFor(text){
    if(text && assetFor(text)) return "asset";   // pre-rendered Romanian clip
    if(roVoice) return "tts";                    // local Romanian voice
    return "unavailable";                        // refuse — do not mispronounce
  }
  function sourceLabel(){
    if(assetCount()) return "Pre-rendered Romanian clips";
    if(roVoice) return roVoice.name;
    return "unavailable";
  }
  function googleFailed(){ return gtFailed; }
  function resetSource(){ gtFailed = false; AUDIO_ASSET_INDEX = null; }
  function speakLocal(text, rate, opts){
    if(!window.speechSynthesis) return false;
    if(!roVoice) refresh();
    /* REFUSE to speak Romanian in a non-Romanian voice. Reading Romanian
       through an English voice teaches wrong phonology — worse for the learner
       than silence. The UI explains and offers a fix instead. */
    if(!roVoice) return false;
    var u = new SpeechSynthesisUtterance(unifyRomanian(text));
    u.voice = roVoice;
    u.lang = roVoice.lang || "ro-RO";
    u.rate = rate; u.pitch = 1;
    if(opts.onend) u.onend = opts.onend;
    if(opts.onstart) u.onstart = opts.onstart;
    current = u;
    /* Chrome drops an utterance queued in the same tick as cancel(). */
    setTimeout(function(){ try{ window.speechSynthesis.speak(u); }catch(e){} }, 0);
    return true;
  }

  function speak(text, opts){
    stop();
    seqCancelled = false;
    return speakOne(text, opts);
  }
  /* Single utterance, without canceling what's already queued — so
     speakSequence can chain calls without killing its own playback. */
  function speakOne(text, opts){
    opts = opts||{};
    var rate = opts.rate || state.settings.audioSpeed || 1;

    /* 1. A bundled native-speaker recording always wins. */
    var src = assetFor(text);
    if(src){
      try{
        audioEl = new Audio(src);
        audioEl.playbackRate = rate;
        if(opts.onend) audioEl.onended = opts.onend;
        audioEl.onerror = function(){ if(opts.onerror) opts.onerror(); };
        audioEl.play().catch(function(){ if(opts.onerror) opts.onerror(); });
        return {ok:true, mode:"asset"};
      }catch(e){ /* fall through */ }
    }

    /* 2. Locally installed Romanian voice. */
    if(speakLocal(text, rate, opts)) return {ok:true, mode:"tts", voice:roVoice.name};

    /* 3. Nothing correct is available — stay silent and say so. */
    if(opts.onerror) opts.onerror();
    return {ok:false, mode:"unavailable", reason:"no-romanian-voice"};
  }
  /* Play several lines back to back — used for dialogue "Play all" and any
     multi-line passage. Each line resolves to its own clip, so a dialogue never
     depends on a clip existing for the whole concatenated transcript. */
  var seqCancelled = false;
  function speakSequence(texts, opts){
    opts = opts||{};
    stop();
    seqCancelled = false;
    var i = 0;
    function next(){
      if(seqCancelled) return;
      if(i >= texts.length){ if(opts.onend) opts.onend(); return; }
      var t = texts[i++];
      var res = speakOne(t, {
        rate: opts.rate,
        onend: function(){ setTimeout(next, 260); },   // a beat between lines
        onerror: function(){ setTimeout(next, 60); }   // skip a missing clip
      });
      if(!res.ok) setTimeout(next, 60);
    }
    next();
    return {ok:true, mode:"sequence"};
  }
  function stop(){
    current = null;
    seqCancelled = true;
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    if(audioEl){ try{ audioEl.pause(); }catch(e){} audioEl = null; }
  }
  return {speak:speak, speakSequence:speakSequence, stop:stop,
          hasNativeVoice:hasNativeVoice, refresh:refresh,
          voiceName:voiceName, romanianVoices:romanianVoices, statusFor:statusFor,
          sourceLabel:sourceLabel, googleFailed:googleFailed, resetSource:resetSource};
})();

/* The conjugation engine (verbTables, conjugateAll, applyReflexive and the

/* The gloss engine (GLOSS_INDEX, VERB_STEMS, glossPut, buildGlossIndex,
   buildVerbStems, glossLookup, looksRomanian, glossify) now lives in
   js/features/gloss.js; sentencesOf moved to js/core/utils.js. Both load

// pos: noun/verb/adj/adv/phrase/pron/prep/conj/num


function glossCoverage(text){
  var words = String(text||"").split(/\s+/).map(function(w){ return w.replace(/[.,!?;:()"„”—–]/g,""); })
    .filter(function(w){ return w.length>1 && !/^\d+$/.test(w); });
  var hit = words.filter(function(w){ return glossLookup(w); }).length;
  return {total:words.length, hit:hit, pct:pct(hit, words.length)};
}


/* Exercises can be generated at runtime (dictation drills, order-the-lines,
   gap-fill, vocabulary review cards) and never enter EXERCISES. Anything that
   resolves an id from the DOM must search the live session first, or those
   activities silently refuse to submit. */
function findExercise(id){
  var pools = [];
  if(session.queue) pools.push(session.queue);
  if(session.exam && session.exam.items) pools.push(session.exam.items);
  for(var i=0;i<pools.length;i++){
    var hit = pools[i].find(function(e){ return e && e.id===id; });
    if(hit) return hit;
  }
  return exerciseById(id);
}


/* ===================== EXERCISE ENGINE (loaded below) ===================== */
/* The transient `session` object now lives in js/core/session.js, loaded just
   above this script. It stays separate from `state` on purpose: session is
   never persisted. Every reader, the 87 property writes and the one full
   reassignment in resetProgress all remain here and resolve out to it. */


function levenshtein(a,b){
  if(a===b) return 0;
  var m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  var prev=new Array(n+1), cur=new Array(n+1), i, j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    var t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
function sameWordsAnyOrder(a,b){
  var wa=norm(a).split(" ").filter(Boolean).sort();
  var wb=norm(b).split(" ").filter(Boolean).sort();
  return wa.length===wb.length && wa.join(" ")===wb.join(" ");
}

function stripLeadPronoun(s){
  var w = norm(s).split(" ");
  if(w.length>1 && SUBJECT_PRONOUNS.indexOf(w[0])>-1) return w.slice(1).join(" ");
  return norm(s);
}

/* Graded verdict: correct | almost | unnatural | incorrect.
   `almost` means the meaning is right but the form has a small defect the
   learner should see named — most often missing diacritics. */
function checkAnswer(ex, given){
  var raw = String(given==null?"":given).trim();
  if(!raw) return {verdict:"incorrect", diagnosis:"You didn't enter an answer.", correct:primaryAnswer(ex)};

  var accepted = (ex.accept && ex.accept.length ? ex.accept : [ex.answer]).filter(Boolean);
  var target = primaryAnswer(ex);

  // 1. exact (ignoring case, punctuation, cedilla-vs-comma)
  for(var i=0;i<accepted.length;i++){
    if(norm(raw)===norm(accepted[i])) return {verdict:"correct", correct:target};
  }
  // 2. right but for the subject pronoun
  for(i=0;i<accepted.length;i++){
    if(stripLeadPronoun(raw)===stripLeadPronoun(accepted[i])) return {verdict:"correct", correct:target};
  }
  // 3. right words, missing diacritics
  for(i=0;i<accepted.length;i++){
    if(normLoose(raw)===normLoose(accepted[i])){
      return {verdict:"almost", correct:target,
        diagnosis:"Your words are right, but some Romanian diacritics are missing. Compare your spelling with the answer below — <b>ă â î ș ț</b> are letters in their own right, not accents you can leave off."};
    }
  }
  // 4. right words, wrong order
  for(i=0;i<accepted.length;i++){
    if(sameWordsAnyOrder(raw, accepted[i])){
      return {verdict:"unnatural", correct:target,
        diagnosis:"You used exactly the right words, but not in the order a Romanian would choose here. Romanian word order is flexible, yet each arrangement carries a different emphasis."};
    }
  }
  // 5. one or two characters off — a typo or a single ending
  var best = Infinity;
  accepted.forEach(function(a){ best = Math.min(best, levenshtein(normLoose(raw), normLoose(a))); });
  if(best<=2){
    return {verdict:"almost", correct:target,
      diagnosis:"Very close — this looks like a small slip in an ending or a single letter. Read your answer against the correct one word by word."};
  }
  return {verdict:"incorrect", correct:target, diagnosis:diagnose(ex, raw)};
}
function primaryAnswer(ex){
  if(ex.answer) return ex.answer;
  if(ex.type==="mcq"||ex.type==="minimal_pair"||ex.type==="reading_q") return ex.options[ex.correct];
  return "";
}
/* Name the specific mistake where we can recognize it, rather than only
   restating the expected string. These patterns are real learner errors. */
function diagnose(ex, raw){
  var n = normLoose(raw);
  if(/\bsunt (mers|venit|plecat|dus|fost la)\b/.test(n) || /\b(sunt|este|esti) (mers|venit|plecat)\b/.test(n))
    return "You used <b>a fi</b> as the past auxiliary. Romanian's perfectul compus always builds on <b>a avea</b>: <i>am mers</i>, never <i>sunt mers</i>.";
  if(/^eu este\b/.test(n) || /\beu (este|e|are)\b/.test(n))
    return "The verb doesn't agree with <b>eu</b>. Check the person endings before anything else — that is what carries the subject in Romanian.";
  if(/\bvreau (invat|merg|fac)\b/.test(n))
    return "After <b>a vrea</b> you need <b>să</b> + subjunctive: <i>vreau să învăț</i>. Romanian rarely uses a bare infinitive here.";
  if(ex.type==="conjugate")
    return "That isn't a form of this verb in the tense asked for. Check the verb reference — irregular verbs in particular have to be memorized as a block.";
  if(/\btrezesc\b/.test(n) && !/\bma trezesc\b/.test(n))
    return "This verb is reflexive: the pronoun <b>mă</b> is part of it, not optional.";
  return "Not quite. Read the correct answer and the explanation below, then try saying it aloud once before you continue.";
}

/* Sentence-construction and matching have their own comparators. */
/* session.built holds INDICES into ex.words, not the words themselves — they
   have to be mapped back before comparison, or every answer is graded against
   a string like "3 0 1 2". */
function builtSentence(ex){
  return (session.built[ex.id]||[])
    .map(function(i){ return ex.words[i]; })
    .filter(Boolean)
    .join(" ");
}
function checkBuild(ex){
  return checkAnswer(ex, builtSentence(ex));
}
/* Ordering is graded on sequence, and the feedback names how far off it was —
   one swapped pair is a different kind of error from a scrambled guess. */
function checkOrder(ex){
  var placed = session.built[ex.id] || [];
  var n = ex.lines.length;
  if(placed.length < n){
    return {verdict:"incorrect", correct:ex.lines.map(function(l){return l.ro;}).join(" / "),
      diagnosis:"You've placed "+placed.length+" of "+n+" lines. Put them all in order before checking."};
  }
  var wrong = placed.filter(function(idx,pos){ return idx!==pos; }).length;
  if(wrong===0) return {verdict:"correct", correct:ex.lines.map(function(l){return l.ro;}).join(" / ")};
  return {
    verdict: wrong<=2 ? "almost" : "incorrect",
    correct: ex.lines.map(function(l){return l.ro;}).join(" / "),
    diagnosis: wrong===2
      ? "Two lines are swapped — the rest of the sequence is right. Replay the conversation and listen for which one answers which."
      : wrong+" of "+n+" lines are out of place. Try playing it at 0.65× and following the question-and-answer pairs rather than individual words."
  };
}
function checkGapfill(ex){
  var gaps = session.gaps[ex.id] || {};
  var wrong = [], nearMiss = 0;
  ex.answers.forEach(function(a,i){
    var given = gaps[i]||"";
    if(norm(given)===norm(a)) return;
    if(normLoose(given)===normLoose(a)){ nearMiss++; return; }
    wrong.push(a);
  });
  if(!wrong.length && !nearMiss) return {verdict:"correct", correct:ex.fullText};
  if(!wrong.length) return {verdict:"almost", correct:ex.fullText,
    diagnosis:"Every word is right, but "+nearMiss+" of them "+(nearMiss===1?"is":"are")+" missing diacritics. Those letters are part of the spelling, not decoration."};
  return {
    verdict: wrong.length<=1 ? "almost" : "incorrect",
    correct: ex.fullText,
    diagnosis: wrong.length+" of "+ex.answers.length+" gaps "+(wrong.length===1?"is":"are")+" wrong. Replay at a slower speed — the missing words are unstressed in connected speech, which is exactly what makes them hard to catch."
  };
}

/* ---- Generators: build activities from dialogues that already exist ---- */
function buildOrderExercise(d){
  return {
    id:"ord_"+d.id, lesson:null, skill:"listening", type:"order_lines", diff:3,
    topic:null, generated:true, lines:d.lines,
    prompt:"Listen to the whole conversation, then put the lines back in the order you heard them.",
    explain:"Following a conversation means tracking who answers what, not catching every word. "+
      "Question-and-answer pairs are the anchor: a line ending in a question mark is almost always followed by the reply to it. "+
      "From the dialogue <i>"+escapeHtml(d.title)+"</i> — "+escapeHtml(d.titleEn)+"."
  };
}
/* Gap-fill is offered from A2 upward only: below that, the learner has not met
   enough vocabulary for a blank to be a listening test rather than a lottery. */
function gapfillEligible(levelId){ return /^(a2|b1)/.test(String(levelId||"")); }
function buildGapfill(id, text, levelId, title){
  if(!gapfillEligible(levelId)) return null;
  var clean = String(text||"").replace(/\s+/g," ").trim();
  var raw = clean.split(" ");
  // Blank content words only — skip short function words and anything numeric.
  var candidates = [];
  raw.forEach(function(w,i){
    var bare = w.replace(/[.,!?;:()"„”—–]/g,"");
    if(bare.length>4 && !/^\d+$/.test(bare)) candidates.push(i);
  });
  if(candidates.length < 3) return null;
  var chosen = pick(candidates, Math.min(4, Math.max(3, Math.floor(candidates.length/6)))).sort(function(a,b){return a-b;});
  var answers = [];
  var tokens = raw.map(function(w,i){
    if(chosen.indexOf(i)===-1) return {text:w, blank:false};
    var bare = w.replace(/[.,!?;:()"„”—–]/g,"");
    answers.push(bare);
    return {text:w, blank:true};
  });
  return {
    id:"gap_"+id, lesson:null, skill:"listening", type:"gapfill", diff:4,
    topic:null, generated:true, tokens:tokens, answers:answers, fullText:clean, audio:clean,
    prompt:"Listen and type the missing words. Play it as many times as you need.",
    explain:"The blanked words are content words — the ones that carry meaning and that connected speech tends to compress. "+
      (title? "From <i>"+escapeHtml(title)+"</i>. ":"")+
      "If a word kept escaping you, replay at 0.65×: hearing it slowed down once usually makes it audible at full speed afterwards."
  };
}
/* Grade a fixed text reproduced from memory. Exact wording matters (it is a
   legal formula), but punctuation and capitalization do not, and a missing
   diacritic is a near-miss worth naming rather than a failure. */
function checkRecital(ex, t){
  var target = ex.model || primaryAnswer(ex);
  if(!t) return {verdict:"incorrect", correct:target,
    diagnosis:"Nothing submitted yet — write out as much as you can recall before checking."};
  if(norm(t)===norm(target)) return {verdict:"correct", correct:target};
  if(normLoose(t)===normLoose(target)){
    return {verdict:"almost", correct:target,
      diagnosis:"Word for word this is the oath — the only differences are diacritics. That matters here: <b>apăr</b> (I defend) and <i>apar</i> (I appear) are different verbs. Use the diacritics bar and try once more."};
  }
  /* Name the specific words that went missing rather than just showing the model. */
  var diff = alignTokens(target.split(/\s+/), t.split(/\s+/));
  var missed = diff.filter(function(w){ return w.status==="missed"; })
                   .map(function(w){ return w.word.replace(/[.,]/g,""); });
  var near = diff.filter(function(w){ return w.status==="near"; })
                 .map(function(w){ return "<b>"+escapeHtml(w.word.replace(/[.,]/g,""))+"</b> (you wrote <i>"+escapeHtml(w.typed)+"</i>)"; });
  var bits = [];
  if(missed.length) bits.push("missing: "+missed.map(function(w){ return "<b>"+escapeHtml(w)+"</b>"; }).join(", "));
  if(near.length)   bits.push("spelled differently: "+near.join(", "));
  return {verdict: missed.length>3 ? "incorrect" : "almost", correct:target,
    diagnosis: bits.length
      ? "Close, but not yet word-perfect — "+bits.join("; ")+"."
      : "Your version differs from the official wording. Compare it line by line below."};
}
/* Open-ended production is judged on effort + required structures, never on
   matching one string. The model answer is teaching material, not a key. */
/* Open production is NEVER graded "correct" — nothing here verifies meaning,
   word order or most of the grammar, and saying "Correct" over text that has
   real errors in it actively teaches the wrong thing. The verdicts are:
     incorrect → too short, or a structure the checker CAN verify is wrong
     almost    → required structures missing
     submitted → nothing detectable is wrong; compare against the model yourself */
function checkProduce(ex, text){
  var t = String(text||"").trim();
  /* Recitation is not open production. Where the task is to reproduce one fixed
     text from memory — the oath, the anthem — there IS a single right answer, so
     it gets graded exactly instead of being sent to self-check. Without this,
     a word-perfect recital comes back "Submitted" and counts against the lesson
     score, which is the opposite of the feedback the learner earned. */
  if(ex.recite) return checkRecital(ex, t);
  var words = t.split(/\s+/).filter(Boolean).length;
  if(words < (ex.minWords||10)){
    return {verdict:"incorrect", correct:ex.model,
      diagnosis:"This is shorter than the task asks for — you wrote "+words+" word"+(words===1?"":"s")+", and the target is at least "+(ex.minWords||10)+". Producing the language yourself is where most of the learning happens, so it's worth the effort."};
  }
  /* Structures we can genuinely verify are checked first — a detected error
     outranks having met the word count. */
  var agreement = checkAgreementStructures(t);
  if(agreement.length){
    return {verdict:"incorrect", correct:ex.model, agreementIssues:agreement,
      diagnosis:"There "+(agreement.length===1?"is one agreement error":"are "+agreement.length+" agreement errors")+
        " in a structure this lesson targets:<br>• "+agreement.join("<br>• ")};
  }
  var missing = (ex.mustUse||[]).filter(function(k){ return normLoose(t).indexOf(normLoose(k))===-1; });
  if(missing.length){
    return {verdict:"almost", correct:ex.model,
      diagnosis:"Good length. The task asked you to use "+missing.map(function(m){return "<b>"+escapeHtml(m)+"</b>";}).join(" and ")+", which I can't find in your answer. Compare with the model below and try folding "+(missing.length>1?"them":"it")+" in."};
  }
  var articles = checkDefiniteAfterLike(t);
  if(articles.length){
    return {verdict:"almost", correct:ex.model, articleIssues:articles,
      diagnosis:"The structures are right, but the article is missing on what is liked:<br>• "+articles.join("<br>• ")};
  }
  return {verdict:"submitted", correct:ex.model, selfCheck:true};
}
/* ---- Number lookup, built from the vocabulary's own plural/definite fields.
   Used to check agreement in constructions where the verb must match the
   thing, not the person: îmi place / îmi plac, mă doare / mă dor. ---- */
var NUMBER_SETS = null;
function buildNumberSets(){
  var sg = {}, pl = {};
  VOCAB.forEach(function(v){
    if(v.pos!=="noun") return;
    var plurals = String(v.plural||"").split("/").map(function(s){return s.trim();}).filter(Boolean);
    var heads   = String(v.ro).split("/").map(function(s){return s.trim();}).filter(Boolean);
    var defs    = String(v.definite||"").split("/").map(function(s){return s.trim();}).filter(Boolean);

    plurals.forEach(function(p){
      pl[normLoose(p)] = true;
      /* Definite plural: mere→merele, flori→florile, frați→frații. */
      if(/[ei]$/.test(p)) pl[normLoose(p+"le")] = true;
      if(/i$/.test(p))    pl[normLoose(p+"i")]  = true;
    });
    var headIsPlural = plurals.length && normLoose(heads[0])===normLoose(plurals[0]);
    if(!headIsPlural){
      heads.forEach(function(h){ sg[normLoose(h)] = true; });
      defs.forEach(function(d){ sg[normLoose(d)] = true; });
    } else {
      heads.forEach(function(h){ pl[normLoose(h)] = true; });
      defs.forEach(function(d){ pl[normLoose(d)] = true; });
    }
  });
  NUMBER_SETS = {sg:sg, pl:pl};
}
function numberOf(word){
  if(!NUMBER_SETS) buildNumberSets();
  var k = normLoose(word);
  if(!k) return null;
  if(NUMBER_SETS.pl[k]) return "pl";
  if(NUMBER_SETS.sg[k]) return "sg";
  return null;   // unknown — say nothing rather than guess
}

/* Check îmi place/plac and mă doare/dor against the number of what follows.
   Returns a list of concrete, quotable problems — never a vague verdict. */


function checkAgreementStructures(text){
  var issues = [];
  var VERBS_TO_CHECK = [
    {sg:"place", pl:"plac",  pron:LIKE_PRONOUNS},
    {sg:"doare", pl:"dor",   pron:HURT_PRONOUNS}
  ];
  String(text||"").split(/[.!?;\n]+/).forEach(function(sent){
    var toks = sent.trim().split(/\s+/).filter(Boolean);
    for(var i=0;i<toks.length;i++){
      var bare = normLoose(toks[i]);
      var spec = VERBS_TO_CHECK.find(function(v){ return bare===normLoose(v.sg) || bare===normLoose(v.pl); });
      if(!spec) continue;
      /* Require a preceding object pronoun, so we only judge this construction
         and not some unrelated use of the same word. */
      var prev = i>0 ? normLoose(toks[i-1]) : "";
      if(spec.pron.indexOf(prev)===-1) continue;

      // Walk forward to the first word whose number we actually know.
      var subject = null, sawSa = false;
      for(var j=i+1; j<toks.length && j<=i+6; j++){
        var w = toks[j].replace(/[.,!?;:()"„”]/g,"");
        if(!w) continue;
        var nw = normLoose(w);
        if(nw==="sa"){ sawSa = true; break; }              // să-clause
        if(AGREEMENT_SKIP.indexOf(nw)>-1) continue;        // foarte, mult, și…
        var n = numberOf(w);
        if(n){ subject = {w:w, n:n}; }
        break;   // first content word decides; don't skip ahead and guess
      }
      if(sawSa){
        if(bare===normLoose(spec.pl)){
          issues.push("<b>"+escapeHtml(toks[i]+" să…")+"</b> — before a <b>să</b>-clause the verb stays singular: <b>"+spec.sg+" să…</b>");
        }
        continue;
      }
      if(!subject) continue;
      var want = subject.n==="pl" ? normLoose(spec.pl) : normLoose(spec.sg);
      if(bare !== want){
        issues.push("<b>"+escapeHtml(toks[i]+" "+subject.w)+"</b> — <i>"+escapeHtml(subject.w)+"</i> is "+
          (subject.n==="pl" ? "plural, so the verb must be <b>"+spec.pl+"</b>"
                            : "singular, so the verb must be <b>"+spec.sg+"</b>")+
          ". The verb agrees with the thing, not with you.");
      }
    }
  });
  return issues;
}
/* Definite article: after place/plac and doare/dor Romanian normally uses the
   definite form for a general statement. Flag the bare form where we can tell. */
function checkDefiniteAfterLike(text){
  var issues = [];
  if(!NUMBER_SETS) buildNumberSets();
  String(text||"").split(/[.!?;\n]+/).forEach(function(sent){
    var toks = sent.trim().split(/\s+/).filter(Boolean);
    for(var i=0;i<toks.length;i++){
      var bare = normLoose(toks[i]);
      if(bare!=="place" && bare!=="plac") continue;
      var prev = i>0 ? normLoose(toks[i-1]) : "";
      if(LIKE_PRONOUNS.indexOf(prev)===-1) continue;
      for(var j=i+1; j<toks.length && j<=i+6; j++){
        var w = toks[j].replace(/[.,!?;:()"„”]/g,"");
        if(!w) continue;
        var nw = normLoose(w);
        if(nw==="sa") break;                             // să-clause: no article
        if(AGREEMENT_SKIP.indexOf(nw)>-1) continue;
        /* Bare headword where the definite form is what a general statement
           needs — and only when it isn't already the definite form. */
        var v = VOCAB.find(function(x){
          return x.pos==="noun" && x.definite &&
            String(x.ro).split("/").some(function(h){ return normLoose(h.trim())===nw; }) &&
            !String(x.definite).split("/").some(function(d){ return normLoose(d.trim())===nw; });
        });
        if(v){
          issues.push("<b>"+escapeHtml(w)+"</b> → <b>"+escapeHtml(String(v.definite).split("/")[0].trim())+"</b>. "+
            "For a general statement Romanian puts the definite article on the thing liked, where English uses no article.");
        }
        break;
      }
    }
  });
  return issues;
}

/* Heuristic writing feedback, split by category as the brief requires.
   These are checks a machine can make honestly — they never claim to judge
   meaning or style. */
function writingFeedback(text){
  var out = [];
  var t = String(text||"");
  var hasDia = /[ăâîșț]/i.test(t);
  var looksRo = /\b(este|sunt|am|și|să|nu|cu|la|în|de)\b/i.test(normLoose(t));
  out.push({cat:"Diacritics", ok:hasDia,
    note: hasDia ? "You are using Romanian diacritics — keep it up; they are part of the spelling."
                 : "I don't see any of <b>ă â î ș ț</b>. Almost any Romanian paragraph of this length needs some. Use the character bar under the box."});
  var sentences = t.split(/[.!?]+/).map(function(s){return s.trim();}).filter(Boolean);
  var avg = sentences.length ? Math.round(t.split(/\s+/).filter(Boolean).length / sentences.length) : 0;
  out.push({cat:"Sentence length", ok: avg>0 && avg<=22,
    note: avg===0 ? "I couldn't find sentence-ending punctuation. Romanian uses <b>. ! ?</b> just as English does."
        : avg>22 ? "Your sentences average "+avg+" words, which is long. Try splitting some — or join them deliberately with connectors like <b>pentru că</b>, <b>deși</b>, <b>iar</b>."
        : "Sentence length averages "+avg+" words, which reads naturally."});
  var sunt_mers = /\b(sunt|este|esti|suntem|sunteti) (mers|venit|plecat|facut|fost)\b/i.test(normLoose(t));
  var agree = checkAgreementStructures(t);
  var arts  = checkDefiniteAfterLike(t);
  var grammarProblems = [];
  if(sunt_mers) grammarProblems.push("<b>a fi</b> used as a past auxiliary — perfectul compus always takes <b>a avea</b>: <i>am mers</i>, <i>am făcut</i>.");
  agree.forEach(function(x){ grammarProblems.push(x); });
  arts.forEach(function(x){ grammarProblems.push(x); });
  out.push({cat:"Grammar", ok:!grammarProblems.length,
    note: grammarProblems.length
      ? grammarProblems.join("<br>")
      : "Nothing flagged by the checks that run here: past-tense auxiliary, and verb agreement in <i>îmi place/plac</i> and <i>mă doare/dor</i>."});
  /* Say plainly what is NOT examined, so a clean result is not mistaken for
     a verdict on the whole text. */
  out.push({cat:"Not checked", ok:null,
    note:"Meaning, word order, tense choice, gender agreement on adjectives and most spelling are <b>not</b> verified here. Read your text against the model line by line — that comparison is the exercise."});
  out.push({cat:"Vocabulary", ok:looksRo,
    note: looksRo ? "Your text reads as Romanian rather than translated English word-for-word."
                  : "I can't detect common Romanian function words here. Make sure you are writing in Romanian, not English."});
  return out;
}

/* Stable-per-attempt shuffle of an exercise's options. Cleared whenever the
   exercise is retried or re-queued, so a second attempt reorders them. */
function optionOrder(ex){
  if(!session.optOrder[ex.id]){
    session.optOrder[ex.id] = shuffle(ex.options.map(function(_,i){ return i; }));
  }
  return session.optOrder[ex.id];
}
function textField(ex, placeholder){
  var key = "ans_"+ex.id;
  var val = session.answers[ex.id]||"";
  return '<input type="text" data-field="'+key+'" data-ex="'+ex.id+'" data-action="typeAnswer" '+
    'data-enter-action="submitExercise" autocomplete="off" autocapitalize="off" spellcheck="false" '+
    'placeholder="'+escapeHtml(placeholder||"Type your answer in Romanian…")+'" value="'+escapeHtml(val)+'" '+
    'aria-label="Your answer" />'+ diacriticBar(key);
}
function skillBadge(skill){
  var cls = {grammar:"accent", vocabulary:"pine", listening:"brick", reading:"neutral", writing:"accent", pronunciation:"pine"}[skill]||"neutral";
  return '<span class="badge '+cls+'">'+escapeHtml(skill)+'</span>';
}


function renderExercise(ex, opts){
  opts = opts||{};
  var fb = session.feedback[ex.id];
  var done = !!fb;
  var body = "";

  switch(ex.type){
    case "mcq": case "reading_q": case "minimal_pair": {
      var sel = session.answers[ex.id];
      /* Option order is shuffled per attempt. With a fixed order, repeating a
         test teaches you that "the answer is B" rather than making you read the
         question — which is exactly the pattern-matching this course is built
         to avoid. The permutation is held for the attempt so re-renders don't
         reshuffle mid-answer, and is discarded on retry. */
      var order = optionOrder(ex);
      body = order.map(function(orig, slot){
        var o = ex.options[orig];
        var cls = "mcq-option";
        if(done){
          if(orig===ex.correct) cls+=" show-correct";
          else if(String(sel)===String(orig)) cls+=" show-wrong";
        } else if(String(sel)===String(orig)) cls+=" selected";
        var audio = ex.type==="minimal_pair" && ex.audioFor
          ? ' '+audioButton(ex.audioFor[orig], {small:true, label:"hear"}) : '';
        /* Options in Romanian are glossable word by word. The gloss click is
           handled before the option click, so looking a word up does not
           accidentally submit an answer. */
        return '<button type="button" class="'+cls+'" data-action="pickOption" data-ex="'+ex.id+'" data-i="'+orig+'"'+(done?' disabled':'')+'>'+
          '<span class="mcq-letter">'+String.fromCharCode(65+slot)+'</span><span class="ro">'+glossify(escapeHtml(o))+'</span>'+audio+'</button>';
      }).join("");

    }
    case "build": {

  /* A comprehension question is unanswerable without its passage. In a lesson

  }

  var audioTop = (ex.audio && ex.type!=="transcribe" && ex.type!=="dictation" && done)
    ? ' '+audioButton(ex.audio,{small:true,label:"listen"}) : '';

  return '<div class="exercise-shell fade-in" data-exercise="'+ex.id+'">'+
    '<div class="exercise-kicker">'+
      '<span style="display:flex;gap:6px;align-items:center">'+skillBadge(ex.skill)+'<span style="font-size:11.5px;color:var(--text-3);font-weight:700;letter-spacing:.3px;text-transform:uppercase">'+(TYPE_LABEL[ex.type]||ex.type)+'</span></span>'+
      (opts.counter? '<span style="font-size:12px;color:var(--text-3)" class="tabular">'+opts.counter+'</span>':'')+
    '</div>'+
    passage+
    '<div class="exercise-prompt">'+promptHtml+audioTop+'</div>'+
    body+
    (ex.hint && !done ? '<div style="margin-top:10px">'+(session.revealed[ex.id]
        ? '<span style="font-size:13px;color:var(--text-2)">💡 '+escapeHtml(ex.hint)+'</span>'
        : '<button class="btn ghost sm" data-action="revealHint" data-ex="'+ex.id+'">Show a hint</button>')+'</div>' : '')+
    (done ? renderFeedback(ex, fb, opts) :

        '<button class="btn" data-action="submitExercise" data-ex="'+ex.id+'">Check answer</button>'+
        '<span style="font-size:12px;color:var(--text-3)">or press <span class="kbd">Enter</span></span>'+
      '</div>')+
  '</div>';
}

/* Word-level alignment of what the learner typed against the transcript.
   A plain string comparison tells them "wrong" and nothing else; a dictation
   learner needs to see WHICH words they missed, because that is the whole
   diagnostic value of the exercise. Standard LCS backtrace over loosely
   normalized tokens, so a missing diacritic still aligns and shows up as a
   near-miss rather than shunting every later word out of position. */
function alignTokens(said, heard){
  var a = said, b = heard, n = a.length, m = b.length;
  var grid = [];
  for(var i=0;i<=n;i++){ grid.push(new Array(m+1).fill(0)); }
  for(i=1;i<=n;i++){
    for(var j=1;j<=m;j++){
      grid[i][j] = normLoose(a[i-1])===normLoose(b[j-1])
        ? grid[i-1][j-1]+1
        : Math.max(grid[i-1][j], grid[i][j-1]);
    }
  }
  var out = []; i = n; j = m;
  while(i>0 && j>0){
    if(normLoose(a[i-1])===normLoose(b[j-1])){
      /* Loose match: same word, but the spelling may still differ (diacritics). */
      out.unshift({word:a[i-1], status: norm(a[i-1])===norm(b[j-1]) ? "ok" : "near", typed:b[j-1]});
      i--; j--;
    } else if(grid[i-1][j] >= grid[i][j-1]){
      out.unshift({word:a[i-1], status:"missed"}); i--;
    } else { j--; }   /* extra word the learner typed — dropped, the gap shows it */
  }
  while(i>0){ out.unshift({word:a[i-1], status:"missed"}); i--; }
  return out;
}
function renderTranscript(ex, typed){
  var text = ex.audio || primaryAnswer(ex);
  if(!text) return "";
  var sents = sentencesOf(text);
  if(!sents.length) sents = [text];

  /* The transcript itself: one sentence per line, generously set, each with its
     own play button so a line can be replayed in isolation while reading it. */
  var lines = sents.map(function(s){
    return '<div class="transcript-line">'+
        audioButton(s, {small:true, label:false})+
        '<span class="transcript-text">'+glossify(escapeHtml(s), {force:true})+'</span>'+
      '</div>';
  }).join("");

  var compare = "";
  if(typed && String(typed).trim()){
    var heardTokens = String(typed).trim().split(/\s+/);
    var saidTokens  = text.split(/\s+/);
    var aligned = alignTokens(saidTokens, heardTokens);
    var wrong = aligned.filter(function(t){ return t.status!=="ok"; });
    compare = '<div class="transcript-compare">'+
      '<div class="transcript-label">What you typed, word by word</div>'+
      '<div class="transcript-diff">'+aligned.map(function(t){
        if(t.status==="ok") return '<span class="tw ok">'+escapeHtml(t.word)+'</span>';
        if(t.status==="near") return '<span class="tw near" title="You wrote: '+escapeHtml(t.typed)+'">'+escapeHtml(t.word)+'</span>';
        return '<span class="tw missed">'+escapeHtml(t.word)+'</span>';
      }).join(" ")+'</div>'+
      '<div class="transcript-key">'+
        (wrong.length===0
          ? 'Every word matched.'
          : '<span class="tw near">green-underlined</span> = right word, spelling or diacritics off · '+
            '<span class="tw missed">struck</span> = you did not catch this word')+
      '</div></div>';
  }

  return '<div class="transcript-panel">'+
      '<div class="transcript-head">'+
        '<span class="transcript-label">Transcript</span>'+
        audioButton(sents, {small:true, label:"Play all"})+
      '</div>'+
      lines + compare +
      '<div class="transcript-key" style="margin-top:10px">Replay a line and read it at the same time — that is the pass that turns a sound you missed into a word you know. Click any word for its meaning.</div>'+
    '</div>';
}

function renderFeedback(ex, fb, opts){
  opts = opts||{};
  var cls = fb.verdict==="correct" ? "correct"
          : fb.verdict==="incorrect" ? "incorrect"
          : fb.verdict==="submitted" ? "neutral" : "partial";
  var title = {
    correct:"Correct",
    almost:"Almost — worth a second look",
    unnatural:"Understandable, but not how it's usually said",
    incorrect:"Not quite",
    submitted:"Submitted — now compare it with the model"
  }[fb.verdict];
  var icon = fb.verdict==="correct" ? iconCheck() : "";

  var answerBlock = "";
  if(fb.verdict!=="correct" || ex.type==="produce"){
    answerBlock = '<div style="margin-top:10px">'+
      '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3)">'+(ex.type==="produce"?"Model answer":"Correct answer")+'</div>'+
      '<div class="correct-answer-line">'+escapeHtml(fb.correct||primaryAnswer(ex))+
        (fb.correct? ' '+audioButton(fb.correct,{small:true,label:false}) : '')+'</div></div>';
  }
  var writing = (ex.type==="produce" && session.answers[ex.id])
    ? '<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">'+
      '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">Feedback on your writing</div>'+
      writingFeedback(session.answers[ex.id]).map(function(f){
        var mark = f.ok===null ? "·" : (f.ok ? "✓" : "!");
        var col  = f.ok===null ? "var(--text-3)" : (f.ok ? "var(--pine)" : "var(--brick)");
        return '<div style="display:flex;gap:8px;margin-bottom:7px;font-size:13.2px;line-height:1.5">'+
          '<span style="flex:0 0 auto;color:'+col+';font-weight:800">'+mark+'</span>'+
          '<span><b>'+f.cat+'.</b> '+f.note+'</span></div>';
      }).join("")+'</div>' : "";

  var transcript = (ex.type==="transcribe"||ex.type==="dictation")
    ? renderTranscript(ex, session.answers[ex.id]) : "";

  return '<div class="feedback-box '+cls+' fade-in" role="status">'+
      '<div class="feedback-title">'+icon+title+'</div>'+
      (fb.diagnosis? '<div class="feedback-explain" style="margin-bottom:8px">'+fb.diagnosis+'</div>':'')+
      answerBlock+
      '<div class="feedback-explain" style="margin-top:10px">'+ex.explain+'</div>'+
      writing + transcript +
    '</div>'+
    '<div style="margin-top:14px;display:flex;gap:10px">'+
      (opts.onContinue!==false? '<button class="btn" data-action="continueExercise" data-ex="'+ex.id+'">Continue</button>':'')+
      '<button class="btn secondary" data-action="retryExercise" data-ex="'+ex.id+'">Try again</button>'+
    '</div>';
}

/* ===================== PROGRESS HELPERS ===================== */

function unitStatus(unit){
  var ls = lessonsOfUnit(unit.id);
  if(!ls.length) return "soon";
  var done = ls.filter(function(l){ return lessonProgress(l.id).status==="complete"; }).length;
  if(done===ls.length) return "done";
  if(done>0) return "current";
  return isUnitUnlocked(unit) ? "open" : "locked";
}

function unitMastery(unit){
  var ls = lessonsOfUnit(unit.id);
  if(!ls.length) return 0;
  var sum = ls.reduce(function(a,l){ return a + lessonProgress(l.id).bestScore; },0);
  return Math.round(sum/ls.length);
}


function totalLessonsBuilt(){ return LESSONS.length; }
function lessonsCompleted(){ return LESSONS.filter(function(l){ return lessonProgress(l.id).status==="complete"; }).length; }
function wordsLearned(){ return Object.keys(state.vocabSrs).length; }
function wordsMastered(){ return Object.keys(state.vocabSrs).filter(function(id){ return state.vocabSrs[id].status==="Mastered"; }).length; }

function shell(sidebarHtml, mainHtml, railHtml, wide){

/* Body-level switcher. Redundant on desktop, where the sidebar carries one —
   so it is hidden there and shown only on mobile, whose sidebar sits behind
   the menu button and would otherwise hide the second course entirely. */
function courseSwitcher(){
  return '<div class="course-switch-body" style="display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap">'+
    COURSES.map(function(c){
      var active = currentCourse()===c.id;

        var lv = levelById(u.levelId); return lv && (lv.course||"cefr")===c.id && lessonsOfUnit(u.id).length;
      }).length;
      return '<button class="chip'+(active?" active":"")+'" data-action="setCourse" data-course="'+c.id+'" '+
        'style="padding:8px 14px">'+escapeHtml(c.short)+
        '<span style="opacity:.6;margin-left:6px">'+built+' units</span></button>';
    }).join("")+
  '</div>';
}

/* The whole course map, both tracks, in one continuous list — the citizenship
   levels sit below the CEFR ones under their own heading rather than behind a
   toggle, so nothing is hidden from view. Opening any unit switches track by
   itself. */
function courseMapSidebar(activeUnitId){
  var levels = LEVELS;
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:0 8px 10px">'+
      '<span style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3)">Course map</span>'+
      /* "Collapse all" as soon as ANYTHING is open, not only when everything
         is. Requiring every level meant that opening one course by hand left
         the button still offering to expand, with no way to close up again. */
      '<button class="btn ghost sm" style="padding:2px 6px;font-size:11.5px" data-action="toggleAllLevels">'+
        (levels.some(function(l){ return levelIsOpen(l.id, activeUnitId); }) ? "Collapse all" : "Expand all")+'</button>'+
    '</div>'+
    levels.map(function(lv, li){
    var courseId = lv.course||"cefr";
    var prevCourse = li>0 ? (LEVELS[li-1].course||"cefr") : null;
    var groupHeader = (courseId!==prevCourse)
      ? '<div class="course-group">'+
          escapeHtml((COURSES.find(function(c){return c.id===courseId;})||{}).name||courseId)+
        '</div>'
      : '';
    return groupHeader + courseMapLevel(lv, activeUnitId);
  }).join("");
}
function courseMapLevel(lv, activeUnitId){
  return [lv].map(function(lv){
    var units = UNITS.filter(function(u){ return u.levelId===lv.id; }).sort(function(a,b){return a.order-b.order;});
    var open = levelIsOpen(lv.id, activeUnitId);
    var built = units.filter(function(u){ return lessonsOfUnit(u.id).length; }).length;
    return '<div class="level-block">'+
      '<button class="level-head" data-action="toggleLevel" data-level="'+lv.id+'" aria-expanded="'+(open?"true":"false")+'">'+
        '<span class="chev'+(open?" open":"")+'" aria-hidden="true">›</span>'+
        '<h3>'+lv.code+' · '+escapeHtml(lv.name)+'</h3>'+
        '<span class="lvl-pct tabular">'+(open? levelProgressPct(lv.id)+'%' : built+'/'+units.length)+'</span>'+
      '</button>'+
      (open? units.map(function(u){
        var st = unitStatus(u);
        var dot = st==="done" ? '<span class="status-dot done">'+iconCheck()+'</span>'
                : st==="current" ? '<span class="status-dot current">●</span>'
                : st==="locked" ? '<span class="status-dot locked">'+iconLock()+'</span>'
                : st==="soon" ? '<span class="status-dot soon">◌</span>'
                : '<span class="status-dot open">○</span>';
        var built = lessonsOfUnit(u.id).length;
        var sub = built? built+" lesson"+(built===1?"":"s")+(st!=="open"&&st!=="locked"? " · "+unitMastery(u)+"%":"") : "in development";
        var locked = st==="locked";
        return '<div class="unit-node'+(u.id===activeUnitId?" current":"")+(locked?" locked":"")+'"'+
          (locked?'':' data-action="go" data-page="unit" data-p1="'+u.id+'" role="button" tabindex="0"')+'>'+
          dot+'<div><div class="u-title">'+escapeHtml(u.title)+'</div><div class="u-sub">'+escapeHtml(u.titleEn)+' · '+sub+'</div></div></div>';
      }).join("") : '')+
    '</div>';
  }).join("");
}

/* ---------- UNIT OVERVIEW ---------- */
PAGES.unit = function(params){
  var u = unitById(params[0]);
  if(!u) return notFound("That unit doesn't exist.");
  var ls = lessonsOfUnit(u.id);
  var lv = levelById(u.levelId);

  var main = '<div class="section-eyebrow">'+lv.code+' · Unit '+u.order+'</div>'+
    '<h1 style="font-size:29px;margin-bottom:4px">'+escapeHtml(u.title)+'</h1>'+
    '<p style="color:var(--text-2);font-size:15px;margin-bottom:6px">'+escapeHtml(u.titleEn)+'</p>'+
    '<p style="color:var(--text-2);max-width:62ch;margin-bottom:24px">'+escapeHtml(u.blurb)+'</p>';

  /* A unit can point at a purpose-built assessment instead of the generic
     checkpoint builder — the I.L.R. mock is structured as three papers and
     cannot be assembled from a shuffled pool. */
  if(u.mockRoute){
    main += '<div class="card" style="padding:22px 24px;border-left:3px solid var(--accent)">'+
      '<div class="section-eyebrow">Simulare</div>'+
      '<h2 style="font-size:19px;margin-bottom:8px">The three papers, end to end</h2>'+
      '<p style="color:var(--text-2);font-size:14px;max-width:58ch;margin-bottom:14px">Sat in order, on material held back from the lessons, and scored per paper rather than as one blended mark.</p>'+
      '<button class="btn" data-action="go" data-page="'+u.mockRoute+'">Open the mock exam</button>'+
    '</div>';
    return shell(courseMapSidebar(u.id), main, null);
  }
  if(u.checkpoint){
    var cp = buildExam("checkpoint", u.id);
    var lex = u.levelExam ? buildExam("exam", u.levelId) : null;
    main += '<div class="card" style="padding:22px 24px;margin-bottom:14px;border-left:3px solid var(--accent)">'+
      '<div class="section-eyebrow">Checkpoint</div>'+
      '<h2 style="font-size:19px;margin-bottom:8px">Mixed review of this level so far</h2>'+
      '<p style="color:var(--text-2);font-size:14px;max-width:56ch;margin-bottom:14px">Questions are drawn from every unit you\'ve completed in '+lv.code+' and shuffled together. Unlike a lesson, nothing tells you which rule is being tested — that\'s deliberate, so recognizing the pattern can\'t stand in for knowing the language.</p>'+
      (cp
        ? '<button class="btn" data-action="go" data-page="exam" data-p1="checkpoint" data-p2="'+u.id+'">Start checkpoint · '+cp.items.length+' questions</button>'
        : '<p style="font-size:13.5px;color:var(--text-3)">Complete at least one earlier unit in this level to unlock the checkpoint.</p>')+
    '</div>';
    if(u.levelExam){
      main += '<div class="card" style="padding:22px 24px;margin-bottom:14px;border-left:3px solid var(--pine)">'+
        '<div class="section-eyebrow" style="color:var(--pine)">Level exam</div>'+
        '<h2 style="font-size:19px;margin-bottom:8px">'+lv.code+' assessment</h2>'+
        '<p style="color:var(--text-2);font-size:14px;max-width:56ch;margin-bottom:14px">Vocabulary, grammar, listening, reading and written production, scored separately by skill rather than as one number. Pass mark 75%.</p>'+
        (lex
          ? '<button class="btn" data-action="go" data-page="exam" data-p1="exam" data-p2="'+u.levelId+'">Start '+lv.code+' exam · '+lex.items.length+' questions</button>'
          : '<p style="font-size:13.5px;color:var(--text-3)">Complete some lessons in this level first.</p>')+
      '</div>';
    }
    var past = state.examResults.filter(function(r){ return r.id===u.id || r.id===u.levelId; });
    if(past.length){
      main += '<div class="card" style="padding:18px 20px"><h3 style="font-size:15px;margin-bottom:10px">Previous attempts</h3>'+
        past.slice(0,5).map(function(r){
          return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px">'+
            '<span style="flex:1">'+escapeHtml(r.title)+'</span>'+
            '<span class="tabular" style="color:var(--text-3)">'+escapeHtml(r.date)+'</span>'+
            '<span class="badge '+(r.passed?'pine':'brick')+'">'+r.score+'%</span></div>';
        }).join("")+'</div>';
    }
  } else if(!ls.length){
    main += '<div class="card" style="padding:26px;text-align:center">'+
      '<div style="font-size:15px;font-weight:700;margin-bottom:6px">This unit is mapped but not yet written</div>'+
      '<p style="color:var(--text-2);font-size:14px;max-width:52ch;margin:0 auto 16px">The curriculum plan for this unit is fixed — the topics and grammar are listed above. The lesson content itself is still being authored.</p>'+
      '<button class="btn secondary" data-action="go" data-page="home">Back to the course path</button></div>';
  } else {
    main += ls.map(function(l,i){
      var p = lessonProgress(l.id);
      var badge = p.status==="complete" ? '<span class="badge pine">'+iconCheck()+' '+p.bestScore+'%</span>'
                : p.attempts ? '<span class="badge accent">in progress</span>' : '<span class="badge neutral">not started</span>';
      return '<div class="card" style="padding:18px 20px;margin-bottom:12px;display:flex;gap:16px;align-items:flex-start">'+
        '<div style="flex:1">'+
          '<div style="display:flex;gap:10px;align-items:center;margin-bottom:5px">'+
            '<span style="font-family:var(--font-mono);font-size:12px;color:var(--text-3)">'+(i+1)+'</span>'+
            '<b style="font-family:var(--font-display);font-size:17px">'+escapeHtml(l.title)+'</b>'+badge+'</div>'+
          '<div style="font-size:13px;color:var(--text-3);margin-bottom:6px">'+escapeHtml(l.titleEn)+'</div>'+
          '<p style="font-size:13.8px;color:var(--text-2);max-width:58ch">'+escapeHtml(l.objective)+'</p>'+
          '<div style="font-size:12px;color:var(--text-3);margin-top:8px">'+l.sections.length+' stages · '+
            l.sections.filter(function(s){return s.type==="vocab";}).reduce(function(a,s){return a+s.vocabIds.length;},0)+' words</div>'+
        '</div>'+
        '<button class="btn'+(p.status==="complete"?" secondary":"")+'" data-action="go" data-page="lesson" data-p1="'+l.id+'">'+
          (p.status==="complete"?"Review":p.attempts?"Resume":"Start")+'</button>'+
      '</div>';
    }).join("");
  }
  return shell(courseMapSidebar(u.id), main, null);
};

/* One-time consent screen for the profanity unit. Says plainly what is behind
   it and why it is worth reading, rather than being coy — the content is a
   comprehension aid, and treating it as forbidden would misrepresent it. */
function profanityGate(l){
  return '<div class="main-inner" style="max-width:620px;padding-top:30px">'+
    '<div class="section-eyebrow">Register track · optional unit</div>'+
    '<h1 style="font-size:28px;margin-bottom:12px">'+escapeHtml(l.title)+'</h1>'+
    '<div class="card" style="padding:22px 24px;margin-bottom:16px">'+
      '<p style="font-size:14px;color:var(--text-2);line-height:1.65;margin-bottom:12px">'+
        'This unit contains Romanian profanity, including strong and anatomical vulgarity, shown with '+
        'literal English translations. It is taught for <b>recognition</b>: what the words mean, how strong '+
        'each one is, and why almost none of them are worth a learner using.</p>'+
      '<p style="font-size:14px;color:var(--text-2);line-height:1.65;margin-bottom:12px">'+
        'It is here because not understanding it is its own problem — you cannot otherwise tell an '+
        'affectionate jab from a real insult, and Romanian swearing is harsher than the English glosses '+
        'suggest. The strongest items are shown partially masked and marked <i>never use</i>.</p>'+
      '<p style="font-size:13px;color:var(--text-3);line-height:1.6;margin-bottom:18px">'+
        'Nothing else in the course depends on this unit. You can skip it entirely, and you can turn it '+
        'back off later from Progress → Settings.</p>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
        '<button class="btn" data-action="enableProfanity" data-lesson="'+l.id+'">Show this unit</button>'+
        '<button class="btn secondary" data-action="go" data-page="home">Skip it</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function mediaByKind(k){ return MEDIA.filter(function(m){ return m.kind===k; }); }
function mediaLevels(){
  var out = [];
  MEDIA.forEach(function(m){ if(out.indexOf(m.level)===-1) out.push(m.level); });
  return out.sort();
}
/* Transcripts are supplied by the learner, not by this course. Writing out a
   transcript of a video nobody here has watched would mean inventing the words
   a learner then commits to memory — the one place in this app where a
   confident guess would do real damage. So the panel is an editor: paste what
   you hear (or the channel's own subtitles), and it becomes a shadowing script
   with click-to-gloss and line-by-line stepping. Saved per video, locally. */
function mediaTranscript(id){ return (state.mediaTranscripts||{})[id] || ""; }
PAGES.media = function(params){
  var openId = params[0] || null;
  if(openId){
    var item = MEDIA.find(function(m){ return m.id===openId; });
    if(item) return shell(null, mediaDetail(item), null);
  }
  var cfg = session.mediaFilter || (session.mediaFilter = {level:"all", kind:"all"});
  var chip = function(group, val, label){
    return '<button class="chip'+(cfg[group]===val?" active":"")+'" data-action="setMediaFilter" '+
      'data-group="'+group+'" data-val="'+escapeHtml(val)+'">'+escapeHtml(label)+'</button>';
  };
  var list = MEDIA.filter(function(m){
    if(cfg.level!=="all" && m.level!==cfg.level) return false;
    if(cfg.kind!=="all" && m.kind!==cfg.kind) return false;
    return true;
  });
  var songs = mediaByKind("song");

  var main = '<h1 style="font-size:28px;margin-bottom:6px">Media & shadowing</h1>'+
    '<p style="color:var(--text-2);margin-bottom:18px;max-width:64ch">Romanian video and music in one place, roughly sorted by level. Nothing loads until you press play. Open any item to add a transcript and shadow along line by line.</p>'+
    '<div class="card" style="padding:16px 18px;margin-bottom:18px">'+
      '<label class="field-label">Level</label>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'+
        chip("level","all","Any")+mediaLevels().map(function(l){ return chip("level",l,l); }).join("")+'</div>'+
      '<label class="field-label">Type</label>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        chip("kind","all","Everything")+chip("kind","video","Videos")+chip("kind","song","Songs")+'</div>'+
    '</div>'+
    (list.length? list.map(mediaCard).join("")
      : '<div class="empty-state">Nothing matches those filters yet.</div>')+
    (cfg.kind!=="video" && !songs.length
      ? '<div class="card" style="padding:18px 20px;margin-top:18px;border-left:3px solid var(--accent)">'+
        '<b style="font-family:var(--font-display);font-size:15px">Songs</b>'+
        '<p style="font-size:13.3px;color:var(--text-2);line-height:1.6;margin-top:6px;max-width:62ch">'+
          'No songs added yet. Send me the YouTube links and I will verify each one and add it here with the '+
          'lyrics panel — music is unusually good shadowing material because the melody fixes the stress pattern, '+
          'and Romanian song lyrics tend to use exactly the elisions that make speech hard to follow '+
          '(<i>te-am, s-a, într-un</i>).</p></div>'
      : '')+
    '<div class="card" style="padding:16px 18px;margin-top:18px">'+
      '<div style="font-size:12.5px;color:var(--text-3);line-height:1.6">Videos are embedded from YouTube and remain the property of their channels. '+
      'Levels are approximate — where a channel states one it is used, otherwise it is a judgement. '+
      'If an embed stops working the video has been removed or restricted at source.</div>'+
    '</div>';
  return shell(null, main, null);
};
function mediaCard(m){
  var hasScript = !!mediaTranscript(m.id);
  return '<div class="card" style="padding:16px 18px;margin-bottom:12px">'+
    '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px">'+
      '<span class="badge accent">'+escapeHtml(m.level)+'</span>'+
      (m.levelSource==="stated"? '<span class="badge neutral" title="Level stated by the channel">stated</span>'
                               : '<span class="badge neutral" title="Level judged from the content, not stated by the channel">approx.</span>')+
      (m.kind==="song"? '<span class="badge pine">song</span>':'')+
      (hasScript? '<span class="badge pine">transcript saved</span>':'')+
    '</div>'+
    '<b style="font-family:var(--font-display);font-size:16px">'+escapeHtml(m.title)+'</b>'+
    '<div style="font-size:12.5px;color:var(--text-3);margin-top:2px">'+escapeHtml(m.channel)+'</div>'+
    '<p style="font-size:13.2px;color:var(--text-2);line-height:1.55;margin-top:7px;max-width:64ch">'+escapeHtml(m.note)+'</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:11px">'+
      '<button class="btn secondary sm" data-action="go" data-page="media" data-p1="'+m.id+'">Open &amp; shadow</button>'+
      '<a class="btn ghost sm" href="https://www.youtube.com/watch?v='+m.id+""+'" target="_blank" rel="noopener noreferrer">Watch on YouTube ↗</a>'+
    '</div>'+
  '</div>';
}
function mediaDetail(m){
  var script = mediaTranscript(m.id);
  var editing = session.mediaEditing===m.id || !script;
  var lines = script.split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean);
  return '<button class="btn ghost sm" data-action="go" data-page="media" style="margin-bottom:12px">← All media</button>'+
    '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px">'+
      '<span class="badge accent">'+escapeHtml(m.level)+'</span>'+
      '<span style="font-size:12.5px;color:var(--text-3)">'+escapeHtml(m.channel)+'</span>'+
    '</div>'+
    '<h1 style="font-size:23px;margin-bottom:12px;max-width:60ch">'+escapeHtml(m.title)+'</h1>'+
    '<div class="video-frame" style="margin-bottom:8px">'+
      '<iframe src="https://www.youtube-nocookie.com/embed/'+m.id+'?rel=0'+""+'" '+
      'title="'+escapeHtml(m.title)+'" frameborder="0" allowfullscreen '+
      'allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"></iframe></div>'+
    '<p style="font-size:13px;color:var(--text-2);line-height:1.55;max-width:64ch;margin-bottom:18px">'+escapeHtml(m.note)+'</p>'+

    '<div class="card" style="padding:18px 20px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">'+
        '<b style="font-family:var(--font-display);font-size:16px">Shadowing script</b>'+
        (script && !editing? '<button class="btn ghost sm" data-action="editTranscript" data-vid="'+m.id+'">Edit</button>':'')+
      '</div>'+
      (editing
        ? '<p style="font-size:13px;color:var(--text-2);line-height:1.6;max-width:64ch;margin-bottom:10px">'+
            'Paste the transcript here — the channel\'s subtitles, or what you can make out yourself. '+
            'One sentence per line works best. It is saved in this browser and travels with your progress export.<br><br>'+
            '<span style="color:var(--text-3)">This course does not ship transcripts for these videos. Writing out words '+
            'nobody here has verified against the audio would mean handing you a script to memorise that might be wrong — '+
            'so the text is yours to supply.</span></p>'+
          '<textarea data-field="transcript" data-action="typeTranscript" rows="10" '+
            'style="width:100%;font-size:14px;line-height:1.6;margin-bottom:10px" '+
            'placeholder="Mă trezesc la ora șapte.&#10;Mă spăl pe față și mă îmbrac.&#10;Iau micul dejun la opt.">'+escapeHtml(script)+'</textarea>'+
          '<button class="btn sm" data-action="saveTranscript" data-vid="'+m.id+'">Save script</button>'+
          (script? ' <button class="btn ghost sm" data-action="cancelTranscript">Cancel</button>':'')
        : (function(){
            /* A transcript the learner typed is not course material, so almost
               none of it has a pre-rendered clip. Without a local Romanian
               voice installed the app refuses to speak it — correctly, since
               an English voice reading Romanian teaches the wrong sounds — but
               a play button that silently does nothing reads as a broken
               feature. Check each line up front and show the real state. */
            var speakable = lines.filter(function(l){ return Speech.statusFor(l)!=="unavailable"; }).length;
            var silent = lines.length - speakable;
            return '<p style="font-size:12.8px;color:var(--text-3);margin-bottom:'+(silent?'8px':'12px')+'">'+
              lines.length+' line'+(lines.length===1?"":"s")+'. Click any word for its meaning. Play the video and speak along one line at a time.</p>'+
            (silent
              ? '<div style="font-size:12.6px;color:var(--text-2);line-height:1.6;background:var(--accent-soft);'+
                'border-radius:var(--radius-s);padding:10px 12px;margin-bottom:12px">'+
                '<b>'+silent+' of '+lines.length+' line'+(lines.length===1?" has":"s have")+' no playback here.</b> '+
                'The course ships clips only for its own material, and this transcript is yours. Individual '+
                '<i>words</i> usually still play if they appear in the course — click one to hear it. '+
                'For the full lines, use the video: it is the recording you want to imitate anyway.'+
                (Speech.hasNativeVoice()? '' :
                  '<br><br>Installing a Romanian system voice would let your browser read any line aloud. '+
                  'Without one this course stays silent rather than reading Romanian in an English accent.')+
                '</div>'
              : '')+
            '<div class="verse">'+lines.map(function(l,i){
              var canPlay = Speech.statusFor(l)!=="unavailable";
              return '<div class="verse-line" style="display:flex;gap:10px;align-items:flex-start">'+
                '<span class="tabular" style="flex:0 0 26px;color:var(--text-3);font-size:12px;padding-top:5px">'+(i+1)+'</span>'+
                '<div class="verse-ro" style="flex:1">'+glossRun(escapeHtml(l), null)+'</div>'+
                (canPlay
                  ? audioButton(l,{small:true,label:false})
                  : '<span class="audio-btn small audio-none" title="No clip for this line — click a word instead, or play the video" aria-hidden="true">'+iconPlay()+'</span>')+
              '</div>';
            }).join("")+'</div>';
          })())+
    '</div>';
}


function ilrMockState(){
  if(!session.ilrMock) session.ilrMock = {paper:0, started:null, done:false};
  return session.ilrMock;
}
PAGES.ilrmock = function(){
  var st = ilrMockState();
  var papers = ILR_PAPERS.map(function(p){ return {meta:p, items: mockItems("ilr", p.n)}; });
  var allItems = papers.reduce(function(a,p){ return a.concat(p.items); }, []);

  if(!st.started){
    return shell(null,
      '<div class="section-eyebrow">I.L.R. · Simulare de examen</div>'+
      '<h1 style="font-size:30px;margin-bottom:10px">Full mock exam</h1>'+
      '<p style="color:var(--text-2);max-width:64ch;margin-bottom:18px">Three papers, sat in order, on material you have not seen in the lessons. Each paper is scored separately — that is how the real exam works, and a single combined mark would hide a weak paper behind a strong one.</p>'+
      '<div class="card" style="padding:20px 22px;margin-bottom:16px">'+
        papers.map(function(p){
          return '<div style="padding:12px 0;border-bottom:1px solid var(--line)">'+
            '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'+
              '<span class="badge accent">Proba '+p.meta.n+'</span>'+
              '<b style="font-family:var(--font-display);font-size:15.5px">'+escapeHtml(p.meta.ro)+'</b>'+
              '<span style="margin-left:auto;font-size:12.5px;color:var(--text-3)">'+p.items.length+' item'+(p.items.length===1?"":"s")+'</span>'+
            '</div>'+
            '<div style="font-size:12.8px;color:var(--text-3);margin-top:3px">'+escapeHtml(p.meta.en)+'</div>'+
            '<p style="font-size:13px;color:var(--text-2);margin-top:6px;line-height:1.55;max-width:62ch">'+escapeHtml(p.meta.note)+'</p>'+
          '</div>';
        }).join("")+
        '<p style="font-size:12.8px;color:var(--text-3);margin-top:14px;line-height:1.6">'+
          '<b>On timing:</b> the ILR does not publish per-paper durations, so this simulation does not impose one — '+
          'an invented limit would train the wrong pace. Elapsed time is shown so you can judge it yourself, and the '+
          'writing tasks are the ones worth timing.</p>'+
      '</div>'+
      '<button class="btn" data-action="startIlrMock">Begin Proba 1</button> '+
      '<button class="btn secondary" data-action="go" data-page="home">Back</button>'
    , null);
  }

  if(st.done) return shell(null, ilrMockReport(papers, allItems), null);

  var cur = papers[st.paper];
  var answered = cur.items.filter(function(e){ return session.feedback[e.id]; }).length;
  var readingId = cur.items.length && cur.items[0].readingId;
  var text = readingId ? readingById(readingId) : null;

  var body =
    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px">'+
      '<div class="section-eyebrow">Proba '+cur.meta.n+' din 3 · '+escapeHtml(cur.meta.en)+'</div>'+
      '<span style="font-size:12.5px;color:var(--text-3)" class="tabular">'+elapsedSince(st.started)+' elapsed</span>'+
    '</div>'+
    '<h1 style="font-size:24px;margin-bottom:8px">'+escapeHtml(cur.meta.ro)+'</h1>'+
    '<p style="color:var(--text-2);font-size:13.5px;max-width:64ch;margin-bottom:16px">'+escapeHtml(cur.meta.note)+'</p>'+
    '<div class="progressbar" style="margin-bottom:18px"><span style="width:'+pct(answered,cur.items.length)+'%"></span></div>'+
    (text? renderReading(text) : '')+
    (text? '<h2 style="font-size:17px;margin:22px 0 12px">Întrebări</h2>' : '')+
    cur.items.map(function(e){

function elapsedSince(t){
  if(!t) return "0:00";
  var s = Math.max(0, Math.floor((Date.now()-t)/1000));
  var m = Math.floor(s/60);
  return m + ":" + String(s%60).padStart(2,"0");
}
/* Per-paper results. Free writing is excluded from the scored denominator for
   the same reason it is everywhere else — nothing here can grade it — and is
   counted and reported separately instead of being quietly dropped. */
function ilrMockReport(papers, allItems){
  var rows = papers.map(function(p){
    var gradable = p.items.filter(function(e){
      var f = session.feedback[e.id]; return f && f.verdict!=="submitted";
    });
    var correct = gradable.filter(function(e){ return session.feedback[e.id].verdict==="correct"; }).length;
    var selfCheck = p.items.filter(function(e){
      var f = session.feedback[e.id]; return f && f.verdict==="submitted";
    }).length;
    var skipped = p.items.filter(function(e){ return !session.feedback[e.id]; }).length;
    return {meta:p.meta, total:p.items.length, gradable:gradable.length, correct:correct,
            selfCheck:selfCheck, skipped:skipped,
            score: gradable.length? pct(correct, gradable.length) : null};
  });
  var scored = rows.filter(function(r){ return r.score!==null; });
  var overall = scored.length
    ? Math.round(scored.reduce(function(a,r){ return a+r.score; },0)/scored.length) : null;

  return '<div class="section-eyebrow">I.L.R. · Rezultate</div>'+
    '<h1 style="font-size:28px;margin-bottom:6px">Mock exam results</h1>'+
    '<p style="color:var(--text-2);font-size:13.5px;max-width:64ch;margin-bottom:18px">Scored per paper, because the real exam is. A strong reading paper does not compensate for a weak written one.</p>'+
    '<div class="card" style="padding:22px 24px;margin-bottom:16px">'+
      rows.map(function(r){
        var col = r.score===null? "var(--text-3)" : r.score>=70? "var(--pine)" : r.score>=50? "var(--accent-strong)" : "var(--brick)";
        return '<div style="padding:14px 0;border-bottom:1px solid var(--line)">'+
          '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'+
            '<span class="badge neutral">Proba '+r.meta.n+'</span>'+
            '<b style="font-family:var(--font-display);font-size:15px">'+escapeHtml(r.meta.en)+'</b>'+
            '<span class="tabular" style="margin-left:auto;font-weight:700;font-size:18px;color:'+col+'">'+
              (r.score===null? "—" : r.score+"%")+'</span>'+
          '</div>'+
          '<div style="font-size:12.8px;color:var(--text-3);margin-top:5px">'+
            (r.gradable? r.correct+' of '+r.gradable+' auto-graded correct' : 'nothing auto-gradable on this paper')+
            (r.selfCheck? ' · '+r.selfCheck+' written task'+(r.selfCheck===1?"":"s")+' to compare against the model yourself' : '')+
            (r.skipped? ' · '+r.skipped+' not attempted' : '')+
          '</div>'+
        '</div>';
      }).join("")+
      (overall!==null
        ? '<div style="margin-top:16px;font-size:13.5px;color:var(--text-2)">Average across auto-graded papers: <b>'+overall+'%</b>. '+
          'The written papers carry heavy weight in the real exam and cannot be scored here — read them against the models before judging yourself ready.</div>'
        : '')+
    '</div>'+
    whatYouGotWrong(allItems, {retryAction:null})+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">'+
      '<button class="btn" data-action="restartIlrMock">Sit it again</button>'+
      '<button class="btn secondary" data-action="go" data-page="home">Back to the track</button>'+
    '</div>';
}

/* ---------- MOVING PROGRESS BETWEEN BROWSERS ----------
   Progress lives in this browser's localStorage, which is per-browser and
   per-device by design. Real accounts need a server to hold the data, and this
   course is a single static file with no backend — so instead of pretending,
   the app makes the save file portable: export it, carry it, import it. That
   covers the actual need (continue on another machine) and has the side benefit
   that the data stays yours and never leaves your computer. */
/* The mistake notebook stores the prompt and the full explanation alongside
   every saved mistake, which is most of the save file's bulk. Both are
   reconstructible from the exercise id, so the pasteable code drops them and
   the import puts them back. The downloaded FILE keeps everything, since size
   costs nothing there. */
function slimStateForCode(st){
  var copy = Object.assign({}, st);
  copy.mistakes = (st.mistakes||[]).map(function(m){
    if(!m.exerciseId || !exerciseById(m.exerciseId)) return m;   // generated: keep verbatim
    var s = Object.assign({}, m);
    delete s.explanation; delete s.promptText;
    return s;
  });
  return copy;
}
function rehydrateMistakes(st){
  (st.mistakes||[]).forEach(function(m){
    if(m.explanation && m.promptText) return;
    var ex = m.exerciseId && exerciseById(m.exerciseId);
    if(!ex) return;
    if(!m.explanation) m.explanation = ex.explain;
    if(!m.promptText)  m.promptText  = String(ex.prompt||"").replace(/<[^>]+>/g,"");
  });
  return st;
}
function stateToCode(){
  var json = JSON.stringify({v:2, at:new Date().toISOString(), slim:1, state:slimStateForCode(state)});
  /* btoa is byte-oriented; Romanian text and names are not ASCII. */
  return btoa(unescape(encodeURIComponent(json)));
}
function codeToState(code){
  var json = decodeURIComponent(escape(atob(String(code).replace(/\s+/g,""))));
  var wrapper = JSON.parse(json);
  if(!wrapper || !wrapper.state) throw new Error("not a progress code");
  return rehydrateMistakes(wrapper.state);
}
/* Merge an imported save over the default shape, so a file written by an older
   build still loads: any key the export predates keeps its default rather than
   arriving undefined and breaking a page halfway through a render. */
function applyImportedState(incoming, source){
  var d = defaultState();
  Object.keys(d).forEach(function(k){
    var saved = incoming[k];
    if(saved===undefined || saved===null) return;
    var nested = d[k] && typeof d[k]==="object" && !Array.isArray(d[k])
              && saved && typeof saved==="object" && !Array.isArray(saved);
    d[k] = nested ? Object.assign({}, d[k], saved) : saved;
  });
  state = d;
  writeState();
  session.transferOpen = false;
  session.importCode = "";
  session.transferErr = "";
  session.transferMsg = "Progress restored from "+source+" — "+progressSummaryLine(state)+".";
  render();
}

        '</div>'+

/* Romanian dictionaries and coursebooks mark words as s.f. / s.m. / s.n. /

function posAbbrev(v){

    return {m:"s.m.", f:"s.f.", n:"s.n.", "m/f":"s.m./s.f.", "n/f":"s.n./s.f."}[v.gender] || "s.";
  }
  return {verb:"vb.", adj:"adj.", adv:"adv.", prep:"prep.", conj:"conj.",
          pron:"pron.", num:"num.", phrase:"expr.", art:"art."}[v.pos] || v.pos;
}
