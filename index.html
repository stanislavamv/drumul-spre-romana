{id:"g_alphabet", cat:"Pronunciation", level:"A1", title:"The Romanian Alphabet & Sounds",
 rule:"Romanian is written with the Latin alphabet plus five extra letters: ă, â, î, ș, ț. Spelling is very regular — almost every letter has one consistent sound.",
 formation:["<b>ă</b> — like the 'a' in 'sofa' (schwa): <i>masă</i>","<b>â / î</b> — the same sound, a tight central vowel with no English equivalent; â is used inside words, î at the start/end: <i>român, în</i>","<b>ș</b> — 'sh' as in 'shoe': <i>șapte</i>","<b>ț</b> — 'ts' as in 'cats': <i>țară</i>","<b>ce/ci</b> — 'ch' as in 'cheese': <i>ceas, cine</i>","<b>che/chi</b> — hard 'k': <i>chelner, chibrit</i>","<b>ge/gi</b> — 'j' as in 'jeep': <i>ger, girafă</i>","<b>ghe/ghi</b> — hard 'g': <i>ghid, ghețari</i>","Romanian <b>r</b> is lightly rolled/tapped, never like the English 'r'."],
 examples:[{ro:"oraș",en:"city — the ș makes an 'sh' sound"},{ro:"mulțumesc",en:"thank you — the ț makes a 'ts' sound"},{ro:"română",en:"Romanian — â is a tense central vowel"}],
 mistakes:[{wrong:"Reading â/î as English 'i'",right:"Both are a distinct central vowel, closer to a tight 'uh'",note:"English speakers often substitute a familiar vowel — listen to native audio and imitate rather than reading it as English."},{wrong:"Pronouncing ș as a plain 's'",right:"ș is always 'sh'",note:"Skipping the diacritic changes the word: sat (village) vs. șase (six)."}]},
{id:"g_gender", cat:"Nouns", level:"A1", title:"Noun Gender: the un / două Test",
 rule:"Don't try to guess gender from the ending — test it. Put <b>un</b> or <b>o</b> in front, then <b>doi</b> or <b>două</b>. The two answers together identify the gender, and this is how the distinction is taught in Romania itself.",
 formation:["<b>un</b> … <b>doi</b> → masculine: <i>un student → doi studenți</i>","<b>o</b> … <b>două</b> → feminine: <i>o studentă → două studente</i>","<b>un</b> … <b>două</b> → neuter: <i>un manual → două manuale</i>","That third combination is the whole definition of neuter: it takes <b>un</b> like a masculine in the singular, and <b>două</b> like a feminine in the plural. There is no separate set of neuter endings to learn.","So when you meet a new noun, learn it as a triple: <b>un scaun, două scaune</b> — the article and the plural together settle the gender for good."],
 examples:[{ro:"un student, doi studenți",en:"a student, two students — masculine"},{ro:"o studentă, două studente",en:"a student (f), two students — feminine"},{ro:"un manual, două manuale",en:"a textbook, two textbooks — neuter: un + două"}],
 mistakes:[{wrong:"Trying to memorize neuter as a third set of endings",right:"Neuter = un in the singular, două in the plural",note:"It is a hybrid, not a third pattern. Once you apply the un/două test you never need to memorize which nouns are neuter — the test tells you."},{wrong:"Assuming every -ă noun is feminine and every consonant-final noun masculine",right:"Test with un/o and doi/două",note:"Endings are a hint, not a rule: many neuter nouns end in a consonant just like masculines. Only the plural separates them."}]},
{id:"g_plural", cat:"Nouns", level:"A1", title:"Plural Formation",
 rule:"Read the plural as a transformation of the ending, not as a new word. Each gender has a small set of ending-changes, and almost every noun follows one of them.",
 formation:["<b>MASCULINE — always ends in -i.</b> The change is to the final sound:","&nbsp;&nbsp;consonant → consonant + <b>i</b> : <i>coleg→colegi, student→studenți, specialist→specialiști, pas→pași</i>","&nbsp;&nbsp;-u → <b>-i</b> : <i>leu→lei, metru→metri</i>","&nbsp;&nbsp;-e → <b>-i</b> : <i>frate→frați</i>","&nbsp;&nbsp;The consonant softens before that -i: <b>t→ț, d→z, s→ș</b> — <i>student→studenți, brad→brazi, pas→pași</i>.","<b>FEMININE — -ă or -e becomes -e or -i:</b> <i>casă→case, mașină→mașini, floare→flori</i>","<b>NEUTER — adds -e or -uri:</b> <i>oraș→orașe, tren→trenuri</i>. Which one is unpredictable; learn it with the noun.","<b>Invariable:</b> a few masculines are identical in both numbers — <i>un unchi/doi unchi, un ochi/doi ochi, un pui/doi pui</i>.","<b>Irregular:</b> <i>copil→copii, cal→cai, om→oameni</i>."],
 examples:[{ro:"un student → doi studenți",en:"a student → two students (t softens to ț)"},{ro:"un frate → doi frați",en:"a brother → two brothers (-e → -i)"},{ro:"o floare → două flori",en:"a flower → two flowers"},{ro:"un ochi → doi ochi",en:"an eye → two eyes — invariable"}],
 mistakes:[{wrong:"*o mașine (from mașină)",right:"o mașină → două mașini",note:"Not every feminine noun uses -e; many -ă nouns take -i instead. Learn plurals with the noun as a set."},{wrong:"*doi ochii",right:"doi ochi",note:"Invariable nouns do not change at all. The extra -i here would be the definite article: ochii = 'the eyes'."}]},
{id:"g_articles_def", cat:"Nouns", level:"A1", title:"The Definite Article (Attached Ending)",
 rule:"Unlike English 'the', the Romanian definite article is a suffix attached to the end of the noun.",
 formation:["Masc. sg.: -ul → <i>băiatul</i> (the boy); plural -i already definite-looking, add -i → <i>băieții</i>","Fem. sg.: -a → <i>casa</i> (the house); plural -ele/-le → <i>casele</i>","Neuter sg.: -ul → <i>orașul</i>; plural -ele → <i>orașele</i>","If the noun ends in a vowel, the article often contracts: <i>cafea → cafeaua</i>."],
 examples:[{ro:"În sală e un student. → Studentul are curs aici.",en:"There's a student in the hall. → The student has a class here."},{ro:"Aici e un magazin. → Magazinul e aproape de cămin.",en:"Here is a shop. → The shop is near the hall of residence."},{ro:"În fotografie e un munte. → Muntele are 2000 de metri.",en:"There's a mountain in the photo. → The mountain is 2000 metres high."},{ro:"o carte → cartea",en:"a book → the book"}],
 mistakes:[{wrong:"*the băiat (leaving the article as a separate word)",right:"băiatul",note:"There is no separate word for 'the' — it always fuses onto the noun's ending."},{wrong:"Using the indefinite when reintroducing something already mentioned",right:"un student … studentul",note:"Watch the pattern in the examples above: something enters the conversation with un/o, and every mention after that takes the attached article. This is the same job English does with a → the."}]},
{id:"g_articles_indef", cat:"Nouns", level:"A1", title:"The Indefinite Article",
 rule:"'A / an' is a separate word before the noun: un for masculine/neuter, o for feminine.",
 formation:["un + masc./neuter noun: <i>un bărbat, un oraș</i>","o + feminine noun: <i>o femeie</i>","Plural indefinite normally just drops the article: <i>bărbați</i> ('men', not 'some men'), though niște can be added for 'some'."],
 examples:[{ro:"un profesor, o profesoară",en:"a (male) teacher, a (female) teacher"},{ro:"niște prieteni",en:"some friends"}],
 mistakes:[{wrong:"Sunt un student.",right:"Sunt student.",note:"Romanian drops the article before a profession or role after <i>a fi</i>: <i>sunt profesor</i>, <i>este medic</i>. Adding <b>un</b> is the commonest English-speaker slip at A1."},{wrong:"Am cumpărat niște pâine.",right:"Am cumpărat pâine.",note:"<b>Niște</b> goes with countable plurals (<i>niște mere</i>). With uncountables Romanian normally uses nothing at all."}]},
{id:"g_pronouns_subj", cat:"Pronouns", level:"A1", title:"Subject Pronouns & Pronoun Dropping",
 rule:"eu, tu, el/ea, noi, voi, ei/ele — but Romanian verb endings already show the subject, so pronouns are usually dropped unless you need emphasis or contrast.",
 formation:["eu (I), tu (you, informal sg.), el/ea (he/she), noi (we), voi (you, pl./formal), ei/ele (they m/f)","Dumneavoastră is the formal 'you' (sg. or pl.), used with voi-form verbs."],
 examples:[{ro:"Sunt din Cluj.",en:"(I) am from Cluj — pronoun dropped, still clear from 'sunt'."},{ro:"Eu sunt din Cluj, dar tu ești din Iași.",en:"I'm from Cluj, but you're from Iași — pronouns kept for contrast."}],
 mistakes:[{wrong:"Eu sunt eu student.",right:"Eu sunt student.",note:"Don't double the pronoun; and dropping 'eu' entirely (Sunt student) is just as natural."}]},
{id:"g_present", cat:"Verbs", level:"A1", title:"Present Tense & Conjugation Groups",
 rule:"Regular verbs fall into four conjugation groups by infinitive ending: -a, -ea, -e, -i (with several -i verbs taking an -esc- infix).",
 formation:["-a: <i>a lucra</i> → lucrez, lucrezi, lucrează, lucrăm, lucrați, lucrează","-ea: <i>a vedea</i> → văd, vezi, vede, vedem, vedeți, văd","-e: <i>a merge</i> → merg, mergi, merge, mergem, mergeți, merg","-i (regular): <i>a dormi</i> → dorm, dormi, doarme, dormim, dormiți, dorm","-i (with -esc-): <i>a citi</i> → citesc, citești, citește, citim, citiți, citesc"],
 examples:[{ro:"Ea lucrează la spital.",en:"She works at the hospital."},{ro:"Noi citim o carte.",en:"We are reading a book."}],
 mistakes:[{wrong:"Applying -esc- to every -i verb",right:"Only some -i verbs take -esc- (citesc, vorbesc); others don't (dorm, simt)",note:"Learn each -i verb's pattern individually — check the verb tool."}]},
{id:"g_irregular_verbs", cat:"Verbs", level:"A1", title:"Key Irregular Verbs: a fi, a avea, a vrea, a putea, a merge, a face",
 rule:"These six verbs are used constantly and don't follow the regular patterns — they must be memorized individually.",
 formation:["a fi (to be): sunt, ești, este, suntem, sunteți, sunt","a avea (to have): am, ai, are, avem, aveți, au","a vrea (to want): vreau, vrei, vrea, vrem, vreți, vor","a putea (can): pot, poți, poate, putem, puteți, pot","a merge (to go): merg, mergi, merge, mergem, mergeți, merg","a face (to do/make): fac, faci, face, facem, faceți, fac"],
 examples:[{ro:"Pot să merg, dar nu vreau.",en:"I can go, but I don't want to."}],
 mistakes:[{wrong:"El este merge.",right:"El merge.",en2:"",note:"Don't add a fi before another conjugated verb — Romanian doesn't need a 'helper' verb here."}]},
{id:"g_negation", cat:"Sentence Structure", level:"A1", title:"Negation with nu",
 rule:"Place nu directly before the conjugated verb to negate a sentence.",
 formation:["nu + verb: <i>Nu sunt obosit.</i>","With object pronouns, nu comes before the pronoun: <i>Nu îl văd.</i>","Nu combines with niciodată (never), nimic (nothing), nimeni (no one) for double negatives, which are required (not optional) in Romanian."],
 examples:[{ro:"Nu vorbesc franceza.",en:"I don't speak French."},{ro:"Nu mănânc niciodată carne.",en:"I never eat meat. (lit. 'I don't eat never meat' — double negation is correct)"}],
 mistakes:[{wrong:"Mănânc niciodată carne. (dropping nu)",right:"Nu mănânc niciodată carne.",note:"Unlike English, Romanian requires both nu and the negative word together."}]},
{id:"g_questions", cat:"Sentence Structure", level:"A1", title:"Questions & Interrogative Words",
 rule:"Yes/no questions usually just use rising intonation (word order stays the same); wh-questions front the question word.",
 formation:["cine (who), ce (what), unde (where), când (when), cum (how), de ce (why), cât/câtă/câți/câte (how much/many)","Yes/no: Ești obosit? (rising intonation, no do-support needed)"],
 examples:[{ro:"Unde locuiești?",en:"Where do you live?"},{ro:"Câți ani ai?",en:"How many years do you have? = How old are you?"}],
 mistakes:[{wrong:"Do you speak Romanian? → *Faci tu vorbești română?",right:"Vorbești română?",note:"Romanian has no equivalent of English 'do-support' — just conjugate the main verb."}]},
{id:"g_adj_agreement", cat:"Adjectives", level:"A1", title:"Adjective Agreement & Placement",
 rule:"Adjectives agree in gender and number with the noun, and usually follow the noun (unlike English).",
 formation:["4-ending adjectives change for all forms: <i>înalt, înaltă, înalți, înalte</i>","2-ending adjectives only change for number: <i>mare, mare, mari, mari</i>","Most descriptive adjectives follow the noun: <i>o casă mare</i>; a few common ones (mare, bun, mic, tânăr...) can precede for emphasis/style."],
 examples:[{ro:"un băiat înalt / o fată înaltă / niște băieți înalți",en:"a tall boy / a tall girl / some tall boys"},{ro:"o zi frumoasă",en:"a beautiful day"}],
 mistakes:[{wrong:"o casă mare-ă",right:"o casă mare",note:"mare is a 2-ending adjective — it doesn't add -ă for feminine."}]},
{id:"g_possessives", cat:"Pronouns", level:"A1", title:"Possessive Adjectives (al meu, a mea...)",
 rule:"Possessives agree with the gender/number of the thing owned, and are preceded by a linking article (al/a/ai/ale) that also agrees.",
 formation:["masc. sg. owned: al meu, al tău, al lui/ei, al nostru, al vostru, al lor","fem. sg. owned: a mea, a ta, a lui/ei, a noastră, a voastră, a lor","With the noun made definite, the linking article often drops: <i>fratele meu</i> (my brother), not <i>fratele al meu</i>."],
 examples:[{ro:"Aceasta este mașina mea.",en:"This is my car."},{ro:"Cartea este a ta.",en:"The book is yours."}],
 mistakes:[{wrong:"fratele al meu",right:"fratele meu",note:"Drop 'al/a' when the possessive directly follows a definite noun."}]},
{id:"g_demonstratives", cat:"Pronouns", level:"A1", title:"Demonstratives: acest/această, acel/acea",
 rule:"'This/these' and 'that/those' agree with the noun's gender and number.",
 formation:["this (m): acest, (f): această, plural: acești/aceste","that (m): acel, (f): acea, plural: acei/acele"],
 examples:[{ro:"acest oraș",en:"this city"},{ro:"acea casă",en:"that house"}],
 mistakes:[{wrong:"acest orasșul",right:"acest orasș / orasșul acesta",note:"Pick one. Before the noun the demonstrative does the article's job (<i>acest orasș</i>); after it, the noun takes the definite ending and the demonstrative changes form (<i>orasșul acesta</i>). Never both at once."},{wrong:"această profesor",right:"acest profesor",note:"The demonstrative agrees with the NOUN, not the person. <i>Profesor</i> is masculine even when the teacher is a woman — for the feminine you would need <i>această profesoară</i>."}]},
{id:"g_numbers", cat:"Numbers", level:"A1", title:"Cardinal & Ordinal Numbers",
 rule:"Numbers 1-19 are individual words; from 20 they combine with de before the noun for 20+.",
 formation:["1 unu/una, 2 doi/două (gender-marked!), 3 trei, 4 patru, 5 cinci... 10 zece, 11 unsprezece... 20 douăzeci, 21 douăzeci și unu, 100 o sută","From 20 upward, use de before the noun: douăzeci de ani (20 years)","Ordinals: primul/prima (1st), al doilea/a doua (2nd), al treilea/a treia (3rd)..."],
 examples:[{ro:"doi băieți, două fete",en:"two boys, two girls — 'doi/două' is the only number that changes for gender"},{ro:"treizeci de euro",en:"thirty euros"}],
 mistakes:[{wrong:"douăzeci ani (forgetting de)",right:"douăzeci de ani",note:"Numbers from 20 up require de before the counted noun."}]},
{id:"g_prepositions", cat:"Prepositions", level:"A1", title:"Basic Prepositions & the Accusative",
 rule:"Most common prepositions (la, în, cu, pe, de, pentru) take the accusative case, which for nouns looks identical to the base form (only pronouns change shape).",
 formation:["la (at/to): la muncă","în (in): în oraș","cu (with): cu prietenii","pe (on/for people, see g_pe): pe masă","de la / până la (from / until)"],
 examples:[{ro:"Merg la muncă cu autobuzul.",en:"I go to work by bus."},{ro:"Cartea este pe masă.",en:"The book is on the table."}],
 mistakes:[{wrong:"Merg la magazinul.",right:"Merg la magazin.",note:"After most prepositions the noun drops its definite article: <i>la magazin</i>, <i>în orasș</i>, <i>pe stradă</i>."},{wrong:"Merg cu autobuz.",right:"Merg cu autobuzul.",note:"Transport is the exception that catches everyone: <b>cu</b> + the DEFINITE form. <i>Cu autobuzul</i>, <i>cu masșina</i>, <i>cu trenul</i> — never <i>cu autobuz</i>."}]},
{id:"g_pe_accusative", cat:"Cases", level:"A2", title:"Personal Accusative with pe",
 rule:"When a direct object is a specific person (or a personal pronoun), Romanian marks it with pe before the noun/pronoun.",
 formation:["pe + definite person: <i>O văd pe Maria.</i>","Almost always paired with a doubling clitic pronoun (îl, o, îi, le) right before the verb — this is 'pronoun doubling'.","Not used for indefinite or non-person objects: <i>Citesc o carte</i> (no pe)."],
 examples:[{ro:"O văd pe Maria în fiecare zi.",en:"I see Maria every day. (lit. 'her I-see PE Maria')"},{ro:"Îl ajut pe Andrei cu tema.",en:"I'm helping Andrei with his homework."}],
 mistakes:[{wrong:"Văd Maria.",right:"O văd pe Maria.",note:"Specific people as direct objects need both pe and the doubling pronoun (o, îl...)."}]},
{id:"g_object_pronouns", cat:"Pronouns", level:"A2", title:"Direct & Indirect Object Pronouns",
 rule:"Unstressed object pronouns attach right before the conjugated verb (or after it, hyphenated, with infinitives/imperatives).",
 formation:["Direct (accusative): mă, te, îl/o, ne, vă, îi/le","Indirect (dative): îmi, îți, îi, ne, vă, le","Word order: subject (optional) + indirect + direct + verb: <i>Mi-l dai?</i> (Will you give it to me?)"],
 examples:[{ro:"Îl văd.",en:"I see him/it."},{ro:"Îi dau cartea Mariei.",en:"I give the book to Maria. (Îi = to her, doubling 'Mariei')"},{ro:"Mi-l trimiți mâine?",en:"Will you send it to me tomorrow?"}],
 mistakes:[{wrong:"Dau cartea la Maria.",right:"Îi dau cartea Mariei. / Îi dau Mariei cartea.",note:"Romanian marks the indirect object with the dative pronoun îi rather than a preposition like English 'to'."}]},
{id:"g_dative_genitive", cat:"Cases", level:"A2", title:"Dative & Genitive Case",
 rule:"Dative marks 'to/for' (indirect object, possession with a fi + dative); genitive marks 'of/'s' possession. Both change the noun's article, not just add a preposition.",
 formation:["Genitive (possession): al/a/ai/ale + noun in genitive form: <i>casa Mariei</i> (Maria's house), <i>cartea copilului</i> (the child's book)","Dative (recipient): <i>Îi dau Mariei un cadou.</i> (I give Maria a gift.)","Common feminine nouns change -a→-ei, masculine/neuter add -lui: <i>Maria→Mariei, Andrei→lui Andrei</i>."],
 examples:[{ro:"Aceasta este casa părinților mei.",en:"This is my parents' house. (genitive)"},{ro:"I-am scris o scrisoare bunicii.",en:"I wrote a letter to grandma. (dative)"}],
 mistakes:[{wrong:"casa de Maria",right:"casa Mariei",note:"Romanian possession doesn't use a preposition like English 'of' — the noun itself takes the genitive ending."}]},
{id:"g_reflexive", cat:"Verbs", level:"A1", title:"Reflexive Verbs",
 rule:"Many everyday verbs (waking up, washing, getting dressed) are reflexive in Romanian, using mă/te/se/ne/vă/se before the verb.",
 formation:["a se trezi (to wake up): mă trezesc, te trezești, se trezește...","a se spăla (to wash): mă spăl, te speli, se spală...","In perfectul compus, the reflexive pronoun contracts with a: m-am trezit, te-ai trezit, s-a trezit..."],
 examples:[{ro:"Mă trezesc devreme.",en:"I wake up early."},{ro:"Ne-am distrat la petrecere.",en:"We had fun at the party."}],
 mistakes:[{wrong:"Trezesc la ora șapte. (dropping mă)",right:"Mă trezesc la ora șapte.",note:"The reflexive pronoun is required — it's part of the verb's basic form, not optional."}]},
{id:"g_perfect_compus", cat:"Verbs", level:"A2", title:"Perfectul Compus (Conversational Past)",
 rule:"The everyday past tense for completed actions: present tense of a avea (as auxiliary) + past participle.",
 formation:["Auxiliary: am, ai, a, am, ați, au (from a avea)","Participle: verb stem + -at (-a verbs), -ut (-e/-ea verbs), or -it (-i verbs): lucrat, văzut, dormit","Negation: nu + auxiliary: <i>Nu am mâncat.</i>","Reflexive verbs contract the pronoun: <i>m-am trezit, s-a dus</i>."],
 examples:[{ro:"Am mers la magazin și am cumpărat pâine.",en:"I went to the store and bought bread."},{ro:"Ai văzut filmul acela?",en:"Have you seen that movie?"}],
 mistakes:[{wrong:"Eu sunt mers la magazin.",right:"Eu am mers la magazin.",note:"Romanian's perfectul compus always uses a avea as the auxiliary — never a fi — regardless of the main verb."}]},
{id:"g_imperfect", cat:"Verbs", level:"A2", title:"Imperfectul (Imperfect Past)",
 rule:"Used for ongoing, repeated, or background actions in the past — 'was doing / used to do' — contrasted with the completed-action perfectul compus.",
 formation:["-a/-ea verbs: -am, -ai, -a, -am, -ați, -au: <i>lucram, lucrai, lucra...</i>","-e/-i verbs: -eam, -eai, -ea...: <i>citeam, citeai, citea...</i>","a fi is irregular: eram, erai, era, eram, erați, erau"],
 examples:[{ro:"Când eram mic, locuiam la țară.",en:"When I was little, I lived (used to live) in the countryside."},{ro:"Citeam o carte când a sunat telefonul.",en:"I was reading a book when the phone rang. (imperfect = ongoing background action; perfectul compus = the interrupting event)"}],
 mistakes:[{wrong:"Using perfectul compus for background description",right:"Use imperfect for scene-setting/ongoing states",note:"Compare: Ploua (it was raining, imperfect, background) vs. A plouat toată ziua (it rained all day, perfectul compus, a completed whole event)."}]},
{id:"g_future", cat:"Verbs", level:"A1", title:"Future Tense",
 rule:"Romanian has a formal future (voi + infinitive) and a much more common colloquial future (o să + subjunctive), plus the present tense used with a time word.",
 formation:["Formal: voi, vei, va, vom, veți, vor + infinitive (without 'a'): <i>voi merge</i>","Colloquial: o să + subjunctive: <i>o să merg</i> (very common in speech)","Near future with present tense: <i>Mâine merg la Cluj.</i> ('Tomorrow I go/I'm going to Cluj')"],
 examples:[{ro:"Voi termina proiectul mâine.",en:"I will finish the project tomorrow."},{ro:"O să plouă azi.",en:"It's going to rain today."}],
 mistakes:[{wrong:"Voi plec mâine.",right:"Voi pleca mâine.",note:"The <b>voi/vei/va</b> future takes the plain INFINITIVE — <i>voi pleca</i>. Only the <b>o să</b> form takes a conjugated verb: <i>o să plec</i>. Mixing the two halves is the standard error."},{wrong:"O să vă contactez — in a formal letter.",right:"Vă voi contacta.",note:"Both are correct Romanian, but <b>o să</b> is spoken register and <b>voi</b> is written. In a formal email the spoken form reads as careless."}]},
{id:"g_conditional", cat:"Verbs", level:"B1", title:"Conditional Mood (Present & Perfect)",
 rule:"Expresses hypotheticals and polite requests — 'would' in English. The present conditional uses aș/ai/ar + infinitive; the past conditional adds fi + participle.",
 formation:["Present: aș, ai, ar, am, ați, ar + infinitive: <i>aș merge</i> (I would go)","Past (recognition-level): aș fi mers (I would have gone)","Common in hypothetical dacă-clauses: <i>Dacă aș avea timp, aș călători mai mult.</i>"],
 examples:[{ro:"Aș vrea o cafea, vă rog.",en:"I would like a coffee, please. (polite request)"},{ro:"Dacă aș avea mai mult timp, aș învăța încă o limbă.",en:"If I had more time, I would learn another language."},{ro:"Dacă aș fi știut, aș fi venit mai devreme.",en:"If I had known, I would have come earlier."}],
 mistakes:[{wrong:"Dacă am timp, aș merge. (mixing tenses)",right:"Dacă aș avea timp, aș merge.",note:"Hypothetical dacă-clauses pair the conditional in both halves; the present indicative dacă am is used only for real/likely conditions ('if I have time [and I might], I'll go')."}]},
{id:"g_subjunctive", cat:"Verbs", level:"B1", title:"The Subjunctive with să",
 rule:"Introduced by să, the subjunctive is used after verbs of wanting/ability/necessity, and to replace the infinitive in everyday speech.",
 formation:["Identical to present indicative except in el/ea and ei/ele forms of many verbs: <i>el merge → să meargă; el face → să facă</i>","Common frames: vreau să..., trebuie să..., pot să..., e important să...","Replaces the infinitive after modal verbs, which is why Romanian speech uses să constantly: <i>Vreau să învăț</i>, not *Vreau a învăța."],
 examples:[{ro:"Vreau să învăț română.",en:"I want to learn Romanian."},{ro:"Trebuie să plecăm acum.",en:"We have to leave now."},{ro:"E mai bine să vorbești cu el.",en:"It's better for you to talk to him."}],
 mistakes:[{wrong:"Vreau învăța română.",right:"Vreau să învăț română.",note:"Modal/desire verbs are almost always followed by să + subjunctive, not a bare infinitive."}]},
{id:"g_imperative", cat:"Verbs", level:"A2", title:"The Imperative (Commands)",
 rule:"Used for direct commands and instructions; has distinct tu and voi forms, and a separate negative form.",
 formation:["Affirmative tu: often = el/ea present form minus final vowel, or its own form: <i>vino!, mergi!, fă!</i>","Affirmative voi: same as voi present tense: <i>veniți!, mergeți!, faceți!</i>","Negative: nu + infinitive (with 'a'): <i>Nu pleca!</i> (Don't leave!) — a distinct pattern from the affirmative.","Reflexive/object pronouns attach after and hyphenate: <i>Trezește-te!, Ajută-mă!</i>"],
 examples:[{ro:"Ascultați cu atenție!",en:"Listen carefully! (voi/formal)"},{ro:"Nu uita telefonul!",en:"Don't forget your phone!"}],
 mistakes:[{wrong:"Nu uiți telefonul! (using present tense for negative command)",right:"Nu uita telefonul!",note:"Negative commands use nu + the long infinitive form, not the present-tense-like affirmative form."}]},
{id:"g_comparison", cat:"Adjectives", level:"A2", title:"Comparative & Superlative",
 rule:"Comparisons are built with mai (more) and cel mai (the most) before the adjective — Romanian doesn't use endings like English '-er/-est'.",
 formation:["Comparative: mai + adj (+ decât for 'than'): <i>mai mare decât</i> (bigger than)","Equality: la fel de... ca: <i>la fel de bun ca</i> (as good as)","Superlative: cel/cea/cei/cele mai + adj: <i>cel mai bun</i> (the best)","Irregular: bun→mai bun→cel mai bun is regular, but bun can also become mai bine (adverb, 'better')."],
 examples:[{ro:"România este mai mare decât Bulgaria.",en:"Romania is bigger than Bulgaria."},{ro:"Acesta este cel mai bun restaurant din oraș.",en:"This is the best restaurant in the city."}],
 mistakes:[{wrong:"Este mai mare ca Bulgaria.",right:"Este mai mare decât Bulgaria.",note:"<b>Decât</b> is 'than' after <i>mai</i>; <b>ca</b> belongs to the equality frame <i>la fel de … ca</i>. English uses 'as' in both, which is why this is the most frequent comparison error."},{wrong:"cel mai bun restaurant în oraș",right:"cel mai bun restaurant din oraș",note:"After a superlative, 'in' is <b>din</b>: <i>cel mai bun din clasă</i>, <i>cea mai mare din țară</i>."},{wrong:"Ea este cel mai bună.",right:"Ea este cea mai bună.",note:"<b>Cel/cea/cei/cele</b> agrees with the noun — feminine singular takes <b>cea</b>."}]},
{id:"g_relative", cat:"Sentence Structure", level:"B1", title:"Relative Clauses (care, cine, ce)",
 rule:"care is the all-purpose relative pronoun ('who/which/that'); it takes a preposition directly before it when needed and can carry case endings.",
 formation:["Subject/object: <i>omul care vorbește</i> (the man who is speaking)","With preposition: <i>omul cu care vorbesc</i> (the man I'm speaking with — lit. 'with whom')","Possessive: <i>a cărui/a cărei</i> (whose)"],
 examples:[{ro:"Cartea pe care am citit-o este excelentă.",en:"The book that I read is excellent."},{ro:"Femeia despre care vorbeam este profesoară.",en:"The woman I was talking about is a teacher."}],
 mistakes:[{wrong:"Omul care l-am văzut.",right:"Omul pe care l-am văzut.",note:"When <b>care</b> is the direct object, it needs <b>pe</b> AND the verb keeps its doubling pronoun: <i>pe care <b>l-</b>am văzut</i>. Both halves are obligatory."},{wrong:"Cartea care am citit.",right:"Cartea pe care am citit-o.",note:"Same rule, with the pronoun attached to the participle and agreeing with <i>cartea</i>: <i>am citit-<b>o</b></i>."},{wrong:"Prietenul cine m-a ajutat.",right:"Prietenul care m-a ajutat.",note:"<b>Cine</b> only works in a question or with no antecedent (<i>Cine vine?</i>). After a named noun you need <b>care</b>."}]},
{id:"g_supin", cat:"Verbs", level:"B1", title:"The Supine: de făcut, de citit",
 rule:"A verb form built with <b>de</b> + the participle, used where English needs 'to do' or '-ing'. It has no direct English equivalent, which is why learners avoid it — and why avoiding it is audible.",
 formation:["<b>de</b> + participle: <i>de făcut, de citit, de spălat, de mâncat</i>","'Something to do': <i>am ceva <b>de făcut</b></i> — I have something to do","'Easy/hard to…': <i>e greu <b>de explicat</b></i> — it's hard to explain","'Finished doing': <i>am terminat <b>de mâncat</b></i> — I've finished eating","As a noun of activity: <i>mașină <b>de spălat</b></i> (washing machine), <i>ceva <b>de băut</b></i> (something to drink)"],
 examples:[
   {ro:"Am mult de lucru astăzi.",en:"I have a lot of work to do today."},
   {ro:"E greu de crezut.",en:"It's hard to believe."},
   {ro:"Ai terminat de scris?",en:"Have you finished writing?"},
   {ro:"Vrei ceva de mâncat?",en:"Do you want something to eat?"}
 ],
 mistakes:[
   {wrong:"Am ceva să fac.",right:"Am ceva de făcut.",note:"After <i>ceva</i>, <i>mult</i>, <i>nimic</i> the supine is required — not <b>să</b> + subjunctive. <i>Am ceva să fac</i> is a direct translation of English and sounds wrong."},
   {wrong:"Am terminat să mănânc.",right:"Am terminat de mâncat.",note:"<b>A termina</b> takes the supine, never <i>să</i>. Same for <i>a începe</i> in some uses."},
   {wrong:"E greu să explic asta.",right:"E greu de explicat. / E greu să explic asta.",note:"Both exist but mean different things: <i>de explicat</i> is impersonal ('it's hard to explain, in general'), while <i>să explic</i> pins it to you ('it's hard for me to explain it')."}
 ]},
{id:"g_passive", cat:"Verbs", level:"B1", title:"The Passive and the Reflexive Passive",
 rule:"Romanian has two passives. The formal one uses <b>a fi</b> + participle; the everyday one uses <b>se</b> + an active verb — and the second is far more common.",
 formation:["Formal passive: <b>a fi</b> + participle, agreeing with the subject — <i>casa <b>a fost vândută</b></i>, <i>documentele <b>au fost semnate</b></i>","Agent, if named: <b>de</b> or <b>de către</b> — <i>vândută <b>de</b> proprietar</i>","Reflexive passive: <b>se</b> + active verb, no agreement on a participle — <i><b>se vinde</b> casa</i>, <i><b>se semnează</b> documentele</i>","The verb still agrees with its subject: <i>se vinde casa</i> (sg.) but <i>se vând casele</i> (pl.)","Instructions, recipes, notices and officialese use the reflexive form almost exclusively."],
 examples:[
   {ro:"Casa a fost vândută anul trecut.",en:"The house was sold last year."},
   {ro:"Aici se vorbește româna.",en:"Romanian is spoken here."},
   {ro:"Se servesc cu smântână.",en:"They are served with sour cream."},
   {ro:"Certificatul se eliberează în treizeci de zile.",en:"The certificate is issued within thirty days."}
 ],
 mistakes:[
   {wrong:"Se vinde casele.",right:"Se vând casele.",note:"The verb agrees with the thing, even in the reflexive passive. Plural subject, plural verb."},
   {wrong:"Româna este vorbită aici. (as everyday speech)",right:"Aici se vorbește româna.",note:"Grammatically fine, but the <i>a fi</i> passive sounds bookish in ordinary contexts. Romanian reaches for <b>se</b> where English reaches for 'is'."},
   {wrong:"Casa a fost vândut.",right:"Casa a fost vândută.",note:"In the <i>a fi</i> passive the participle behaves like an adjective and must agree in gender and number with the subject."}
 ]},
{id:"g_cel", cat:"Nouns", level:"B1", title:"cel, cea, cei, cele",
 rule:"A standalone article that lets a noun be dropped, links a noun to a descriptive phrase, and builds the superlative. One of the highest-frequency words a learner never actively uses.",
 formation:["Forms: <b>cel</b> (m.sg.), <b>cea</b> (f.sg.), <b>cei</b> (m.pl.), <b>cele</b> (f.pl.)","Superlative: <b>cel mai</b> + adjective — <i>cel mai bun</i>, <i>cea mai mare</i>","Standing in for a dropped noun: <i>Care carte? <b>Cea</b> roșie.</i> — Which book? The red one.","Linking a noun to a following phrase: <i>fata <b>cea</b> frumoasă</i>, <i>studenții <b>cei</b> harnici</i>","With numbers: <i><b>cei</b> doi copii</i> — the two children"],
 examples:[
   {ro:"Care e mașina ta? — Cea albastră.",en:"Which is your car? — The blue one."},
   {ro:"Este cea mai bună soluție.",en:"It's the best solution."},
   {ro:"Cei doi frați locuiesc împreună.",en:"The two brothers live together."},
   {ro:"Prefer varianta cea nouă.",en:"I prefer the new version."}
 ],
 mistakes:[
   {wrong:"Care carte? Roșia.",right:"Care carte? Cea roșie.",note:"English drops the noun and says 'the red one'. Romanian uses <b>cea</b> to hold the place — turning the adjective into a definite noun instead is not idiomatic."},
   {wrong:"cel mai bună",right:"cea mai bună",note:"<b>Cel</b> agrees with the noun it refers to, so a feminine noun takes <b>cea</b> even though <i>cel mai</i> feels like a fixed phrase."},
   {wrong:"doi copii au venit (meaning 'the two children')",right:"cei doi copii au venit",note:"Without <b>cei</b> this is 'two children' rather than 'the two children'. The article carries the definiteness."}
 ]},
{id:"g_pluperfect", cat:"Verbs", level:"B1", title:"Mai-mult-ca-perfectul (Pluperfect)",
 rule:"The tense for an action completed BEFORE another past action. Romanian forms it with a single word — no auxiliary — which makes it look strange at first but easy to build.",
 formation:["Take the participle, drop any final -t/-s ending change, and add the pluperfect endings: <b>-sem, -seși, -se, -serăm, -serăți, -seră</b>","<i>a pleca</i> → plecasem, plecaseși, plecase, plecaserăm, plecaserăți, plecaseră","<i>a merge</i> (participle <i>mers</i>) → mersesem, merseseși, mersese, merseserăm, merseserăți, merseseră","<i>a fi</i> → fusesem, fuseseși, fusese, fuseserăm, fuseserăți, fuseseră","Unlike the perfect compus, there is <b>no auxiliary</b> — the whole tense is one word."],
 examples:[
   {ro:"Când am ajuns, ei plecaseră deja.",en:"When I arrived, they had already left."},
   {ro:"Nu am recunoscut strada, pentru că nu mai fusesem acolo.",en:"I didn't recognise the street, because I hadn't been there before."},
   {ro:"Începuse să plouă înainte să ieșim.",en:"It had started raining before we went out."}
 ],
 mistakes:[{wrong:"Când am ajuns, ei au plecat deja.",right:"Când am ajuns, ei plecaseră deja.",note:"With <i>deja</i> and two past events, the earlier one needs the pluperfect. Using the perfect compus for both flattens the sequence and reads as if the two things happened at the same moment."}]},
{id:"g_reported", cat:"Sentence Structure", level:"B1", title:"Reported Speech",
 rule:"Romanian reports speech with că (that) or să (for requests and commands), and shifts tenses backwards much as English does — but far less rigidly.",
 formation:["Statements: <b>că</b> + clause — <i>A spus <b>că</b> vine mâine.</i>","Requests/commands: <b>să</b> + subjunctive — <i>M-a rugat <b>să</b> îl ajut.</i>","Yes/no questions: <b>dacă</b> — <i>M-a întrebat <b>dacă</b> vin.</i>","Present becomes imperfect when the reporting verb is past: <i>„Sunt obosit” → A zis că <b>era</b> obosit.</i>","In everyday speech the shift is often skipped: <i>A zis că <b>e</b> obosit</i> is perfectly normal."],
 examples:[
   {ro:"Mi-a spus că nu poate veni.",en:"He told me that he can't come."},
   {ro:"M-a întrebat dacă am timp.",en:"She asked me whether I had time."},
   {ro:"Ne-a rugat să vorbim mai încet.",en:"He asked us to speak more quietly."}
 ],
 mistakes:[{wrong:"M-a întrebat că am timp.",right:"M-a întrebat dacă am timp.",note:"A reported yes/no question takes <b>dacă</b>, never <i>că</i>. <i>Că</i> reports a statement."}]},
{id:"g_connectors", cat:"Sentence Structure", level:"B1", title:"Connectors: Cause, Contrast, Concession, Purpose",
 rule:"B1 argumentation relies on a toolbox of connecting words to link ideas precisely.",
 formation:["Cause: pentru că, deoarece, fiindcă (because)","Consequence: așadar, deci, prin urmare (so, therefore)","Contrast: dar, însă, în timp ce (but, whereas)","Concession: deși, cu toate că (although)","Purpose: ca să, pentru ca... să (so that, in order to)"],
 examples:[{ro:"Deși ploua, am ieșit la plimbare.",en:"Although it was raining, we went out for a walk."},{ro:"Am economisit bani ca să călătoresc.",en:"I saved money so that I could travel."}],
 mistakes:[{wrong:"Desși ploua, dar am iesșit.",right:"Desși ploua, am iesșit.",note:"Romanian does not pair <b>desși</b> with <i>dar</i>. One concessive marker is enough — the English 'although… but' habit produces a double connector."},{wrong:"Pentru că nu am timp, de aceea nu vin.",right:"Nu vin pentru că nu am timp.",note:"The same fault from the other side: <b>pentru că</b> gives the cause, <b>de aceea</b> the consequence. Using both states the relation twice."},{wrong:"Am economisit bani să călătoresc — in writing.",right:"…ca să călătoresc.",note:"For purpose, written Romanian prefers <b>ca să</b>. A bare <i>să</i> is fine in speech but clipped in a formal text."}]},
{id:"g_imi_place", cat:"Verbs", level:"A1", title:"Saying What You Like: îmi place / îmi plac",
 rule:"Romanian doesn't say 'I like X'. It says 'X is pleasing to me' — so the thing liked is the <b>subject</b>, and the person doing the liking is in the dative. This reverses the English sentence, and getting it backwards is the single most common A1 mistake.",
 formation:["Dative pronouns: <b>îmi</b> (to me), <b>îți</b> (to you), <b>îi</b> (to him/her), <b>ne</b> (to us), <b>vă</b> (to you pl.), <b>le</b> (to them)","<b>place</b> + singular thing: <i>Îmi place cafeaua.</i>","<b>plac</b> + plural thing: <i>Îmi plac merele.</i>","The verb agrees with the THING, never with the person: <i>Ne plac filmele</i> ('we like films' — plac because filme is plural)","With a verb instead of a noun, always singular: <i>Îmi place să citesc.</i> ('I like to read')","Negation puts nu first: <i>Nu îmi place</i>, usually contracted in speech to <b>nu-mi place</b>."],
 examples:[{ro:"Îmi place cafeaua.",en:"I like coffee. (lit. 'to-me pleases the-coffee')"},{ro:"Îmi plac merele.",en:"I like apples. (plac, because 'mere' is plural)"},{ro:"Îți place România?",en:"Do you like Romania?"},{ro:"Nu-mi place să mă trezesc devreme.",en:"I don't like waking up early."}],
 mistakes:[{wrong:"Eu plac cafea.",right:"Îmi place cafeaua.",note:"'Eu plac' would mean 'I am pleasing (to someone)'. The person who likes goes in the dative — îmi, not eu — and the thing liked takes the definite article."},{wrong:"Îmi place merele.",right:"Îmi plac merele.",note:"The verb agrees with the thing liked. Plural thing → plac."}]},
{id:"g_frequency", cat:"Adverbs", level:"A1", title:"Adverbs of Frequency",
 rule:"How often something happens is expressed with a small set of adverbs. Most sit before or after the verb fairly freely, but <b>niciodată</b> ('never') behaves differently — it demands a <b>nu</b> on the verb.",
 formation:["<b>întotdeauna / mereu</b> — always","<b>de obicei</b> — usually","<b>des / deseori</b> — often","<b>uneori / câteodată</b> — sometimes","<b>rar</b> — rarely","<b>niciodată</b> — never, and always with <b>nu</b>: <i>Nu merg niciodată acolo.</i>","Time-frame phrases: <b>în fiecare zi</b> (every day), <b>o dată pe săptămână</b> (once a week), <b>de două ori pe lună</b> (twice a month)"],
 examples:[{ro:"De obicei mă trezesc la șapte.",en:"I usually wake up at seven."},{ro:"Merg la sală de două ori pe săptămână.",en:"I go to the gym twice a week."},{ro:"Nu beau niciodată cafea seara.",en:"I never drink coffee in the evening."}],
 mistakes:[{wrong:"Beau niciodată cafea.",right:"Nu beau niciodată cafea.",note:"Romanian requires the double negative. Unlike English, dropping nu is not an option — it makes the sentence ungrammatical, not just informal."},{wrong:"Merg la sală două ori pe săptămână.",right:"Merg la sală de două ori pe săptămână.",note:"'X times' is de … ori: de două ori, de trei ori. Only 'once' breaks the pattern: o dată."}]},
{id:"g_dates", cat:"Numbers", level:"A1", title:"Months & Dates",
 rule:"Months are never capitalized in Romanian. Dates use ordinary cardinal numbers — with one exception, the first of the month.",
 formation:["ianuarie, februarie, martie, aprilie, mai, iunie, iulie, august, septembrie, octombrie, noiembrie, decembrie — all lowercase","Asking: <b>Ce dată este azi?</b> or <b>În ce dată suntem?</b>","Answering: <b>Este 15 martie.</b> — cardinal number, no preposition, no 'the'","The 1st is the exception and uses the ordinal: <b>întâi martie</b> (or <i>1 martie</i>)","'On' a date takes <b>pe</b>: <i>Ne vedem pe 20 mai.</i>","Months take <b>în</b>: <i>în august</i>. Years take <b>în</b> too: <i>în 2026</i>."],
 examples:[{ro:"Ce dată este azi? — Este 12 octombrie.",en:"What's the date today? — It's 12 October."},{ro:"Ziua mea este pe întâi martie.",en:"My birthday is on the first of March."},{ro:"Plecăm în septembrie.",en:"We're leaving in September."}],
 mistakes:[{wrong:"Este 15 de martie.",right:"Este 15 martie.",note:"No de before the month — that rule applies to counted nouns (15 zile), not to dates."},{wrong:"Ziua mea este pe unu martie.",right:"Ziua mea este pe întâi martie.",note:"The first of the month uses întâi, not unu."}]},
{id:"g_ma_doare", cat:"Verbs", level:"A1", title:"Saying What Hurts: mă doare",
 rule:"Like <i>îmi place</i>, this construction inverts the English sentence. Romanian says 'the head hurts <b>me</b>' — the body part is the subject, and the person is a direct-object pronoun.",
 formation:["Pronouns: <b>mă</b> (me), <b>te</b> (you), <b>îl/o</b> (him/her), <b>ne</b> (us), <b>vă</b> (you pl.), <b>îi/le</b> (them)","<b>doare</b> + one body part: <i>Mă doare capul.</i>","<b>dor</b> + several body parts: <i>Mă dor picioarele.</i>","The body part takes the definite article: <b>capul</b>, not <i>cap</i>","Past: <i>M-a durut capul.</i>"],
 examples:[{ro:"Mă doare capul.",en:"I have a headache. (lit. 'the head hurts me')"},{ro:"Mă dor picioarele.",en:"My feet hurt. (dor, because picioarele is plural)"},{ro:"Te doare gâtul?",en:"Does your throat hurt?"}],
 mistakes:[{wrong:"Eu doare capul meu.",right:"Mă doare capul.",note:"Two errors at once: the person must be the pronoun mă, and the body part takes the definite article rather than a possessive. Romanian does not say 'my head' here — whose head it is, is obvious."},{wrong:"Mă doare picioarele.",right:"Mă dor picioarele.",note:"The verb agrees with the body part. Plural body part → dor."}]},
{id:"g_comparative_a1", cat:"Adjectives", level:"A1", title:"Making Comparisons: mai … decât",
 rule:"Romanian never changes the adjective's ending to compare. It puts <b>mai</b> in front, and <b>decât</b> before whatever you compare against.",
 formation:["More: <b>mai</b> + adjective — <i>mai mare</i> (bigger)","Less: <b>mai puțin</b> + adjective — <i>mai puțin scump</i> (less expensive)","Than: <b>decât</b> — <i>mai mare decât</i>","As … as: <b>la fel de … ca</b> — <i>la fel de bun ca</i>","The most: <b>cel/cea/cei/cele mai</b> + adjective, agreeing with the noun — <i>cel mai bun</i>, <i>cea mai bună</i>","The adjective still agrees with its noun: <i>o casă mai mare</i>, <i>niște case mai mari</i>."],
 examples:[{ro:"Această cămașă este mai ieftină decât cealaltă.",en:"This shirt is cheaper than the other one."},{ro:"Trenul este mai rapid decât autobuzul.",en:"The train is faster than the bus."},{ro:"Este cel mai bun restaurant din oraș.",en:"It's the best restaurant in the city."}],
 mistakes:[{wrong:"mai ieftin ca cealaltă",right:"mai ieftin decât cealaltă",note:"Use decât for 'than' after a comparative. Ca belongs to the equal comparison la fel de … ca."},{wrong:"cel mai bună",right:"cea mai bună",note:"cel/cea/cei/cele agrees with the noun: cel mai bun (m), cea mai bună (f)."}]},
{id:"g_impersonal", cat:"Verbs", level:"A1", title:"Impersonal Verbs: Weather & 'It is…'",
 rule:"Weather in Romanian has no subject at all. English needs a dummy 'it' — <i>it rains</i>, <i>it is cold</i> — but Romanian simply uses the third-person verb on its own.",
 formation:["Single verbs: <b>plouă</b> (it's raining), <b>ninge</b> (it's snowing), <b>tună</b> (it's thundering)","<b>este / e</b> + adjective: <i>este frig</i> (it's cold), <i>e cald</i> (it's warm), <i>e frumos</i> (the weather is nice)","<b>este</b> + noun: <i>este soare</i> (it's sunny), <i>este vânt</i> (it's windy)","Past: <b>a plouat</b>, <b>a nins</b>, <b>a fost frig</b>","Never add a pronoun: there is no Romanian equivalent of the English dummy 'it' here."],
 examples:[{ro:"Plouă de dimineață.",en:"It's been raining since morning."},{ro:"Iarna este foarte frig aici.",en:"In winter it's very cold here."},{ro:"Ieri a nins toată ziua.",en:"Yesterday it snowed all day."}],
 mistakes:[{wrong:"El plouă.",right:"Plouă.",note:"There is no subject. Adding el makes it mean 'he rains', which is nonsense — this is the single most common English-speaker error with weather."},{wrong:"Este este frig.",right:"Este frig.",note:"One verb is enough: este frig literally reads 'is cold', with no subject."}]},
{id:"g_place_prepositions", cat:"Prepositions", level:"A1", title:"Prepositions of Place & Giving Directions",
 rule:"Location and direction use a small set of prepositions, some of which require de before the noun.",
 formation:["<b>în</b> (in), <b>pe</b> (on), <b>la</b> (at/to), <b>sub</b> (under), <b>lângă</b> (next to)","With <b>de</b>: <b>aproape de</b> (near), <b>departe de</b> (far from), <b>vizavi de</b> (opposite), <b>în fața</b> (in front of), <b>în spatele</b> (behind)","Directions: <b>drept înainte</b> (straight ahead), <b>la stânga</b> (left), <b>la dreapta</b> (right), <b>la colț</b> (at the corner)","<b>la</b> covers both 'at' and 'to' — <i>Merg la gară</i> (I'm going to the station) and <i>Sunt la gară</i> (I'm at the station)."],
 examples:[{ro:"Farmacia este lângă bancă.",en:"The pharmacy is next to the bank."},{ro:"Mergeți drept înainte, apoi la stânga.",en:"Go straight ahead, then left."},{ro:"Hotelul este vizavi de parc.",en:"The hotel is opposite the park."}],
 mistakes:[{wrong:"aproape banca",right:"aproape de bancă",note:"aproape, departe and vizavi all require de before the noun."}]},
{id:"g_word_order", cat:"Sentence Structure", level:"A2", title:"Word Order & Emphasis",
 rule:"Basic order is Subject-Verb-Object, but Romanian is flexible: word order shifts to change emphasis, and clitic pronouns cluster tightly before the verb.",
 formation:["Neutral: <i>Maria citește o carte.</i>","Fronting for emphasis: <i>O carte citește Maria (nu un ziar).</i> ('It's a book Maria is reading, not a newspaper')","Adjectives, adverbs, and object pronouns follow fairly fixed positions relative to the verb even when the subject moves."],
 examples:[{ro:"Mâine plecăm la mare.",en:"Tomorrow we're leaving for the seaside. (time-adverb fronted, very natural)"}],
 mistakes:[{wrong:"Eu mâine plec la mare.",right:"Mâine plec la mare.",note:"Once a time adverb is fronted, the subject pronoun normally drops — the verb ending already carries it. Keeping <i>eu</i> is grammatical but heavy."},{wrong:"Am văzut niciodată acest film.",right:"Nu am văzut niciodată acest film.",note:"Romanian keeps the double negative: <b>nu</b> stays even with <i>niciodată</i>, <i>nimic</i>, <i>nimeni</i>. Dropping it, as English does, is ungrammatical."},{wrong:"Cartea o am citit.",right:"Cartea am citit-o. / Am citit cartea.",note:"Object pronouns sit immediately before the verb, or attach to the participle — they cannot float. Emphasis is achieved by fronting the noun, not by moving the pronoun."}]}
];

/* ===================== VOCABULARY ===================== */
// pos: noun/verb/adj/adv/phrase/pron/prep/conj/num
var VOCAB = [
 // --- A1.1 U1 L1: Salut! ---
 {id:"w_buna", ro:"bună", pos:"phrase", en:"hi / hello (informal, any time)", ex:{ro:"Bună! Ce mai faci?",en:"Hi! How are you?"}, level:"a1_1", unit:"a1_1_u1", tags:["greetings"]},

   {speaker:"Agent", ro:"Da, balconul este în sufragerie și dă spre parc.", en:"Yes, the balcony is off the living room and looks onto the park."},
   {speaker:"Client", ro:"Îmi place. Cât este chiria?", en:"I like it. How much is the rent?"},
   {speaker:"Agent", ro:"Patru sute cincizeci de euro pe lună, plus întreținerea.", en:"Four hundred and fifty euros a month, plus maintenance."}
  ]},
 {id:"d_u8l1", title:"Cum e vremea?", titleEn:"What's the weather like?", level:"a1_1",
  lines:[
   {speaker:"Ana", ro:"Cum este vremea afară?", en:"What's the weather like outside?"},
   {speaker:"Mihai", ro:"Plouă și bate vântul. Ia o umbrelă!", en:"It's raining and windy. Take an umbrella!"},
   {speaker:"Ana", ro:"Câte grade sunt?", en:"How many degrees is it?"},
   {speaker:"Mihai", ro:"Doar zece grade. E cam frig pentru mai.", en:"Only ten degrees. It's rather cold for May."},
   {speaker:"Ana", ro:"Sper că mâine va fi soare.", en:"I hope it'll be sunny tomorrow."},
   {speaker:"Mihai", ro:"Da, se anunță frumos la sfârșitul săptămânii.", en:"Yes, they're forecasting nice weather at the end of the week."}
  ]},
 {id:"d_a12u1", title:"Cu ce te ocupi?", titleEn:"What do you do?", level:"a1_2",
  lines:[
   {speaker:"Andrei", ro:"Tu cu ce te ocupi?", en:"What do you do (for a living)?"},
   {speaker:"Elena", ro:"Sunt programatoare la o firmă din centru. Dar tu?", en:"I'm a programmer at a company downtown. And you?"},
   {speaker:"Andrei", ro:"Eu sunt medic. Lucrez la spitalul de lângă parc.", en:"I'm a doctor. I work at the hospital near the park."},
   {speaker:"Elena", ro:"Ai un program greu?", en:"Do you have a hard schedule?"},
   {speaker:"Andrei", ro:"Uneori. De obicei încep la opt și termin la șase, dar rar plec la timp.", en:"Sometimes. I usually start at eight and finish at six, but I rarely leave on time."},
   {speaker:"Elena", ro:"Înțeleg. Eu am noroc — nu lucrez niciodată în weekend.", en:"I understand. I'm lucky — I never work at the weekend."}
  ]},
 {id:"d_a12u2", title:"Ce faci în timpul liber?", titleEn:"What do you do in your free time?", level:"a1_2",
  lines:[
   {speaker:"Maria", ro:"Ce faci de obicei în timpul liber?", en:"What do you usually do in your free time?"},
   {speaker:"Radu", ro:"Îmi place să citesc și să gătesc. Și joc fotbal sâmbăta.", en:"I like reading and cooking. And I play football on Saturdays."},
   {speaker:"Maria", ro:"Eu nu fac sport aproape deloc. Prefer să mă uit la filme.", en:"I hardly do any sport. I prefer watching films."},
   {speaker:"Radu", ro:"Ce filme îți plac?", en:"What films do you like?"},
   {speaker:"Maria", ro:"Îmi plac comediile. Nu-mi plac deloc filmele de groază.", en:"I like comedies. I don't like horror films at all."},
   {speaker:"Radu", ro:"Atunci mergem la o comedie weekendul viitor?", en:"Then shall we go to a comedy next weekend?"}
  ]},
 {id:"d_a12u3", title:"O programare la medic", titleEn:"A doctor's appointment", level:"a1_2",
  lines:[
   {speaker:"Recepție", ro:"Alo, cabinetul doctorului Ionescu, bună ziua!", en:"Hello, Doctor Ionescu's practice, good day!"},
   {speaker:"Pacient", ro:"Bună ziua! Aș vrea să fac o programare, vă rog.", en:"Good day! I'd like to make an appointment, please."},
   {speaker:"Recepție", ro:"Sigur. Când sunteți liber?", en:"Certainly. When are you free?"},
   {speaker:"Pacient", ro:"Joi sau vineri, dacă se poate. Joi sunt ocupat dimineața.", en:"Thursday or Friday, if possible. On Thursday I'm busy in the morning."},
   {speaker:"Recepție", ro:"Avem loc vineri, pe 14 martie, la ora unsprezece.", en:"We have a slot on Friday, the 14th of March, at eleven o'clock."},
   {speaker:"Pacient", ro:"Perfect. Vă mulțumesc mult!", en:"Perfect. Thank you very much!"}
  ]},
 {id:"d_a12u4", title:"La farmacie", titleEn:"At the pharmacy", level:"a1_2",
  lines:[
   {speaker:"Farmacist", ro:"Bună ziua! Cu ce vă pot ajuta?", en:"Good day! How can I help you?"},
   {speaker:"Client", ro:"Bună ziua. Mă doare gâtul de două zile și cred că am febră.", en:"Good day. My throat has hurt for two days and I think I have a fever."},
   {speaker:"Farmacist", ro:"Aveți rețetă de la medic?", en:"Do you have a prescription from the doctor?"},
   {speaker:"Client", ro:"Nu, încă nu am fost la medic.", en:"No, I haven't been to the doctor yet."},
   {speaker:"Farmacist", ro:"Vă dau ceva pentru gât. Dacă febra nu scade în două zile, mergeți la medic.", en:"I'll give you something for your throat. If the fever doesn't go down in two days, go to the doctor."},
   {speaker:"Client", ro:"Mulțumesc mult. Cât costă?", en:"Thank you very much. How much is it?"}
  ]},
 {id:"d_a12u5", title:"La casa de bilete", titleEn:"At the ticket office", level:"a1_2",
  lines:[
   {speaker:"Călător", ro:"Bună ziua. Un bilet până la Brașov, vă rog.", en:"Good day. One ticket to Brașov, please."},
   {speaker:"Casier", ro:"Dus sau dus-întors?", en:"One way or return?"},
   {speaker:"Călător", ro:"Dus-întors, mă întorc duminică.", en:"Return, I'm coming back on Sunday."},
   {speaker:"Casier", ro:"Trenul de la ora nouă are un loc liber la clasa a doua.", en:"The nine o'clock train has a free seat in second class."},
   {speaker:"Călător", ro:"Perfect. De la ce peron pleacă?", en:"Perfect. Which platform does it leave from?"},
   {speaker:"Casier", ro:"De la peronul patru. Atenție, are zece minute întârziere.", en:"From platform four. Careful, it has a ten-minute delay."}
  ]},
 {id:"d_a12u6", title:"O invitație", titleEn:"An invitation", level:"a1_2",
  lines:[
   {speaker:"Ana", ro:"Sâmbătă este ziua mea de naștere. Vii la petrecere?", en:"Saturday is my birthday. Are you coming to the party?"},
   {speaker:"Mihai", ro:"Sigur că vin! La ce oră începe?", en:"Of course I'm coming! What time does it start?"},
   {speaker:"Ana", ro:"Pe la șapte, la mine acasă.", en:"Around seven, at my place."},
   {speaker:"Mihai", ro:"Vine și Radu?", en:"Is Radu coming too?"},
   {speaker:"Ana", ro:"Din păcate nu poate, este plecat din oraș.", en:"Unfortunately he can't, he's out of town."},
   {speaker:"Mihai", ro:"Păcat. Atunci ne vedem sâmbătă — aduc eu ceva de băut.", en:"Shame. See you Saturday then — I'll bring something to drink."}
  ]},
 {id:"d_civ_interviu", title:"La interviu", titleEn:"At the interview", level:"civic",
  lines:[
   {speaker:"Funcționar", ro:"Bună ziua. Vă rog să vă prezentați.", en:"Good day. Please introduce yourself."},
   {speaker:"Solicitant", ro:"Bună ziua. Mă numesc Andrei Popa, am treizeci și patru de ani și locuiesc în Chișinău.", en:"Good day. My name is Andrei Popa, I am thirty-four years old and I live in Chișinău."},
   {speaker:"Funcționar", ro:"De ce doriți să redobândiți cetățenia română?", en:"Why do you wish to restore Romanian citizenship?"},
   {speaker:"Solicitant", ro:"Bunicii mei s-au născut în România. Vreau să păstrez legătura cu țara și cu limba lor.", en:"My grandparents were born in Romania. I want to keep the connection with their country and language."},
   {speaker:"Funcționar", ro:"Care este capitala României și care este ziua națională?", en:"What is the capital of Romania and what is the national day?"},
   {speaker:"Solicitant", ro:"Capitala este București, iar ziua națională este 1 decembrie.", en:"The capital is Bucharest, and the national day is 1 December."},
   {speaker:"Funcționar", ro:"Puteți să spuneți jurământul de credință?", en:"Can you say the oath of allegiance?"},
   {speaker:"Solicitant", ro:"Da. Jur să fiu devotat patriei și poporului român, să apăr drepturile și interesele naționale, să respect Constituția și legile României.", en:"Yes. I swear to be devoted to the homeland and the Romanian people, to defend the national rights and interests, to respect the Constitution and the laws of Romania."}
  ]},
 {id:"d_a2u1", title:"Weekendul trecut", titleEn:"Last weekend", level:"a2_1",
  lines:[
   {speaker:"Sorin", ro:"Ce ai făcut în weekend?", en:"What did you do on the weekend?"},
   {speaker:"Maria", ro:"Sâmbătă am mers la munte cu niște prieteni. Am mâncat la un restaurant tradițional și am făcut o drumeție.", en:"On Saturday I went to the mountains with some friends. We ate at a traditional restaurant and went hiking."},
   {speaker:"Sorin", ro:"Sună minunat! Eu am stat acasă și am citit o carte.", en:"Sounds wonderful! I stayed home and read a book."},
   {speaker:"Maria", ro:"Duminică ne-am întâlnit cu familia și am vizitat un muzeu nou din centru.", en:"On Sunday we met up with family and visited a new museum downtown."}
  ]},
 {id:"d_a2u2", title:"Ce planuri ai?", titleEn:"What are your plans?", level:"a2_1",
  lines:[
   {speaker:"Irina", ro:"Ce planuri ai pentru vara asta?", en:"What plans do you have for this summer?"},
   {speaker:"Cătălin", ro:"O să merg două săptămâni în Grecia. Am rezervat deja biletele.", en:"I'm going to Greece for two weeks. I've already booked the tickets."},
   {speaker:"Irina", ro:"Ce bine! Eu încă nu știu. Trebuie să vorbesc cu șeful despre concediu.", en:"How nice! I still don't know. I have to talk to my boss about the leave."},
   {speaker:"Cătălin", ro:"Ar trebui să te decizi repede, altfel se scumpesc biletele.", en:"You should decide quickly, otherwise the tickets get more expensive."},
   {speaker:"Irina", ro:"Ai dreptate. Sper să rezolv până vineri.", en:"You're right. I hope to sort it out by Friday."},
   {speaker:"Cătălin", ro:"Dacă vrei, îți trimit linkul agenției mele.", en:"If you like, I'll send you my agency's link."}
  ]},
 {id:"d_a2u3", title:"La recepția hotelului", titleEn:"At the hotel reception", level:"a2_1",
  lines:[
   {speaker:"Recepționer", ro:"Bună ziua! Aveți o rezervare?", en:"Good day! Do you have a reservation?"},
   {speaker:"Client", ro:"Da, pe numele Ionescu. O cameră dublă pentru trei nopți.", en:"Yes, under the name Ionescu. A double room for three nights."},
   {speaker:"Recepționer", ro:"Am găsit-o. Camera 214, la etajul doi. Poftiți cheia.", en:"I've found it. Room 214, on the second floor. Here's the key."},
   {speaker:"Client", ro:"Mulțumesc. Micul dejun este inclus?", en:"Thank you. Is breakfast included?"},
   {speaker:"Recepționer", ro:"Da, îl serviți între șapte și zece, la parter.", en:"Yes, you have it between seven and ten, on the ground floor."},
   {speaker:"Client", ro:"Perfect. Și la ce oră trebuie să eliberăm camera?", en:"Perfect. And what time do we have to check out?"},
   {speaker:"Recepționer", ro:"Până la ora douăsprezece. Vă doresc un sejur plăcut!", en:"By twelve o'clock. I wish you a pleasant stay!"}
  ]},
 {id:"d_a2u4", title:"La cabinetul medical", titleEn:"At the doctor's surgery", level:"a2_1",
  lines:[
   {speaker:"Medic", ro:"Bună ziua. Spuneți-mi, ce vă supără?", en:"Good day. Tell me, what's bothering you?"},
   {speaker:"Pacient", ro:"Tușesc de o săptămână și mă doare gâtul. Cred că am răcit.", en:"I've been coughing for a week and my throat hurts. I think I've caught a cold."},
   {speaker:"Medic", ro:"Ați avut febră?", en:"Have you had a fever?"},
   {speaker:"Pacient", ro:"Da, acum trei zile am avut treizeci și opt de grade.", en:"Yes, three days ago I had thirty-eight degrees."},
   {speaker:"Medic", ro:"Înțeleg. Ar trebui să vă odihniți și să beți multe lichide.", en:"I see. You should rest and drink plenty of fluids."},
   {speaker:"Pacient", ro:"Am nevoie de analize?", en:"Do I need tests?"},
   {speaker:"Medic", ro:"Deocamdată nu. Vă dau o rețetă, iar dacă nu vă simțiți mai bine în trei zile, reveniți.", en:"Not for now. I'll give you a prescription, and if you don't feel better in three days, come back."}
  ]},
 {id:"d_a2u5", title:"Vizionăm un apartament", titleEn:"Viewing a flat", level:"a2_1",
  lines:[
   {speaker:"Proprietar", ro:"Acesta este apartamentul. L-am renovat anul trecut.", en:"This is the flat. I renovated it last year."},
   {speaker:"Chiriaș", ro:"Se vede. Cât este chiria și ce include?", en:"You can tell. How much is the rent and what does it include?"},
   {speaker:"Proprietar", ro:"Cinci sute de euro. Întreținerea nu este inclusă.", en:"Five hundred euros. Maintenance isn't included."},
   {speaker:"Chiriaș", ro:"Și garanția?", en:"And the deposit?"},
   {speaker:"Proprietar", ro:"O chirie. O primiți înapoi la sfârșitul contractului.", en:"One month's rent. You get it back at the end of the contract."},
   {speaker:"Chiriaș", ro:"Vecinii sunt liniștiți?", en:"Are the neighbours quiet?"},
   {speaker:"Proprietar", ro:"Foarte. Sunt o familie cu doi copii și o doamnă în vârstă.", en:"Very. There's a family with two children and an elderly lady."},
   {speaker:"Chiriaș", ro:"Îmi place. Când putem semna contractul?", en:"I like it. When can we sign the contract?"}
  ]},
 {id:"d_b1u1", title:"Munca de acasă", titleEn:"Working from home", level:"b1_1",
  lines:[
   {speaker:"Alex", ro:"Care este părerea ta despre munca de acasă?", en:"What's your opinion about working from home?"},
   {speaker:"Ioana", ro:"Cred că e important să avem flexibilitate, dar mi se pare că lipsește contactul cu colegii.", en:"I think it's important to have flexibility, but I feel like contact with colleagues is missing."},
   {speaker:"Alex", ro:"Sunt de acord. E bine să lucrăm de acasă câteva zile, dar nu în fiecare zi.", en:"I agree. It's good to work from home a few days, but not every day."},
   {speaker:"Ioana", ro:"Exact. Depinde și de tipul de job — pentru unii e mai potrivit decât pentru alții.", en:"Exactly. It also depends on the type of job — it suits some more than others."}
  ]},

 /* ---------- A2.1 units 6–8 ---------- */
 {id:"d_a2u6", title:"Interviu pentru un post", titleEn:"A job interview", level:"a2_1",
  lines:[
   {speaker:"Angajator", ro:"Bună ziua! Luați loc, vă rog. Povestiți-mi puțin despre dumneavoastră.", en:"Good day! Have a seat, please. Tell me a little about yourself."},
   {speaker:"Candidat", ro:"Mulțumesc. Am terminat facultatea de economie acum trei ani și de atunci lucrez în contabilitate.", en:"Thank you. I finished the economics faculty three years ago and since then I've worked in accounting."},
   {speaker:"Angajator", ro:"De ce vreți să schimbați locul de muncă?", en:"Why do you want to change jobs?"},
   {speaker:"Candidat", ro:"Îmi place ce fac, dar vreau o echipă mai mare și mai multă responsabilitate.", en:"I like what I do, but I want a bigger team and more responsibility."},
   {speaker:"Angajator", ro:"Ce salariu aveți în vedere?", en:"What salary do you have in mind?"},
   {speaker:"Candidat", ro:"M-am gândit la ceva în jur de opt mii de lei net, dar sunt deschis la discuții.", en:"I was thinking of something around eight thousand lei net, but I'm open to discussion."},
   {speaker:"Angajator", ro:"Bine. Vă anunțăm până vineri.", en:"Good. We'll let you know by Friday."}
  ]},
 {id:"d_a2u7", title:"Cum e noul coleg?", titleEn:"What's the new colleague like?", level:"a2_1",
  lines:[
   {speaker:"Dana", ro:"Ai cunoscut-o pe Ioana, colega nouă?", en:"Have you met Ioana, the new colleague?"},
   {speaker:"Radu", ro:"Da, ieri. Mi s-a părut foarte deschisă.", en:"Yes, yesterday. She seemed very open to me."},
   {speaker:"Dana", ro:"Așa e. E genul de om care întreabă când nu știe ceva.", en:"That's right. She's the kind of person who asks when she doesn't know something."},
   {speaker:"Radu", ro:"Asta apreciez. Colegul de dinainte era mai închis și nu spunea niciodată nimic.", en:"That's what I appreciate. The colleague before was more closed off and never said anything."},
   {speaker:"Dana", ro:"Da, era cam timid. Ioana pare mai sigură pe ea.", en:"Yes, he was rather shy. Ioana seems more sure of herself."},
   {speaker:"Radu", ro:"Sper să rămână. Avem nevoie de cineva răbdător în echipă.", en:"I hope she stays. We need someone patient on the team."}
  ]},
 {id:"d_a2u8", title:"La piață", titleEn:"At the market", level:"a2_1",
  lines:[
   {speaker:"Vânzătoare", ro:"Bună ziua! Ce vă dau?", en:"Good day! What can I get you?"},
   {speaker:"Client", ro:"Aș vrea un kilogram de roșii și o legătură de pătrunjel.", en:"I'd like a kilogram of tomatoes and a bunch of parsley."},
   {speaker:"Vânzătoare", ro:"Roșiile sunt de grădină, foarte bune pentru salată. Altceva?", en:"The tomatoes are homegrown, very good for salad. Anything else?"},
   {speaker:"Client", ro:"Aveți smântână? Fac sarmale duminică.", en:"Do you have sour cream? I'm making sarmale on Sunday."},
   {speaker:"Vânzătoare", ro:"Sigur că am. Smântână de casă, groasă. Cu ce carne le faceți?", en:"Of course I do. Homemade sour cream, thick. What meat are you making them with?"},
   {speaker:"Client", ro:"Cu porc și puțină vită, cum făcea bunica.", en:"With pork and a little beef, the way my grandmother used to."},
   {speaker:"Vânzătoare", ro:"Așa e cel mai bine. Douăzeci și cinci de lei în total.", en:"That's the best way. Twenty-five lei in total."}
  ]},

 /* ---------- A2.2 ---------- */
 {id:"d_a2_2u2", title:"La bancă", titleEn:"At the bank", level:"a2_2",
  lines:[
   {speaker:"Funcționar", ro:"Bună ziua! Cu ce vă pot ajuta?", en:"Good day! How can I help you?"},
   {speaker:"Client", ro:"Aș vrea să deschid un cont curent. Ce acte îmi trebuie?", en:"I'd like to open a current account. What documents do I need?"},
   {speaker:"Funcționar", ro:"Buletinul sau pașaportul și o dovadă de adresă. Aveți permis de ședere?", en:"Your ID card or passport and proof of address. Do you have a residence permit?"},
   {speaker:"Client", ro:"Da, îl am la mine. Se percepe vreun comision lunar?", en:"Yes, I have it with me. Is there a monthly fee?"},
   {speaker:"Funcționar", ro:"Primul an e gratuit, apoi cinci lei pe lună. Completați formularul acesta, vă rog.", en:"The first year is free, then five lei a month. Fill in this form, please."},
   {speaker:"Client", ro:"În cât timp primesc cardul?", en:"How long until I get the card?"},
   {speaker:"Funcționar", ro:"În cinci zile lucrătoare, la ghișeul de aici sau prin poștă.", en:"In five working days, at the counter here or by post."}
  ]},
 {id:"d_a2_2u3", title:"Am o problemă cu produsul", titleEn:"I have a problem with the product", level:"a2_2",
  lines:[
   {speaker:"Client", ro:"Nu vă supărați, am cumpărat aspiratorul acesta acum două săptămâni și s-a stricat.", en:"Excuse me, I bought this vacuum cleaner two weeks ago and it's broken."},
   {speaker:"Vânzător", ro:"Îmi pare rău. Aveți bonul fiscal?", en:"I'm sorry. Do you have the receipt?"},
   {speaker:"Client", ro:"Da, poftiți. Este încă în garanție, nu?", en:"Yes, here you are. It's still under warranty, isn't it?"},
   {speaker:"Vânzător", ro:"Da, garanția e de doi ani. Putem să îl reparăm sau să îl înlocuim.", en:"Yes, the warranty is two years. We can repair it or replace it."},
   {speaker:"Client", ro:"Aș prefera să îl înlocuiți, dacă se poate.", en:"I'd prefer you to replace it, if possible."},
   {speaker:"Vânzător", ro:"Sigur. Completați o cerere și primiți altul în trei zile.", en:"Certainly. Fill in a request and you'll get another one in three days."}
  ]},
 {id:"d_a2_2u5", title:"În magazin", titleEn:"In the shop", level:"a2_2",
  lines:[
   {speaker:"Vânzătoare", ro:"Bună ziua! Căutați ceva anume?", en:"Good day! Are you looking for something in particular?"},
   {speaker:"Client", ro:"Da, un palton pentru iarnă. Ce mărime credeți că port?", en:"Yes, a winter coat. What size do you think I wear?"},
   {speaker:"Vânzătoare", ro:"Cred că patruzeci. Vreți să probați acesta?", en:"I think forty. Would you like to try this one on?"},
   {speaker:"Client", ro:"Da. Unde e cabina de probă?", en:"Yes. Where's the fitting room?"},
   {speaker:"Vânzătoare", ro:"În spate, la dreapta.", en:"At the back, on the right."},
   {speaker:"Client", ro:"E puțin cam strâmt la umeri. Aveți unul mai larg?", en:"It's a bit tight at the shoulders. Do you have a looser one?"},
   {speaker:"Vânzătoare", ro:"Vă aduc mărimea patruzeci și doi. Vă stă foarte bine culoarea, apropo.", en:"I'll bring you a forty-two. The colour suits you very well, by the way."}
  ]},
 {id:"d_a2_2u7", title:"Cum era pe atunci", titleEn:"How it was back then", level:"a2_2",
  lines:[
   {speaker:"Bunica", ro:"Pe atunci locuiam la țară, într-o casă mică.", en:"Back then we lived in the countryside, in a small house."},
   {speaker:"Nepot", ro:"Și mergeai la școală în sat?", en:"And did you go to school in the village?"},
   {speaker:"Bunica", ro:"În fiecare zi mergeam pe jos, patru kilometri. Iarna era greu.", en:"Every day I walked, four kilometres. In winter it was hard."},
   {speaker:"Nepot", ro:"Și ce s-a întâmplat în ziua aceea despre care povesteai?", en:"And what happened on that day you were telling me about?"},
   {speaker:"Bunica", ro:"Mergeam spre școală și dintr-odată a început o furtună. M-am adăpostit la o vecină.", en:"I was walking to school and suddenly a storm started. I took shelter at a neighbour's."},
   {speaker:"Nepot", ro:"Și după aceea?", en:"And after that?"},
   {speaker:"Bunica", ro:"După aceea m-a dus tata cu căruța. Nu am ajuns la școală în ziua aceea.", en:"After that my father took me with the cart. I didn't get to school that day."}
  ]},

 /* ---------- B1.1 ---------- */
 {id:"d_b1u3", title:"Ne-am certat", titleEn:"We had an argument", level:"b1_1",
  lines:[
   {speaker:"Ana", ro:"Ești supărată pe mine? Simt că ceva nu e în regulă.", en:"Are you annoyed with me? I feel like something isn't right."},
   {speaker:"Ioana", ro:"Nu sunt supărată, sunt dezamăgită. E altceva.", en:"I'm not annoyed, I'm disappointed. That's something else."},
   {speaker:"Ana", ro:"Îmi pare rău. Nu mi-am dat seama că te-a deranjat atât.", en:"I'm sorry. I didn't realise it bothered you that much."},
   {speaker:"Ioana", ro:"Nu e vorba de o singură dată. Se întâmplă des și nu spui nimic.", en:"It's not about one time. It happens often and you don't say anything."},
   {speaker:"Ana", ro:"Ai dreptate. Ar fi trebuit să vorbesc cu tine mai devreme.", en:"You're right. I should have spoken to you earlier."},
   {speaker:"Ioana", ro:"Hai să lăsăm asta. Important e că vorbim acum.", en:"Let's leave it. What matters is that we're talking now."}
  ]},
 {id:"d_b1u6", title:"La ghișeu, din nou", titleEn:"At the counter, again", level:"b1_1",
  lines:[
   {speaker:"Funcționară", ro:"Următorul, vă rog! Ce doriți?", en:"Next, please! What do you need?"},
   {speaker:"Solicitant", ro:"Aș vrea să depun o cerere pentru certificatul de rezidență.", en:"I'd like to submit an application for a residence certificate."},
   {speaker:"Funcționară", ro:"Aveți dosarul complet? Trebuie copie după pașaport, dovadă de adresă și cerere semnată.", en:"Is your file complete? You need a copy of your passport, proof of address and a signed application."},
   {speaker:"Solicitant", ro:"Cred că da. Am adus tot ce scria pe site.", en:"I think so. I brought everything the website listed."},
   {speaker:"Funcționară", ro:"Lipsește ștampila de la primărie pe dovada de adresă.", en:"The stamp from the town hall is missing on the proof of address."},
   {speaker:"Solicitant", ro:"Și dacă o aduc mâine, se poate rezolva?", en:"And if I bring it tomorrow, can it be sorted out?"},
   {speaker:"Funcționară", ro:"Da, dar termenul de depunere e vineri. Certificatul se eliberează în treizeci de zile.", en:"Yes, but the submission deadline is Friday. The certificate is issued within thirty days."}
  ]},
 {id:"d_b1u8", title:"Să cumpărăm sau să stăm cu chirie?", titleEn:"Buy or keep renting?", level:"b1_1",
  lines:[
   {speaker:"Radu", ro:"Dacă am lua un credit acum, am plăti cam cât plătim pe chirie.", en:"If we took out a loan now, we'd pay about what we pay in rent."},
   {speaker:"Ilinca", ro:"Da, dar rata rămâne douăzeci de ani. Chiria o poți opri oricând.", en:"Yes, but the instalment stays for twenty years. You can stop renting any time."},
   {speaker:"Radu", ro:"E adevărat. Pe de altă parte, la sfârșit apartamentul e al nostru.", en:"That's true. On the other hand, at the end the flat is ours."},
   {speaker:"Ilinca", ro:"Mă îngrijorează dobânda. Dacă crește, nu ne-am mai permite.", en:"The interest worries me. If it goes up, we wouldn't be able to afford it any more."},
   {speaker:"Radu", ro:"Atunci hai să mai așteptăm un an și să strângem un avans mai mare.", en:"Then let's wait another year and save a bigger deposit."},
   {speaker:"Ilinca", ro:"În fond, nu ne grăbește nimeni. E o decizie pentru douăzeci de ani.", en:"After all, nobody's rushing us. It's a decision for twenty years."}
  ]}

 {id:"r_u1", title:"Un mesaj nou", titleEn:"A new message", level:"a1_1", format:"message", wordCount:42,
  ro:"Bună! Numele meu este Elena. Sunt din România, din orașul Cluj-Napoca. Sunt profesoară de matematică. Vorbesc română și engleză, iar acum învăț puțină franceză. Am douăzeci și opt de ani. Familia mea este mică: am un frate și o soră.",
