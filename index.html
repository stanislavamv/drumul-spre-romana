/* ===================== SPEECH / AUDIO ABSTRACTION ===================== */
/* ---------------------------------------------------------------------------
   AUDIO ASSETS — prerecorded native-speaker clips, keyed by the exact Romanian
   string they voice. Stored separately from lesson content (per the brief) so
   recordings can be added without touching a single lesson, vocabulary entry
   or exercise.

   Drop in entries as:  "bună ziua": "audio/buna-ziua.mp3"
   or a data: URI. Anything listed here is used in preference to speech
   synthesis. Keys are matched case- and diacritic-insensitively.

   This ships EMPTY: no native recordings are bundled. Until it is populated,
   playback falls back to a Romanian TTS voice — and if none is installed, the
   app refuses to speak rather than mispronouncing Romanian in an English voice.
--------------------------------------------------------------------------- */
var AUDIO_ASSETS = {
  // "bună ziua": "audio/buna-ziua.mp3",
};

/* Pronunciation comes from pre-rendered clips (see audio-manifest.js). Fetching
   Google's translate_tts live from the page is not possible: it rejects
   browser-originated requests — the Sec-Fetch-* / Origin headers mark them as
   hotlinking and it returns an HTML error page instead of audio, and those
   headers are forbidden to JavaScript. tools/fetch_audio.py does the fetching
   from a non-browser client instead, which also makes playback work offline. */
var AUDIO_ASSET_INDEX = null;
function buildAssetIndex(){
  AUDIO_ASSET_INDEX = {};
  /* audio-manifest.js (generated by tools/fetch_audio.py) is keyed by the same
     normLoose() form used here, so it merges in directly. */
  var m = window.AUDIO_MANIFEST;
  if(m) Object.keys(m).forEach(function(k){ AUDIO_ASSET_INDEX[k] = m[k]; });
  /* Hand-added entries win over generated ones. */
  Object.keys(AUDIO_ASSETS).forEach(function(k){ AUDIO_ASSET_INDEX[normLoose(k)] = AUDIO_ASSETS[k]; });
  return AUDIO_ASSET_INDEX;
}
function assetFor(text){
  if(AUDIO_ASSET_INDEX===null) buildAssetIndex();
  var k = normLoose(text);
  if(AUDIO_ASSET_INDEX[k]) return AUDIO_ASSET_INDEX[k];
  /* Poetic elisions (nost', într') are stored under the unelided stem. */
  var stripped = normLoose(String(text||"").replace(/['’]+$/,""));
  return AUDIO_ASSET_INDEX[stripped] || null;
}
function assetCount(){
  if(AUDIO_ASSET_INDEX===null) buildAssetIndex();
  return Object.keys(AUDIO_ASSET_INDEX).length;
}

var Speech = (function(){
  var voices=[], roVoice=null, current=null, audioEl=null, gtFailed=false;

  /* Rank Romanian voices best-first. Edge exposes free online neural voices
     (Emil / Alina, ro-RO) that are modelled on native speakers; those are the
     best available without shipping recordings. Offline SAPI voices come next.
     A non-Romanian voice is NEVER an acceptable fallback. */
  function scoreVoice(v){
    if(!/^ro(-|_|$)/i.test(v.lang)) return -1;
    var n = (v.name||"").toLowerCase();
    var s = 10;
    if(/natural|neural/.test(n)) s += 40;
    if(/online/.test(n)) s += 20;
    if(/\bro-ro\b/i.test(v.lang)) s += 5;
    if(v.localService) s += 3;
    return s;
  }
  function refresh(){
    try{
      voices = window.speechSynthesis ? (window.speechSynthesis.getVoices()||[]) : [];
      var ro = voices.filter(function(v){ return scoreVoice(v) >= 0; })
                     .sort(function(a,b){ return scoreVoice(b)-scoreVoice(a); });
      roVoice = ro[0] || null;
    }catch(e){ voices=[]; roVoice=null; }
    return roVoice;
  }
  if(typeof window!=="undefined" && window.speechSynthesis){
    refresh();
    /* Voice lists populate asynchronously — and on Edge the online neural
       voices arrive seconds after the offline ones. Re-check and repaint so the
       audio controls stop showing as unavailable once Romanian appears. */
    window.speechSynthesis.onvoiceschanged = function(){
      var had = !!roVoice;
      refresh();
      if(!!roVoice !== had && typeof render==="function") render();
    };
    [400, 1200, 3000].forEach(function(ms){
      setTimeout(function(){
        var had = !!roVoice;
        refresh();
        if(!!roVoice !== had && typeof render==="function") render();
      }, ms);
    });
  }
  function hasNativeVoice(){ return !!roVoice; }
  function voiceName(){ return roVoice ? roVoice.name : null; }
  function romanianVoices(){ return voices.filter(function(v){ return scoreVoice(v)>=0; }); }
  /* What will actually happen if the learner presses play on this text. */
  function statusFor(text){
    if(text && assetFor(text)) return "asset";   // pre-rendered Romanian clip
    if(roVoice) return "tts";                    // local Romanian voice
    return "unavailable";                        // refuse — do not mispronounce
  }
  function sourceLabel(){
    if(assetCount()) return "Pre-rendered Romanian clips";
    if(roVoice) return roVoice.name;
    return "unavailable";
  }
  function googleFailed(){ return gtFailed; }
  function resetSource(){ gtFailed = false; AUDIO_ASSET_INDEX = null; }
  function speakLocal(text, rate, opts){
    if(!window.speechSynthesis) return false;
    if(!roVoice) refresh();
    /* REFUSE to speak Romanian in a non-Romanian voice. Reading Romanian
       through an English voice teaches wrong phonology — worse for the learner
       than silence. The UI explains and offers a fix instead. */
    if(!roVoice) return false;
    var u = new SpeechSynthesisUtterance(unifyRomanian(text));
    u.voice = roVoice;
    u.lang = roVoice.lang || "ro-RO";
    u.rate = rate; u.pitch = 1;
    if(opts.onend) u.onend = opts.onend;
    if(opts.onstart) u.onstart = opts.onstart;
    current = u;
    /* Chrome drops an utterance queued in the same tick as cancel(). */
    setTimeout(function(){ try{ window.speechSynthesis.speak(u); }catch(e){} }, 0);
    return true;
  }

  function speak(text, opts){
    stop();
    seqCancelled = false;
    return speakOne(text, opts);
  }
  /* Single utterance, without canceling what's already queued — so
     speakSequence can chain calls without killing its own playback. */
  function speakOne(text, opts){
    opts = opts||{};
    var rate = opts.rate || state.settings.audioSpeed || 1;

    /* 1. A bundled native-speaker recording always wins. */
    var src = assetFor(text);
    if(src){
      try{
        audioEl = new Audio(src);
        audioEl.playbackRate = rate;
        if(opts.onend) audioEl.onended = opts.onend;
        audioEl.onerror = function(){ if(opts.onerror) opts.onerror(); };
        audioEl.play().catch(function(){ if(opts.onerror) opts.onerror(); });
        return {ok:true, mode:"asset"};
      }catch(e){ /* fall through */ }
    }

    /* 2. Locally installed Romanian voice. */
    if(speakLocal(text, rate, opts)) return {ok:true, mode:"tts", voice:roVoice.name};

    /* 3. Nothing correct is available — stay silent and say so. */
    if(opts.onerror) opts.onerror();
    return {ok:false, mode:"unavailable", reason:"no-romanian-voice"};
  }
  /* Play several lines back to back — used for dialogue "Play all" and any
     multi-line passage. Each line resolves to its own clip, so a dialogue never
     depends on a clip existing for the whole concatenated transcript. */
  var seqCancelled = false;
  function speakSequence(texts, opts){
    opts = opts||{};
    stop();
    seqCancelled = false;
    var i = 0;
    function next(){
      if(seqCancelled) return;
      if(i >= texts.length){ if(opts.onend) opts.onend(); return; }
      var t = texts[i++];
      var res = speakOne(t, {
        rate: opts.rate,
        onend: function(){ setTimeout(next, 260); },   // a beat between lines
        onerror: function(){ setTimeout(next, 60); }   // skip a missing clip
      });
      if(!res.ok) setTimeout(next, 60);
    }
    next();
    return {ok:true, mode:"sequence"};
  }
  function stop(){
    current = null;
    seqCancelled = true;
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    if(audioEl){ try{ audioEl.pause(); }catch(e){} audioEl = null; }
  }
  return {speak:speak, speakSequence:speakSequence, stop:stop,
          hasNativeVoice:hasNativeVoice, refresh:refresh,
          voiceName:voiceName, romanianVoices:romanianVoices, statusFor:statusFor,
          sourceLabel:sourceLabel, googleFailed:googleFailed, resetSource:resetSource};
})();

function findExercise(id){

}

/* Sentence-construction and matching have their own comparators. */


/* Ordering is graded on sequence, and the feedback names how far off it was —
   one swapped pair is a different kind of error from a scrambled guess. */
function checkOrder(ex){
  var placed = session.built[ex.id] || [];
  var n = ex.lines.length;
  if(placed.length < n){
    return {verdict:"incorrect", correct:ex.lines.map(function(l){return l.ro;}).join(" / "),
      diagnosis:"You've placed "+placed.length+" of "+n+" lines. Put them all in order before checking."};
  }
  var wrong = placed.filter(function(idx,pos){ return idx!==pos; }).length;
  if(wrong===0) return {verdict:"correct", correct:ex.lines.map(function(l){return l.ro;}).join(" / ")};
  return {
    verdict: wrong<=2 ? "almost" : "incorrect",
    correct: ex.lines.map(function(l){return l.ro;}).join(" / "),
    diagnosis: wrong===2
      ? "Two lines are swapped — the rest of the sequence is right. Replay the conversation and listen for which one answers which."
      : wrong+" of "+n+" lines are out of place. Try playing it at 0.65× and following the question-and-answer pairs rather than individual words."
  };
}
function checkGapfill(ex){
  var gaps = session.gaps[ex.id] || {};
  var wrong = [], nearMiss = 0;
  ex.answers.forEach(function(a,i){
    var given = gaps[i]||"";
    if(norm(given)===norm(a)) return;
    if(normLoose(given)===normLoose(a)){ nearMiss++; return; }
    wrong.push(a);
  });
  if(!wrong.length && !nearMiss) return {verdict:"correct", correct:ex.fullText};
  if(!wrong.length) return {verdict:"almost", correct:ex.fullText,
    diagnosis:"Every word is right, but "+nearMiss+" of them "+(nearMiss===1?"is":"are")+" missing diacritics. Those letters are part of the spelling, not decoration."};
  return {
    verdict: wrong.length<=1 ? "almost" : "incorrect",
    correct: ex.fullText,
    diagnosis: wrong.length+" of "+ex.answers.length+" gaps "+(wrong.length===1?"is":"are")+" wrong. Replay at a slower speed — the missing words are unstressed in connected speech, which is exactly what makes them hard to catch."
  };
}

/* ---- Generators: build activities from dialogues that already exist ---- */
function buildOrderExercise(d){
  return {
    id:"ord_"+d.id, lesson:null, skill:"listening", type:"order_lines", diff:3,
    topic:null, generated:true, lines:d.lines,
    prompt:"Listen to the whole conversation, then put the lines back in the order you heard them.",
    explain:"Following a conversation means tracking who answers what, not catching every word. "+
      "Question-and-answer pairs are the anchor: a line ending in a question mark is almost always followed by the reply to it. "+
      "From the dialogue <i>"+escapeHtml(d.title)+"</i> — "+escapeHtml(d.titleEn)+"."
  };
}
/* Gap-fill is offered from A2 upward only: below that, the learner has not met
   enough vocabulary for a blank to be a listening test rather than a lottery. */
function gapfillEligible(levelId){ return /^(a2|b1)/.test(String(levelId||"")); }
function buildGapfill(id, text, levelId, title){
  if(!gapfillEligible(levelId)) return null;
  var clean = String(text||"").replace(/\s+/g," ").trim();
  var raw = clean.split(" ");
  // Blank content words only — skip short function words and anything numeric.
  var candidates = [];
  raw.forEach(function(w,i){
    var bare = w.replace(/[.,!?;:()"„”—–]/g,"");
    if(bare.length>4 && !/^\d+$/.test(bare)) candidates.push(i);
  });
  if(candidates.length < 3) return null;
  var chosen = pick(candidates, Math.min(4, Math.max(3, Math.floor(candidates.length/6)))).sort(function(a,b){return a-b;});
  var answers = [];
  var tokens = raw.map(function(w,i){
    if(chosen.indexOf(i)===-1) return {text:w, blank:false};
    var bare = w.replace(/[.,!?;:()"„”—–]/g,"");
    answers.push(bare);
    return {text:w, blank:true};
  });
  return {
    id:"gap_"+id, lesson:null, skill:"listening", type:"gapfill", diff:4,
    topic:null, generated:true, tokens:tokens, answers:answers, fullText:clean, audio:clean,
    prompt:"Listen and type the missing words. Play it as many times as you need.",
    explain:"The blanked words are content words — the ones that carry meaning and that connected speech tends to compress. "+
      (title? "From <i>"+escapeHtml(title)+"</i>. ":"")+
      "If a word kept escaping you, replay at 0.65×: hearing it slowed down once usually makes it audible at full speed afterwards."
  };
}

function unitStatus(unit){
  var ls = lessonsOfUnit(unit.id);
  if(!ls.length) return "soon";
  var done = ls.filter(function(l){ return lessonProgress(l.id).status==="complete"; }).length;
  if(done===ls.length) return "done";
  if(done>0) return "current";
  return isUnitUnlocked(unit) ? "open" : "locked";
}

function unitMastery(unit){
  var ls = lessonsOfUnit(unit.id);
  if(!ls.length) return 0;
  var sum = ls.reduce(function(a,l){ return a + lessonProgress(l.id).bestScore; },0);
  return Math.round(sum/ls.length);
}

function courseMapSidebar(activeUnitId){
  var levels = LEVELS;
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:0 8px 10px">'+
      '<span style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3)">Course map</span>'+
      /* "Collapse all" as soon as ANYTHING is open, not only when everything
         is. Requiring every level meant that opening one course by hand left
         the button still offering to expand, with no way to close up again. */
      '<button class="btn ghost sm" style="padding:2px 6px;font-size:11.5px" data-action="toggleAllLevels">'+
        (levels.some(function(l){ return levelIsOpen(l.id, activeUnitId); }) ? "Collapse all" : "Expand all")+'</button>'+
    '</div>'+
    levels.map(function(lv, li){
    var courseId = lv.course||"cefr";
    var prevCourse = li>0 ? (LEVELS[li-1].course||"cefr") : null;
    var groupHeader = (courseId!==prevCourse)
      ? '<div class="course-group">'+
          escapeHtml((COURSES.find(function(c){return c.id===courseId;})||{}).name||courseId)+
        '</div>'
      : '';
    return groupHeader + courseMapLevel(lv, activeUnitId);
  }).join("");
}
function courseMapLevel(lv, activeUnitId){
  return [lv].map(function(lv){
    var units = UNITS.filter(function(u){ return u.levelId===lv.id; }).sort(function(a,b){return a.order-b.order;});
    var open = levelIsOpen(lv.id, activeUnitId);
    var built = units.filter(function(u){ return lessonsOfUnit(u.id).length; }).length;
    return '<div class="level-block">'+
      '<button class="level-head" data-action="toggleLevel" data-level="'+lv.id+'" aria-expanded="'+(open?"true":"false")+'">'+
        '<span class="chev'+(open?" open":"")+'" aria-hidden="true">›</span>'+
        '<h3>'+lv.code+' · '+escapeHtml(lv.name)+'</h3>'+
        '<span class="lvl-pct tabular">'+(open? levelProgressPct(lv.id)+'%' : built+'/'+units.length)+'</span>'+
      '</button>'+
      (open? units.map(function(u){
        var st = unitStatus(u);
        var dot = st==="done" ? '<span class="status-dot done">'+iconCheck()+'</span>'
                : st==="current" ? '<span class="status-dot current">●</span>'
                : st==="locked" ? '<span class="status-dot locked">'+iconLock()+'</span>'
                : st==="soon" ? '<span class="status-dot soon">◌</span>'
                : '<span class="status-dot open">○</span>';
        var built = lessonsOfUnit(u.id).length;
        var sub = built? built+" lesson"+(built===1?"":"s")+(st!=="open"&&st!=="locked"? " · "+unitMastery(u)+"%":"") : "in development";
        var locked = st==="locked";
        return '<div class="unit-node'+(u.id===activeUnitId?" current":"")+(locked?" locked":"")+'"'+
          (locked?'':' data-action="go" data-page="unit" data-p1="'+u.id+'" role="button" tabindex="0"')+'>'+
          dot+'<div><div class="u-title">'+escapeHtml(u.title)+'</div><div class="u-sub">'+escapeHtml(u.titleEn)+' · '+sub+'</div></div></div>';
      }).join("") : '')+
    '</div>';
  }).join("");
}

PAGES.unit = function(params){

  var ls = lessonsOfUnit(u.id);
  var lv = levelById(u.levelId);

  var main = '<div class="section-eyebrow">'+lv.code+' · Unit '+u.order+'</div>'+

  /* A unit can point at a purpose-built assessment instead of the generic
     checkpoint builder — the I.L.R. mock is structured as three papers and

      '<div class="section-eyebrow">Checkpoint</div>'+

      '<p style="color:var(--text-2);font-size:14px;max-width:56ch;margin-bottom:14px">Questions are drawn from every unit you\'ve completed in '+lv.code+' and shuffled together. Unlike a lesson, nothing tells you which rule is being tested — that\'s deliberate, so recognizing the pattern can\'t stand in for knowing the language.</p>'+
      (cp
        ? '<button class="btn" data-action="go" data-page="exam" data-p1="checkpoint" data-p2="'+u.id+'">Start checkpoint · '+cp.items.length+' questions</button>'

    if(u.levelExam){

        '<p style="color:var(--text-2);font-size:14px;max-width:56ch;margin-bottom:14px">Vocabulary, grammar, listening, reading and written production, scored separately by skill rather than as one number. Pass mark 75%.</p>'+
        (lex
          ? '<button class="btn" data-action="go" data-page="exam" data-p1="exam" data-p2="'+u.levelId+'">Start '+lv.code+' exam · '+lex.items.length+' questions</button>'
          : '<p style="font-size:13.5px;color:var(--text-3)">Complete some lessons in this level first.</p>')+
      '</div>';
    }
    var past = state.examResults.filter(function(r){ return r.id===u.id || r.id===u.levelId; });
    if(past.length){
      main += '<div class="card" style="padding:18px 20px"><h3 style="font-size:15px;margin-bottom:10px">Previous attempts</h3>'+
        past.slice(0,5).map(function(r){
          return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px">'+
            '<span style="flex:1">'+escapeHtml(r.title)+'</span>'+

        }).join("")+'</div>';

        '<div style="flex:1">'+

        '</div>'+
        '<button class="btn'+(p.status==="complete"?" secondary":"")+'" data-action="go" data-page="lesson" data-p1="'+l.id+'">'+
          (p.status==="complete"?"Review":p.attempts?"Resume":"Start")+'</button>'+
      '</div>';
    }).join("");
  }
  return shell(courseMapSidebar(u.id), main, null);
};

function mediaByKind(k){ return MEDIA.filter(function(m){ return m.kind===k; }); }
function mediaLevels(){
  var out = [];
  MEDIA.forEach(function(m){ if(out.indexOf(m.level)===-1) out.push(m.level); });
  return out.sort();
}
/* Transcripts are supplied by the learner, not by this course. Writing out a
   transcript of a video nobody here has watched would mean inventing the words
   a learner then commits to memory — the one place in this app where a
   confident guess would do real damage. So the panel is an editor: paste what
   you hear (or the channel's own subtitles), and it becomes a shadowing script
   with click-to-gloss and line-by-line stepping. Saved per video, locally. */
function mediaTranscript(id){ return (state.mediaTranscripts||{})[id] || ""; }
PAGES.media = function(params){
  var openId = params[0] || null;
  if(openId){
    var item = MEDIA.find(function(m){ return m.id===openId; });
    if(item) return shell(null, mediaDetail(item), null);
  }
  var cfg = session.mediaFilter || (session.mediaFilter = {level:"all", kind:"all"});
  var chip = function(group, val, label){
    return '<button class="chip'+(cfg[group]===val?" active":"")+'" data-action="setMediaFilter" '+
      'data-group="'+group+'" data-val="'+escapeHtml(val)+'">'+escapeHtml(label)+'</button>';
  };
  var list = MEDIA.filter(function(m){
    if(cfg.level!=="all" && m.level!==cfg.level) return false;
    if(cfg.kind!=="all" && m.kind!==cfg.kind) return false;
    return true;
  });
  var songs = mediaByKind("song");

  var main = '<h1 style="font-size:28px;margin-bottom:6px">Media & shadowing</h1>'+
    '<p style="color:var(--text-2);margin-bottom:18px;max-width:64ch">Romanian video and music in one place, roughly sorted by level. Nothing loads until you press play. Open any item to add a transcript and shadow along line by line.</p>'+
    '<div class="card" style="padding:16px 18px;margin-bottom:18px">'+
      '<label class="field-label">Level</label>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'+
        chip("level","all","Any")+mediaLevels().map(function(l){ return chip("level",l,l); }).join("")+'</div>'+
      '<label class="field-label">Type</label>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        chip("kind","all","Everything")+chip("kind","video","Videos")+chip("kind","song","Songs")+'</div>'+
    '</div>'+
    (list.length? list.map(mediaCard).join("")
      : '<div class="empty-state">Nothing matches those filters yet.</div>')+
    (cfg.kind!=="video" && !songs.length
      ? '<div class="card" style="padding:18px 20px;margin-top:18px;border-left:3px solid var(--accent)">'+
        '<b style="font-family:var(--font-display);font-size:15px">Songs</b>'+
        '<p style="font-size:13.3px;color:var(--text-2);line-height:1.6;margin-top:6px;max-width:62ch">'+
          'No songs added yet. Send me the YouTube links and I will verify each one and add it here with the '+
          'lyrics panel — music is unusually good shadowing material because the melody fixes the stress pattern, '+
          'and Romanian song lyrics tend to use exactly the elisions that make speech hard to follow '+
          '(<i>te-am, s-a, într-un</i>).</p></div>'
      : '')+
    '<div class="card" style="padding:16px 18px;margin-top:18px">'+
      '<div style="font-size:12.5px;color:var(--text-3);line-height:1.6">Videos are embedded from YouTube and remain the property of their channels. '+
      'Levels are approximate — where a channel states one it is used, otherwise it is a judgement. '+
      'If an embed stops working the video has been removed or restricted at source.</div>'+
    '</div>';
  return shell(null, main, null);
};
function mediaCard(m){
  var hasScript = !!mediaTranscript(m.id);
  return '<div class="card" style="padding:16px 18px;margin-bottom:12px">'+
    '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px">'+
      '<span class="badge accent">'+escapeHtml(m.level)+'</span>'+
      (m.levelSource==="stated"? '<span class="badge neutral" title="Level stated by the channel">stated</span>'
                               : '<span class="badge neutral" title="Level judged from the content, not stated by the channel">approx.</span>')+
      (m.kind==="song"? '<span class="badge pine">song</span>':'')+
      (hasScript? '<span class="badge pine">transcript saved</span>':'')+
    '</div>'+
    '<b style="font-family:var(--font-display);font-size:16px">'+escapeHtml(m.title)+'</b>'+
    '<div style="font-size:12.5px;color:var(--text-3);margin-top:2px">'+escapeHtml(m.channel)+'</div>'+
    '<p style="font-size:13.2px;color:var(--text-2);line-height:1.55;margin-top:7px;max-width:64ch">'+escapeHtml(m.note)+'</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:11px">'+
      '<button class="btn secondary sm" data-action="go" data-page="media" data-p1="'+m.id+'">Open &amp; shadow</button>'+
      '<a class="btn ghost sm" href="https://www.youtube.com/watch?v='+m.id+""+'" target="_blank" rel="noopener noreferrer">Watch on YouTube ↗</a>'+
    '</div>'+
  '</div>';
}
function mediaDetail(m){
  var script = mediaTranscript(m.id);
  var editing = session.mediaEditing===m.id || !script;
  var lines = script.split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean);
  return '<button class="btn ghost sm" data-action="go" data-page="media" style="margin-bottom:12px">← All media</button>'+
    '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px">'+
      '<span class="badge accent">'+escapeHtml(m.level)+'</span>'+
      '<span style="font-size:12.5px;color:var(--text-3)">'+escapeHtml(m.channel)+'</span>'+
    '</div>'+
    '<h1 style="font-size:23px;margin-bottom:12px;max-width:60ch">'+escapeHtml(m.title)+'</h1>'+
    '<div class="video-frame" style="margin-bottom:8px">'+
      '<iframe src="https://www.youtube-nocookie.com/embed/'+m.id+'?rel=0'+""+'" '+
      'title="'+escapeHtml(m.title)+'" frameborder="0" allowfullscreen '+
      'allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"></iframe></div>'+
    '<p style="font-size:13px;color:var(--text-2);line-height:1.55;max-width:64ch;margin-bottom:18px">'+escapeHtml(m.note)+'</p>'+

    '<div class="card" style="padding:18px 20px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">'+
        '<b style="font-family:var(--font-display);font-size:16px">Shadowing script</b>'+
        (script && !editing? '<button class="btn ghost sm" data-action="editTranscript" data-vid="'+m.id+'">Edit</button>':'')+
      '</div>'+
      (editing
        ? '<p style="font-size:13px;color:var(--text-2);line-height:1.6;max-width:64ch;margin-bottom:10px">'+
            'Paste the transcript here — the channel\'s subtitles, or what you can make out yourself. '+
            'One sentence per line works best. It is saved in this browser and travels with your progress export.<br><br>'+
            '<span style="color:var(--text-3)">This course does not ship transcripts for these videos. Writing out words '+
            'nobody here has verified against the audio would mean handing you a script to memorise that might be wrong — '+
            'so the text is yours to supply.</span></p>'+
          '<textarea data-field="transcript" data-action="typeTranscript" rows="10" '+
            'style="width:100%;font-size:14px;line-height:1.6;margin-bottom:10px" '+
            'placeholder="Mă trezesc la ora șapte.&#10;Mă spăl pe față și mă îmbrac.&#10;Iau micul dejun la opt.">'+escapeHtml(script)+'</textarea>'+
          '<button class="btn sm" data-action="saveTranscript" data-vid="'+m.id+'">Save script</button>'+
          (script? ' <button class="btn ghost sm" data-action="cancelTranscript">Cancel</button>':'')
        : (function(){
            /* A transcript the learner typed is not course material, so almost
               none of it has a pre-rendered clip. Without a local Romanian
               voice installed the app refuses to speak it — correctly, since
               an English voice reading Romanian teaches the wrong sounds — but
               a play button that silently does nothing reads as a broken
               feature. Check each line up front and show the real state. */
            var speakable = lines.filter(function(l){ return Speech.statusFor(l)!=="unavailable"; }).length;
            var silent = lines.length - speakable;
            return '<p style="font-size:12.8px;color:var(--text-3);margin-bottom:'+(silent?'8px':'12px')+'">'+
              lines.length+' line'+(lines.length===1?"":"s")+'. Click any word for its meaning. Play the video and speak along one line at a time.</p>'+
            (silent
              ? '<div style="font-size:12.6px;color:var(--text-2);line-height:1.6;background:var(--accent-soft);'+
                'border-radius:var(--radius-s);padding:10px 12px;margin-bottom:12px">'+
                '<b>'+silent+' of '+lines.length+' line'+(lines.length===1?" has":"s have")+' no playback here.</b> '+
                'The course ships clips only for its own material, and this transcript is yours. Individual '+
                '<i>words</i> usually still play if they appear in the course — click one to hear it. '+
                'For the full lines, use the video: it is the recording you want to imitate anyway.'+
                (Speech.hasNativeVoice()? '' :
                  '<br><br>Installing a Romanian system voice would let your browser read any line aloud. '+
                  'Without one this course stays silent rather than reading Romanian in an English accent.')+
                '</div>'
              : '')+
            '<div class="verse">'+lines.map(function(l,i){
              var canPlay = Speech.statusFor(l)!=="unavailable";
              return '<div class="verse-line" style="display:flex;gap:10px;align-items:flex-start">'+
                '<span class="tabular" style="flex:0 0 26px;color:var(--text-3);font-size:12px;padding-top:5px">'+(i+1)+'</span>'+
                '<div class="verse-ro" style="flex:1">'+glossRun(escapeHtml(l), null)+'</div>'+
                (canPlay
                  ? audioButton(l,{small:true,label:false})
                  : '<span class="audio-btn small audio-none" title="No clip for this line — click a word instead, or play the video" aria-hidden="true">'+iconPlay()+'</span>')+
              '</div>';
            }).join("")+'</div>';
          })())+
    '</div>';
}


function ilrMockState(){
  if(!session.ilrMock) session.ilrMock = {paper:0, started:null, done:false};
  return session.ilrMock;
}
PAGES.ilrmock = function(){
  var st = ilrMockState();
  var papers = ILR_PAPERS.map(function(p){ return {meta:p, items: mockItems("ilr", p.n)}; });
  var allItems = papers.reduce(function(a,p){ return a.concat(p.items); }, []);

  if(!st.started){
    return shell(null,
      '<div class="section-eyebrow">I.L.R. · Simulare de examen</div>'+
      '<h1 style="font-size:30px;margin-bottom:10px">Full mock exam</h1>'+
      '<p style="color:var(--text-2);max-width:64ch;margin-bottom:18px">Three papers, sat in order, on material you have not seen in the lessons. Each paper is scored separately — that is how the real exam works, and a single combined mark would hide a weak paper behind a strong one.</p>'+
      '<div class="card" style="padding:20px 22px;margin-bottom:16px">'+
        papers.map(function(p){
          return '<div style="padding:12px 0;border-bottom:1px solid var(--line)">'+
            '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'+
              '<span class="badge accent">Proba '+p.meta.n+'</span>'+
              '<b style="font-family:var(--font-display);font-size:15.5px">'+escapeHtml(p.meta.ro)+'</b>'+
              '<span style="margin-left:auto;font-size:12.5px;color:var(--text-3)">'+p.items.length+' item'+(p.items.length===1?"":"s")+'</span>'+
            '</div>'+
            '<div style="font-size:12.8px;color:var(--text-3);margin-top:3px">'+escapeHtml(p.meta.en)+'</div>'+
            '<p style="font-size:13px;color:var(--text-2);margin-top:6px;line-height:1.55;max-width:62ch">'+escapeHtml(p.meta.note)+'</p>'+
          '</div>';
        }).join("")+
        '<p style="font-size:12.8px;color:var(--text-3);margin-top:14px;line-height:1.6">'+
          '<b>On timing:</b> the ILR does not publish per-paper durations, so this simulation does not impose one — '+
          'an invented limit would train the wrong pace. Elapsed time is shown so you can judge it yourself, and the '+
          'writing tasks are the ones worth timing.</p>'+
      '</div>'+
      '<button class="btn" data-action="startIlrMock">Begin Proba 1</button> '+
      '<button class="btn secondary" data-action="go" data-page="home">Back</button>'
    , null);
  }

  if(st.done) return shell(null, ilrMockReport(papers, allItems), null);

  var cur = papers[st.paper];
  var answered = cur.items.filter(function(e){ return session.feedback[e.id]; }).length;
  var readingId = cur.items.length && cur.items[0].readingId;
  var text = readingId ? readingById(readingId) : null;

  var body =
    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px">'+
      '<div class="section-eyebrow">Proba '+cur.meta.n+' din 3 · '+escapeHtml(cur.meta.en)+'</div>'+
      '<span style="font-size:12.5px;color:var(--text-3)" class="tabular">'+elapsedSince(st.started)+' elapsed</span>'+
    '</div>'+
    '<h1 style="font-size:24px;margin-bottom:8px">'+escapeHtml(cur.meta.ro)+'</h1>'+
    '<p style="color:var(--text-2);font-size:13.5px;max-width:64ch;margin-bottom:16px">'+escapeHtml(cur.meta.note)+'</p>'+
    '<div class="progressbar" style="margin-bottom:18px"><span style="width:'+pct(answered,cur.items.length)+'%"></span></div>'+
    (text? renderReading(text) : '')+
    (text? '<h2 style="font-size:17px;margin:22px 0 12px">Întrebări</h2>' : '')+
    cur.items.map(function(e){
      return '<div style="margin-bottom:16px">'+renderExercise(e,{onContinue:false, showPassage:false})+'</div>';
    }).join("")+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)">'+
      (answered < cur.items.length
        ? '<span style="font-size:13px;color:var(--text-3);align-self:center">'+(cur.items.length-answered)+' still unanswered — you can move on anyway.</span>'
        : '')+
      '<button class="btn" data-action="nextIlrPaper" style="margin-left:auto">'+
        (st.paper < papers.length-1 ? 'Finish Proba '+cur.meta.n+' → Proba '+(cur.meta.n+1) : 'Finish and see results')+'</button>'+
    '</div>';
  return shell(null, body, null);
};
function elapsedSince(t){
  if(!t) return "0:00";
  var s = Math.max(0, Math.floor((Date.now()-t)/1000));
  var m = Math.floor(s/60);
  return m + ":" + String(s%60).padStart(2,"0");
}
/* Per-paper results. Free writing is excluded from the scored denominator for
   the same reason it is everywhere else — nothing here can grade it — and is
   counted and reported separately instead of being quietly dropped. */
function ilrMockReport(papers, allItems){
  var rows = papers.map(function(p){
    var gradable = p.items.filter(function(e){
      var f = session.feedback[e.id]; return f && f.verdict!=="submitted";
    });
    var correct = gradable.filter(function(e){ return session.feedback[e.id].verdict==="correct"; }).length;
    var selfCheck = p.items.filter(function(e){
      var f = session.feedback[e.id]; return f && f.verdict==="submitted";
    }).length;
    var skipped = p.items.filter(function(e){ return !session.feedback[e.id]; }).length;
    return {meta:p.meta, total:p.items.length, gradable:gradable.length, correct:correct,
            selfCheck:selfCheck, skipped:skipped,
            score: gradable.length? pct(correct, gradable.length) : null};
  });
  var scored = rows.filter(function(r){ return r.score!==null; });
  var overall = scored.length
    ? Math.round(scored.reduce(function(a,r){ return a+r.score; },0)/scored.length) : null;

  return '<div class="section-eyebrow">I.L.R. · Rezultate</div>'+
    '<h1 style="font-size:28px;margin-bottom:6px">Mock exam results</h1>'+
    '<p style="color:var(--text-2);font-size:13.5px;max-width:64ch;margin-bottom:18px">Scored per paper, because the real exam is. A strong reading paper does not compensate for a weak written one.</p>'+
    '<div class="card" style="padding:22px 24px;margin-bottom:16px">'+
      rows.map(function(r){
        var col = r.score===null? "var(--text-3)" : r.score>=70? "var(--pine)" : r.score>=50? "var(--accent-strong)" : "var(--brick)";
        return '<div style="padding:14px 0;border-bottom:1px solid var(--line)">'+
          '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'+
            '<span class="badge neutral">Proba '+r.meta.n+'</span>'+
            '<b style="font-family:var(--font-display);font-size:15px">'+escapeHtml(r.meta.en)+'</b>'+
            '<span class="tabular" style="margin-left:auto;font-weight:700;font-size:18px;color:'+col+'">'+
              (r.score===null? "—" : r.score+"%")+'</span>'+
          '</div>'+
          '<div style="font-size:12.8px;color:var(--text-3);margin-top:5px">'+
            (r.gradable? r.correct+' of '+r.gradable+' auto-graded correct' : 'nothing auto-gradable on this paper')+
            (r.selfCheck? ' · '+r.selfCheck+' written task'+(r.selfCheck===1?"":"s")+' to compare against the model yourself' : '')+
            (r.skipped? ' · '+r.skipped+' not attempted' : '')+
          '</div>'+
        '</div>';
      }).join("")+
      (overall!==null
        ? '<div style="margin-top:16px;font-size:13.5px;color:var(--text-2)">Average across auto-graded papers: <b>'+overall+'%</b>. '+
          'The written papers carry heavy weight in the real exam and cannot be scored here — read them against the models before judging yourself ready.</div>'
        : '')+
    '</div>'+
    whatYouGotWrong(allItems, {retryAction:null})+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">'+
      '<button class="btn" data-action="restartIlrMock">Sit it again</button>'+
      '<button class="btn secondary" data-action="go" data-page="home">Back to the track</button>'+
    '</div>';
}

/* ---------- AUTHOR MODE ----------
   Opens every unit regardless of progress, for reviewing or authoring content
   without working through the sequence first.

   There is deliberately no password. The course is a static file with no
   server, so any check would run in the learner's own browser against a value
   in the same file — defeated by viewing source. A login box that cannot
   actually refuse anyone is worse than none, because it invites putting
   something behind it. This is a preference, and it is labelled as one.
   Real authorisation needs a server, and can arrive with accounts. */
PAGES.admin = function(){
  var on = state.settings.unlockAll;
  var main = '<div class="main-inner" style="max-width:560px;padding-top:30px">'+
    '<div class="section-eyebrow">Author mode</div>'+
    '<h1 style="font-size:28px;margin-bottom:10px">Open every unit</h1>'+
    '<div class="card" style="padding:22px 24px;margin-bottom:16px">'+
      '<p style="font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:16px">'+
        'Unlocks every unit in every track, so you can open anything without completing what comes '+
        'before it. Intended for reviewing material or checking a lesson you have not reached yet. '+
        'Your scores, review queue and mistake notebook are unaffected \u2014 this only removes the locks.</p>'+
      '<label style="display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer">'+
        '<input type="checkbox" data-action="toggleUnlockAll" '+(on?"checked":"")+' style="width:auto;margin-top:3px" />'+
        '<span><b>Unlock all course content</b><br>'+
        '<span style="font-size:12.5px;color:var(--text-3)">'+
          (on? 'Currently on. Every unit is open.' : 'Currently off. Units open as you complete the one before.')+
        '</span></span></label>'+
    '</div>'+
    '<div class="card" style="padding:18px 20px">'+
      '<b style="font-family:var(--font-display);font-size:15px">Why there is no password here</b>'+
      '<p style="font-size:13px;color:var(--text-2);line-height:1.6;margin-top:6px">'+
        'This course runs entirely in your browser with no server behind it. Any password check would happen '+
        'on the same machine as the thing it is checking, and anyone could read it in the page source or set '+
        'the flag from the developer console. A lock that cannot refuse anyone is worse than an honest switch, '+
        'because it tempts you into putting something private behind it. Nothing here is private \u2014 it is a '+
        'preference about how the course behaves.</p>'+
    '</div>'+
  '</div>';
  return shell(null, main, null);
};


/* Two columns of paired sentences, each pair differing in exactly one thing.
   Borrowed from Brâncuș: a contrast shown is understood faster than a rule
   stated, because the learner does the noticing. */

  return '<div class="card" style="padding:20px 22px">'+
    (s.intro? '<p style="color:var(--text-2);margin-bottom:16px;max-width:62ch">'+s.intro+'</p>':'')+
    '<div class="contrast-grid">'+
      '<div class="contrast-head">'+escapeHtml(s.leftLabel||"A")+'</div>'+
      '<div class="contrast-head">'+escapeHtml(s.rightLabel||"B")+'</div>'+
      s.pairs.map(function(p){
        return '<div class="contrast-cell">'+
            '<div class="ro">'+escapeHtml(p[0])+' '+audioButton(p[0],{small:true,label:false})+'</div>'+
            (p[2]? '<div class="en">'+escapeHtml(p[2])+'</div>':'')+
          '</div>'+
          '<div class="contrast-cell">'+
            '<div class="ro">'+escapeHtml(p[1])+' '+audioButton(p[1],{small:true,label:false})+'</div>'+
            (p[3]? '<div class="en">'+escapeHtml(p[3])+'</div>':'')+

  '</div>';
}

/* ---------- MOVING PROGRESS BETWEEN BROWSERS ----------
   Progress lives in this browser's localStorage, which is per-browser and
   per-device by design. Real accounts need a server to hold the data, and this
   course is a single static file with no backend — so instead of pretending,
   the app makes the save file portable: export it, carry it, import it. That
   covers the actual need (continue on another machine) and has the side benefit
   that the data stays yours and never leaves your computer. */
/* The mistake notebook stores the prompt and the full explanation alongside
   every saved mistake, which is most of the save file's bulk. Both are
   reconstructible from the exercise id, so the pasteable code drops them and
   the import puts them back. The downloaded FILE keeps everything, since size
   costs nothing there. */
function slimStateForCode(st){
  var copy = Object.assign({}, st);
  copy.mistakes = (st.mistakes||[]).map(function(m){
    if(!m.exerciseId || !exerciseById(m.exerciseId)) return m;   // generated: keep verbatim
    var s = Object.assign({}, m);
    delete s.explanation; delete s.promptText;
    return s;
  });
  return copy;
}
function rehydrateMistakes(st){
  (st.mistakes||[]).forEach(function(m){
    if(m.explanation && m.promptText) return;
    var ex = m.exerciseId && exerciseById(m.exerciseId);
    if(!ex) return;
    if(!m.explanation) m.explanation = ex.explain;
    if(!m.promptText)  m.promptText  = String(ex.prompt||"").replace(/<[^>]+>/g,"");
  });
  return st;
}
function stateToCode(){
  var json = JSON.stringify({v:2, at:new Date().toISOString(), slim:1, state:slimStateForCode(state)});
  /* btoa is byte-oriented; Romanian text and names are not ASCII. */
  return btoa(unescape(encodeURIComponent(json)));
}
function codeToState(code){
  var json = decodeURIComponent(escape(atob(String(code).replace(/\s+/g,""))));
  var wrapper = JSON.parse(json);
  if(!wrapper || !wrapper.state) throw new Error("not a progress code");
  return rehydrateMistakes(wrapper.state);
}
/* Merge an imported save over the default shape, so a file written by an older
   build still loads: any key the export predates keeps its default rather than
   arriving undefined and breaking a page halfway through a render. */
function applyImportedState(incoming, source){
  var d = defaultState();
  Object.keys(d).forEach(function(k){
    var saved = incoming[k];
    if(saved===undefined || saved===null) return;
    var nested = d[k] && typeof d[k]==="object" && !Array.isArray(d[k])
              && saved && typeof saved==="object" && !Array.isArray(saved);
    d[k] = nested ? Object.assign({}, d[k], saved) : saved;
  });
  state = d;
  writeState();
  session.transferOpen = false;
  session.importCode = "";
  session.transferErr = "";
  session.transferMsg = "Progress restored from "+source+" — "+progressSummaryLine(state)+".";
  render();
}
function transferCard(){
  var open = session.transferOpen;
  return '<div class="card" style="padding:20px 22px;margin-bottom:16px">'+
    '<h2 style="font-size:17px;margin-bottom:6px">Move your progress to another browser</h2>'+
    '<p style="font-size:13.5px;color:var(--text-2);line-height:1.6;max-width:62ch;margin-bottom:12px">'+
      'Your progress is saved in this browser only — there is no account system, because the course is a single file '+
      'that runs with no server behind it. To carry it to another browser or computer, export it here and import it there. '+
      'Nothing is uploaded anywhere.</p>'+
    '<div style="font-size:12.5px;color:var(--text-3);margin-bottom:12px">Currently saved here: '+escapeHtml(progressSummaryLine(state))+'</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:'+(open?'14px':'0')+'">'+
      '<button class="btn secondary sm" data-action="exportProgress">Download progress file</button>'+

/* Romanian dictionaries and coursebooks mark words as s.f. / s.m. / s.n. /
   adj. / vb. — the convention a learner will meet in any Romanian material,
   so the course uses it too, with the English spelled out alongside. */
function posAbbrev(v){
  if(v.pos==="noun"){
    return {m:"s.m.", f:"s.f.", n:"s.n.", "m/f":"s.m./s.f.", "n/f":"s.n./s.f."}[v.gender] || "s.";
  }
  return {verb:"vb.", adj:"adj.", adv:"adv.", prep:"prep.", conj:"conj.",
          pron:"pron.", num:"num.", phrase:"expr.", art:"art."}[v.pos] || v.pos;
}
function renderVocabCard(v){
  var st = state.vocabSrs[v.id];
  var meta = [];
  if(v.pos==="noun"){
    if(v.gender) meta.push({m:"masculine",f:"feminine",n:"neuter","m/f":"masc./fem.","n/f":"neuter/fem."}[v.gender]||v.gender);
    if(v.plural) meta.push("pl. "+v.plural);
    if(v.definite) meta.push("def. "+v.definite);
  }
  /* Some headwords are patterns rather than words — "mai … decât", "la fel de
     … ca". There is nothing coherent to pronounce, so they get no play button;
     the example sentence underneath carries the audio instead. */
  var speakable = v.ro.indexOf("…") === -1;
  return '<div class="vocab-card">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'+
      '<div><div class="headword">'+escapeHtml(v.ro)+(speakable? audioButton(v.ro,{small:true,label:false}) : '')+'</div>'+
      '<div class="pos"><span style="font-style:italic;color:var(--accent-strong)">'+posAbbrev(v)+'</span> '+
        escapeHtml(v.pos)+(meta.length? ' — '+escapeHtml(meta.join(" · ")):'')+'</div></div>'+
      (st? '<span class="mastery-tag '+st.status+'">'+st.status+'</span>':'')+
    '</div>'+
    (v.register? '<div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap"><span class="badge '+
        (v.severity>=3?"brick":/formal/.test(v.register)&&/informal/.test(v.register)?"neutral":/^informal/.test(v.register)?"accent":"pine")+
        '">'+escapeHtml(v.register)+'</span>'+
        /* Strength is shown as its own mark, because "vulgar" alone does not
           tell a learner whether a word is closer to "damn" or to something
           that ends a conversation — and that gap is the whole lesson. */
        (v.severity? '<span class="badge '+(v.severity>=3?"brick":v.severity===2?"accent":"neutral")+'" '+
          'title="Strength '+v.severity+' of 4">'+"●".repeat(v.severity)+"○".repeat(4-v.severity)+'</span>':'')+
        (v.useIt===false? '<span class="badge brick">understand, don\'t use</span>':'')+
      '</div>':'')+
    '<div class="en">'+escapeHtml(v.en)+'</div>'+
    (v.ex? '<div class="ex">'+escapeHtml(v.ex.ro)+' '+audioButton(v.ex.ro,{small:true,label:false})+
      '<div class="ex-en">'+escapeHtml(v.ex.en)+'</div></div>':'')+
  '</div>';
}

/* Romanian inserts "de" between a numeral and the noun it counts once the
   numeral reaches 20 — douăzeci DE ani, but nouăsprezece ani. The rule keys off
   the last two digits, so 101 takes no "de" (o sută unu ani) while 120 does. */
function needsDe(n){
  n = Math.floor(Math.abs(n));
  if(n < 20) return false;
  var lastTwo = n % 100;
  return !(lastTwo >= 1 && lastTwo <= 19);
}
function romanianNumber(n, opts){
  opts = opts || {};
  n = Math.floor(Math.abs(n));
  var fem = !!opts.feminine;
  if(n < 10) return (fem ? NUM_ONES_F : NUM_ONES)[n];
  if(n < 20) return NUM_TEENS[n-10];
  if(n < 100){
    var t = Math.floor(n/10), u = n%10;
    return NUM_TENS[t] + (u ? " și " + (fem ? NUM_ONES_F : NUM_ONES)[u] : "");
  }
  if(n < 1000){
    var h = Math.floor(n/100), rest = n%100;
    /* sută is feminine: o sută, două sute, trei sute … */
    var head = h===1 ? "o sută" : NUM_ONES_F[h] + " sute";
    return head + (rest ? " " + romanianNumber(rest, {feminine:fem}) : "");
  }
  if(n < 1000000){
    var th = Math.floor(n/1000), r2 = n%1000;
    /* mie is feminine (o mie, două mii) and is itself a counted noun, so a
       multiplier of 20 or more takes "de": douăzeci DE mii, cinci sute DE mii. */
    var thHead = th===1 ? "o mie"
      : romanianNumber(th, {feminine:true}) + (needsDe(th) ? " de mii" : " mii");
    return thHead + (r2 ? " " + romanianNumber(r2, {feminine:fem}) : "");
  }
  var mil = Math.floor(n/1000000), r3 = n%1000000;
  /* milion is neuter, and neuter nouns take the feminine numeral in the plural:
     două milioane, not *doi milioane. The "de" rule applies here too. */
  var milHead = mil===1 ? "un milion"
    : romanianNumber(mil, {feminine:true}) + (needsDe(mil) ? " de milioane" : " milioane");
  return milHead + (r3 ? " " + romanianNumber(r3, {feminine:fem}) : "");
}

function isYear(n){ return n >= 1000 && n <= 2999; }
function numberNote(n, context){
  var notes = [];
  if(isYear(n)) notes.push("Years are read out in full in Romanian — never split into pairs the way English says “eighteen fifty-nine”.");
  if(needsDe(n) && !isYear(n)) notes.push("Counting a noun needs <b>de</b> from 20 up: <i>" + romanianNumber(n) + " de ani</i>.");
  else if(n >= 20 && !isYear(n)) notes.push("No <b>de</b> here — the last two digits are between 1 and 19: <i>" + romanianNumber(n) + " ani</i>.");
  if(n === 1 && context === "date") notes.push("The first of the month is <b>întâi</b>, not <i>unu</i>.");
  if(String(n).length > 3 && !isYear(n)) notes.push("<b>mie</b> is feminine, so it takes <b>două</b>: <i>două mii</i>.");
  return notes;
}


PAGES.lesson = function(params){
  var l = lessonById(params[0]);
  if(!l) return notFound("That lesson doesn't exist.");
  /* The profanity lesson is opted into once, not gated every visit — a wall you
     have to click through repeatedly stops being a choice and becomes friction.
     The consent is stored, and can be withdrawn from Progress. */
  if(l.sensitive && !state.settings.showProfanity) return shell(null, profanityGate(l), null);
  var stageIdx = clamp(parseInt(params[1]||"0",10)||0, 0, l.sections.length-1);
  var s = l.sections[stageIdx];
  var p = lessonProgress(l.id);
  var u = unitById(l.unitId);

  var body = "";
  switch(s.type){
    case "context":
      body = (s.note? '<p style="color:var(--text-2);margin-bottom:14px;max-width:62ch">'+s.note+'</p>':'')+
             renderDialogue(dialogueById(s.dialogueId), {hideEn:true})+
             '<p style="color:var(--text-3);font-size:13px;margin-top:12px;max-width:62ch">Listen through once before revealing any English. Understanding the gist without the translation is the skill you are building.</p>';
      break;
    case "grammar":
      body = (s.intro? '<p style="color:var(--text-2);margin-bottom:14px;max-width:62ch">'+s.intro+'</p>':'')+
             renderGrammarArticle(grammarById(s.topicId));
      break;
    case "vocab":
      body = '<p style="color:var(--text-2);margin-bottom:16px;max-width:62ch">Tap the speaker on any word or example to hear it. These words enter your review queue as soon as you finish the lesson.</p>'+
             '<div class="grid-2">'+ s.vocabIds.map(function(id){
               var v = vocabById(id); return v? renderVocabCard(v):"";
             }).join("") +'</div>';
      break;
    case "contrast":
      body = renderContrast(s);
      break;
    case "culture":
      body = '<div class="card" style="padding:22px 24px;border-left:3px solid var(--pine)">'+
        '<div class="section-eyebrow" style="color:var(--pine)">Cultural note</div>'+
        '<h3 style="font-size:19px;margin-bottom:10px">'+escapeHtml(s.title)+'</h3>'+
        '<p style="color:var(--text-2);line-height:1.7">'+s.body+'</p></div>';
      break;
    default: {
      var ids = s.exerciseIds||[];
      body = ids.map(function(id,i){
        var ex = exerciseById(id);
        if(!ex) return "";
        return '<div style="margin-bottom:18px">'+renderExercise(ex,{counter:(i+1)+" / "+ids.length, onContinue:false})+'</div>';
      }).join("");
      if(s.type==="reading" && s.readingId) body = renderReading(readingById(s.readingId));
      break;
    }
  }
  if(s.type==="reading" && s.readingId && !s.exerciseIds) body = renderReading(readingById(s.readingId));

  var allAnswered = (s.exerciseIds||[]).every(function(id){ return session.feedback[id]; });
  var isLast = stageIdx===l.sections.length-1;

  var main =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
      '<button class="btn ghost sm" data-action="go" data-page="unit" data-p1="'+u.id+'">← '+escapeHtml(u.titleEn)+'</button>'+
      '<span style="font-size:12px;color:var(--text-3)" class="tabular">Stage '+(stageIdx+1)+' of '+l.sections.length+'</span>'+
    '</div>'+
    '<div class="progressbar" style="margin-bottom:20px"><span style="width:'+Math.round(100*(stageIdx)/(l.sections.length-1||1))+'%"></span></div>'+
    '<div class="section-eyebrow">'+(STAGE_LABEL[s.type]||s.type)+'</div>'+
    '<h1 style="font-size:26px;margin-bottom:16px">'+escapeHtml(l.title)+'</h1>'+
    body+
    '<div style="display:flex;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)">'+
      (stageIdx>0? '<button class="btn secondary" data-action="go" data-page="lesson" data-p1="'+l.id+'" data-p2="'+(stageIdx-1)+'">Previous</button>':'')+
      (isLast
        ? '<button class="btn" data-action="finishLesson" data-lesson="'+l.id+'">Finish lesson</button>'
        : '<button class="btn" data-action="go" data-page="lesson" data-p1="'+l.id+'" data-p2="'+(stageIdx+1)+'"'+
          ((s.exerciseIds&&s.exerciseIds.length&&!allAnswered)?' disabled title="Answer the exercises above first"':'')+'>Continue</button>')+
    '</div>';

  var railStages = '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px">Lesson stages</div>'+
    l.sections.map(function(sec,i){
      var active = i===stageIdx;
      return '<div style="display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;'+(active?'background:var(--accent-soft)':'')+'" data-action="go" data-page="lesson" data-p1="'+l.id+'" data-p2="'+i+'" role="button" tabindex="0">'+
        '<span style="width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;'+
        (i<stageIdx?'background:var(--pine);color:#fff':active?'background:var(--accent);color:#fff':'border:1.5px solid var(--line-strong);color:var(--text-3)')+'">'+(i<stageIdx?'✓':i+1)+'</span>'+
        '<span style="font-size:13px;'+(active?'font-weight:700':'color:var(--text-2)')+'">'+(STAGE_LABEL[sec.type]||sec.type)+'</span></div>';
    }).join("")+
    '<hr class="rule" style="margin:16px 0">'+
    '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">Objective</div>'+
    '<p style="font-size:13px;color:var(--text-2);line-height:1.55">'+escapeHtml(l.objective)+'</p>'+
    (p.status==="complete"? '<div style="margin-top:14px"><span class="badge pine">'+iconCheck()+' completed · '+p.bestScore+'%</span></div>':'');

  return shell(courseMapSidebar(u.id), main, railStages);
};

/* ---------- GRAMMAR REFERENCE ---------- */
function grammarExerciseCount(topicId){
  return EXERCISES.filter(function(e){ return e.topic===topicId; }).length;
}
PAGES.grammar = function(params){
  var q = session.grammarQuery||"";
  var lvl = session.grammarLevel||"all";
  var cat = session.grammarCat||"all";
  var focus = params[0] ? grammarById(params[0]) : null;

  var cats = [];
  GRAMMAR_TOPICS.forEach(function(g){ if(cats.indexOf(g.cat)===-1) cats.push(g.cat); });
  var levels = [];
  GRAMMAR_TOPICS.forEach(function(g){ if(levels.indexOf(g.level)===-1) levels.push(g.level); });
  levels.sort();

  function matches(g){
    if(lvl!=="all" && g.level!==lvl) return false;
    if(cat!=="all" && g.cat!==cat) return false;
    if(q){
      var hay = normLoose(g.title+" "+g.cat+" "+g.rule+" "+(g.formation||[]).join(" "));
      if(hay.indexOf(normLoose(q))===-1) return false;
    }
    return true;
  }
  var list = GRAMMAR_TOPICS.filter(matches);

  /* Sidebar mirrors the active filters, so the two views never disagree. */
  var side = '<div style="font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin:0 8px 10px">'+
      'Topics'+((lvl!=="all"||cat!=="all")? ' · filtered':'')+'</div>'+
    cats.filter(function(c){ return list.some(function(g){ return g.cat===c; }); }).map(function(c){
      return '<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:var(--text-2);margin:0 8px 5px">'+escapeHtml(c)+'</div>'+
        list.filter(function(g){return g.cat===c;}).map(function(g){
          var n = grammarExerciseCount(g.id);
          return '<div class="unit-node'+(focus&&focus.id===g.id?" current":"")+'" style="padding:7px 8px" data-action="go" data-page="grammar" data-p1="'+g.id+'" role="button" tabindex="0">'+
            '<div><div style="font-size:13.3px;font-weight:600">'+escapeHtml(g.title)+'</div>'+
            '<div style="font-size:11px;color:var(--text-3)">'+g.level+' · '+n+' exercise'+(n===1?"":"s")+'</div></div></div>';
        }).join("")+'</div>';
    }).join("") || '<div style="padding:8px;font-size:13px;color:var(--text-3)">Nothing matches these filters.</div>';

  var filterBar =
    '<div style="margin-bottom:8px"><span style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-right:8px">Level</span>'+
      ['all'].concat(levels).map(function(L){
        return '<button class="chip'+(lvl===L?" active":"")+'" style="margin:0 4px 4px 0" data-action="setGrammarLevel" data-v="'+L+'">'+
          (L==="all"?"All":L)+'</button>';
      }).join("")+
    '</div>'+
    '<div style="margin-bottom:16px"><span style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-right:8px">Topic</span>'+
      ['all'].concat(cats).map(function(C){
        return '<button class="chip'+(cat===C?" active":"")+'" style="margin:0 4px 4px 0" data-action="setGrammarCat" data-v="'+escapeHtml(C)+'">'+
          (C==="all"?"All":escapeHtml(C))+'</button>';
      }).join("")+
    '</div>';

  var main = focus
    ? '<button class="btn ghost sm" data-action="go" data-page="grammar" style="margin-bottom:12px">← All grammar</button>'+renderGrammarArticle(focus)+
      '<div style="margin-top:16px">'+practiceLinkFor(focus.id)+'</div>'
    : '<h1 style="font-size:28px;margin-bottom:6px">Grammar reference</h1>'+
      '<p style="color:var(--text-2);margin-bottom:16px;max-width:60ch">Every rule with its formation, worked examples, and the mistakes English speakers actually make. Filter by level or topic, or search across all of them.</p>'+
      '<input type="search" data-field="gq" data-action="grammarSearch" placeholder="Search rules, e.g. \'plural\', \'perfectul compus\', \'pe\'…" value="'+escapeHtml(q)+'" style="margin-bottom:14px" aria-label="Search grammar" />'+
      filterBar+
      grammarDrillBar(list)+
      '<div style="font-size:12.5px;color:var(--text-3);margin-bottom:12px" class="tabular">'+list.length+' of '+GRAMMAR_TOPICS.length+' rules'+
        ((lvl!=="all"||cat!=="all"||q)? ' · <button class="btn ghost sm" style="padding:0 4px" data-action="clearGrammarFilters">clear filters</button>':'')+'</div>'+
      (list.length? list.map(function(g){
        var n = grammarExerciseCount(g.id);
        return '<div class="card" style="padding:16px 18px;margin-bottom:10px;cursor:pointer" data-action="go" data-page="grammar" data-p1="'+g.id+'" role="button" tabindex="0">'+
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap"><span class="badge accent">'+g.level+'</span><span class="badge neutral">'+escapeHtml(g.cat)+'</span>'+
            '<span class="badge '+(n>=3?"pine":n>0?"neutral":"brick")+'">'+n+' exercise'+(n===1?"":"s")+'</span></div>'+
          '<b style="font-family:var(--font-display);font-size:16.5px">'+escapeHtml(g.title)+'</b>'+
          '<p style="font-size:13.5px;color:var(--text-2);margin-top:4px;max-width:66ch">'+escapeHtml(g.rule.slice(0,150))+(g.rule.length>150?"…":"")+'</p></div>';
      }).join("") : '<div class="empty-state">No rule matches these filters.</div>');

  return shell(side, main, null);
};
/* Counts through openExercises so the number shown matches the number the
   drill will actually serve — the raw EXERCISES list includes mock-exam items
   and, when not opted in, the profanity unit. */
function practiceLinkFor(topicId){
  var n = openExercises().filter(function(e){ return e.topic===topicId; }).length;
  if(!n) return '<div style="font-size:13px;color:var(--text-3)">No exercises target this rule directly yet — it is practiced inside the lessons that introduce it.</div>';
  return '<button class="btn" data-action="startTopicPractice" data-topic="'+topicId+'">Drill this rule ('+n+' exercise'+(n===1?"":"s")+')</button>';
}
/* Drill everything the current filters are showing. The level and category
   chips were previously only a way to browse; this turns a filtered view into
   a practice set, which is what a learner narrowing to "A2 · Verbs" actually
   wants next. */
function grammarDrillBar(list){
  var ids = list.map(function(g){ return g.id; });
  var pool = openExercises().filter(function(e){ return ids.indexOf(e.topic)>-1; });
  if(!pool.length) return '';
  var withEx = list.filter(function(g){
    return pool.some(function(e){ return e.topic===g.id; });
  }).length;

function drillPool(cfg){
  return VERBS.filter(function(v){
    if(cfg.scope==="irregular" && !verbIsIrregular(v)) return false;
    if(cfg.scope==="reflexive" && !verbIsReflexive(v)) return false;
    if(cfg.scope==="marked" && state.verbsMarked.indexOf(v.id)===-1) return false;
    if(["I","I-ez","II","III","IV","IV-esc"].indexOf(cfg.scope)>-1 && verbGroupKey(v)!==cfg.scope) return false;
    return true;
  });
}
function buildConjugationDrill(cfg){
  var pool = drillPool(cfg);
  if(!pool.length) return [];
  var tenses = cfg.tenses.length? cfg.tenses : ["present"];
  var out = [];
  for(var i=0; i<cfg.length; i++){
    var v = sample(pool);
    var tense = sample(tenses);
    var T = verbTables(v);
    if(!T[tense]) continue;
    var meta = TENSE_META.find(function(t){ return t.id===tense; });
    if(tense==="imperative"){
      var who = sample(["tu","voi"]);
      /* Verbs whose singular imperative is undeclared (or genuinely unused, as
         with stative a părea) must not become drill questions — there would be
         no correct answer to mark against. */
      if(!T.imperative[who]) continue;
      out.push({
        id:"drill_"+v.id+"_imp_"+who+"_"+i, lesson:null, skill:"grammar", type:"conjugate", diff:3,
        topic:"g_imperative", generated:true, vocab:[],
        prompt: escapeHtml(v.inf)+" — <b>"+who+"</b> — "+meta.ro,
        answer: T.imperative[who], accept:[T.imperative[who], String(T.imperative[who]).replace(/!$/,"")],
        audio: T.imperative[who],
        explain:"<b>"+escapeHtml(T.imperative[who])+"</b> — "+escapeHtml(v.en)+". "+
          (v.notes? escapeHtml(v.notes) : "The voi-imperative is identical to the voi present tense; the tu form is less predictable.")
      });
      continue;
    }
    var person = sample(PERSONS);
    var form = T[tense][person];
    if(!form || form==="—") continue;
    out.push({
      id:"drill_"+v.id+"_"+tense+"_"+person+"_"+i, lesson:null, skill:"grammar", type:"conjugate", diff:3,
      topic: tense==="subjunctive" ? "g_subjunctive" : tense==="imperfect" ? "g_imperfect"
           : tense==="past" ? "g_perfect_compus" : tense==="future" ? "g_future"
           : tense==="conditional" ? "g_conditional" : "g_present",
      generated:true, vocab:[],
      prompt: escapeHtml(v.inf)+" — <b>"+PERSON_LABELS[person]+"</b> — "+meta.ro,
      answer: form, accept:[form],
      audio: form,
      explain:"<b>"+escapeHtml(form)+"</b> — "+escapeHtml(v.en)+" ("+meta.en.toLowerCase()+", "+PERSON_LABELS[person]+")."+
        (verbIsIrregular(v)? " This verb is irregular, so the form has to be known rather than derived." :
          " Conjugation class "+escapeHtml(verbGroupLabel(v))+" — the same endings apply to every verb in that class.")+
        (v.notes? "<br><span style=\"color:var(--text-3)\">"+escapeHtml(v.notes)+"</span>" : "")
    });
  }
  return out;
}

    '</div>'+
    '<div class="card" style="padding:18px 20px">'+
      '<b style="font-family:var(--font-display);font-size:16px">Why drill by tense</b>'+
      '<p style="font-size:13.5px;color:var(--text-2);margin-top:6px;line-height:1.6">Lessons introduce a tense and then move on, so the present ends up massively over-practiced and the imperfect and conditional barely at all. Drilling one tense across many verbs is how the pattern becomes automatic — and mixing two tenses together is what stops you applying the right ending to the wrong tense.</p>'+

/* Exercises the learner has agreed to see. The profanity unit is opt-in, and an
   opt-in that only guards its own lesson page is not an opt-in at all — those
   questions would still surface through Practice ("all levels"), the Listening
   set, topic drills and vocabulary review. Every broad scan over EXERCISES goes
   through here so the consent holds everywhere. */
function isSensitiveExercise(e){
  var l = e && e.lesson && lessonById(e.lesson);
  return !!(l && l.sensitive);
}
function openExercises(){
  return EXERCISES.filter(function(e){
    /* Mock-exam items are reserved for the simulation. If they leaked into
       practice, review, the listening set or the drills, the learner would
       meet them before sitting the mock and the mock would then measure
       recall of specific items rather than readiness. */
    if(e.mock) return false;
    if(!state.settings.showProfanity && isSensitiveExercise(e)) return false;
    return true;
  });
}
function mockItems(kind, paper){
  return EXERCISES.filter(function(e){
    return e.mock===kind && (paper==null || e.paper===paper);
  });
}
function practicePool(cfg){
  return openExercises().filter(function(e){
    var l = lessonById(e.lesson);
    if(cfg.level!=="all"){
      var lvl = l? l.levelId:"";
      var fam = cfg.level.slice(0,2);
      if(lvl.slice(0,2)!==fam) return false;
    }
    if(cfg.skill!=="all" && e.skill!==cfg.skill) return false;
    return true;
  });
}

/* Where pronunciation comes from, stated plainly, with a working switch. */
function audioSourcePanel(){
  var clips = assetCount();
  var localVoices = Speech.romanianVoices();
  var st = Speech.statusFor("");

  var status;
  if(clips){
    status = '<div style="background:var(--pine-soft);color:var(--pine);padding:10px 12px;border-radius:var(--radius-s);font-size:13px">'+
      '<b>Using '+clips+' pre-rendered Romanian clips.</b> Recorded from Google Translate\'s Romanian voice and bundled with the course, so pronunciation is consistent and works offline.'+
      (localVoices.length? '' : ' Anything not covered by a clip stays silent rather than being read in an English voice.')+'</div>';
  } else if(st==="tts"){
    status = '<div style="background:var(--pine-soft);color:var(--pine);padding:10px 12px;border-radius:var(--radius-s);font-size:13px">'+
      '<b>Using a Romanian voice installed on this computer:</b> '+escapeHtml(Speech.voiceName()||"")+'.</div>';

    status = '<div style="background:var(--brick-soft);color:var(--brick);padding:10px 12px;border-radius:var(--radius-s);font-size:13px">'+
      '<b>No Romanian pronunciation available yet.</b> Rather than read Romanian aloud in an English voice and teach you the wrong sounds, playback stays silent. '+
      'Run <code>python tools/fetch_audio.py tools/ro-strings.json</code> to download the clips, or install a Romanian voice (see below).</div>';
  }

  return '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
      '<label class="field-label" style="margin:0">Pronunciation source</label>'+
      '<button class="chip" data-action="recheckVoices">Re-check</button></div>'+
    status+
    '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:var(--text-2);font-weight:600">Where the audio comes from</summary>'+
      '<div style="font-size:13px;color:var(--text-2);line-height:1.65;margin-top:8px">'+
      '<p style="margin-bottom:8px">Playback tries three sources in order:</p>'+

        '<li><b>Pre-rendered clips</b> ('+clips+' loaded) — MP3s in <code>audio/</code>, listed in <code>audio-manifest.js</code>. Generated by <code>tools/fetch_audio.py</code> from Google Translate\'s Romanian voice. Google\'s endpoint refuses requests coming from a web page, so the audio has to be fetched ahead of time — which also means it works with no internet connection.</li>'+
        '<li><b>A Romanian voice installed on your computer</b> — covers anything without a clip.</li>'+
        '<li><b>Silence.</b> If neither is available the play button turns red instead of mispronouncing the word. An English voice reading Romanian teaches the wrong sounds, which is worse than no audio.</li>'+
      '</ol>'+
      '<p style="margin-bottom:6px">To swap in real native-speaker recordings later, drop files into <code>audio/</code> and list them in <code>AUDIO_ASSETS</code> at the top of the source — they take priority over everything else, and no lesson content needs to change.</p>'+
      '<p style="margin-bottom:6px"><b>Offline voice on Windows:</b> Settings → Time &amp; language → Language &amp; region → Add a language → Română → tick <i>Text-to-speech</i> → Install. Restart the browser, then press <b>Re-check</b>.</p>'+
      '<p><b>Microsoft Edge</b> also exposes free Romanian neural voices (Emil, Alina) with no install — open this page in Edge and press Re-check.</p>'+

}

/* ---------- SHADOWING ----------
   Play a line, then hold silence for roughly as long as the line took, so the
   learner repeats it aloud into that gap. Advancing automatically is the point:
   it forces production at the speaker's pace instead of letting you re-read. */
function shadowPanel(){
  var s = session.shadow;
  if(!s) return "";
  var d = dialogueById(s.dialogueId);
  if(!d) return "";
  var line = d.lines[s.index];
  var pctDone = pct(s.index, d.lines.length);
  return '<div class="card fade-in" style="padding:22px 24px;margin-bottom:18px;border-left:3px solid var(--pine)">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
      '<div><div class="section-eyebrow" style="color:var(--pine)">Shadowing · '+escapeHtml(d.title)+'</div>'+
      '<div style="font-size:12.5px;color:var(--text-3)">Line '+(s.index+1)+' of '+d.lines.length+'</div></div>'+

    '</div>'+
    '<div class="progressbar pine" style="margin-bottom:16px"><span style="width:'+pctDone+'%"></span></div>'+
    '<div style="font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--text-3)">'+escapeHtml(line.speaker)+'</div>'+
    '<div style="font-family:var(--font-display);font-size:22px;line-height:1.45;margin:4px 0 10px">'+escapeHtml(line.ro)+'</div>'+
    (s.showEn? '<div style="font-size:13.5px;color:var(--text-3);margin-bottom:12px">'+escapeHtml(line.en)+'</div>':'')+
    '<div style="padding:12px 14px;border-radius:var(--radius-s);margin-bottom:14px;font-size:14px;font-weight:600;'+
      (s.phase==="repeat"
        ? 'background:var(--accent-soft);color:var(--accent-strong)">Your turn — say it aloud'

    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
      '<button class="btn sm" data-action="shadowRepeat">Hear it again</button>'+
      '<button class="btn secondary sm" data-action="shadowNext">Next line →</button>'+
      '<button class="chip" data-action="shadowToggleEn">'+(s.showEn?"Hide English":"Show English")+'</button>'+
      '<span class="speed-row" style="margin-left:auto">'+[0.65,0.8,1].map(function(sp){
        return '<button data-action="setSpeed" data-speed="'+sp+'" class="'+(state.settings.audioSpeed===sp?"active":"")+'">'+sp+'×</button>';
      }).join("")+'</span>'+
    '</div>'+
  '</div>';
}
