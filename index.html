function saveMistake(m){

/* ===================== SPEECH / AUDIO ABSTRACTION ===================== */
/* ---------------------------------------------------------------------------
   AUDIO ASSETS — prerecorded native-speaker clips, keyed by the exact Romanian
   string they voice. Stored separately from lesson content (per the brief) so
   recordings can be added without touching a single lesson, vocabulary entry
   or exercise.

   Drop in entries as:  "bună ziua": "audio/buna-ziua.mp3"
   or a data: URI. Anything listed here is used in preference to speech
   synthesis. Keys are matched case- and diacritic-insensitively.

   This ships EMPTY: no native recordings are bundled. Until it is populated,
   playback falls back to a Romanian TTS voice — and if none is installed, the
   app refuses to speak rather than mispronouncing Romanian in an English voice.
--------------------------------------------------------------------------- */
var AUDIO_ASSETS = {
  // "bună ziua": "audio/buna-ziua.mp3",
};

/* Pronunciation comes from pre-rendered clips (see audio-manifest.js). Fetching
   Google's translate_tts live from the page is not possible: it rejects
   browser-originated requests — the Sec-Fetch-* / Origin headers mark them as
   hotlinking and it returns an HTML error page instead of audio, and those
   headers are forbidden to JavaScript. tools/fetch_audio.py does the fetching
   from a non-browser client instead, which also makes playback work offline. */
var AUDIO_ASSET_INDEX = null;
function buildAssetIndex(){
  AUDIO_ASSET_INDEX = {};
  /* audio-manifest.js (generated by tools/fetch_audio.py) is keyed by the same
     normLoose() form used here, so it merges in directly. */
  var m = window.AUDIO_MANIFEST;
  if(m) Object.keys(m).forEach(function(k){ AUDIO_ASSET_INDEX[k] = m[k]; });
  /* Hand-added entries win over generated ones. */
  Object.keys(AUDIO_ASSETS).forEach(function(k){ AUDIO_ASSET_INDEX[normLoose(k)] = AUDIO_ASSETS[k]; });
  return AUDIO_ASSET_INDEX;
}
function assetFor(text){
  if(AUDIO_ASSET_INDEX===null) buildAssetIndex();
  var k = normLoose(text);
  if(AUDIO_ASSET_INDEX[k]) return AUDIO_ASSET_INDEX[k];
  /* Poetic elisions (nost', într') are stored under the unelided stem. */
  var stripped = normLoose(String(text||"").replace(/['’]+$/,""));
  return AUDIO_ASSET_INDEX[stripped] || null;
}
function assetCount(){
  if(AUDIO_ASSET_INDEX===null) buildAssetIndex();
  return Object.keys(AUDIO_ASSET_INDEX).length;
}

var Speech = (function(){
  var voices=[], roVoice=null, current=null, audioEl=null, gtFailed=false;

  /* Rank Romanian voices best-first. Edge exposes free online neural voices
     (Emil / Alina, ro-RO) that are modelled on native speakers; those are the
     best available without shipping recordings. Offline SAPI voices come next.
     A non-Romanian voice is NEVER an acceptable fallback. */
  function scoreVoice(v){
    if(!/^ro(-|_|$)/i.test(v.lang)) return -1;
    var n = (v.name||"").toLowerCase();
    var s = 10;
    if(/natural|neural/.test(n)) s += 40;
    if(/online/.test(n)) s += 20;
    if(/\bro-ro\b/i.test(v.lang)) s += 5;
    if(v.localService) s += 3;
    return s;
  }
  function refresh(){
    try{
      voices = window.speechSynthesis ? (window.speechSynthesis.getVoices()||[]) : [];
      var ro = voices.filter(function(v){ return scoreVoice(v) >= 0; })
                     .sort(function(a,b){ return scoreVoice(b)-scoreVoice(a); });
      roVoice = ro[0] || null;
    }catch(e){ voices=[]; roVoice=null; }
    return roVoice;
  }
  if(typeof window!=="undefined" && window.speechSynthesis){
    refresh();
    /* Voice lists populate asynchronously — and on Edge the online neural
       voices arrive seconds after the offline ones. Re-check and repaint so the
       audio controls stop showing as unavailable once Romanian appears. */
    window.speechSynthesis.onvoiceschanged = function(){
      var had = !!roVoice;
      refresh();
      if(!!roVoice !== had && typeof render==="function") render();
    };
    [400, 1200, 3000].forEach(function(ms){
      setTimeout(function(){
        var had = !!roVoice;
        refresh();
        if(!!roVoice !== had && typeof render==="function") render();
      }, ms);
    });
  }
  function hasNativeVoice(){ return !!roVoice; }
  function voiceName(){ return roVoice ? roVoice.name : null; }
  function romanianVoices(){ return voices.filter(function(v){ return scoreVoice(v)>=0; }); }
  /* What will actually happen if the learner presses play on this text. */
  function statusFor(text){
    if(text && assetFor(text)) return "asset";   // pre-rendered Romanian clip
    if(roVoice) return "tts";                    // local Romanian voice
    return "unavailable";                        // refuse — do not mispronounce
  }
  function sourceLabel(){
    if(assetCount()) return "Pre-rendered Romanian clips";
    if(roVoice) return roVoice.name;
    return "unavailable";
  }
  function googleFailed(){ return gtFailed; }
  function resetSource(){ gtFailed = false; AUDIO_ASSET_INDEX = null; }
  function speakLocal(text, rate, opts){
    if(!window.speechSynthesis) return false;
    if(!roVoice) refresh();
    /* REFUSE to speak Romanian in a non-Romanian voice. Reading Romanian
       through an English voice teaches wrong phonology — worse for the learner
       than silence. The UI explains and offers a fix instead. */
    if(!roVoice) return false;
    var u = new SpeechSynthesisUtterance(unifyRomanian(text));
    u.voice = roVoice;
    u.lang = roVoice.lang || "ro-RO";
    u.rate = rate; u.pitch = 1;
    if(opts.onend) u.onend = opts.onend;
    if(opts.onstart) u.onstart = opts.onstart;
    current = u;
    /* Chrome drops an utterance queued in the same tick as cancel(). */
    setTimeout(function(){ try{ window.speechSynthesis.speak(u); }catch(e){} }, 0);
    return true;
  }

  function speak(text, opts){
    stop();
    seqCancelled = false;
    return speakOne(text, opts);
  }
  /* Single utterance, without canceling what's already queued — so
     speakSequence can chain calls without killing its own playback. */
  function speakOne(text, opts){
    opts = opts||{};
    var rate = opts.rate || state.settings.audioSpeed || 1;

    /* 1. A bundled native-speaker recording always wins. */
    var src = assetFor(text);
    if(src){
      try{
        audioEl = new Audio(src);
        audioEl.playbackRate = rate;
        if(opts.onend) audioEl.onended = opts.onend;
        audioEl.onerror = function(){ if(opts.onerror) opts.onerror(); };
        audioEl.play().catch(function(){ if(opts.onerror) opts.onerror(); });
        return {ok:true, mode:"asset"};
      }catch(e){ /* fall through */ }
    }

    /* 2. Locally installed Romanian voice. */
    if(speakLocal(text, rate, opts)) return {ok:true, mode:"tts", voice:roVoice.name};

    /* 3. Nothing correct is available — stay silent and say so. */
    if(opts.onerror) opts.onerror();
    return {ok:false, mode:"unavailable", reason:"no-romanian-voice"};
  }
  /* Play several lines back to back — used for dialogue "Play all" and any
     multi-line passage. Each line resolves to its own clip, so a dialogue never
     depends on a clip existing for the whole concatenated transcript. */
  var seqCancelled = false;
  function speakSequence(texts, opts){
    opts = opts||{};
    stop();
    seqCancelled = false;
    var i = 0;
    function next(){
      if(seqCancelled) return;
      if(i >= texts.length){ if(opts.onend) opts.onend(); return; }
      var t = texts[i++];
      var res = speakOne(t, {
        rate: opts.rate,
        onend: function(){ setTimeout(next, 260); },   // a beat between lines
        onerror: function(){ setTimeout(next, 60); }   // skip a missing clip
      });
      if(!res.ok) setTimeout(next, 60);
    }
    next();
    return {ok:true, mode:"sequence"};
  }
  function stop(){
    current = null;
    seqCancelled = true;
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    if(audioEl){ try{ audioEl.pause(); }catch(e){} audioEl = null; }
  }
  return {speak:speak, speakSequence:speakSequence, stop:stop,
          hasNativeVoice:hasNativeVoice, refresh:refresh,
          voiceName:voiceName, romanianVoices:romanianVoices, statusFor:statusFor,
          sourceLabel:sourceLabel, googleFailed:googleFailed, resetSource:resetSource};
})();

/* ===================== ROUTER ===================== */
function parseHash(){
  var h = location.hash.replace(/^#\/?/,"");
  var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
  return {page: parts[0]||"home", params: parts.slice(1)};
}
function navigate(page, params){
  var p = "#/"+page+(params&&params.length? "/"+params.map(encodeURIComponent).join("/") : "");
  if(location.hash===p){ render(); } else { location.hash=p; }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);

/* ===================== CONJUGATION ENGINE =====================
   Romanian verbs fall into four conjugation classes, each with sub-patterns.
   Regular forms are generated from the infinitive; anything irregular is
   declared per verb in an `irr` block and overrides the generated form.

   Classes:
     I     -a            a cânta  → cânt, cânți, cântă…
     I-ez  -a + -ez-     a lucra  → lucrez, lucrezi, lucrează…
     II    -ea           a vedea  → văd, vezi, vede…
     III   -e            a merge  → merg, mergi, merge…
     IV    -i            a dormi  → dorm, dormi, doarme…
     IV-esc -i + -esc-   a vorbi  → vorbesc, vorbești, vorbește…
     IV-î  -î            a coborî → cobor, cobori, coboară…
--------------------------------------------------------------------------- */
var PERSONS = ["eu","tu","el","noi","voi","ei"];

/* Consonants soften before the -i of the tu form: t→ț, d→z, s→ș, st→ șt … */
function softenBeforeI(stem){
  return stem
    .replace(/sc$/,"șt").replace(/st$/,"șt")
    .replace(/t$/,"ț").replace(/d$/,"z").replace(/s$/,"ș");
}
/* Strip the citation form down to the bare infinitive. Three shapes occur:
   "a merge", "a se trezi" (accusative reflexive) and "a-și aminti" (dative
   reflexive). Missing the third produced a stem of "a-și aminti" and tables
   reading "îmi a-și amintesc". */
function verbParts(inf){
  var bare = String(inf)
    .replace(/^a[-‑](și|şi|mi|ți|ţi)\s+/, "")
    .replace(/^a\s+/, "")
    .replace(/^se\s+/, "")
    .trim();
  var m = bare.match(/(ea|î|a|e|i)$/);
  var ending = m ? m[1] : "";
  return {bare:bare, stem: ending ? bare.slice(0, -ending.length) : bare, ending:ending};
}
/* Reflexive in either paradigm — the citation form alone is not enough, since
   dative reflexives are written "a-și …" rather than "a se …". */
function verbIsReflexive(v){ return !!(v.refl || /^a[\s-](se|și|şi)\b/.test(v.inf)); }
var PRESENT_ENDINGS = {
  "I":      ["", "i", "ă", "ăm", "ați", "ă"],
  "I-ez":   ["ez", "ezi", "ează", "ăm", "ați", "ează"],
  "II":     ["", "i", "e", "em", "eți", ""],
  "III":    ["", "i", "e", "em", "eți", ""],
  "IV":     ["", "i", "e", "im", "iți", ""],
  "IV-esc": ["esc", "ești", "ește", "im", "iți", "esc"],
  "IV-î":   ["", "i", "ă", "âm", "âți", "ă"]
};
var PARTICIPLE_SUFFIX = {"I":"at","I-ez":"at","II":"ut","III":"ut","IV":"it","IV-esc":"it","IV-î":"ât"};
/* Imperfect stem-vowel differs by class. */
var IMPERFECT_LINK = {"I":"a","I-ez":"a","II":"ea","III":"ea","IV":"ea","IV-esc":"ea","IV-î":"a"};
var IMPERFECT_ENDINGS = ["m","i","","m","ți","u"];

function conjugatePresent(v){
  if(v.irr && v.irr.present) return v.irr.present;
  var p = verbParts(v.inf), g = v.group, ends = PRESENT_ENDINGS[g] || PRESENT_ENDINGS["III"];
  var out = {};
  PERSONS.forEach(function(person, i){
    var stem = p.stem;
    // The tu form softens the final consonant before its -i.
    if(i===1 && ends[i]==="i") stem = softenBeforeI(stem);
    out[person] = stem + ends[i];
  });
  return out;
}
function participleOf(v){
  if(v.irr && v.irr.participle) return v.irr.participle;
  var p = verbParts(v.inf);
  return p.stem + (PARTICIPLE_SUFFIX[v.group] || "ut");
}
function conjugateImperfect(v){
  if(v.irr && v.irr.imperfect) return v.irr.imperfect;
  var p = verbParts(v.inf), link = IMPERFECT_LINK[v.group] || "ea", out = {};
  PERSONS.forEach(function(person, i){ out[person] = p.stem + link + IMPERFECT_ENDINGS[i]; });
  return out;
}
function compoundWith(auxes, tail){
  var out = {};
  PERSONS.forEach(function(person, i){ out[person] = auxes[i] + " " + tail; });
  return out;
}
function conjugateAll(v){
  var part = participleOf(v);
  var infBare = verbParts(v.inf).bare;
  return {
    present:     conjugatePresent(v),
    past:        (v.irr && v.irr.past)        || compoundWith(["am","ai","a","am","ați","au"], part),
    imperfect:   conjugateImperfect(v),
    future:      (v.irr && v.irr.future)      || compoundWith(["voi","vei","va","vom","veți","vor"], infBare),
    conditional: (v.irr && v.irr.conditional) || compoundWith(["aș","ai","ar","am","ați","ar"], infBare),
    subjunctive: subjunctiveOf(v),
    imperative:  imperativeOf(v),
    participle:  part
  };
}
/* Only the third person differs from the present indicative — and that form is
   irregular often enough that it is declared per verb as `subj3`. */
function subjunctiveOf(v){
  if(v.irr && v.irr.subjunctive) return v.irr.subjunctive;
  var pres = conjugatePresent(v), out = {};
  var third = (v.irr && v.irr.subj3) || defaultSubj3(v, pres);
  PERSONS.forEach(function(person){ out[person] = "să " + pres[person]; });
  out.el = "să " + third;
  out.ei = "să " + third;
  return out;
}
function defaultSubj3(v, pres){
  var p = verbParts(v.inf);
  if(v.group==="I")      return p.stem + "e";
  if(v.group==="I-ez")   return p.stem + "eze";
  if(v.group==="IV-esc") return p.stem + "ească";
  if(v.group==="IV-î")   return p.stem + "ască";
  return p.stem + "ă";          // II, III, IV
}
/* The voi-imperative is always the voi present, with no exceptions worth
   naming. The SINGULAR imperative is a different matter: for -a verbs it is
   reliably the 3rd person singular (cântă!, lasă!, întreabă!), and the same
   holds for the -esc- and -î- patterns (citește!, hotărăște!, coboară!). For
   classes II, III and IV it is lexically determined and cannot be derived —
   transitive scrie! and deschide! take the 3rd person, intransitive mergi! and
   dormi! take the 2nd, a auzi breaks even that generalisation with auzi!, and
   a whole set shortens irregularly (zi!, du!, adu!, fă!, ia!, vino!).
   Deriving it there produced confident nonsense: zici!, pui!, deschizi!. So it
   is generated only where the rule holds, and must be declared per verb
   otherwise. A missing form is shown as unknown rather than invented. */
var IMPERATIVE_FROM_THIRD = {"I":1, "I-ez":1, "IV-esc":1, "IV-î":1};
function imperativeOf(v){
  var pres = conjugatePresent(v);
  var voi = pres.voi + "!";
  if(v.irr && v.irr.imperative){
    var given = v.irr.imperative;
    return {tu: given.tu, voi: given.voi || voi};
  }
  if(IMPERATIVE_FROM_THIRD[v.group]) return {tu: pres.el + "!", voi: voi};
  return {tu: null, voi: voi};      // must be declared; never guessed
}
/* Reflexive verbs carry their pronoun with them, and it moves in the past and
   the imperative — so they need their own rendering rather than a bare table.

   Romanian has TWO reflexive paradigms, and mixing them up is a real error
   rather than a stylistic slip. Most verbs take the accusative set (mă, te,
   se): mă trezesc, m-am trezit. A smaller but very common group takes the
   dative set (îmi, îți, își): îmi amintesc, mi-am amintit, amintește-ți!.
   Writing *mă amintesc is simply wrong, so verbs marked refl:"dative" get the
   second set throughout. */
var REFLEX_PRON     = {eu:"mă", tu:"te", el:"se", noi:"ne", voi:"vă", ei:"se"};
var REFLEX_PRON_D   = {eu:"îmi", tu:"îți", el:"își", noi:"ne", voi:"vă", ei:"își"};
var REFLEX_PAST_D   = {eu:"mi-am", tu:"ți-ai", el:"și-a", noi:"ne-am", voi:"v-ați", ei:"și-au"};
var REFLEX_COND_D   = {eu:"mi-aș", tu:"ți-ai", el:"și-ar", noi:"ne-am", voi:"v-ați", ei:"și-ar"};
var REFLEX_FUT_D    = {eu:"îmi voi", tu:"îți vei", el:"își va", noi:"ne vom", voi:"vă veți", ei:"își vor"};
var REFLEX_PAST     = {eu:"m-am", tu:"te-ai", el:"s-a", noi:"ne-am", voi:"v-ați", ei:"s-au"};
var REFLEX_COND     = {eu:"m-aș", tu:"te-ai", el:"s-ar", noi:"ne-am", voi:"v-ați", ei:"s-ar"};
var REFLEX_FUT      = {eu:"mă voi", tu:"te vei", el:"se va", noi:"ne vom", voi:"vă veți", ei:"se vor"};
function applyReflexive(v, tables){
  if(!v.refl) return tables;
  var dative = v.refl === "dative";
  var PRON = dative ? REFLEX_PRON_D : REFLEX_PRON;
  var PAST = dative ? REFLEX_PAST_D : REFLEX_PAST;
  var COND = dative ? REFLEX_COND_D : REFLEX_COND;
  var FUT  = dative ? REFLEX_FUT_D  : REFLEX_FUT;
  var part = tables.participle;
  var infBare = verbParts(v.inf).bare;
  var out = {participle: part};
  ["present","imperfect"].forEach(function(t){
    out[t] = {};
    PERSONS.forEach(function(p){ out[t][p] = PRON[p] + " " + tables[t][p]; });
  });
  out.past = {}; out.conditional = {}; out.future = {}; out.subjunctive = {};
  PERSONS.forEach(function(p){
    out.past[p]        = PAST[p] + " " + part;
    out.conditional[p] = COND[p] + " " + infBare;
    out.future[p]      = FUT[p]  + " " + infBare;
    out.subjunctive[p] = "să " + PRON[p] + " " + String(tables.subjunctive[p]).replace(/^să\s+/,"");
  });
  /* In the affirmative imperative the pronoun jumps to the end and hyphenates —
     -te for accusative reflexives, -ți for dative ones (trezește-te! but
     amintește-ți!). A null tu-form means the singular imperative was never
     declared for this verb, and "null-te!" is worse than showing nothing. */
  out.imperative = {
    tu: tables.imperative.tu
        ? String(tables.imperative.tu).replace(/!$/,"") + (dative ? "-ți!" : "-te!")
        : null,
    voi: String(tables.imperative.voi).replace(/!$/,"") + "-vă!"

  return out;
}
/* Public accessor: returns a fully-formed verb with all tables filled in. */
var VERB_CACHE = {};
function verbTables(v){
  if(VERB_CACHE[v.id]) return VERB_CACHE[v.id];
  var t;
  if(v.present && v.past && v.subjunctive){
    /* Hand-written entry: every table already spelled out (the original core
       verbs). Reflexive pronouns are baked into those, so no post-processing. */
    t = {present:v.present, past:v.past, imperfect:v.imperfect, future:v.future,
         conditional:v.conditional, subjunctive:v.subjunctive,
         imperative:v.imperative, participle:v.participle};
  } else {
    t = applyReflexive(v, conjugateAll(v));
  }
  VERB_CACHE[v.id] = t;
  return t;
}
/* Which conjugation class a verb belongs to, for grouping and filtering. */
var GROUP_LABEL = {
  "I":"I · -a", "I-ez":"I · -a (-ez-)", "II":"II · -ea", "III":"III · -e",
  "IV":"IV · -i", "IV-esc":"IV · -i (-esc-)", "IV-î":"IV · -î"

function verbGroupKey(v){
  if(GROUP_LABEL[v.group]) return v.group;
  /* Legacy entries carry a prose group string; map it back to a class. */
  var g = String(v.group||"");
  if(/irregular|impersonal/i.test(g)) return "irr";
  if(/1st|-a\b/.test(g)) return /ez/.test(g) ? "I-ez" : "I";
  if(/2nd|-ea/.test(g)) return "II";
  if(/3rd|-e\b|-ge/.test(g)) return "III";
  if(/esc/.test(g)) return "IV-esc";
  if(/4th|-i\b/.test(g)) return "IV";
  return "irr";
}
function verbGroupLabel(v){
  var k = verbGroupKey(v);
  return k==="irr" ? "Irregular" : (GROUP_LABEL[k]||k);
}

  irr:{imperative:{tu:"auzi!"}, present:{eu:"aud",tu:"auzi",el:"aude",noi:"auzim",voi:"auziți",ei:"aud"}, participle:"auzit", subj3:"audă"},
  notes:"Hearing (passive) as opposed to a asculta (listening deliberately).",
  example:{ro:"Nu te aud bine.",en:"I can't hear you well."}},
 {id:"v_dormi", inf:"a dormi", en:"to sleep", group:"IV", f:1, irregular:true,
  irr:{imperative:{tu:"dormi!"}, present:{eu:"dorm",tu:"dormi",el:"doarme",noi:"dormim",voi:"dormiți",ei:"dorm"}, participle:"dormit", subj3:"doarmă"},
  notes:"Stem vowel o→oa in the third person singular: doarme.",
  example:{ro:"Dorm șapte ore pe noapte.",en:"I sleep seven hours a night."}},
 {id:"v_simti", inf:"a simți", en:"to feel", group:"IV", f:1,
  irr:{imperative:{tu:"simte!"}, present:{eu:"simt",tu:"simți",el:"simte",noi:"simțim",voi:"simțiți",ei:"simt"}, participle:"simțit", subj3:"simtă"},
  notes:"Reflexive a se simți is how you say how you feel: mă simt bine.",
  example:{ro:"Mă simt mult mai bine azi.",en:"I feel much better today."}},
 {id:"v_trai", inf:"a trăi", en:"to live (be alive)", group:"IV-esc", f:2,
  notes:"Being alive or living a certain way. For residing somewhere use a locui.",
  example:{ro:"Bunicii mei au trăit nouăzeci de ani.",en:"My grandparents lived to ninety."}},
 {id:"v_muri", inf:"a muri", en:"to die", group:"IV", f:2, irregular:true,
  irr:{imperative:{tu:"mori!"}, present:{eu:"mor",tu:"mori",el:"moare",noi:"murim",voi:"muriți",ei:"mor"}, participle:"murit", subj3:"moară"},
  notes:"Stem vowel u→o/oa. Colloquially 'mor de foame' = I'm starving.",
  example:{ro:"Mor de foame!",en:"I'm starving!"}},
 {id:"v_rade", inf:"a râde", en:"to laugh", group:"III", f:2,
  irr:{imperative:{tu:"râzi!"}, present:{eu:"râd",tu:"râzi",el:"râde",noi:"râdem",voi:"râdeți",ei:"râd"}, participle:"râs", subj3:"râdă"},
  notes:"Participle râs, also the noun for 'laughter'. A râde de cineva = to laugh at someone.",
  example:{ro:"Am râs foarte mult.",en:"We laughed a lot."}},
 {id:"v_plange", inf:"a plânge", en:"to cry", group:"III", f:2,
  irr:{imperative:{tu:"plângi!"}, present:{eu:"plâng",tu:"plângi",el:"plânge",noi:"plângem",voi:"plângeți",ei:"plâng"}, participle:"plâns", subj3:"plângă"},
  notes:"Reflexive a se plânge means 'to complain' — same verb, quite different meaning.",
  example:{ro:"Copilul plânge de o oră.",en:"The child has been crying for an hour."}},
 {id:"v_canta", inf:"a cânta", en:"to sing; to play (an instrument)", group:"I", f:2,
  irr:{present:{eu:"cânt",tu:"cânți",el:"cântă",noi:"cântăm",voi:"cântați",ei:"cântă"}, subj3:"cânte"},
  notes:"Used for instruments too: cânt la pian. Never a juca for music.",
  example:{ro:"Cânt la chitară de zece ani.",en:"I've played the guitar for ten years."}},
 {id:"v_conduce", inf:"a conduce", en:"to drive; to lead", group:"III", f:2,
  irr:{imperative:{tu:"condu!"}, present:{eu:"conduc",tu:"conduci",el:"conduce",noi:"conducem",voi:"conduceți",ei:"conduc"}, participle:"condus", subj3:"conducă"},
  notes:"Both driving a car and leading an organization. Permis de conducere = driving license.",
  example:{ro:"Conduc de cincisprezece ani.",en:"I've been driving for fifteen years."}},
 {id:"v_calatori", inf:"a călători", en:"to travel", group:"IV-esc", f:2,
  notes:"The noun călătorie is far more common than the verb in speech.",
  example:{ro:"Îmi place să călătoresc singur.",en:"I like traveling alone."}},
 {id:"v_seintoarce", inf:"a se întoarce", en:"to return, to come back", group:"III", refl:true, f:1, irregular:true,
  irr:{imperative:{tu:"întoarce!"}, present:{eu:"întorc",tu:"întorci",el:"întoarce",noi:"întoarcem",voi:"întoarceți",ei:"întorc"}, participle:"întors", subj3:"întoarcă"},
  notes:"Reflexive. Mă întorc în cinci minute is what you say when stepping out.",
  example:{ro:"Mă întorc duminică seara.",en:"I'm coming back on Sunday evening."}},
 {id:"v_segrabi", inf:"a se grăbi", en:"to hurry", group:"IV-esc", refl:true, f:2,
  notes:"Mă grăbesc = I'm in a hurry. Nu te grăbi! = Take your time!",
  example:{ro:"Mă grăbesc, am întârziat.",en:"I'm in a hurry, I'm late."}},
 {id:"v_seimbraca", inf:"a se îmbrăca", en:"to get dressed", group:"I", refl:true, f:2,
  irr:{present:{eu:"îmbrac",tu:"îmbraci",el:"îmbracă",noi:"îmbrăcăm",voi:"îmbrăcați",ei:"îmbracă"}, subj3:"îmbrace"},
  notes:"Without the pronoun, a îmbrăca means dressing someone else.",
  example:{ro:"Mă îmbrac și vin.",en:"I'll get dressed and come."}},
 {id:"v_sespala", inf:"a se spăla", en:"to wash (oneself)", group:"I", refl:true, f:2,
  irr:{present:{eu:"spăl",tu:"speli",el:"spală",noi:"spălăm",voi:"spălați",ei:"spală"}, subj3:"spele"},
  notes:"Mă spăl pe mâini / pe dinți — Romanian uses pe for the body part.",
  example:{ro:"Mă spăl pe dinți de două ori pe zi.",en:"I brush my teeth twice a day."}},
 {id:"v_sesimti", inf:"a se simți", en:"to feel (a certain way)", group:"IV", refl:true, f:1,
  irr:{imperative:{tu:"simte!"}, present:{eu:"simt",tu:"simți",el:"simte",noi:"simțim",voi:"simțiți",ei:"simt"}, participle:"simțit", subj3:"simtă"},
  notes:"Cum te simți? is the standard 'how do you feel?'",
  example:{ro:"Nu mă simt bine.",en:"I don't feel well."}},
 {id:"v_folosi", inf:"a folosi", en:"to use", group:"IV-esc", f:2,
  notes:"Regular -esc verb. Folositor = useful.",
  example:{ro:"Folosesc aplicația în fiecare zi.",en:"I use the app every day."}},
 {id:"v_schimba", inf:"a schimba", en:"to change", group:"I", f:2,
  irr:{present:{eu:"schimb",tu:"schimbi",el:"schimbă",noi:"schimbăm",voi:"schimbați",ei:"schimbă"}, subj3:"schimbe"},
  notes:"Also for changing money or transport: schimb bani, schimb trenul.",
  example:{ro:"Vreau să schimb rezervarea.",en:"I want to change the booking."}},
 {id:"v_termina", inf:"a termina", en:"to finish", group:"I", f:1,
  irr:{present:{eu:"termin",tu:"termini",el:"termină",noi:"terminăm",voi:"terminați",ei:"termină"}, subj3:"termine"},
  notes:"Opposite of a începe. Termină! = Stop it! / Cut it out!",
  example:{ro:"Termin lucrul la ora șase.",en:"I finish work at six."}},
 {id:"v_opri", inf:"a opri", en:"to stop", group:"IV-esc", f:2,
  notes:"Reflexive a se opri = to come to a stop: autobuzul se oprește aici.",
  example:{ro:"Opriți aici, vă rog.",en:"Stop here, please."}},
 {id:"v_astepta2", inf:"a purta", en:"to wear; to carry", group:"I", f:2,
  irr:{present:{eu:"port",tu:"porți",el:"poartă",noi:"purtăm",voi:"purtați",ei:"poartă"}, subj3:"poarte"},
  notes:"Used for clothes and for sizes: ce mărime porți?",
  example:{ro:"Port ochelari de la zece ani.",en:"I've worn glasses since I was ten."}},
 {id:"v_gati2", inf:"a găti", en:"to cook", group:"IV-esc", f:2,
  notes:"Regular -esc verb. The noun is mâncare, not *gătire, in everyday use.",
  example:{ro:"Gătesc în fiecare duminică.",en:"I cook every Sunday."}},
 {id:"v_studia", inf:"a studia", en:"to study", group:"I-ez", f:2,
  notes:"Takes -ez: studiez, studiezi, studiază. More formal than a învăța.",
  example:{ro:"Studiez medicina la Cluj.",en:"I study medicine in Cluj."}},
 {id:"v_lucra2", inf:"a munci", en:"to work (hard), to labour", group:"IV-esc", f:2,
  notes:"Emphasizes effort more than a lucra. The noun muncă is the everyday word for work.",
  example:{ro:"Muncesc mult în perioada asta.",en:"I'm working a lot at the moment."}},
 {id:"v_vorbi2", inf:"a discuta", en:"to discuss, to talk over", group:"I", f:2,
  irr:{present:{eu:"discut",tu:"discuți",el:"discută",noi:"discutăm",voi:"discutați",ei:"discută"}, subj3:"discute"},
  notes:"More purposeful than a vorbi — you discuss a topic with someone.",
  example:{ro:"Trebuie să discutăm despre asta.",en:"We need to discuss this."}},
 {id:"v_chema", inf:"a chema", en:"to call (summon)", group:"I", f:2,
  irr:{present:{eu:"chem",tu:"chemi",el:"cheamă",noi:"chemăm",voi:"chemați",ei:"cheamă"}, subj3:"cheme"},
  notes:"Reflexive a se chema = to be named: mă cheamă Ana. Distinct from a suna (to phone).",
  example:{ro:"Cheamă un taxi, te rog.",en:"Call a taxi, please."}},
 {id:"v_oferi", inf:"a oferi", en:"to offer", group:"IV", f:2,
  irr:{imperative:{tu:"oferă!"}, present:{eu:"ofer",tu:"oferi",el:"oferă",noi:"oferim",voi:"oferiți",ei:"oferă"}, participle:"oferit", subj3:"ofere"},
  notes:"Takes a dative for the recipient: îți ofer.",
  example:{ro:"Hotelul oferă mic dejun gratuit.",en:"The hotel offers free breakfast."}},
 {id:"v_comanda", inf:"a comanda", en:"to order (food, goods)", group:"I", f:2,
  irr:{present:{eu:"comand",tu:"comanzi",el:"comandă",noi:"comandăm",voi:"comandați",ei:"comandă"}, subj3:"comande"},
  notes:"Restaurant and online shopping. Note d→z in tu comanzi.",
  example:{ro:"Am comandat deja mâncare.",en:"I've already ordered food."}},
 {id:"v_costa2", inf:"a construi", en:"to build", group:"IV-esc", f:3,
  notes:"Regular -esc verb: construiesc, construiești, construiește.",
  example:{ro:"Se construiește un bloc nou aici.",en:"A new block is being built here."}},
 {id:"v_repara", inf:"a repara", en:"to repair, to fix", group:"I", f:3,
  irr:{present:{eu:"repar",tu:"repari",el:"repară",noi:"reparăm",voi:"reparați",ei:"repară"}, subj3:"repare"},
  notes:"Everyday word for fixing things. The noun is reparație.",
  example:{ro:"Trebuie să repar bicicleta.",en:"I need to fix the bike."}},
 {id:"v_curata", inf:"a curăța", en:"to clean", group:"I", f:3,
  irr:{present:{eu:"curăț",tu:"cureți",el:"curăță",noi:"curățăm",voi:"curățați",ei:"curăță"}, subj3:"curețe"},
  notes:"The noun curățenie ('cleaning, cleanliness') is more common: fac curățenie.",
  example:{ro:"Curăț bucătăria sâmbăta.",en:"I clean the kitchen on Saturdays."}},

 /* ---------- Batch 3: the rest of the high-frequency core ----------
    Classes II, III and IV must declare their singular imperative — the engine
    refuses to guess it, for the reasons set out at imperativeOf(). Participles
    and subjunctive 3rd persons are declared wherever the regular suffix would
    produce the wrong form (creștut for crescut, batut for bătut). */
 {id:"v_raspunde", inf:"a răspunde", en:"to answer, to reply", group:"III", f:1,
  irr:{imperative:{tu:"răspunde!"}, participle:"răspuns"},
  notes:"Takes a dative for the person: îți răspund. Răspuns is also the noun 'answer'.",
  example:{ro:"Îți răspund mâine dimineață.",en:"I'll answer you tomorrow morning."}},
 {id:"v_insemna", inf:"a însemna", en:"to mean", group:"I", f:1,
  irr:{present:{eu:"însemn",tu:"însemni",el:"înseamnă",noi:"însemnăm",voi:"însemnați",ei:"înseamnă"}, subj3:"însemne"},
  notes:"Ce înseamnă…? is how you ask what a word means — the single most useful question for a learner.",
  example:{ro:"Ce înseamnă cuvântul ăsta?",en:"What does this word mean?"}},
 {id:"v_aparea", inf:"a apărea", en:"to appear, to come out", group:"II", f:2,
  irr:{imperative:{tu:null}, present:{eu:"apar",tu:"apari",el:"apare",noi:"apărem",voi:"păreți",ei:"apar"}, participle:"apărut", subj3:"apară"},
  notes:"Same family as a părea. Used for things coming into view and for publications coming out.",
  example:{ro:"Cartea apare în octombrie.",en:"The book comes out in October."}},
 {id:"v_disparea", inf:"a dispărea", en:"to disappear", group:"II", f:2,
  irr:{imperative:{tu:"dispari!"}, present:{eu:"dispar",tu:"dispari",el:"dispare",noi:"dispărem",voi:"dispăreți",ei:"dispar"}, participle:"dispărut", subj3:"dispară"},
  notes:"Dispari! on its own is a rude 'get lost'.",
  example:{ro:"Telefonul meu a dispărut.",en:"My phone has disappeared."}},
 {id:"v_creste", inf:"a crește", en:"to grow; to raise", group:"III", f:2,
  irr:{imperative:{tu:"crește!"}, present:{eu:"cresc",tu:"crești",el:"crește",noi:"creștem",voi:"creșteți",ei:"cresc"}, participle:"crescut", subj3:"crească"},
  notes:"Both intransitive (children grow) and transitive (to raise children or animals).",
  example:{ro:"Am crescut la țară.",en:"I grew up in the countryside."}},
 {id:"v_prinde", inf:"a prinde", en:"to catch", group:"III", f:2,
  irr:{imperative:{tu:"prinde!"}, participle:"prins"},
  notes:"Also 'to catch' a train and, colloquially, to understand: am prins ideea.",
  example:{ro:"Nu am prins trenul de opt.",en:"I didn't catch the eight o'clock train."}},
 {id:"v_bate", inf:"a bate", en:"to beat; to knock", group:"III", f:2,
  irr:{imperative:{tu:"bate!"}, participle:"bătut"},
  notes:"Participle bătut, not *batut. Bate vântul = the wind is blowing.",
  example:{ro:"Cineva bate la ușă.",en:"Someone is knocking at the door."}},
 {id:"v_rupe", inf:"a rupe", en:"to tear, to break", group:"III", f:3,
  irr:{imperative:{tu:"rupe!"}, participle:"rupt"},
  notes:"For things that tear or snap. A sparge is for things that shatter.",
  example:{ro:"Mi-am rupt mâna anul trecut.",en:"I broke my arm last year."}},
 {id:"v_sparge", inf:"a sparge", en:"to break, to smash", group:"III", f:3,
  irr:{imperative:{tu:"sparge!"}, participle:"spart"},
  notes:"For glass, plates, windows — anything that shatters.",
  example:{ro:"Am spart un pahar.",en:"I broke a glass."}},
 {id:"v_sterge", inf:"a șterge", en:"to wipe; to delete", group:"III", f:2,
  irr:{imperative:{tu:"șterge!"}, participle:"șters"},
  notes:"Everyday word for deleting files as well as wiping surfaces.",
  example:{ro:"Am șters mesajul din greșeală.",en:"I deleted the message by mistake."}},
 {id:"v_atinge", inf:"a atinge", en:"to touch; to reach", group:"III", f:3,
  irr:{imperative:{tu:"atinge!"}, participle:"atins"},
  notes:"Nu atinge! is the standard 'don't touch' — though the negative imperative is nu atinge, using the infinitive.",
  example:{ro:"Nu atinge, e fierbinte!",en:"Don't touch, it's hot!"}},
 {id:"v_promite", inf:"a promite", en:"to promise", group:"III", f:2,
  irr:{imperative:{tu:"promite!"}, participle:"promis"},
  notes:"Takes a dative for the person promised: îți promit.",
  example:{ro:"Îți promit că vin.",en:"I promise you I'll come."}},
 {id:"v_permite", inf:"a permite", en:"to allow, to permit", group:"III", f:2,
  irr:{imperative:{tu:"permite!"}, participle:"permis"},
  notes:"Reflexive a-și permite = to afford: nu-mi permit.",
  example:{ro:"Nu-mi permit o mașină nouă.",en:"I can't afford a new car."}},
 {id:"v_recunoaste", inf:"a recunoaște", en:"to recognize; to admit", group:"III", f:2,
  irr:{imperative:{tu:"recunoaște!"}, present:{eu:"recunosc",tu:"recunoști",el:"recunoaște",noi:"recunoaștem",voi:"recunoașteți",ei:"recunosc"}, participle:"recunoscut", subj3:"recunoască"},
  notes:"Same pattern as a cunoaște. Covers both recognizing a face and admitting a fact.",
  example:{ro:"Recunosc că am greșit.",en:"I admit that I was wrong."}},
 {id:"v_traduce", inf:"a traduce", en:"to translate", group:"III", f:2,
  irr:{imperative:{tu:"tradu!"}, participle:"tradus"},
  notes:"Shortened imperative tradu!, like du! and adu!. Din… în… for the language pair.",
  example:{ro:"Poți să traduci asta în engleză?",en:"Can you translate this into English?"}},
 {id:"v_propune", inf:"a propune", en:"to propose, to suggest", group:"III", f:2,
  irr:{imperative:{tu:"propune!"}, present:{eu:"propun",tu:"propui",el:"propune",noi:"propunem",voi:"propuneți",ei:"propun"}, participle:"propus"},
  notes:"Built on a pune, and shares its irregular tu form: propui, not *propuni.",
  example:{ro:"Îți propun altceva.",en:"I'm suggesting something else to you."}},
 {id:"v_apartine", inf:"a aparține", en:"to belong to", group:"III", f:3,
  irr:{imperative:{tu:null}, present:{eu:"aparțin",tu:"aparții",el:"aparține",noi:"aparținem",voi:"aparțineți",ei:"aparțin"}},
  notes:"Built on a ține. Takes a dative: îmi aparține.",
  example:{ro:"Cartea aceasta îi aparține Anei.",en:"This book belongs to Ana."}},
 {id:"v_depinde", inf:"a depinde", en:"to depend", group:"III", f:2,
  irr:{imperative:{tu:null}, participle:"depins"},
  notes:"Depinde! on its own is the everyday 'it depends'. Takes de: depinde de tine.",
  example:{ro:"Depinde de vreme.",en:"It depends on the weather."}},
 {id:"v_senaste", inf:"a se naște", en:"to be born", group:"III", refl:true, f:2,
  irr:{imperative:{tu:null}, present:{eu:"nasc",tu:"naști",el:"naște",noi:"naștem",voi:"nașteți",ei:"nasc"}, participle:"născut", subj3:"nască"},
  notes:"Almost always met in the past: m-am născut în… is how you give your birthplace and year.",
  example:{ro:"M-am născut în Bucureşti.",en:"I was born in Bucharest."}},
 {id:"v_ridica", inf:"a ridica", en:"to lift, to raise", group:"I", f:2,
  notes:"Reflexive a se ridica = to stand up, to get up.",
  example:{ro:"Ridică mâna dacă știi.",en:"Raise your hand if you know."}},
 {id:"v_arunca", inf:"a arunca", en:"to throw; to throw away", group:"I", f:2,
  notes:"A arunca la gunoi = to throw in the bin.",
  example:{ro:"Nu arunca biletul!",en:"Don't throw the ticket away!"}},
 {id:"v_taia", inf:"a tăia", en:"to cut", group:"I", f:2,
  irr:{present:{eu:"tai",tu:"tai",el:"taie",noi:"tăiem",voi:"tăiați",ei:"taie"}, subj3:"taie"},
  notes:"Note the shortened stem in the singular: tai, not *tăi.",
  example:{ro:"Tai pâinea, te rog?",en:"Will you cut the bread, please?"}},
 {id:"v_urca", inf:"a urca", en:"to go up, to get on", group:"I", f:2,
  notes:"Used for boarding a vehicle: urc în tren. Opposite of a coborî.",
  example:{ro:"Urcăm la etajul trei.",en:"We're going up to the third floor."}},
 {id:"v_cobori", inf:"a coborî", en:"to go down, to get off", group:"IV-î", f:2,
  irr:{present:{eu:"cobor",tu:"cobori",el:"coboară",noi:"coborâm",voi:"coborâți",ei:"coboară"}, subj3:"coboare"},
  notes:"The -î class: note the â in the noi and voi forms. Cobor la următoarea = I'm getting off at the next stop.",
  example:{ro:"Cobor la stația următoare.",en:"I'm getting off at the next stop."}},
 {id:"v_hotari", inf:"a hotărî", en:"to decide", group:"IV-î", f:2,
  irr:{present:{eu:"hotărăsc",tu:"hotărăști",el:"hotărăște",noi:"hotărâm",voi:"hotărâți",ei:"hotărăsc"}, participle:"hotărât", subj3:"hotărască"},
  notes:"The -î verbs that take -ăsc-, parallel to the -esc- pattern in the -i class.",
  example:{ro:"Am hotărât să rămân.",en:"I've decided to stay."}},
 {id:"v_omori", inf:"a omorî", en:"to kill", group:"IV-î", f:3,
  irr:{present:{eu:"omor",tu:"omori",el:"omoară",noi:"omorâm",voi:"omorâți",ei:"omoară"}, participle:"omorât", subj3:"omoare"},
  notes:"Same -î pattern as a coborî. Mă omori! is a common exaggeration, 'you're killing me'.",
  example:{ro:"Căldura asta mă omoară.",en:"This heat is killing me."}},
 {id:"v_jura", inf:"a jura", en:"to swear (an oath)", group:"I", f:3,
  notes:"The verb of the citizenship oath. Îți jur = I swear to you.",
  example:{ro:"Jur să spun adevărul.",en:"I swear to tell the truth."}},
 {id:"v_apara", inf:"a apăra", en:"to defend", group:"I", f:3,
  irr:{present:{eu:"apăr",tu:"aperi",el:"apără",noi:"apărăm",voi:"apărați",ei:"apără"}, subj3:"apere"},
  notes:"In the oath: să apăr drepturile. Note apăr with ă — apar is a different verb (a apărea).",
  example:{ro:"Îmi apăr punctul de vedere.",en:"I defend my point of view."}},
 {id:"v_respecta", inf:"a respecta", en:"to respect; to observe (a rule)", group:"I", f:2,
  notes:"Also used for keeping to rules and schedules: respect programul.",
  example:{ro:"Respect regulile casei.",en:"I respect the rules of the house."}},
 {id:"v_merita", inf:"a merita", en:"to deserve; to be worth", group:"I", f:2,
  notes:"Merită! on its own = it's worth it. Nu merită = it's not worth it.",
  example:{ro:"Merită să vezi filmul.",en:"The film is worth seeing."}},
 {id:"v_rezolva", inf:"a rezolva", en:"to solve, to sort out", group:"I", f:2,
  notes:"Used for problems, paperwork and errands alike: rezolv eu.",
  example:{ro:"Rezolv eu problema.",en:"I'll sort the problem out."}},
 {id:"v_accepta", inf:"a accepta", en:"to accept", group:"I", f:2,
  notes:"Formal register. In speech people often say sunt de acord instead.",
  example:{ro:"Accept condițiile.",en:"I accept the conditions."}},
 {id:"v_refuza", inf:"a refuza", en:"to refuse", group:"I", f:2,
  notes:"Takes să + subjunctive: refuz să cred.",
  example:{ro:"Refuz să plec acum.",en:"I refuse to leave now."}},
 {id:"v_evita", inf:"a evita", en:"to avoid", group:"I", f:3,
  notes:"Takes să + subjunctive for actions: evit să conduc noaptea.",
  example:{ro:"Evit aglomerația.",en:"I avoid the crowds."}},
 {id:"v_repeta", inf:"a repeta", en:"to repeat", group:"I", f:1,
  notes:"Puteți să repetați? is the phrase to have ready when you miss something.",
  example:{ro:"Poți să repeți, te rog?",en:"Can you repeat that, please?"}},
 {id:"v_continua", inf:"a continua", en:"to continue", group:"I", f:2,
  irr:{present:{eu:"continui",tu:"continui",el:"continuă",noi:"continuăm",voi:"continuați",ei:"continuă"}, subj3:"continue"},
  notes:"The eu form ends in -i, unusually for an -a verb: continui.",
  example:{ro:"Continuăm mâine.",en:"We'll continue tomorrow."}},
 {id:"v_castiga", inf:"a câștiga", en:"to win; to earn", group:"I", f:2,
  notes:"Both winning a game and earning money: câștig bine.",
  example:{ro:"Echipa noastră a câștigat.",en:"Our team won."}},
 {id:"v_numara", inf:"a număra", en:"to count", group:"I", f:2,
  irr:{present:{eu:"număr",tu:"numeri",el:"numără",noi:"numărăm",voi:"numărați",ei:"numără"}, subj3:"numere"},
  notes:"Note the ă→e shift in the tu form: numeri.",
  example:{ro:"Numără până la zece.",en:"Count to ten."}},
 {id:"v_aduna", inf:"a aduna", en:"to gather; to add up", group:"I", f:3,
  notes:"Reflexive a se aduna = to gather (of people).",
  example:{ro:"Adunăm bani pentru cadou.",en:"We're collecting money for a present."}},
 {id:"v_imprumuta", inf:"a împrumuta", en:"to borrow; to lend", group:"I", f:3,
  notes:"One verb for both directions — the preposition tells you which: împrumut de la (borrow from), împrumut cuiva (lend to).",
  example:{ro:"Îmi împrumuți cinci lei?",en:"Will you lend me five lei?"}},
 {id:"v_completa", inf:"a completa", en:"to fill in (a form)", group:"I-ez", f:2,
  notes:"The -ez- pattern. The verb you need for any Romanian paperwork.",
  example:{ro:"Completez formularul acum.",en:"I'm filling in the form now."}},
 {id:"v_functiona", inf:"a funcționa", en:"to work, to function", group:"I-ez", f:2,
  notes:"For machines and systems. A lucra and a munci are for people.",
  example:{ro:"Liftul nu funcționează.",en:"The lift isn't working."}},
 {id:"v_durea", inf:"a durea", en:"to hurt, to ache", group:"II", f:1,
  irr:{imperative:{tu:null}, present:{eu:"—",tu:"—",el:"doare",noi:"—",voi:"—",ei:"dor"}, participle:"durut", subj3:"doară"},
  notes:"Third person only, and the verb agrees with the BODY PART, not the person: mă doare capul (sg.), mă dor picioarele (pl.).",
  example:{ro:"Mă doare capul.",en:"I have a headache."}},
 {id:"v_suferi", inf:"a suferi", en:"to suffer", group:"IV", f:3,
  irr:{imperative:{tu:"suferă!"}, present:{eu:"sufăr",tu:"suferi",el:"suferă",noi:"suferim",voi:"suferiți",ei:"suferă"}, subj3:"sufere"},
  notes:"Note sufăr with ă in the eu form. A suferi de = to suffer from (an illness).",
  example:{ro:"Sufăr de alergii primăvara.",en:"I suffer from allergies in spring."}},
 {id:"v_imparti", inf:"a împărți", en:"to divide; to share", group:"IV", f:3,
  irr:{imperative:{tu:"împarte!"}, present:{eu:"împart",tu:"împarți",el:"împarte",noi:"împărțim",voi:"împărțiți",ei:"împart"}, subj3:"împartă"},
  notes:"Sharing a flat, splitting a bill, and division in arithmetic.",
  example:{ro:"Împărțim nota?",en:"Shall we split the bill?"}},
 {id:"v_porni", inf:"a porni", en:"to start (a device); to set off", group:"IV-esc", f:2,
  notes:"For switching things on and for setting out on a journey. Opposite: a opri.",
  example:{ro:"Pornesc calculatorul.",en:"I'm starting up the computer."}},
 {id:"v_lipsi", inf:"a lipsi", en:"to be missing, to be absent", group:"IV-esc", f:2,
  notes:"Îmi lipsește = I miss (something/someone) — the thing missed is the subject, as with îmi place.",
  example:{ro:"Îmi lipsește casa.",en:"I miss home."}},
 {id:"v_cheltui", inf:"a cheltui", en:"to spend (money)", group:"IV-esc", f:2,
  irr:{present:{eu:"cheltuiesc",tu:"cheltuiești",el:"cheltuiește",noi:"cheltuim",voi:"cheltuiți",ei:"cheltuiesc"}, subj3:"cheltuiască"},
  notes:"Only for money. Time is petrec: petrec timp cu familia.",
  example:{ro:"Cheltuiesc prea mult pe cafea.",en:"I spend too much on coffee."}},
 {id:"v_segandi", inf:"a se gândi", en:"to think (about)", group:"IV-esc", refl:true, f:1,
  notes:"Always reflexive, and takes la for the topic: mă gândesc la tine. Distinct from a crede (to believe, to hold an opinion).",
  example:{ro:"Mă gândesc la vacanță.",en:"I'm thinking about the holiday."}},
 {id:"v_seintampla", inf:"a se întâmpla", en:"to happen", group:"I", refl:true, f:1,
  irr:{imperative:{tu:null}, present:{eu:"—",tu:"—",el:"întâmplă",noi:"—",voi:"—",ei:"întâmplă"}, subj3:"întâmple"},
  notes:"Third person only — events happen, people do not. Ce s-a întâmplat? = What happened?",
  example:{ro:"Ce se întâmplă aici?",en:"What's going on here?"}},
 {id:"v_sedescurca", inf:"a se descurca", en:"to manage, to cope", group:"I", refl:true, f:2,
  notes:"A very Romanian verb: mă descurc covers managing, coping and getting by. Descurcă-te! = sort it out yourself.",
  example:{ro:"Mă descurc cu româna.",en:"I get by in Romanian."}},
 {id:"v_sebucura", inf:"a se bucura", en:"to be glad, to enjoy", group:"I", refl:true, f:2,
  notes:"Mă bucur! = I'm glad. Mă bucur să te cunosc = pleased to meet you.",
  example:{ro:"Mă bucur că ai venit.",en:"I'm glad you came."}},
 {id:"v_sesupara", inf:"a se supăra", en:"to get upset, to take offence", group:"I", refl:true, f:2,
  irr:{present:{eu:"supăr",tu:"superi",el:"supără",noi:"supărăm",voi:"supărați",ei:"supără"}, subj3:"supere"},
  notes:"Nu te supăra… is the standard polite opener for interrupting a stranger — literally 'don't be offended'.",
  example:{ro:"Nu te supăra, unde e gara?",en:"Excuse me, where is the station?"}},
 {id:"v_semuta", inf:"a se muta", en:"to move (house)", group:"I", refl:true, f:2,
  notes:"For changing address. Moving an object is a muta without the pronoun.",
  example:{ro:"Mă mut în septembrie.",en:"I'm moving in September."}},
 {id:"v_seodihni", inf:"a se odihni", en:"to rest", group:"IV-esc", refl:true, f:3,
  notes:"Odihnește-te! = get some rest.",
  example:{ro:"Trebuie să mă odihnesc.",en:"I need to rest."}},
 {id:"v_secasatori", inf:"a se căsători", en:"to get married", group:"IV-esc", refl:true, f:3,
  notes:"Takes cu for the spouse: mă căsătoresc cu Ana.",
  example:{ro:"S-au căsătorit anul trecut.",en:"They got married last year."}},
 {id:"v_sepregati", inf:"a se pregăti", en:"to get ready, to prepare", group:"IV-esc", refl:true, f:2,
  notes:"Takes pentru or de: mă pregătesc pentru examen.",
  example:{ro:"Mă pregătesc de plecare.",en:"I'm getting ready to leave."}},

 /* ---------- Batch 4: core verbs missed by the earlier passes ----------
    Batches 2 and 3 were built toward a target count and ended up padded with
    mid-frequency verbs while a plăcea — the verb behind a grammar topic this
    course already teaches — was not in the list at all. These are the ones a
    beginner meets first. */
 {id:"v_placea", inf:"a plăcea", en:"to please (îmi place = I like)", group:"II", f:1, irregular:true,
  irr:{imperative:{tu:null}, present:{eu:"plac",tu:"placi",el:"place",noi:"plăcem",voi:"plăceți",ei:"plac"}, participle:"plăcut", subj3:"placă"},
  notes:"Almost always used in the third person with a dative pronoun, and it agrees with the THING liked, not the person: îmi place cafeaua (sg.) but îmi plac cafelele (pl.). This is the single most common agreement error English speakers make in Romanian.",
  example:{ro:"Îmi place muzica românească.",en:"I like Romanian music."}},
 {id:"v_senumi", inf:"a se numi", en:"to be called, to be named", group:"IV-esc", refl:true, f:1,
  notes:"Mă numesc… is the standard way to give your name, slightly more formal than mă cheamă. Also used for things: cum se numește asta?",
  example:{ro:"Mă numesc Ana Popescu.",en:"My name is Ana Popescu."}},
 {id:"v_sta", inf:"a sta", en:"to stay; to sit; to live (colloquial)", group:"I", f:1, irregular:true,
  irr:{imperative:{tu:"stai!"}, present:{eu:"stau",tu:"stai",el:"stă",noi:"stăm",voi:"stați",ei:"stau"}, participle:"stat", subj3:"stea"},
  notes:"Stai! also means 'wait!' or 'hang on!' in conversation. Stau în București is a common colloquial alternative to locuiesc.",
  example:{ro:"Stai puțin, vin acum!",en:"Hang on a second, I'm coming!"}},
 {id:"v_deveni", inf:"a deveni", en:"to become", group:"IV", f:2,
  irr:{imperative:{tu:"devino!"}, present:{eu:"devin",tu:"devii",el:"devine",noi:"devenim",voi:"deveniți",ei:"devin"}, participle:"devenit", subj3:"devină"},
  notes:"Built on a veni and follows it exactly, including the imperative devino!.",
  example:{ro:"Vreau să devin profesor.",en:"I want to become a teacher."}},
 {id:"v_siaminti", inf:"a-și aminti", en:"to remember", group:"IV-esc", refl:"dative", f:1,
  notes:"Takes the DATIVE reflexive pronouns (îmi, îți, își), not the accusative ones: îmi amintesc, mi-am amintit. Writing *mă amintesc is wrong. Takes de for the thing remembered: îmi amintesc de tine.",
  example:{ro:"Nu-mi amintesc numele lui.",en:"I don't remember his name."}},
 {id:"v_seduce", inf:"a se duce", en:"to go (colloquial)", group:"III", refl:true, f:1,
  irr:{imperative:{tu:"du!"}, participle:"dus"},
  notes:"Extremely common in speech, often preferred to a merge: mă duc la magazin. Du-te! = go on, off you go.",
  example:{ro:"Mă duc la piață.",en:"I'm going to the market."}},
 {id:"v_seafla", inf:"a se afla", en:"to be located, to be situated", group:"I", refl:true, f:2,
  irr:{present:{eu:"aflu",tu:"afli",el:"află",noi:"aflăm",voi:"aflați",ei:"află"}, subj3:"afle"},
  notes:"The formal way to say where something is — signs and official texts prefer it to este. Non-reflexive a afla = to find out.",
  example:{ro:"Muzeul se află în centru.",en:"The museum is located in the center."}},
 {id:"v_spera", inf:"a spera", en:"to hope", group:"I", f:2,
  notes:"Takes să + subjunctive: sper să vii. Sper că da = I hope so.",
  example:{ro:"Sper să ne vedem curând.",en:"I hope we see each other soon."}},
 {id:"v_exista", inf:"a exista", en:"to exist, there is / there are", group:"I", f:2,
  notes:"Există is the impersonal 'there is / there are' in more formal Romanian, where speech uses e or sunt.",
  example:{ro:"Există o soluție.",en:"There is a solution."}},
 {id:"v_dura", inf:"a dura", en:"to last, to take (time)", group:"I-ez", f:2,
  irr:{imperative:{tu:null}, present:{eu:"—",tu:"—",el:"durează",noi:"—",voi:"—",ei:"durează"}, subj3:"dureze"},
  notes:"Third person only. Cât durează? = how long does it take?",
  example:{ro:"Filmul durează două ore.",en:"The film lasts two hours."}},
 {id:"v_fugi", inf:"a fugi", en:"to run; to flee", group:"IV", f:2,
  irr:{imperative:{tu:"fugi!"}, participle:"fugit", subj3:"fugă"},
  notes:"Also colloquially 'to dash off': fug la magazin.",
  example:{ro:"Fug puțin până la magazin.",en:"I'm dashing to the shop."}},
 {id:"v_alerga", inf:"a alerga", en:"to run (for exercise)", group:"I", f:2,
  irr:{present:{eu:"alerg",tu:"alergi",el:"aleargă",noi:"alergăm",voi:"alergați",ei:"aleargă"}, subj3:"alerge"},
  notes:"Running as a sport. A fugi is running away from or dashing somewhere.",
  example:{ro:"Alerg în fiecare dimineață.",en:"I run every morning."}},
 {id:"v_seplimba", inf:"a se plimba", en:"to go for a walk, to stroll", group:"I", refl:true, f:2,
  notes:"Always reflexive. A plimbare is the noun: ies la plimbare.",
  example:{ro:"Ne plimbăm prin parc.",en:"We're walking through the park."}},
 {id:"v_sescuza", inf:"a se scuza", en:"to apologize", group:"I", refl:true, f:2,
  notes:"Scuză-mă / scuzați-mă is the everyday 'excuse me' — accusative, not reflexive, in that form.",
  example:{ro:"Mă scuz pentru întârziere.",en:"I apologize for being late."}},
 {id:"v_ierta", inf:"a ierta", en:"to forgive", group:"I", f:3,
  irr:{present:{eu:"iert",tu:"ierți",el:"iartă",noi:"iertăm",voi:"iertați",ei:"iartă"}, subj3:"ierte"},
  notes:"Iartă-mă! = forgive me. Note the diphthong in the third person: iartă.",
  example:{ro:"Te rog să mă ierți.",en:"Please forgive me."}},
 {id:"v_zambi", inf:"a zâmbi", en:"to smile", group:"IV-esc", f:3,
  notes:"A râde is to laugh; a zâmbi is to smile.",
  example:{ro:"Zâmbește, te fotografiez!",en:"Smile, I'm taking your picture!"}},
 {id:"v_conta", inf:"a conta", en:"to matter, to count", group:"I-ez", f:2,
  irr:{imperative:{tu:null}, present:{eu:"—",tu:"—",el:"contează",noi:"—",voi:"—",ei:"contează"}, subj3:"conteze"},
  notes:"Nu contează = it doesn't matter, one of the most useful short replies in Romanian.",
  example:{ro:"Nu contează, lasă.",en:"It doesn't matter, never mind."}},
 {id:"v_seteme", inf:"a se teme", en:"to be afraid", group:"III", refl:true, f:3,
  irr:{imperative:{tu:null}, participle:"temut", subj3:"teamă"},
  notes:"Takes de for the thing feared: mă tem de câini. In speech mi-e frică de… is more common.",
  example:{ro:"Mă tem că am greșit.",en:"I'm afraid I've made a mistake."}},
 {id:"v_sosi", inf:"a sosi", en:"to arrive", group:"IV-esc", f:2,
  notes:"More formal than a ajunge — you meet it on timetables and announcements.",
  example:{ro:"Trenul sosește la ora trei.",en:"The train arrives at three o'clock."}},
 {id:"v_privi", inf:"a privi", en:"to look at, to watch", group:"IV-esc", f:2,
  notes:"More deliberate than a vedea. A se uita la is the everyday spoken equivalent.",
  example:{ro:"Privesc pe fereastră.",en:"I'm looking out of the window."}},
 {id:"v_seintalni", inf:"a se întâlni", en:"to meet (up)", group:"IV-esc", refl:true, f:1,
  notes:"Takes cu for the person: mă întâlnesc cu Ana. A cunoaște is meeting someone for the first time.",
  example:{ro:"Ne întâlnim la șapte.",en:"We're meeting at seven."}},
 {id:"v_saluta", inf:"a saluta", en:"to greet, to say hello", group:"I", f:3,
  notes:"Salută-l din partea mea = say hello to him from me.",
  example:{ro:"Salut-o pe mama din partea mea.",en:"Say hello to your mother from me."}},
 {id:"v_striga", inf:"a striga", en:"to shout, to call out", group:"I", f:3,
  notes:"A striga pe cineva = to call someone by shouting.",
  example:{ro:"Cineva strigă afară.",en:"Someone is shouting outside."}},
 {id:"v_tacea", inf:"a tăcea", en:"to be silent, to shut up", group:"II", f:3,
  irr:{imperative:{tu:"taci!"}, present:{eu:"tac",tu:"taci",el:"tace",noi:"tăcem",voi:"tăceți",ei:"tac"}, participle:"tăcut", subj3:"tacă"},
  notes:"Taci! is blunt — 'be quiet' at best, 'shut up' at worst. Fă liniște is the polite version.",
  example:{ro:"A tăcut tot drumul.",en:"He was silent the whole way."}},
 {id:"v_visa", inf:"a visa", en:"to dream", group:"I-ez", f:3,
  notes:"Takes la for aspirations: visez la o casă. Am visat că… for dreams while asleep.",
  example:{ro:"Am visat ceva ciudat.",en:"I dreamed something strange."}},
 {id:"v_zbura", inf:"a zbura", en:"to fly", group:"I", f:3,
  irr:{present:{eu:"zbor",tu:"zbori",el:"zboară",noi:"zburăm",voi:"zburați",ei:"zboară"}, subj3:"zboare"},
  notes:"Stem vowel u→o/oa, like a omorî. The noun zbor = flight.",
  example:{ro:"Zburăm la Cluj mâine.",en:"We're flying to Cluj tomorrow."}},
 {id:"v_inota", inf:"a înota", en:"to swim", group:"I", f:3,
  irr:{present:{eu:"înot",tu:"înoți",el:"înoată",noi:"înotăm",voi:"înotați",ei:"înoată"}, subj3:"înoate"},
  notes:"Note the diphthong in the third person: înoată.",
  example:{ro:"Nu știu să înot.",en:"I don't know how to swim."}},
 {id:"v_traversa", inf:"a traversa", en:"to cross", group:"I-ez", f:3,
  notes:"For crossing a street: traversez strada. The -ez- pattern.",
  example:{ro:"Traversează pe verde!",en:"Cross on the green light!"}},
 {id:"v_semana", inf:"a semăna", en:"to resemble, to look like", group:"I", f:3,
  irr:{present:{eu:"semăn",tu:"semeni",el:"seamănă",noi:"semănăm",voi:"semănați",ei:"seamănă"}, subj3:"semene"},
  notes:"Takes cu: semeni cu tatăl tău. A homograph of a semăna 'to sow'.",
  example:{ro:"Semeni cu mama ta.",en:"You look like your mother."}},
 {id:"v_interzice", inf:"a interzice", en:"to forbid, to ban", group:"III", f:3,
  irr:{imperative:{tu:"interzice!"}, participle:"interzis"},
  notes:"Built on a zice. Interzis is the word on prohibition signs: fumatul interzis.",
  example:{ro:"Este interzis să parchezi aici.",en:"It's forbidden to park here."}},
 {id:"v_preda", inf:"a preda", en:"to teach; to hand in", group:"I", f:3,
  irr:{present:{eu:"predau",tu:"predai",el:"predă",noi:"predăm",voi:"predați",ei:"predau"}, subj3:"predea"},
  notes:"Both teaching a subject and handing something over. Note predau in the eu form.",
  example:{ro:"Predau limba română.",en:"I teach Romanian."}},
 {id:"v_ura", inf:"a ura", en:"to wish (someone something)", group:"I-ez", f:3,
  notes:"The verb behind every greeting card: îți urez succes, vă urăm sărbători fericite.",
  example:{ro:"Îți urez mult succes!",en:"I wish you every success!"}},
 {id:"v_sejuca", inf:"a se juca", en:"to play (games)", group:"I", refl:true, f:2,
  irr:{present:{eu:"joc",tu:"joci",el:"joacă",noi:"jucăm",voi:"jucați",ei:"joacă"}, subj3:"joace"},
  notes:"Reflexive for playing games or messing about; non-reflexive a juca for sports and roles: joc fotbal.",
  example:{ro:"Copiii se joacă în curte.",en:"The children are playing in the yard."}},
 {id:"v_seridica", inf:"a se ridica", en:"to stand up, to get up", group:"I", refl:true, f:2,
  notes:"Reflexive of a ridica. Ridică-te! = stand up.",
  example:{ro:"S-a ridicat de pe scaun.",en:"He stood up from the chair."}},
 {id:"v_seaseza", inf:"a se așeza", en:"to sit down", group:"I", refl:true, f:2,
  irr:{present:{eu:"așez",tu:"așezi",el:"așază",noi:"așezăm",voi:"așezați",ei:"așază"}, subj3:"așeze"},
  notes:"Așază-te! or the politer luați loc! for inviting someone to sit.",
  example:{ro:"Așază-te, te rog.",en:"Sit down, please."}},
 {id:"v_seopri", inf:"a se opri", en:"to stop, to come to a halt", group:"IV-esc", refl:true, f:2,
  notes:"Reflexive of a opri, used for vehicles and for stopping oneself: autobuzul se oprește aici.",
  example:{ro:"Trenul se oprește în fiecare gară.",en:"The train stops at every station."}},

 {id:"v_vorbi", inf:"a vorbi", en:"to speak", group:"4th conj. -i", irregular:false,
   present:{eu:"vorbesc",tu:"vorbești",el:"vorbește",noi:"vorbim",voi:"vorbiți",ei:"vorbesc"},
   past:{eu:"am vorbit",tu:"ai vorbit",el:"a vorbit",noi:"am vorbit",voi:"ați vorbit",ei:"au vorbit"},
   imperfect:{eu:"vorbeam",tu:"vorbeai",el:"vorbea",noi:"vorbeam",voi:"vorbeați",ei:"vorbeau"},
   future:{eu:"voi vorbi",tu:"vei vorbi",el:"va vorbi",noi:"vom vorbi",voi:"veți vorbi",ei:"vor vorbi"},
   conditional:{eu:"aș vorbi",tu:"ai vorbi",el:"ar vorbi",noi:"am vorbi",voi:"ați vorbi",ei:"ar vorbi"},
   subjunctive:{eu:"să vorbesc",tu:"să vorbești",el:"să vorbească",noi:"să vorbim",voi:"să vorbiți",ei:"să vorbească"},
   imperative:{tu:"vorbește!",voi:"vorbiți!"}, participle:"vorbit",
   notes:"Same -esc- pattern as a locui — very common among -i verbs.",
   example:{ro:"Vorbesc puțin română.", en:"I speak a little Romanian."}}
