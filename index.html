 explain:"<b>O să merg</b> is the everyday spoken future. <i>Voi merge</i> is correct but belongs to writing and formal speech — using it in casual conversation sounds bookish. Option C mangles the preposition: it is <b>în Grecia</b>, not <i>să Grecia</i>.",
 audio:"Vara aceasta o să merg în Grecia.", vocab:["a_plan"]},
{id:"a202", lesson:"l_a2u2l1", skill:"grammar", type:"fill", diff:3, topic:"g_subjunctive",
 prompt:"Trebuie ___ vorbesc cu șeful.", answer:"să", accept:["să","sa"],
 explain:"<b>A trebui</b> is always followed by <b>să</b> + subjunctive. Note that <i>trebuie</i> itself never changes for person — <i>trebuie să vorbesc, trebuie să vorbim</i>. Who must do it is carried entirely by the verb after <b>să</b>.",
 audio:"Trebuie să vorbesc cu șeful.", vocab:["a_atrebui"]},
{id:"a203", lesson:"l_a2u2l1", skill:"grammar", type:"mcq", diff:3, topic:"g_subjunctive",
 prompt:"How do you give advice: \"You should talk to him\"?",
 options:["Trebuie să vorbești cu el.","Ar trebui să vorbești cu el.","Vei trebui să vorbești cu el."], correct:1,
 explain:"<b>Ar trebui</b> — the conditional of <i>a trebui</i> — is the standard way to say 'should'. Plain <i>trebuie</i> is stronger: 'you have to'. The difference between obligation and advice is exactly this one word.",
 audio:"Ar trebui să vorbești cu el.", vocab:["a_artrebui"]},
{id:"a204", lesson:"l_a2u2l2", skill:"vocabulary", type:"mcq", diff:4, topic:null,
 prompt:"Which is correct? <span class=\"ro\">___ pe Maria de zece ani.</span>",
 options:["Știu","O cunosc","O știu"], correct:1,
 explain:"English uses one verb where Romanian uses two. <b>A cunoaște</b> is for people and places you are acquainted with; <b>a ști</b> is for facts and skills. Since Maria is a person, it is <b>O cunosc pe Maria</b> — with <i>pe</i> and the doubling pronoun, as always with a specific person as object.",
 audio:"O cunosc pe Maria de zece ani.", vocab:["a_acunoaste","a_asti"]},
{id:"a205", lesson:"l_a2u2l2", skill:"grammar", type:"fill", diff:3, topic:null,
 prompt:"___ să înot, dar nu ___ să schiez. (a ști, both blanks)", answer:"Știu ... știu",
 accept:["știu","Știu","stiu","Știu … știu","știu știu"],
 explain:"<b>Știu să înot</b> — for a learned skill Romanian uses <b>a ști + să</b>, never <i>a cunoaște</i>. The rule of thumb: <i>a ști</i> takes facts and să-clauses, <i>a cunoaște</i> takes people and places.",
 audio:"Știu să înot, dar nu știu să schiez.", vocab:["a_asti"]},
{id:"a206", lesson:"l_a2u2l2", skill:"writing", type:"produce", diff:4, topic:"g_future",
 prompt:"Write 4–5 sentences about your plans for the coming year. Use <b>o să</b> and <b>ar trebui să</b> at least once each.",
 minWords:25, mustUse:["o să","ar trebui"],
 model:"Anul viitor o să încep un curs de română avansată. Vreau să merg în România în vară, ca să exersez cu vorbitori nativi. Ar trebui să economisesc mai mulți bani până atunci. Sper să găsesc și un partener de conversație online. Poimâine încep să caut un curs potrivit.",
 explain:"Compare with the model. Both <b>o să</b> and <b>ar trebui să</b> take the subjunctive, so the verb after them changes only in the third person (<i>o să meargă</i>, <i>ar trebui să meargă</i>). Check also that you used <b>ca să</b> — not just <i>să</i> — where you expressed purpose.",
 vocab:["a_anulviitor","a_artrebui"]},

/* ---------- A2.1 U3 : hotel, object pronouns in practice ---------- */
{id:"a221", lesson:"l_a2u3l1", skill:"vocabulary", type:"trans_en_ro", diff:3, topic:null,
 prompt:"Translate: \"I have a reservation for three nights.\"",
 answer:"Am o rezervare pentru trei nopți.",
 accept:["Am o rezervare pentru trei nopți.","Am o rezervare pentru trei nopti.","Am o rezervare de trei nopți."],
 explain:"<b>Trei nopți</b> — the plural of <i>noapte</i> is irregular in its vowel: <b>nopți</b>. Note no <i>de</i> after <b>trei</b>: that is only required from twenty upward (<i>douăzeci de nopți</i>).",
 audio:"Am o rezervare pentru trei nopți.", vocab:["a_rezervare","a_noapte_h"]},
{id:"a222", lesson:"l_a2u3l1", skill:"grammar", type:"mcq", diff:4, topic:"g_object_pronouns",
 prompt:"The receptionist finds your booking. Which is right?",
 options:["Am găsit-o.","Am găsit-l.","O am găsit."], correct:0,
 explain:"<b>Rezervarea</b> is feminine, so the pronoun is <b>o</b> — and in the perfect compus it attaches to the END of the participle with a hyphen: <b>am găsit-o</b>. This is unique to <i>o</i>; the other pronouns go before the auxiliary (<i>l-am găsit</i>, <i>i-am găsit</i>).",
 audio:"Am găsit-o.", vocab:["a_rezervare"]},
{id:"a223", lesson:"l_a2u3l1", skill:"grammar", type:"fill", diff:4, topic:"g_object_pronouns",
 prompt:"Micul dejun? ___ serviți între șapte și zece.", answer:"Îl", accept:["îl","il"],
 explain:"<b>Micul dejun</b> is masculine/neuter singular, so the pronoun is <b>îl</b>. Placing the pronoun before the verb like this is how Romanian avoids repeating a noun already mentioned — very common in service language.",
 audio:"Îl serviți între șapte și zece.", vocab:["a_micdejun_inc"]},
{id:"a224", lesson:"l_a2u3l2", skill:"reading", type:"reading_q", diff:4, topic:null, readingId:"r_a2u3",
 prompt:"You want to cancel two days before arriving. According to the email, is that in time?",
 options:["No — cancellations are not accepted at all.","Yes — the notice period is 48 hours.","No — you must cancel a week ahead."], correct:1,
 explain:"The email asks for notice <i>cu cel puțin patruzeci și opt de ore înainte</i> — at least forty-eight hours, which is two days. The figure is written out in words rather than digits, which is normal in formal Romanian correspondence and is the main reading difficulty here.",
 vocab:["a_rezervare"]},
{id:"a225", lesson:"l_a2u3l2", skill:"listening", type:"transcribe", diff:4, topic:null,
 prompt:"Listen and type what you hear.",
 audio:"Camera trebuie eliberată până la ora douăsprezece.",
 answer:"Camera trebuie eliberată până la ora douăsprezece.",
 accept:["Camera trebuie eliberată până la ora douăsprezece."],
 explain:"<b>Trebuie eliberată</b> is a passive: 'must be vacated'. The participle agrees with <i>camera</i> (feminine), hence <b>eliberată</b>. Note <b>până la</b> for a deadline — 'by, no later than'.",
 vocab:["a_atrebui"]},

/* ---------- A2.1 U4 : at the doctor, giving advice ---------- */
{id:"a241", lesson:"l_a2u4l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"The doctor asks <span class=\"ro\">Ce vă supără?</span> What are they asking?",
 options:["What is annoying you? (i.e. what's wrong medically)","Who upset you?","What do you need?"], correct:0,
 explain:"<b>Ce vă supără?</b> literally means 'what is bothering you', and it is the standard opening question in a Romanian consultation — the equivalent of 'what seems to be the problem?'. Answer with your symptoms: <i>Mă doare…</i>, <i>Tușesc…</i>, <i>Am febră…</i>",
 audio:"Ce vă supără?", vocab:["a_simptom"]},
{id:"a242", lesson:"l_a2u4l1", skill:"grammar", type:"build", diff:4, topic:"g_subjunctive",
 prompt:"Arrange into a piece of advice.",
 words:["ar","trebui","vă","să","odihniți"], answer:"Ar trebui să vă odihniți.",
 accept:["Ar trebui să vă odihniți.","Ar trebui sa va odihniti."],
 explain:"<b>Ar trebui să vă odihniți</b> — advice in the polite form. Note the reflexive pronoun <b>vă</b> sits between <i>să</i> and the verb, never before <i>să</i>. The verb <i>a se odihni</i> is reflexive, so dropping <b>vă</b> would break it.",
 audio:"Ar trebui să vă odihniți.", vocab:["a_aseodihni","a_artrebui"]},
{id:"a243", lesson:"l_a2u4l2", skill:"grammar", type:"transform", diff:4, topic:"g_perfect_compus",
 prompt:"Rewrite in the past: <span class=\"ro\">Am febră și tușesc.</span>",
 answer:"Am avut febră și am tușit.", accept:["Am avut febră și am tușit."],
 explain:"Both verbs go into perfectul compus: <i>am → <b>am avut</b></i> and <i>tușesc → <b>am tușit</b></i>. Note that <b>am</b> appears twice but does different jobs — the first is the auxiliary, the second belongs to <i>a avea</i> itself.",
 audio:"Am avut febră și am tușit.", vocab:["a_atusi"]},
{id:"a244", lesson:"l_a2u4l2", skill:"writing", type:"produce", diff:4, topic:"g_subjunctive",
 prompt:"A friend writes that they've been ill all week. Reply in 4–5 sentences: ask how they are, and give two pieces of advice.",
 minWords:25, mustUse:["ar trebui"],
 model:"Îmi pare rău să aud că ești bolnav. Cum te simți acum, mai bine? Ar trebui să te odihnești și să bei multe lichide. Dacă febra nu scade, ar trebui să mergi la medic. Sper să te faci bine repede!",
 explain:"Check that every piece of advice uses <b>ar trebui să</b> + subjunctive, and that reflexive verbs kept their pronouns (<i>să te odihnești</i>, <i>să te faci bine</i>). <b>Sper să…</b> is the natural way to close a message like this.",
 vocab:["a_artrebui","a_aseodihni"]},

/* ---------- A2.1 U5 : renting, genitive/dative in context ---------- */
{id:"a261", lesson:"l_a2u5l1", skill:"grammar", type:"mcq", diff:4, topic:"g_dative_genitive",
 prompt:"Choose the natural way to say \"I complained to the landlord\":",
 options:["M-am plâns la proprietar.","M-am plâns proprietarului.","Am plâns proprietarul."], correct:1,
 explain:"<b>A se plânge</b> takes a dative recipient — <b>proprietarului</b>, with the -ului ending — not <i>la + noun</i>. Option C also drops the reflexive pronoun, which changes the meaning entirely: <i>am plâns</i> means 'I wept'.",
 audio:"M-am plâns proprietarului.", vocab:["a_aseplange","a_proprietar"]},
{id:"a262", lesson:"l_a2u5l1", skill:"grammar", type:"fill", diff:4, topic:"g_dative_genitive",
 prompt:"Garanția se returnează la sfârșitul ___. (contract)", answer:"contractului", accept:["contractului"],
 explain:"<b>Sfârșitul contractului</b> — 'the end of the contract'. Neuter and masculine nouns take <b>-ului</b> in the genitive. Romanian shows possession by inflecting the owner, with no preposition where English needs 'of'.",
 audio:"Garanția se returnează la sfârșitul contractului.", vocab:["a_contract","a_garantie"]},
{id:"a263", lesson:"l_a2u5l2", skill:"reading", type:"reading_q", diff:4, topic:null, readingId:"r_a2u5",
 prompt:"You have a budget of 550 euros a month all-in, in winter. Can you afford this flat?",
 options:["Yes, comfortably — the rent is 500.","It's very tight — maintenance adds roughly 30 euros on top.","No — the rent alone is over 550."], correct:1,
 explain:"Rent is 500 euros, but <i>întreținerea nu este inclusă</i> and runs about <b>150 de lei</b> in winter — roughly 30 euros. That puts the real total near 530, inside the budget but only just. The advert never states a total; you have to combine two separate figures and notice they are in different currencies.",
 vocab:["a_intretinere","a_garantie"]},
{id:"a264", lesson:"l_a2u5l2", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Write a short message to a landlord about the flat in the advert. Ask two questions and say when you could view it (4–5 sentences).",
 minWords:28, mustUse:["apartament"],
 model:"Bună ziua! Am văzut anunțul dumneavoastră pentru apartamentul din zona Aviatorilor. Aș vrea să știu dacă întreținerea include și căldura. De asemenea, este posibil un contract pe doi ani? Aș putea să vizionez apartamentul joi după ora șase. Vă mulțumesc!",
 explain:"Note the register: a stranger gets <b>dumneavoastră</b> and voi-form verbs throughout. <b>Aș vrea să știu dacă…</b> is a useful frame for a polite indirect question, and <b>Aș putea să…</b> for proposing a time without presuming.",
 vocab:["a_intretinere","a_contract"]},

/* ---------- B1.1 : subjunctive & opinions ---------- */
{id:"e501", lesson:"l_b1u1l1", skill:"grammar", type:"mcq", diff:4, topic:"g_subjunctive",
 prompt:"Alege varianta corectă:",
 options:["Vreau învăț română.","Vreau să învăț română.","Vreau a învăța română."], correct:1,
 explain:"După verbe ca <b>a vrea, a putea, a trebui</b>, româna folosește <b>să</b> + conjunctiv, nu infinitivul: <b>Vreau să învăț</b>. Construcția cu infinitivul (<i>vreau a învăța</i>) există, dar este arhaică și sună livresc. <i>(After verbs like a vrea, Romanian uses să + subjunctive rather than the infinitive.)</i>",
 audio:"Vreau să învăț română."},
{id:"e502", lesson:"l_b1u1l1", skill:"grammar", type:"fill", diff:4, topic:"g_subjunctive",
 prompt:"E important ca echipele ___ ___ față în față. (a se întâlni)",
 answer:"să se întâlnească", accept:["să se întâlnească"],
 explain:"La persoana a III-a, conjunctivul are formă proprie: <i>el/ea se întâlnește</i> → <b>să se întâlnească</b>. Aceasta este singura persoană unde conjunctivul diferă clar de indicativ. Pronumele reflexiv <b>se</b> stă între <i>să</i> și verb.",
 audio:"E important ca echipele să se întâlnească față în față."},
{id:"e503", lesson:"l_b1u1l1", skill:"grammar", type:"produce", diff:4, topic:"g_conditional",
 prompt:"Completează natural: <span class=\"ro\">Dacă aș avea mai mult timp, ________</span>",
 minWords:3, mustUse:["aș"],
 model:"Dacă aș avea mai mult timp, aș învăța încă o limbă.",
 explain:"Aceasta este o condiție ipotetică. Româna folosește condiționalul în <b>ambele</b> propoziții: <i>dacă + aș avea → aș învăța</i>. Formele sunt <b>aș, ai, ar, am, ați, ar</b> + infinitiv. Orice continuare cu un verb la condițional este corectă — de exemplu <i>aș călători mai mult</i>, <i>aș citi mai des</i>, <i>aș dormi mai mult</i>.",
 audio:"Dacă aș avea mai mult timp, aș învăța încă o limbă."},
{id:"e504", lesson:"l_b1u1l1", skill:"reading", type:"reading_q", diff:4, topic:"g_connectors", readingId:"r_b1u1",
 prompt:"Care afirmație rezumă cel mai bine poziția articolului?",
 options:["Munca de acasă este superioară și ar trebui generalizată.","Nicio formulă nu se potrivește tuturor, dar compromisul câștigă teren.","Întâlnirile față în față sunt indispensabile pentru orice echipă."], correct:1,
 explain:"Răspunsul nu apare ca atare nicăieri — trebuie să sintetizezi. Ultima frază spune <i>nu există o soluție perfectă pentru toată lumea</i>, iar <i>tot mai multe companii… adoptă acest tip de flexibilitate</i> arată direcția. Concesivul <b>deși</b> leagă cele două idei: recunoaște limita, apoi afirmă tendința. Variantele A și C repetă poziții pe care articolul le prezintă ca fiind ale <i>unora</i>, nu ca propria concluzie."},
{id:"e504b", lesson:"l_b1u1l1", skill:"reading", type:"reading_q", diff:4, topic:"g_connectors", readingId:"r_b1u1",
 prompt:"De ce consideră unii angajatori că prezența la birou contează?",
 options:["Pentru că angajații lucrează mai multe ore acolo.","Pentru că se pierde mai puțin timp în trafic.","Pentru că relațiile dintre colegi se construiesc mai ușor direct."], correct:2,
 explain:"Textul spune <i>pentru a comunica mai eficient și a construi relații mai puternice</i> — reformulat aici ca „relațiile se construiesc mai ușor direct”. Atenție la varianta B: <b>timpul pierdut în trafic</b> chiar apare în text, dar ca argument al taberei <i>opuse</i>, a susținătorilor muncii la distanță. Cine caută doar cuvinte-cheie alege exact varianta greșită."},
{id:"e505", lesson:"l_b1u1l1", skill:"writing", type:"produce", diff:5, topic:"g_connectors",
 prompt:"Scrie 100–150 de cuvinte despre o decizie dificilă pe care ai luat-o și de ce ai luat-o.",
 minWords:60, mustUse:["pentru că"],
 model:"Acum câțiva ani a trebuit să decid dacă să rămân în orașul meu natal sau să mă mut în alt oraș pentru un job nou. A fost o decizie dificilă pentru că aveam toți prietenii și familia acolo. Pe de o parte, jobul oferea un salariu mai bun și mai multe oportunități de dezvoltare. Pe de altă parte, știam că voi fi singur la început și că va trebui să îmi construiesc o viață nouă. Până la urmă m-am mutat, deși mi-a fost foarte greu în primele luni. Astăzi cred că a fost alegerea potrivită, fiindcă am învățat să fiu mai independent.",
 explain:"Compară cu modelul. Un text B1 bun folosește: timpuri trecute contrastate (<b>a trebuit, aveam, m-am mutat</b> — perfect compus pentru evenimente, imperfect pentru fundal), conectori de cauză (<b>pentru că, fiindcă</b>), de contrast (<b>pe de o parte… pe de altă parte, deși</b>) și de concluzie (<b>până la urmă</b>). Verifică și acordul participiului în <i>am luat-o</i>."},

/* ---------- REGISTER TRACK ----------
   These test the SOCIAL judgement rather than the words: which register fits
   which situation, and what a given word signals about the speaker. Getting
   mișto right in a dictionary sense is easy; knowing not to say it to a
   registrar is the actual skill. */
{id:"rg101", lesson:"l_reg_u1l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"You are at a government office and the clerk asks how you are. Which reply fits?",
 options:["Ce faci?","Bine, mulțumesc. Dumneavoastră?","Bine, bă."], correct:1,
 explain:"<b>Bine, mulțumesc. Dumneavoastră?</b> is the only one that fits a formal setting. <b>Ce faci?</b> is the informal 'how are you' you would use with a friend — asking it back to an official is over-familiar. <b>Bă</b> is blunt address between close friends and would be startling here.",
 audio:"Bine, mulțumesc. Dumneavoastră?", vocab:["r_ce_faci"]},
{id:"rg102", lesson:"l_reg_u1l1", skill:"vocabulary", type:"match", diff:2, topic:null,
 prompt:"Match each colloquial expression with what it actually does in conversation.",
 pairs:[["păi","opens a hesitant answer"],["mă rog","waves away what was just said"],["hai","urges, or ends a call"],["deci","marks a conclusion, or fills a pause"],["frate","addresses a friend, or vents feeling"]],
 explain:"None of these translate cleanly. <b>Păi</b> buys a moment before answering. <b>Mă rog</b> concedes and moves on — closest to 'anyway'. <b>Hai</b> is astonishingly versatile: <i>hai să mergem</i> (let's go), <i>hai, pa</i> (right, bye). <b>Deci</b> is textbook 'therefore' but in speech is mostly a filler. <b>Frate</b> is literally 'brother' and functions like 'mate'.",
 vocab:["r_pai","r_ma_rog","r_hai","r_deci","r_frate"]},
{id:"rg103", lesson:"l_reg_u1l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"A Romanian friend says: <i>Băi, e nasol rău afară.</i> What are they telling you?",
 options:["The weather is terrible.","There is a loud noise outside.","Someone is being rude outside."], correct:0,
 explain:"<b>Nasol</b> = bad, lousy — and <b>rău</b> after an adjective works as an intensifier, so <i>nasol rău</i> is 'really lousy'. <b>Băi</b> is just how they got your attention. Note that <i>rău</i> as an intensifier is purely colloquial; in writing you would use <i>foarte</i>.",
 vocab:["r_nasol","r_bags"]},
{id:"rg104", lesson:"l_reg_u1l1", skill:"writing", type:"produce", diff:3, topic:null,
 prompt:"A friend texts asking how your week went. Reply in 3–4 sentences using at least two informal markers from this lesson.",
 minWords:15, mustUse:["mă rog"],
 model:"Păi, a fost o săptămână destul de nasol. Am avut mult de lucru și n-am dormit bine. Mă rog, acum e mai bine. Hai să ne vedem în weekend!",
 explain:"The model opens with <b>păi</b> (hesitation), uses <b>nasol</b> for 'rough', concedes with <b>mă rog</b>, and closes with <b>hai să</b> — a very natural informal shape. Compare yours for register consistency: mixing <i>dumneavoastră</i> into a message like this would sound sarcastic.",
 vocab:["r_pai","r_nasol","r_ma_rog","r_hai"]},

{id:"rg111", lesson:"l_reg_u2l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"Someone tells you surprising news. Which reaction is the most natural?",
 options:["Nu se poate!","Este incredibil pentru mine.","Am o mare surpriză."], correct:0,
 explain:"<b>Nu se poate!</b> is the standard reflex for 'no way!'. The second is grammatically fine but reads as translated English — no one says it. The third means 'I have a big surprise', which is you announcing something, not reacting.",
 audio:"Nu se poate!", vocab:["r_nuse_poate"]},
{id:"rg112", lesson:"l_reg_u2l1", skill:"vocabulary", type:"fill", diff:2, topic:null,
 prompt:"Complete the exchange: <i>— Unde mi-am pus cheile? — ___ n-am.</i>",
 answer:"Habar", accept:["Habar","habar"],
 explain:"<b>Habar n-am</b> = 'I have no idea'. The word <i>habar</i> comes from Turkish and appears almost exclusively in this one phrase — you will rarely meet it alone.",
 audio:"Habar n-am.", vocab:["r_habar"]},
{id:"rg113", lesson:"l_reg_u2l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"A colleague is about to sit an exam. What do Romanians say?",
 options:["Noroc bun!","Baftă!","Felicitări!"], correct:1,
 explain:"<b>Baftă!</b> is the everyday 'good luck' and is what you will actually hear. <i>Noroc</i> exists but is mainly a toast ('cheers') or a casual hello. <b>Felicitări</b> is 'congratulations' — for afterwards, and only if it went well.",
 audio:"Baftă!", vocab:["r_bafta"]},
{id:"rg114", lesson:"l_reg_u2l1", skill:"vocabulary", type:"error_fix", diff:3, topic:null,
 prompt:"This reply sounds oddly formal for a chat between friends. Rewrite it informally.",
 given:"Nu am nicio informație despre această chestiune.", answer:"Habar n-am.",
 accept:["Habar n-am.","Habar n-am","Habar nu am."],
 explain:"Register mismatch rather than a grammar error — the original is correct Romanian, but between friends it lands as stiff or sarcastic. <b>Habar n-am</b> carries the same meaning at the right level. Knowing that a sentence is <i>too correct</i> for its situation is a real B1 skill.",
 vocab:["r_habar"]},

{id:"rg121", lesson:"l_reg_u3l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"Which of these would a Romanian in their twenties be most likely to say today?",
 options:["Ce beton a fost!","Ce mișto a fost!","Ce bengos a fost!"], correct:1,
 explain:"All three mean roughly 'that was great', but they are not equally current. <b>Mișto</b> is alive and everyday. <b>Beton</b> and <b>bengos</b> are recognisably dated — using them marks you as having learned from older material, which is precisely the trap of studying slang from books.",
 vocab:["r_misto","r_beton","r_bengos"]},
{id:"rg122", lesson:"l_reg_u3l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"<i>Mi-a dat țeapă.</i> What happened?",
 options:["He gave me a sharp object.","He ripped me off, or stood me up.","He gave me a warning."], correct:1,
 explain:"<b>A da țeapă</b> literally involves a spike, but idiomatically it means to cheat someone or leave them hanging. Very common in complaints about tradesmen, sellers and unreliable friends. The noun <i>țeapă</i> on its own is also used: <i>a fost o țeapă</i> = it was a scam.",
 vocab:["r_a_da_teapa"]},
{id:"rg123", lesson:"l_reg_u3l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"Someone describes a person as <i>șmecher</i>. Is that a compliment?",
 options:["Always — it means clever and admirable.","It depends entirely on tone and context.","Never — it is a straightforward insult."], correct:1,
 explain:"<b>Șmecher</b> sits on a knife edge. Said warmly it means streetwise and quick; said flatly it means a chancer who cuts corners. <i>Se crede șmecher</i> ('he thinks he's a big shot') is clearly negative. As a learner, understand it and avoid applying it to people — the tone is very hard to land.",
 vocab:["r_smecher"]},
{id:"rg124", lesson:"l_reg_u3l1", skill:"writing", type:"produce", diff:3, topic:null,
 prompt:"Describe something you enjoyed recently, in 3–4 sentences, as you would to a friend your own age. Use at least one slang item from this lesson.",
 minWords:15, mustUse:["mișto"],
 model:"Am fost la un concert sâmbătă și a fost super mișto. Trupa a cântat vreo două ore. Tipii din fața noastră erau de treabă și am vorbit cu ei după. Clar merg din nou.",
 explain:"Notice the mix: <b>mișto</b> and <b>tipii</b> and <b>de treabă</b> are colloquial, but the grammar underneath stays completely standard. That is how real informal Romanian works — slang sits on top of correct structure rather than replacing it.",
 vocab:["r_misto","r_tip","r_de_treaba","r_clar"]},

{id:"rg131", lesson:"l_reg_u4l1", skill:"reading", type:"mcq", diff:2, topic:null,
 prompt:"A text message reads: <i>sal, ajung in 10 min, np daca intarzii putin</i>. What is notable about the Romanian?",
 options:["It contains several spelling errors.","The diacritics are omitted, which is normal in texting.","It is written in a regional dialect."], correct:1,
 explain:"Nothing here is misspelled by texting conventions — <i>ajung</i>, <i>întârzii</i> and <i>puțin</i> are simply typed without diacritics, which is extremely common on phones. <b>Sal</b> is a clipped <i>salut</i> and <b>np</b> is 'no problem'. Read it aloud with the diacritics restored and it is ordinary Romanian.",
 vocab:["r_sal","r_np"]},
{id:"rg132", lesson:"l_reg_u4l1", skill:"writing", type:"trans_en_ro", diff:3, topic:null,
 prompt:"Rewrite this text message in full standard Romanian, with diacritics: <i>sal, ce faci? ajung mai tarziu, imi pare rau</i>",
 answer:"Salut, ce faci? Ajung mai târziu, îmi pare rău.",
 accept:["Salut, ce faci? Ajung mai târziu, îmi pare rău.","Salut, ce faci? Ajung mai târziu. Îmi pare rău."],
 explain:"Restoring diacritics is a genuine skill: <i>tarziu → <b>târziu</b></i>, <i>imi → <b>îmi</b></i>, <i>rau → <b>rău</b></i>. Romanians read undiacriticked text effortlessly, but you should still write with diacritics in anything formal — an email to an office without them looks careless.",
 vocab:["r_sal"]},

{id:"rg141", lesson:"l_reg_u5l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"You hear <i>La naiba!</i> and <i>Du-te dracului!</i> in the same conversation. How do they compare?",
 options:["They are equally strong.","La naiba is mild; du-te dracului is genuinely offensive.","La naiba is stronger."], correct:1,
 explain:"<b>La naiba</b> is about as strong as 'damn' — you could say it in front of most people without much consequence. <b>Du-te dracului</b> ('go to hell') is aimed AT someone and is a real insult that ends conversations. Romanian profanity is steeply graded, and the gap between these two is much wider than a dictionary suggests.",
 vocab:["r_la_naiba","r_dute_dracu"]},
{id:"rg142", lesson:"l_reg_u5l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"A Romanian friend swears cheerfully while telling you a story. What should you conclude?",
 options:["Swearing is neutral in Romanian, so you can join in freely.","They are comfortable with you — but the same words from a learner land differently.","They are angry with you."], correct:1,
 explain:"Swearing among friends is common and often affectionate, but a non-native using the same words rarely reads the same way: it can sound aggressive, or like a joke that has not landed. Understanding profanity protects you; deploying it takes a social fluency that comes long after B1. Recognise it, and let it stay in other people's mouths.",
 vocab:["r_injuratura"]},
{id:"rg143", lesson:"l_reg_u5l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"Which of these is NOT itself a swear word?",
 options:["rahat","înjurătură","la dracu'"], correct:1,
 explain:"<b>Înjurătură</b> is the ordinary noun meaning 'a swear word' — perfectly usable in any company, including with a teacher or an official: <i>a spus o înjurătură</i>. The verb <b>a înjura</b> ('to swear at') is likewise neutral. <b>Rahat</b> and <b>la dracu'</b> are the real thing.",
 vocab:["r_injuratura","r_a_injura"]},

/* ---------- A2.1 U6: Studii și muncă ---------- */
{id:"a271", lesson:"l_a2u6l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"An interviewer asks <i>Ce salariu aveți în vedere?</i> What are they asking?",
 options:["What salary do you currently earn?","What salary do you have in mind?","When were you last paid?"], correct:1,
 explain:"<b>A avea în vedere</b> = to have in mind, to be considering. It is a set phrase — <i>vedere</i> ('sight') does not carry its literal meaning here. The question is about your expectations, not your current pay, so answering with your old salary gives away more than you meant to.",
 audio:"Ce salariu aveți în vedere?", vocab:["a_salariu"]},
{id:"a272", lesson:"l_a2u6l1", skill:"grammar", type:"fill", diff:2, topic:"g_perfect_compus",
 prompt:"Complete with the perfect compus: <i>Am ___ facultatea în două mii nouăsprezece.</i> (a absolvi)",
 answer:"absolvit", accept:["absolvit"],
 explain:"<b>Absolvit</b> — an -i verb takes the participle in <b>-it</b>. Note that the auxiliary is <b>a avea</b> (<i>am</i>), as it is for almost every Romanian verb: <i>am absolvit</i>, never *<i>sunt absolvit</i>.",
 audio:"Am absolvit facultatea în două mii nouăsprezece.", vocab:["a_atermina2","a_facultate"]},
{id:"a273", lesson:"l_a2u6l1", skill:"vocabulary", type:"match", diff:2, topic:null,
 prompt:"Match each word with its meaning in a work context.",
 pairs:[["loc de muncă","a job, a workplace"],["post","a specific position"],["concediu","leave from work"],["program","working hours"],["experiență","experience"]],
 explain:"<b>Loc de muncă</b> is the job in general; <b>post</b> is the named role you apply for. <b>Concediu</b> is leave from work — not to be confused with <i>vacanță</i>, which is a holiday you take. <b>Program</b> is a false friend: it means your working hours, not a computer program (that is <i>program</i> too, but context decides).",
 vocab:["a_locdemunca","a_post","a_concediu","a_program","a_experienta"]},
{id:"a274", lesson:"l_a2u6l1", skill:"reading", type:"mcq", diff:3, topic:null, readingId:"r_a2u6",
 prompt:"You have one year of experience and finished university. Can you apply?",
 options:["Yes — the advert asks for completed higher education, which you have.","No — the advert asks for at least two years in a similar role.","Yes, but only if you know graphics software."], correct:1,
 explain:"The advert says <i>minimum doi ani de experiență</i>. Meeting one requirement does not meet them all, and the graphics software is explicitly <i>un avantaj</i> — a bonus, not a condition. The first option is true as a statement but does not answer the question.",
 vocab:["a_experienta"]},
{id:"a275", lesson:"l_a2u6l2", skill:"reading", type:"mcq", diff:2, topic:null, readingId:"r_a2u6",
 prompt:"What happens if you are not selected?",
 options:["You will be told by 15 March.","You will not hear back at all.","You will be invited to a second interview."], correct:1,
 explain:"<i>Vom contacta numai candidații selectați</i> — only the selected candidates will be contacted. The fifteenth of March is the deadline for sending your CV, not the date of a reply, which is exactly the kind of detail an advert lets you misread.",
 vocab:[]},
{id:"a276", lesson:"l_a2u6l2", skill:"writing", type:"produce", diff:3, topic:null,
 prompt:"Write a short reply to the advert (4–6 sentences): who you are, what you have studied, your experience, and why you are interested.",
 minWords:35, mustUse:["experiență"],
 model:"Bună ziua! Mă numesc Andrei Ionescu și aș vrea să aplic pentru postul de asistent marketing. Am absolvit facultatea de comunicare în două mii douăzeci și am trei ani de experiență într-o agenție mică. Vorbesc engleză la nivel avansat și lucrez zilnic cu programe de grafică. Mă interesează postul pentru că vreau o echipă mai mare. Atașez CV-ul. Cu stimă, Andrei Ionescu.",
 explain:"Note the shape of a Romanian formal message: <b>Bună ziua</b> to open, <b>Cu stimă</b> to close, and <i>dumneavoastră</i> forms throughout if you address the reader directly. <b>Mă interesează</b> ('it interests me') is more natural here than <i>sunt interesat</i>, which is a direct translation from English.",
 vocab:["a_aaplica","a_experienta","a_post"]},

/* ---------- A2.1 U7: Cum sunt oamenii ---------- */
{id:"a281", lesson:"l_a2u7l1", skill:"grammar", type:"transform", diff:2, topic:"g_adj_agreement",
 prompt:"Make the adjective agree: <i>Ioana este un om foarte (deschis).</i>",
 given:"Ioana este un om foarte (deschis).", answer:"Ioana este un om foarte deschis.",
 accept:["Ioana este un om foarte deschis.","un om foarte deschis"],
 explain:"A trap worth meeting early: the adjective agrees with <b>om</b>, which is masculine, not with Ioana. So it stays <b>deschis</b> even though the person is female. Had the sentence been <i>Ioana este foarte deschisă</i>, with no noun in between, the feminine form would be correct.",
 vocab:["a_deschis"]},
{id:"a282", lesson:"l_a2u7l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"Which describes someone who works hard?",
 options:["leneș","harnic","timid"], correct:1,
 explain:"<b>Harnic</b> = hard-working, and it is a genuine compliment in Romanian — often the first thing said in praise of someone. <b>Leneș</b> is its opposite, lazy. <b>Timid</b> is shy, which says nothing about effort.",
 audio:"harnic", vocab:["a_harnic","a_lenes","a_timid"]},
{id:"a283", lesson:"l_a2u7l1", skill:"grammar", type:"fill", diff:3, topic:null,
 prompt:"Complete: <i>Mi ___ pare că are dreptate.</i> (it seems to me that he's right)",
 answer:"se", accept:["se"],
 explain:"<b>Mi se pare</b> is fixed: a dative pronoun (<i>mi</i>) plus the reflexive <b>se</b>. Literally 'it seems itself to me'. Change the person by changing only the first pronoun — <i>ți se pare, i se pare, ni se pare</i> — while <b>se pare</b> stays put.",
 audio:"Mi se pare că are dreptate.", vocab:["a_aparea2"]},
{id:"a284", lesson:"l_a2u7l1", skill:"writing", type:"produce", diff:3, topic:null,
 prompt:"Describe someone you know well in 4–5 sentences: what they are like, and one example of behaviour that shows it.",
 minWords:30, mustUse:["este"],
 model:"Prietena mea Ana este o persoană foarte răbdătoare. Lucrează cu copii mici și nu se enervează niciodată. Este și generoasă — mă ajută de fiecare dată când am o problemă. Uneori mi se pare puțin prea serioasă, dar așa e firea ei.",
 explain:"Two things to check in your own text. First, adjective agreement follows the noun you actually used (<i>o persoană răbdătoare</i>, feminine). Second, giving an example after the adjective is what turns a list into a description — <i>nu se enervează niciodată</i> does more work than a third adjective would.",
 vocab:["a_rabdator","a_generos","a_serios","a_fire"]},

/* ---------- A2.1 U8: Bucătăria românească ---------- */
{id:"a291", lesson:"l_a2u8l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"You are told a dish is <i>de post</i>. What does that tell you?",
 options:["It is served after the main course.","It contains no meat or dairy.","It is a postal delivery."], correct:1,
 explain:"<b>De post</b> refers to religious fasting periods, when Orthodox Romanians avoid meat, dairy and eggs. Restaurants label dishes this way during Lent and Advent, so it doubles as the practical way to find vegan food — asking <i>aveți ceva de post?</i> is often more effective than asking for <i>vegan</i>.",
 vocab:["a_deposti"]},
{id:"a292", lesson:"l_a2u8l1", skill:"reading", type:"mcq", diff:3, topic:null, readingId:"r_a2u8",
 prompt:"Why did the grandmother start on Saturday?",
 options:["Because sarmale are difficult to make.","Because they need hours of slow cooking and taste better later.","Because the market is open on Saturdays."], correct:1,
 explain:"The text says explicitly <i>nu sunt grele, dar cer timp</i> — not difficult, but time-consuming — and <i>cu cât stau mai mult, cu atât sunt mai bune</i>. The first option contradicts the opening sentence while echoing the word <i>grele</i> from it.",
 vocab:["a_sarmale"]},
{id:"a293", lesson:"l_a2u8l1", skill:"grammar", type:"mcq", diff:3, topic:null,
 prompt:"The recipe says <i>Se servesc cu mămăligă</i>. Why <b>se servesc</b> and not <i>servesc</i>?",
 options:["It is the reflexive: the dishes serve themselves.","It is the impersonal passive: 'they are served'.","It is a spelling variant."], correct:1,
 explain:"Romanian uses <b>se</b> + verb where English uses the passive or an impersonal 'you': <i>se servesc</i> = 'they are served', <i>se face</i> = 'it is made', <i>se spune</i> = 'people say'. Recipes and instructions are written almost entirely in this form, so recognising it unlocks a whole genre of text.",
 audio:"Se servesc cu mămăligă și smântână.", vocab:[]},
{id:"a294", lesson:"l_a2u8l2", skill:"writing", type:"produce", diff:3, topic:null,
 prompt:"Describe a dish from your country in 4–6 sentences: what goes in it, how it is made, and when people eat it.",
 minWords:35, mustUse:["se"],
 model:"La noi se face o supă de pui cu legume, mai ales iarna. Se pun morcovi, ceapă și țelină în apă rece și se fierb împreună cu carnea. Se adaugă sare și piper la sfârșit. Se servește fierbinte, cu pâine. De obicei se mănâncă duminica, în familie.",
 explain:"The model uses the impersonal <b>se</b> throughout, which is how Romanian recipes are actually written — <i>se pun, se fierb, se adaugă, se servește</i>. Check that your verb agrees with the thing being done: <i>se pun morcovi</i> (plural) but <i>se servește supa</i> (singular).",
 vocab:["a_reteta","a_afierbe","a_ingredient"]},

/* ---------- A2.2 ---------- */
{id:"b301", lesson:"l_a2_2u1l1", skill:"grammar", type:"fill", diff:2, topic:"g_comparison",
 prompt:"Complete: <i>Trenul este mai rapid ___ autobuzul.</i>",
 answer:"decât", accept:["decât","decat"],
 explain:"<b>Decât</b> is 'than' in a comparison. English speakers often reach for <i>ca</i>, but <i>ca</i> belongs to the equality frame <b>la fel de … ca</b>: <i>la fel de rapid ca autobuzul</i>. Two different structures, two different words.",
 audio:"Trenul este mai rapid decât autobuzul.", vocab:["b_decat"]},
{id:"b302", lesson:"l_a2_2u1l1", skill:"grammar", type:"mcq", diff:3, topic:"g_comparison",
 prompt:"Which is correct for 'She is the best student in the class'?",
 options:["Ea este mai bună studentă din clasă.","Ea este cea mai bună studentă din clasă.","Ea este cel mai bună studentă din clasă."], correct:1,
 explain:"The superlative needs <b>cel/cea/cei/cele</b> before <i>mai</i>, and it agrees with the noun. <i>Studentă</i> is feminine singular, so it takes <b>cea</b>. Option one gives only the comparative ('a better student'), and option three uses the masculine <i>cel</i> with a feminine noun.",
 vocab:["b_celmai"]},
{id:"b303", lesson:"l_a2_2u1l1", skill:"writing", type:"produce", diff:3, topic:null,
 prompt:"Compare two ways of travelling in 4–5 sentences. Say which you prefer and why.",
 minWords:30, mustUse:["decât"],
 model:"Prefer trenul avionului pentru drumurile scurte. Trenul e mai ieftin decât avionul și nu trebuie să ajungi cu două ore înainte. În schimb, avionul e mult mai rapid pe distanțe mari. Pentru mine, cel mai important e confortul, așa că aleg trenul.",
 explain:"Note <b>a prefera</b> takes a dative for the thing rejected: <i>prefer trenul avionului</i> — 'I prefer the train to the plane'. The English 'to' becomes a case ending, not a preposition. <b>În schimb</b> is the natural connector for the other side of an argument.",
 vocab:["b_prefer","b_decat","b_dezavantaj2","b_celmai"]},

{id:"b311", lesson:"l_a2_2u2l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"At the bank you are told <i>Mergeți la ghișeul trei</i>. Where are you going?",
 options:["To the third floor.","To counter number three.","To the third form."], correct:1,
 explain:"<b>Ghișeu</b> is the service window or counter in a bank, post office or public office — a word you will meet constantly in Romanian bureaucracy. It has no connection to <i>etaj</i> (floor) or <i>formular</i> (form).",
 audio:"Mergeți la ghișeul trei.", vocab:["b_ghiseu"]},
{id:"b312", lesson:"l_a2_2u2l1", skill:"vocabulary", type:"match", diff:2, topic:null,
 prompt:"Match each errand word with what it means.",
 pairs:[["cont","account"],["comision","fee"],["colet","parcel"],["formular","form to fill in"],["a retrage","to withdraw"]],
 explain:"<b>Comision</b> is the bank's fee — not a commission you earn. <b>Colet</b> is a parcel, distinct from <i>scrisoare</i> (letter). Note that <b>a retrage</b> is also reflexive in other senses (<i>a se retrage</i> = to withdraw oneself, to retire).",
 vocab:["b_cont","b_comision","b_colet","b_formular","b_aretrage"]},
{id:"b313", lesson:"l_a2_2u2l1", skill:"writing", type:"trans_en_ro", diff:3, topic:null,
 prompt:"Translate into Romanian: \"I would like to open an account. What documents do I need?\"",
 answer:"Aș vrea să deschid un cont. Ce acte îmi trebuie?",
 accept:["Aș vrea să deschid un cont. Ce acte îmi trebuie?","Aș dori să deschid un cont. Ce acte îmi trebuie?","Aș vrea să deschid un cont. De ce acte am nevoie?"],
 explain:"<b>Aș vrea</b> (conditional) is the polite register for any request at a counter — <i>vreau</i> is blunt. Note <b>îmi trebuie</b>: the thing needed is the subject, so it is <i>îmi trebuie acte</i>, literally 'documents are necessary to me'. <i>Am nevoie de</i> is an equally good alternative.",
 audio:"Aș vrea să deschid un cont.", vocab:["b_cont"]},

{id:"b321", lesson:"l_a2_2u3l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"Which opener is politest when you approach a shop assistant with a problem?",
 options:["Nu vă supărați, am o problemă.","Am o problemă!","Hei, ascultă!"], correct:0,
 explain:"<b>Nu vă supărați</b> means literally 'don't be offended' and is the standard polite opener to a stranger — the Romanian equivalent of 'excuse me'. Starting with the complaint alone sounds abrupt, and the third option is how you would address a friend, not a shop assistant.",
 audio:"Nu vă supărați, am o problemă.", vocab:["b_scuzati"]},
{id:"b322", lesson:"l_a2_2u3l1", skill:"grammar", type:"error_fix", diff:3, topic:null,
 prompt:"This complaint is too blunt for a shop. Rewrite it politely.",
 given:"Vreau banii înapoi acum.", answer:"Aș vrea să primesc banii înapoi, vă rog.",
 accept:["Aș vrea să primesc banii înapoi, vă rog.","Aș dori să primesc banii înapoi, vă rog.","Aș vrea banii înapoi, vă rog."],
 explain:"Nothing here is ungrammatical — it is a register problem. <b>Vreau</b> plus <i>acum</i> reads as a demand. The conditional <b>aș vrea</b> softens it, and <b>vă rog</b> does the rest. Romanian politeness leans on the conditional far more heavily than English does.",
 vocab:["b_arambursa"]},
{id:"b323", lesson:"l_a2_2u3l1", skill:"writing", type:"produce", diff:3, topic:null,
 prompt:"Write a short complaint (4–6 sentences): what you bought, when, what is wrong, and what you want done.",
 minWords:35, mustUse:["garanție"],
 model:"Bună ziua! Am cumpărat un telefon de la magazinul dumneavoastră acum trei săptămâni. De două zile nu se mai încarcă deloc. Am bonul fiscal și produsul este încă în garanție. Aș vrea să îl înlocuiți sau să primesc banii înapoi. Vă mulțumesc.",
 explain:"The shape matters as much as the words: what, when, what is wrong, what you want. Note <b>de două zile</b> — Romanian uses <i>de</i> for a duration continuing to now, where English uses 'for'. Check that you used the conditional for the request rather than a bare <i>vreau</i>.",
 vocab:["b_reclamatie","b_garantie2","b_bon","b_aschimba2"]},

{id:"b331", lesson:"l_a2_2u4l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"Someone hands you a small red-and-white token on 1 March. What is it?",
 options:["A colindă","A mărțișor","A sarma"], correct:1,
 explain:"A <b>mărțișor</b> is given on <b>1 March</b> to mark the start of spring, usually by men to women and by children to their teachers. The red and white thread is the fixed part; what hangs from it varies. <b>Colinde</b> are Christmas carols, and <i>sarma</i> is food.",
 audio:"mărțișor", vocab:["b_martisor"]},
{id:"b332", lesson:"l_a2_2u4l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"When can you say <i>La mulți ani!</i>?",
 options:["Only on someone's birthday.","On a birthday, at New Year, and on a name day.","Only at New Year."], correct:1,
 explain:"<b>La mulți ani</b> literally means 'to many years' and covers birthdays, New Year, name days (<i>onomastica</i>) and other milestones. English needs three different phrases for what Romanian does with one — which also means you can never go wrong by using it.",
 audio:"La mulți ani!", vocab:["b_lamultiani"]},

{id:"b341", lesson:"l_a2_2u5l1", skill:"vocabulary", type:"mcq", diff:2, topic:null,
 prompt:"You try on a jacket and it is too small across the shoulders. What do you say?",
 options:["E puțin cam larg.","E puțin cam strâmt.","E puțin cam lung."], correct:1,
 explain:"<b>Strâmt</b> = tight or too narrow; <b>larg</b> is its opposite, loose. <b>Cam</b> before an adjective softens it to 'a bit' or 'rather', which is how you register a problem without sounding like a complaint.",
 audio:"E puțin cam strâmt.", vocab:["b_stramt","b_larg"]},
{id:"b342", lesson:"l_a2_2u5l1", skill:"grammar", type:"fill", diff:3, topic:null,
 prompt:"Complete the compliment: <i>Îți ___ bine în albastru.</i> (blue suits you)",
 answer:"stă", accept:["stă","sta"],
 explain:"<b>A-i sta bine</b> = to suit someone. The verb is third person and agrees with the clothing, not the wearer, with a dative pronoun for the person: <i>îmi stă, îți stă, îi stă</i>. Same shape as <b>îmi place</b> — another verb where the English subject becomes a Romanian dative.",
 audio:"Îți stă bine în albastru.", vocab:["b_asevedea"]},

{id:"b351", lesson:"l_a2_2u6l1", skill:"grammar", type:"transform", diff:3, topic:"g_imperative",
 prompt:"Turn this into a negative command: <i>Pleacă acum!</i> (Don't leave now!)",
 given:"Pleacă acum!", answer:"Nu pleca acum!", accept:["Nu pleca acum!","Nu pleca acum"],
 explain:"The Romanian negative imperative is not the negated affirmative. It is <b>nu</b> + the infinitive without <i>a</i>: <i>pleacă!</i> becomes <b>nu pleca!</b>, <i>vino!</i> becomes <b>nu veni!</b>. Saying *<i>nu pleacă</i> is one of the most audible learner errors there is.",
 audio:"Nu pleca acum!", vocab:[]},
{id:"b352", lesson:"l_a2_2u6l1", skill:"grammar", type:"mcq", diff:3, topic:null,
 prompt:"Which is the gentlest way to advise a friend to rest?",
 options:["Odihnește-te!","Ar trebui să te odihnești.","Este obligatoriu să te odihnești."], correct:1,
 explain:"<b>Ar trebui să</b> ('you should') is the conditional of <i>a trebui</i> and is the standard way to advise without instructing. The imperative <i>odihnește-te!</i> is a direct order — fine between close friends, blunt otherwise. The third is the language of regulations.",
 audio:"Ar trebui să te odihnești.", vocab:["b_aravea","b_eobligatoriu"]},

{id:"b361", lesson:"l_a2_2u7l1", skill:"grammar", type:"mcq", diff:3, topic:"g_imperfect",
 prompt:"Which sentence is right? Both verbs describe the past.",
 options:["În timp ce am gătit, a sunat telefonul.","În timp ce găteam, a sunat telefonul.","În timp ce găteam, suna telefonul."], correct:1,
 explain:"Two past tenses doing different jobs. The <b>imperfect</b> (<i>găteam</i>) sets the ongoing background; the <b>perfect compus</b> (<i>a sunat</i>) reports the single event that interrupts it. Option one puts a completed action where the background belongs; option three leaves the phone ringing indefinitely with no event at all.",
 audio:"În timp ce găteam, a sunat telefonul.", vocab:["b_intimpce"]},
{id:"b362", lesson:"l_a2_2u7l1", skill:"grammar", type:"fill", diff:3, topic:"g_imperfect",
 prompt:"Complete with the imperfect: <i>Pe atunci ___ la țară.</i> (a locui — we used to live)",
 answer:"locuiam", accept:["locuiam"],
 explain:"<b>Locuiam</b> — the imperfect is the tense of 'used to' and of how things were. <b>Pe atunci</b> ('back then') is a reliable signal that the imperfect is wanted: it frames a period rather than a moment.",
 audio:"Pe atunci locuiam la țară.", vocab:["b_peatunci","b_infiecarezi"]},
{id:"b363", lesson:"l_a2_2u7l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Tell a short story from your childhood (5–7 sentences). Set the scene with the imperfect, then say what happened with the perfect compus.",
 minWords:45, mustUse:["dintr-odată"],
 model:"Când eram mic, locuiam într-un oraș mic lângă munte. În fiecare vară mergeam la bunici și stăteam acolo două luni. Îmi plăcea să mă joc în grădină toată ziua. Într-o zi de august mă jucam singur lângă pădure. Dintr-odată am auzit un zgomot ciudat și am văzut un câine mare. M-am speriat și am fugit acasă. După aceea nu am mai mers singur acolo.",
 explain:"Look at the shift: <i>eram, locuiam, mergeam, stăteam, îmi plăcea, mă jucam</i> — all imperfect, all scene-setting — then <i>am auzit, am văzut, m-am speriat, am fugit</i>, all perfect compus, all events. Getting this division right is what makes a Romanian narrative sound like a story rather than a list.",
 vocab:["b_odata","b_dintrodata","b_peatunci","b_apoi2"]},

/* ---------- B1.1 ---------- */
{id:"p401", lesson:"l_b1u2l1", skill:"grammar", type:"fill", diff:3, topic:"g_subjunctive",
 prompt:"Complete: <i>Vreau ___ îmi schimb cariera.</i>",
 answer:"să", accept:["să","sa"],
 explain:"After verbs of wanting, needing and being able, Romanian uses <b>să</b> + subjunctive where English uses an infinitive. <i>Vreau să schimb</i> = 'I want to change'. The bare infinitive (<i>vreau a schimba</i>) exists but is archaic — nobody says it.",
 audio:"Vreau să îmi schimb cariera.", vocab:["p_cariera"]},
{id:"p402", lesson:"l_b1u2l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"A colleague calls a project <i>o provocare</i>. Is that positive or negative?",
 options:["Negative — it means a problem.","Broadly positive — it means a challenge worth taking on.","Neutral — it just means a task."], correct:1,
 explain:"<b>Provocare</b> means 'challenge' in the same optimistic sense English uses at work — something demanding but worth doing. Note the false friend: it does <i>not</i> mean 'provocation', despite looking like it. The verb <i>a provoca</i> does mean 'to provoke', which makes the noun doubly misleading.",
 vocab:["p_provocare"]},
{id:"p403", lesson:"l_b1u2l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Write 5–7 sentences about your field of work or study: what it involves, what has changed in recent years, and what you think comes next.",
 minWords:45, mustUse:["domeniu"],
 model:"Lucrez în domeniul educației de aproape zece ani. La început predam doar în sală, cu tablă și caiete. În ultimii ani totul s-a mutat parțial online și a trebuit să învăț programe noi. Cred că tehnologia nu va înlocui profesorii, dar va schimba felul în care lucrăm. Îmi doresc să folosesc mai bine instrumentele digitale, fără să pierd contactul direct cu studenții.",
 explain:"Notice how the model moves through three tenses on purpose: imperfect for how things were (<i>predam</i>), perfect compus for what changed (<i>s-a mutat, a trebuit</i>), future for what comes next (<i>va schimba</i>). Handling that shift within one paragraph is a B1 skill, not an A2 one.",
 vocab:["p_domeniu","p_asedezvolta","p_ainlocui2","p_competenta"]},

{id:"p411", lesson:"l_b1u3l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"<i>Sunt supărat pe tine</i> versus <i>Sunt dezamăgit de tine</i>. What is the difference?",
 options:["They mean the same thing.","Supărat = annoyed with; dezamăgit = disappointed by. Different prepositions, different feelings.","Dezamăgit is stronger anger."], correct:1,
 explain:"Two things to hold on to. The feelings differ — <b>supărat</b> is annoyance, <b>dezamăgit</b> is disappointment — and so do the prepositions: <b>supărat PE</b> cineva, <b>dezamăgit DE</b> cineva. Getting the preposition wrong is more noticeable than getting the adjective wrong.",
 audio:"Sunt dezamăgit de tine.", vocab:["p_asuparat","p_dezamagit"]},
{id:"p412", lesson:"l_b1u3l1", skill:"grammar", type:"error_fix", diff:4, topic:"g_conditional",
 prompt:"Fix the regret: <i>Ar trebui să vorbesc cu tine mai devreme.</i> (meaning: I should have spoken to you earlier)",
 given:"Ar trebui să vorbesc cu tine mai devreme.", answer:"Ar fi trebuit să vorbesc cu tine mai devreme.",
 accept:["Ar fi trebuit să vorbesc cu tine mai devreme.","Ar fi trebuit să vorbesc cu tine mai devreme"],
 explain:"The original says 'I should speak to you earlier' — advice about the future. For a regret about the past you need the <b>conditional perfect</b>: <b>ar fi trebuit</b> + să. Compare <i>ar trebui să mergi</i> (you should go) with <i>ar fi trebuit să mergi</i> (you should have gone). This is one of the highest-value structures at B1 because regret comes up constantly.",
 audio:"Ar fi trebuit să vorbesc cu tine mai devreme.", vocab:["p_asimtiface"]},
{id:"p413", lesson:"l_b1u3l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Describe a disagreement you had with someone and how it was resolved (5–7 sentences). Say how each of you felt.",
 minWords:45, mustUse:["pentru că"],
 model:"Anul trecut m-am certat cu un prieten bun pentru că am uitat de ziua lui. El nu mi-a spus nimic atunci, dar am simțit că ceva nu e în regulă. După o săptămână mi-a zis că a fost dezamăgit, nu supărat. Mi-a părut foarte rău și mi-am cerut scuze. Ne-am împăcat repede, dar am învățat ceva: era mai bine dacă îmi spunea de la început.",
 explain:"Check two things in your own version. Prepositions after emotion words (<i>supărat pe</i>, <i>dezamăgit de</i>), and the tense split — imperfect for feelings and states (<i>am simțit, era</i>), perfect compus for the events (<i>m-am certat, mi-a zis, ne-am împăcat</i>).",
 vocab:["p_asecerta","p_aseimpaca","p_incredere","p_relatie"]},

{id:"p421", lesson:"l_b1u4l1", skill:"reading", type:"mcq", diff:4, topic:null, readingId:"r_b1u4",
 prompt:"What does the article say is the good news for a learner?",
 options:["Romanian is spoken the same way everywhere.","There is no single standard accent to be measured against.","Textbooks cover all the regional variants."], correct:1,
 explain:"The text ends <i>nu există unul singur pe care toți îl folosesc</i> — no single accent everyone uses, so nobody is in a position to correct yours. The first option contradicts the whole article; the third inverts the bad news, which was that textbooks <i>don't</i> cover the variants.",
 vocab:["p_regiune","p_influenta"]},
{id:"p422", lesson:"l_b1u4l1", skill:"grammar", type:"fill", diff:4, topic:"g_relative",
 prompt:"Complete with the right relative: <i>Un om ___ vine prima dată se așteaptă la o singură țară.</i>",
 answer:"care", accept:["care"],
 explain:"<b>Care</b> is the workhorse relative pronoun — 'who', 'which', 'that' all at once. Note that when <i>care</i> is a direct object referring to a person it takes <b>pe</b> and a doubling pronoun: <i>omul <b>pe care</b> l-am văzut</i>. As a subject, as here, it stands alone.",
 audio:"Un om care vine prima dată se așteaptă la o singură țară.", vocab:[]},

{id:"p431", lesson:"l_b1u5l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Tell the story of a trip that did not go to plan (6–8 sentences). Set the scene, say what went wrong, and how it ended.",
 minWords:55, mustUse:["dar"],
 model:"Acum doi ani am fost cu doi prieteni în Munții Apuseni. Plecaserăm dimineața devreme și vremea era perfectă. Pe la prânz ne-am rătăcit pentru că nu mai vedeam marcajele. Am mers vreo două ore în direcția greșită și începuse să se întunece. Din fericire am întâlnit un cioban care ne-a arătat drumul spre cabană. Am ajuns seara târziu, obosiți și uzi, dar a meritat fiecare minut. A fost o experiență de neuitat.",
 explain:"The model uses three past tenses. Imperfect for the setting (<i>era, vedeam</i>), perfect compus for events (<i>am fost, ne-am rătăcit, am întâlnit</i>), and the pluperfect for what had happened before the story's own starting point (<i>plecaserăm, începuse</i>). You are not required to use the pluperfect yet — but recognising it is what lets you follow a Romanian telling a story properly.",
 vocab:["p_aserataci","p_experienta2","p_neuitat","p_apeisaj"]},

{id:"p441", lesson:"l_b1u6l1", skill:"reading", type:"mcq", diff:4, topic:null, readingId:"r_b1u6",
 prompt:"You submit a file that is missing one document. According to the guide, what happens?",
 options:["It is registered and you are asked to complete it later.","It is not registered at all.","It is registered but the deadline is extended."], correct:1,
 explain:"<i>Dosarele incomplete nu se înregistrează</i> — incomplete files are not registered. This matters practically: the thirty-day clock starts from a <i>complete</i> submission, so a missing stamp does not pause the process, it means the process never began.",
 vocab:["p_dosar","p_adepune"]},
{id:"p442", lesson:"l_b1u6l1", skill:"vocabulary", type:"match", diff:3, topic:null,
 prompt:"Match each bureaucratic term with its meaning.",
 pairs:[["cerere","a written application"],["dosar","the file of documents"],["ștampilă","official stamp"],["termen","deadline"],["a elibera","to issue a document"]],
 explain:"These five words cover most of what happens at a Romanian counter. Note <b>a elibera</b> — literally 'to free' — is the standard verb for issuing documents, which is why a certificate <i>se eliberează</i> rather than being 'given'. <b>Cerere</b> is the written application; the act of submitting it is <b>a depune</b>.",
 vocab:["p_cerere","p_dosar","p_stampila","p_termen","p_aelibera"]},

{id:"p451", lesson:"l_b1u7l1", skill:"vocabulary", type:"mcq", diff:3, topic:null,
 prompt:"You want to see a specialist in the Romanian public system. What do you usually need first?",
 options:["An appointment at the hospital.","A trimitere from your medic de familie.","Private insurance."], correct:1,
 explain:"In the public system the <b>medic de familie</b> (GP) is the gateway: you generally need a <b>trimitere</b> — a referral — before a specialist consultation is covered. Going straight to a specialist usually means paying privately. Knowing this word saves a wasted trip.",
 vocab:["p_trimitere","p_medicdefamilie"]},
{id:"p452", lesson:"l_b1u7l1", skill:"grammar", type:"transform", diff:4, topic:"g_conditional",
 prompt:"Rewrite as advice using the conditional: <i>Renunți la cafea.</i> (You should give up coffee.)",
 given:"Renunți la cafea.", answer:"Ar trebui să renunți la cafea.",
 accept:["Ar trebui să renunți la cafea.","Ar trebui să renunți la cafea"],
 explain:"<b>Ar trebui să</b> is the standard way to advise. Note that <b>a renunța</b> takes <b>la</b>: <i>renunț la cafea</i>, not *<i>renunț cafeaua</i>. Romanian verbs carry their prepositions the way English ones do, and they rarely match.",
 audio:"Ar trebui să renunți la cafea.", vocab:["p_aserenunta"]},

{id:"p461", lesson:"l_b1u8l1", skill:"grammar", type:"mcq", diff:4, topic:"g_conditional",
 prompt:"Which sentence correctly says 'If we took out a loan, we would pay about the same'?",
 options:["Dacă luăm un credit, am plăti cam la fel.","Dacă am lua un credit, am plăti cam la fel.","Dacă am luat un credit, am plăti cam la fel."], correct:1,
 explain:"A hypothetical needs the conditional in <b>both</b> halves: <i>dacă <b>am lua</b>… <b>am plăti</b></i>. Option one mixes a real present condition with a conditional result; option three puts a completed past in the <i>dacă</i> clause. Romanian is stricter about this pairing than English, which happily says 'if we take a loan, we'd pay'.",
 audio:"Dacă am lua un credit, am plăti cam la fel.", vocab:["p_credit"]},
{id:"p462", lesson:"l_b1u8l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Describe a significant decision you have faced (6–8 sentences): the options, what worried you, what you chose and why.",
 minWords:55, mustUse:["pe de altă parte"],
 model:"Acum trei ani a trebuit să aleg între un post sigur în orașul meu și o ofertă mai bună în alt oraș. Postul de acasă era comod și îmi cunoșteam colegii. Pe de altă parte, oferta nouă însemna un salariu mai mare și un domeniu care mă interesa mult. Mă îngrijora că nu cunoșteam pe nimeni acolo. Până la urmă m-am hotărât să plec, pentru că mi-am spus că pot oricând să mă întorc. A fost decizia corectă, deși primele luni au fost grele.",
 explain:"Two markers to check for. <b>Pe de o parte… pe de altă parte</b> is the standard frame for weighing options, and <b>până la urmă</b> ('in the end') signals the resolution. Also note <b>deși</b> ('although') in the last sentence — conceding a drawback after stating your conclusion is what makes an argument sound considered rather than one-sided.",
 vocab:["p_decizie","p_ahotari2","p_consecinta","p_infond","p_amerita2"]},

/* ---------- B1.2 ---------- */
{id:"q501", lesson:"l_b1_2u1l1", skill:"grammar", type:"mcq", diff:4, topic:"g_conditional",
 prompt:"Which correctly says 'If I had known, I would have come'?",
 options:["Dacă știam, veneam.","Dacă aș fi știut, aș fi venit.","Dacă aș ști, aș veni."], correct:1,
 explain:"An unreal past condition takes the <b>conditional perfect</b> in both halves: <i>aș fi știut … aș fi venit</i>. Option three is the present unreal ('if I knew, I would come'). Option one is worth knowing too — the double imperfect is extremely common in speech and means the same thing, but it is informal, and the conditional perfect is what you want in writing.",
 audio:"Dacă aș fi știut, aș fi venit.", vocab:["q_ipoteza"]},
{id:"q502", lesson:"l_b1_2u1l1", skill:"grammar", type:"fill", diff:4, topic:null,
 prompt:"Complete: <i>Merg la munte, ___ dacă plouă.</i> (even if it rains)",
 answer:"chiar", accept:["chiar"],
 explain:"<b>Chiar dacă</b> = 'even if' — it concedes the condition and goes ahead anyway. Distinguish it from <b>în caz că</b> ('in case'), which prepares for a possibility, and <b>cu condiția să</b> ('provided that'), which makes the outcome depend on it.",
 audio:"Merg la munte, chiar dacă plouă.", vocab:["q_chiardaca","q_incaz","q_cuconditia"]},

{id:"q511", lesson:"l_b1_2u2l1", skill:"reading", type:"mcq", diff:4, topic:null, readingId:"r_b1_2u2",
 prompt:"According to the environment item, why has pollution fallen?",
 options:["Because new measures were introduced.","Mainly because of the weather.","Because the big cities have fewer residents."], correct:1,
 explain:"The text says <i>scăderea se datorează mai ales vremii, nu unor măsuri noi</i>, and the researcher explicitly refuses to call it a real improvement. Option one is what a careless reader assumes from the headline fact that pollution fell — and the article exists precisely to correct that assumption.",
 vocab:["q_poluare","q_sursa"]},
{id:"q512", lesson:"l_b1_2u2l1", skill:"grammar", type:"transform", diff:4, topic:"g_reported",
 prompt:"Report this statement: <i>Primarul: „Lucrările continuă.”</i>",
 given:"Primarul: „Lucrările continuă.”", answer:"Primarul a declarat că lucrările continuă.",
 accept:["Primarul a declarat că lucrările continuă.","Primarul a spus că lucrările continuă.","Primarul a declarat că lucrările continuau."],
 explain:"Reported statements take <b>că</b>. Journalistic Romanian prefers <b>a declara</b> over <i>a spune</i>. Note that the tense shift is optional in Romanian — <i>că lucrările continuă</i> is entirely normal even though the reporting verb is past, where English would push it to 'were continuing'.",
 audio:"Primarul a declarat că lucrările continuă.", vocab:["q_aafirma","q_potrivit"]},
{id:"q513", lesson:"l_b1_2u2l1", skill:"grammar", type:"error_fix", diff:4, topic:"g_reported",
 prompt:"Fix the reported question: <i>M-a întrebat că am timp.</i>",
 given:"M-a întrebat că am timp.", answer:"M-a întrebat dacă am timp.",
 accept:["M-a întrebat dacă am timp.","M-a întrebat dacă am timp"],
 explain:"A reported yes/no question takes <b>dacă</b>, never <i>că</i>. <i>Că</i> reports a statement, <i>dacă</i> reports a question. English hides this because it uses 'if' for both 'if it rains' and 'asked if I had time' — Romanian keeps them apart.",
 audio:"M-a întrebat dacă am timp.", vocab:[]},

{id:"q521", lesson:"l_b1_2u3l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Write 6–8 sentences about an environmental or social problem in your area: what it is, why it happens, and what could be done.",
 minWords:55, mustUse:["ar trebui"],
 model:"În orașul meu, cea mai mare problemă este traficul. Din ce în ce mai mulți locuitori merg cu mașina, pentru că transportul public nu e destul de bun. Prin urmare, aerul e mai poluat, mai ales iarna. Pe de altă parte, oamenii nu sunt singurii vinovați: nu prea au alternative. Cred că ar trebui investit mai mult în tramvaie și în piste de biciclete. Dacă transportul ar fi mai rapid, mulți ar renunța la mașină. Până la urmă, e o problemă a întregii societăți.",
 explain:"This is argumentative writing, and the connectors do the structural work: <b>pentru că</b> (cause), <b>prin urmare</b> (consequence), <b>pe de altă parte</b> (counterweight), <b>până la urmă</b> (conclusion). Note also the conditional pair in <i>dacă ar fi… ar renunța</i>. A B1 opinion paragraph is judged as much on its joins as on its vocabulary.",
 vocab:["q_mediu","q_poluare","q_asocietate","q_locuitor","q_aimbunatati"]},

{id:"q531", lesson:"l_b1_2u4l1", skill:"grammar", type:"mcq", diff:4, topic:"g_connectors",
 prompt:"Which connector concedes a point you then argue against?",
 options:["prin urmare","deși","întrucât"], correct:1,
 explain:"<b>Deși</b> ('although') concedes: <i>Deși e scump, merită</i>. <b>Prin urmare</b> ('therefore') draws a consequence, and <b>întrucât</b> ('since') gives a cause. Conceding before you argue is what makes a case sound considered rather than one-sided — it is the single most useful move at B1.",
 vocab:["q_desi","q_prinurmare","q_intrucat"]},
{id:"q532", lesson:"l_b1_2u4l1", skill:"vocabulary", type:"match", diff:4, topic:null,
 prompt:"Match each connector with the job it does in an argument.",
 pairs:[["deși","concedes a point"],["prin urmare","draws a consequence"],["întrucât","gives a cause"],["dimpotrivă","contradicts what was just said"],["până la urmă","announces the conclusion"]],
 explain:"These five cover most of what a B1 argument needs. <b>Dimpotrivă</b> is the sharpest — it rejects the previous statement outright: <i>Nu e greu; dimpotrivă, e foarte simplu</i>. <b>Întrucât</b> and <b>prin urmare</b> are noticeably formal; in speech you would more often hear <i>pentru că</i> and <i>deci</i>.",
 vocab:["q_desi","q_prinurmare","q_intrucat","q_dimpotriva","q_panalaurma"]},

{id:"q541", lesson:"l_b1_2u5l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Describe a goal you are working towards (6–8 sentences): what it is, why it matters, what stands in the way, and your plan.",
 minWords:55, mustUse:["pe termen lung"],
 model:"Scopul meu principal este să vorbesc română fluent în doi ani. Contează pentru mine pentru că familia soției mele nu vorbește engleză. Cea mai mare problemă e că nu am timp să studiez zilnic. Am încercat să învăț seara, dar eram prea obosit. Prin urmare, am schimbat programul: acum citesc douăzeci de minute dimineața. Pe termen lung, cred că e mai important să fac puțin în fiecare zi decât mult o dată pe săptămână. Dacă țin ritmul, ar trebui să ajung la nivelul dorit.",
 explain:"Notice the shape: goal, reason, obstacle, what you tried, what you changed, principle, projection. That progression is what turns a list of sentences into an argument. Grammatically, check the <b>să</b>-clauses after <i>scopul meu este</i> and <i>e mai important</i> — both require the subjunctive, not an infinitive.",
 vocab:["q_scop","q_pelungtermen","q_solutie","q_atingescop"]},

{id:"q551", lesson:"l_b1_2u6l1", skill:"grammar", type:"mcq", diff:4, topic:"g_pluperfect",
 prompt:"Which sentence correctly says 'When I arrived, they had already left'?",
 options:["Când am ajuns, ei au plecat deja.","Când am ajuns, ei plecaseră deja.","Când ajungeam, ei plecau deja."], correct:1,
 explain:"Two past events, one earlier than the other: the earlier one takes the <b>pluperfect</b>, <i>plecaseră</i>. Option one puts both in the perfect compus, which reads as though they left at the moment you arrived. Option three uses two imperfects and describes a repeated situation, not a single event.",
 audio:"Când am ajuns, ei plecaseră deja.", vocab:["q_pana"]},
{id:"q552", lesson:"l_b1_2u6l1", skill:"grammar", type:"fill", diff:4, topic:"g_pluperfect",
 prompt:"Complete with the pluperfect of <i>a pregăti</i>: <i>Mama ___ mâncare pentru drum.</i> (had prepared)",
 answer:"pregătise", accept:["pregătise"],
 explain:"<b>Pregătise</b> — the pluperfect is a single word with no auxiliary, built from the participle stem plus <b>-se</b> endings. That absence of an auxiliary is what makes it hard to spot at first: English 'had prepared' has two words, Romanian has one.",
 audio:"Mama pregătise mâncare pentru drum.", vocab:[]},
{id:"q553", lesson:"l_b1_2u6l1", skill:"reading", type:"mcq", diff:4, topic:null, readingId:"r_b1_2u6",
 prompt:"Why had the father said nothing all morning?",
 options:["He was angry about the departure.","He did not know what to say.","He had already said goodbye the night before."], correct:1,
 explain:"The narrator says <i>crezusem că e supărat</i> — 'I <b>had thought</b> he was upset' — and then corrects it: <i>nu știa ce să spună</i>. The first option is the narrator's own mistaken reading, which the text explicitly overturns. Following that correction depends on noticing the pluperfect.",
 vocab:["q_aseintampla2","q_amintire"]},

{id:"q561", lesson:"l_b1_2u7l1", skill:"vocabulary", type:"match", diff:4, topic:null,
 prompt:"Match each expression with its meaning.",
 pairs:[["a face față","to cope"],["a o lua de la capăt","to start over"],["a da bătăi de cap","to cause trouble"],["nu are rost","there's no point"],["îmi stă pe limbă","it's on the tip of my tongue"]],
 explain:"None of these can be worked out from their parts — <i>bătăi de cap</i> is literally 'head-beatings'. They are worth learning as whole units. <b>Nu are rost</b> in particular is one of the most frequent things you will hear when someone declines to continue an argument.",
 vocab:["q_aface","q_alua","q_capdelucru","q_lafeldebine","q_afidegura"]},
{id:"q562", lesson:"l_b1_2u7l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"Write a short informal message to a Romanian friend (5–7 sentences) about a week that did not go well. Use at least two expressions from this unit.",
 minWords:45, mustUse:["rost"],
 model:"Salut! Ce mai faci? La mine săptămâna asta a fost cam grea. Am avut mult de lucru și pur și simplu nu am mai făcut față. Pe deasupra, mi s-a stricat mașina și îmi dă bătăi de cap de trei zile. M-am gândit să o repar singur, dar nu are rost — o duc mâine la service. Sper că la tine e mai bine. Ne auzim!",
 explain:"Check the register is consistent. <b>Salut</b>, <b>ne auzim</b> and <b>pur și simplu</b> all sit at the same informal level as the idioms; slipping into <i>dumneavoastră</i> or a formal closing would clash. Idioms sit on top of ordinary correct grammar — they do not replace it.",
 vocab:["q_aface","q_capdelucru","q_lafeldebine","q_asemerge"]},

/* ---------- I.L.R. B1 EXAM PREPARATION ----------
   Question formats mirror the ILR's published sample papers: adevărat/fals
   statements on a demanding text, and sentence transformation with the opening
   words fixed. The transformation section is the one that catches candidates
   out — it is not a translation task and not a grammar drill in the usual
   sense, and no general B1 course trains it. */
{id:"i601", lesson:"l_ilr_u1l1", skill:"reading", type:"mcq", diff:3, topic:null,
 prompt:"How many papers does the ILR B1 exam have, and what are they?",
 options:["Two: reading and writing.","Three: reading with grammar, written production, and oral.","Four: reading, writing, listening and speaking, each separate."], correct:1,
 explain:"The published papers show three: <b>I. Comprehensiune de lectură și competență gramaticală</b>, <b>II. Elaborarea unui text pe o temă dată</b>, and <b>III. Înțelegerea și exprimarea orală</b>. Note that grammar is not a separate paper — it sits inside the reading paper — and that listening and speaking are assessed together in the third.",
 vocab:["i_proba","i_comprehensiune","i_elaborare"]},
{id:"i602", lesson:"l_ilr_u1l1", skill:"vocabulary", type:"match", diff:3, topic:null,
 prompt:"Match each exam term with its meaning.",
 pairs:[["probă","a paper / test component"],["atestat","the certificate itself"],["sesiune de atestare","an exam sitting"],["afirmație","a statement to judge true or false"],["a păstra sensul","to keep the meaning"]],
 explain:"These are the words used on the paper and in the instructions, not general vocabulary. <b>A păstra sensul</b> in particular appears verbatim in the transformation task: <i>Continuați următoarele fraze, păstrând sensul și făcând schimbările necesare</i>.",
 vocab:["i_proba","i_atestat","i_sesiune","i_afirmatie","i_apastra"]},

{id:"i611", lesson:"l_ilr_u2l1", skill:"reading", type:"mcq", diff:4, topic:null, readingId:"r_ilr_lectura", qLang:"ro",
 prompt:"<b>Adevărat sau fals?</b> Autorul crede că memoria oamenilor s-a înrăutățit din cauza telefoanelor.",
 options:["Adevărat","Fals"], correct:1,
 explain:"<b>Fals.</b> That is the view the author sets up in order to reject it: <i>Concluzia pare evidentă… Mi se pare că lucrurile stau altfel</i>. This is the commonest trap in the format — a statement that matches something present in the text, but which the text attributes to someone else or goes on to contradict.",
 vocab:["i_adevarat"]},
{id:"i612", lesson:"l_ilr_u2l1", skill:"reading", type:"mcq", diff:4, topic:null, readingId:"r_ilr_lectura", qLang:"ro",
 prompt:"<b>Adevărat sau fals?</b> După autor, uitarea face parte din lectură.",
 options:["Adevărat","Fals"], correct:0,
 explain:"<b>Adevărat</b> — <i>uitarea nu este un defect al lecturii, ci o parte din ea</i>. Note the <b>nu … ci</b> construction ('not … but rather'), which is the load-bearing structure of the whole paragraph. Missing <i>ci</i> reverses the sentence.",
 vocab:[]},
{id:"i613", lesson:"l_ilr_u2l1", skill:"reading", type:"mcq", diff:4, topic:null, readingId:"r_ilr_lectura", qLang:"ro",
 prompt:"<b>Adevărat sau fals?</b> Autorul spune că nu există lectură care cere memorare.",
 options:["Adevărat","Fals"], correct:1,
 explain:"<b>Fals.</b> The text explicitly concedes the opposite: <i>Desigur, există și o lectură care cere memorare: un manual, un contract…</i>. Watch for <b>desigur</b>, <b>bineînțeles</b> and <b>e adevărat că</b> — in an argumentative text they almost always introduce a concession, and a statement built only on the main argument will be marked false because of it.",
 vocab:[]},
{id:"i614", lesson:"l_ilr_u2l1", skill:"reading", type:"mcq", diff:4, topic:null, readingId:"r_ilr_lectura", qLang:"ro",
 prompt:"<b>Adevărat sau fals?</b> Autorul consideră că un cititor de cincizeci de romane poate rezuma corect toate cărțile.",
 options:["Adevărat","Fals"], correct:1,
 explain:"<b>Fals</b> — the text says the opposite in the same sentence: <i>chiar dacă niciunul dintre ei nu poate rezuma corect cele cincizeci de cărți</i>. The statement takes the first half of a <b>chiar dacă</b> clause and drops the concession that follows it.",
 vocab:[]},

{id:"i621", lesson:"l_ilr_u3l1", skill:"grammar", type:"transform", diff:4, topic:null,
 prompt:"Continue the sentence, keeping the meaning: <i>Mașina va fi adusă mâine.</i> → <i>Se…</i>",
 given:"Mașina va fi adusă mâine. → Se…", answer:"Se va aduce mașina mâine.",
 accept:["Se va aduce mașina mâine.","Se va aduce mâine mașina.","Se va aduce mașina mâine"],
 explain:"A passive rewritten as a <b>reflexive passive</b>, which is the more usual Romanian form. <i>Va fi adusă</i> (auxiliary + participle, agreeing with <i>mașina</i>) becomes <b>se va aduce</b> — the verb goes active, <i>se</i> carries the passive sense, and the agreement disappears. This exact pair appears in the official sample paper.",
 audio:"Se va aduce mașina mâine.", vocab:["i_apastra"]},
{id:"i622", lesson:"l_ilr_u3l1", skill:"grammar", type:"transform", diff:4, topic:null,
 prompt:"Continue, keeping the meaning: <i>Dacă-mi cerea bani, îi dădeam.</i> → <i>Dacă mi-ar…</i>",
 given:"Dacă-mi cerea bani, îi dădeam. → Dacă mi-ar…", answer:"Dacă mi-ar fi cerut bani, i-aș fi dat.",
 accept:["Dacă mi-ar fi cerut bani, i-aș fi dat.","Dacă mi-ar fi cerut bani, i-aș fi dat"],
 explain:"The colloquial double imperfect becomes the formal <b>conditional perfect</b> — the same pair you met in B1.2. Both halves must move: <i>ar fi cerut</i> and <b>aș fi dat</b>. Note the object pronoun contracts to <b>i-aș</b>. This is item 9 on the official sample paper almost verbatim, which tells you how much the examiners care about it.",
 audio:"Dacă mi-ar fi cerut bani, i-aș fi dat.", vocab:[]},
{id:"i623", lesson:"l_ilr_u3l1", skill:"grammar", type:"transform", diff:4, topic:null,
 prompt:"Continue, keeping the meaning: <i>O să te aștept la gară.</i> → <i>Te…</i>",
 given:"O să te aștept la gară. → Te…", answer:"Te voi aștepta la gară.",
 accept:["Te voi aștepta la gară.","Te voi aștepta la gară"],
 explain:"Same future, different register. <b>O să</b> + subjunctive is the spoken form; <b>voi/vei/va + infinitive</b> is the written one. The pronoun moves in front of the auxiliary: <i>o să <b>te</b> aștept</i> becomes <b>te</b> voi aștepta. The transformation section frequently tests exactly this kind of register shift.",
 audio:"Te voi aștepta la gară.", vocab:[]},
{id:"i624", lesson:"l_ilr_u3l1", skill:"grammar", type:"transform", diff:4, topic:null,
 prompt:"Continue, keeping the meaning: <i>De ce nu m-ai așteptat unde ne-am înțeles?</i> → <i>Trebuia…</i>",
 given:"De ce nu m-ai așteptat unde ne-am înțeles? → Trebuia…", answer:"Trebuia să mă aștepți unde ne-am înțeles.",
 accept:["Trebuia să mă aștepți unde ne-am înțeles.","Trebuia să mă aștepți unde ne-am înțeles"],
 explain:"A reproachful question becomes a statement of what should have happened. <b>Trebuia să</b> + present subjunctive carries past obligation in Romanian — you do <i>not</i> need a past subjunctive. Note the pronoun shifts from <i>m-ai</i> (you waited for me) to <b>mă</b> aștepți, and the person of the verb changes with it.",
 audio:"Trebuia să mă aștepți unde ne-am înțeles.", vocab:[]},
{id:"i625", lesson:"l_ilr_u3l1", skill:"grammar", type:"transform", diff:4, topic:null,
 prompt:"Continue, keeping the meaning: <i>După ce-l întâlnisem, mi-am dat seama cine era.</i> → <i>Când l-…</i>",
 given:"După ce-l întâlnisem, mi-am dat seama cine era. → Când l-…", answer:"Când l-am întâlnit, mi-am dat seama cine era.",
 accept:["Când l-am întâlnit, mi-am dat seama cine era.","Când l-am întâlnit, mi-am dat seama cine era"],
 explain:"The pluperfect collapses to a perfect compus when <i>după ce</i> becomes <b>când</b>. With <i>după ce</i> the sequence is already explicit, so the earlier action can step back a tense; with <b>când</b> the two are simultaneous and both sit in the perfect compus. Getting this wrong produces <i>când îl întâlnisem</i>, which no Romanian would say.",
 audio:"Când l-am întâlnit, mi-am dat seama cine era.", vocab:[]},

{id:"i631", lesson:"l_ilr_u4l1", skill:"writing", type:"produce", diff:4, topic:null,
 prompt:"<b>Paper II, task 1.</b> Write an email to the Institutul Limbii Române requesting information about the next testing session, and setting out why you need a B1 certificate. Use formal register throughout.",
 minWords:70, mustUse:["Stimate"],
